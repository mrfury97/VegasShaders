SmokeLifeVariation = 0.3                # Seconds each puff of smoke lives, and how much that varies.
GrowSeconds = 1.2                       # Seconds it grows for after leaving the gun (about its life = it keeps swelling as it rises), and seconds it shrinks at the very end (0 = it only fades).
ShrinkSeconds = 0.0                     # Seconds it grows for after leaving the gun (about its life = it keeps swelling as it rises), and seconds it shrinks at the very end (0 = it only fades).
