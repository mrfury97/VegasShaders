[_Main.WeatherMode.General]
CoeffFogB = 0.86
CoeffFogG = 0.88
CoeffFogR = 0.9
CoeffNightB = 0.5
CoeffNightG = 0.6
CoeffNightR = 0.6
CoeffSunB = 0.8
CoeffSunG = 0.9
CoeffSunR = 1.0

[_Main.WeatherMode.Main]
Enabled = false

[_Main.Main.Scope]
KeepOverlayBlack = true     # UNOFFICIAL (2026-11-12), BUG FIX, applies immediately: the game's own rifle scope overlay (the black mask and reticle of the sniper rifle, varmint rifle, binoculars and the like) is drawn with the game's own shaders. The mod's object shaders lit the black mask round the lens like a shiny object, so it came out grey towards its edges. Picture-in-picture scope mods are not touched. false = the mod's shaders on the overlay, as before.
FullFrame = false           # UNOFFICIAL (2026-11-12), applies immediately: while a rifle scope is up the game draws the world only in the middle of the screen, because the mask hides the sides. The mod's effects still run on the empty side strips, and the exposure meters them. true = the whole frame is drawn while scoped, so the exposure, bloom and other effects see an ordinary picture under the mask. Costs some speed while scoped. Same as fScopeScissorAmount=0 under [Display] in the game's INI. false = as before.
KeepRenderScale = true      # UNOFFICIAL (2026-11-12), BUG FIX, applies immediately, with FSR or DLSS at a RenderScale below 1: while the game's own rifle scope was up, upscaling was switched off and the whole frame was drawn at full screen resolution, so the frame rate dropped by a third to a half when you aimed. The game draws the scoped world through a clipping rectangle and the upscaler refused such a frame. Now the frame stays at the render scale while scoped. Picture-in-picture scope mods were never affected. false = as before.
Detect = true        # UNOFFICIAL (2026-11-12), restart to install the hooks, then live. A scope picture drawn by a plugin's extra camera (a picture-in-picture scope mod) is recognised exactly, not guessed from its size. false = the old guess.
OwnCamera = true     # UNOFFICIAL (2026-11-12), live. The scope picture is drawn with its own camera's values, so the sun's shadows, interior lamp shadows and the sky are right inside the lens. false = no shadows in the scope picture, as before.
Clouds = true        # UNOFFICIAL (2026-11-12), live. The game's cloud layers stay visible in the scope picture while volumetric clouds are on. false = no clouds in the lens, as before.
Skin = true          # UNOFFICIAL (2026-11-12), live, needs OwnCamera. Skin in the scope picture uses this mod's skin shaders. false = the game's skin shaders there, as before.
Shaders = 1          # UNOFFICIAL (2026-11-12) [0-2], live. What the scope picture costs. 0 = everything as in the main view. 1 = no ground parallax and plain sun shadow filtering in the lens. 2 = the game's own shaders in the lens (cheapest, looks different from the main view).
Water = 0            # UNOFFICIAL (2026-11-12) [0-1], live. 1 = water in the scope picture uses the game's own water shaders. 0 = as before.
PostEffects = 0      # UNOFFICIAL (2026-11-12) [0-2], live, needs OwnCamera. 1 = distance fog on the scope picture, from the picture's own depth, so far things in the lens are not fog-free. 2 is reserved (fog and ambient occlusion, not built). 0 = off.
FogStrength = 1.0    # UNOFFICIAL (2026-11-12) [0.0-4.0], live. Scales the scope picture's fog (PostEffects 1).

