PlayerRadius = 30.0                     # Your body: smoke never stays inside it or runs through it. Smoke ahead of you as you walk slides aside, a strand you walk through is split, some smoke is pulled into your wake, and stirred smoke thins out. PlayerRadius = your body's width from its middle and PlayerHeight = its height from your feet (game units; both a little over your real size, so smoke stays out of the camera too), PlayerPush = how hard it pushes, Stir = how quickly stirred smoke thins out (per second).
