[_Main.GunFX.Volume]
HeatSmoke = true                        # Which smoke is drawn volumetric while the menu switch is on (1), or stays the game's sprites (0).
Trail = true                            # Which smoke is drawn volumetric while the menu switch is on (1), or stays the game's sprites (0).
Puff = true                             # Which smoke is drawn volumetric while the menu switch is on (1), or stays the game's sprites (0).
Ejection = true                         # Which smoke is drawn volumetric while the menu switch is on (1), or stays the game's sprites (0).
GunInFront = true                       # 1 = your own gun (first person) is always drawn in front of the smoke, so smoke never shows inside it. 0 = smoke and gun are sorted by distance (smoke can pass in front of the gun, but may cut into it).
SizeScale = 0.25                        # Width of the smoke compared with the sprite size (Size times Scale): a sprite's soft edges are mostly transparent, so the visible smoke is about a quarter of it.
BurstSizeScale = 1.0                    # Width of the muzzle puff and ejection smoke compared with their sprite size ([Puff] / [Ejection] Size times Scale).
Expand = 1.6                            # How much bigger the smoke ends up than its sprite size (1 = the same growth as the sprites, from StartSize to full size). It grows fast at first and slower later.
Thinning = 0.2                          # [0-1] How much the smoke thins out as it widens: 0 = it keeps its opacity like the sprites (only FadeStart / FadeEnd fade it), 1 = the same amount of smoke spread wider (much fainter when big).
DensityScale = 4.0                      # How opaque the smoke is. Opacity x DensityScale is its thickness looking straight across the strand where it starts: 0.2 hides about a fifth of what is behind it, 0.8 about half, 2 nearly all. It thins out as it widens.
RiseScale = 1.0                         # How strongly it rises compared with Rise.
CurlScale = 400.0                       # How strongly it curls sideways compared with Curl (it bends gently near the barrel and drifts more as it ages).
Drag = 0.4                              # Air drag: how quickly the heat smoke and trail slow down (per second). Higher = they hang in the air more.
Smooth = 3.0                            # Smoothing: sharp kinks a quick or jittery gun movement leaves in the heat smoke and trail even out over a fraction of a second (per second; 0 = off). The smoke still leaves the barrel straight.
DriftRight = 0.0                        # Drift: the heat smoke and trail lean toward the right of where you aim (DriftRight) and a little away from you (DriftAway), so they keep out of the middle of your view and away from you as you walk (game units per second; 0 = straight up; a negative DriftRight leans left).
DriftAway = 0.0                         # Drift: the heat smoke and trail lean toward the right of where you aim (DriftRight) and a little away from you (DriftAway), so they keep out of the middle of your view and away from you as you walk (game units per second; 0 = straight up; a negative DriftRight leans left).
WrapGun = true                          # The gun as a solid shape: smoke never stays inside it; walking or swinging the gun into the trail splits it, an arm along each side of the barrel, and smoke slides round the barrel instead of riding along with it. GunLength = how far back from the muzzle the gun reaches, GunRadius = how thick it is (game units).
GunLength = 30.0                        # The gun as a solid shape: smoke never stays inside it; walking or swinging the gun into the trail splits it, an arm along each side of the barrel, and smoke slides round the barrel instead of riding along with it. GunLength = how far back from the muzzle the gun reaches, GunRadius = how thick it is (game units).
GunRadius = 3.5                         # The gun as a solid shape: smoke never stays inside it; walking or swinging the gun into the trail splits it, an arm along each side of the barrel, and smoke slides round the barrel instead of riding along with it. GunLength = how far back from the muzzle the gun reaches, GunRadius = how thick it is (game units).
GunShape = true                         # The gun's real shape: read from its model when you first hold it, so smoke flows round its sights, magazine and scope (GunLength and GunRadius then stand in only until it is ready; GunRadius still sets how far out the gun moves the air). 0 = always the plain tube above.
GunSwirl = 0.6                          # Swirl behind the gun: swinging the gun through smoke leaves little whirlpools behind the barrel that curl the smoke into eddies for a moment (0 = none, higher = stronger).
BodySwirl = 0.5                         # Swirl behind you: walking through smoke leaves little upright whirlpools behind your body; together with the gun's they carry each other along, so your wake rolls up into eddies. BodySwirl = how strong (0 = none), SwirlLife = how long each lasts (seconds).
SwirlLife = 1.2                         # Swirl behind you: walking through smoke leaves little upright whirlpools behind your body; together with the gun's they carry each other along, so your wake rolls up into eddies. BodySwirl = how strong (0 = none), SwirlLife = how long each lasts (seconds).
BarrelSpread = 0.3                      # [0-1] The heat smoke also rises off the hot barrel: its source wanders slowly this share of GunLength back from the muzzle (0 = the muzzle only).
Tendrils = 0.6                          # Tendrils: where the heat smoke or trail bends sharply (a quick change of the gun's direction, while you move it), a thin wisp peels off the bend and curls away, and a strand your body splits frays at its torn ends. Tendrils = the chance at each sharp bend (0 = never, 1 = always), TendrilAngle = how sharp a bend must be (degrees), TendrilSize = their thickness as a share of the strand's, TendrilSpeed = how fast they peel off (game units per second).
TendrilAngle = 20.0                     # Tendrils: where the heat smoke or trail bends sharply (a quick change of the gun's direction, while you move it), a thin wisp peels off the bend and curls away, and a strand your body splits frays at its torn ends. Tendrils = the chance at each sharp bend (0 = never, 1 = always), TendrilAngle = how sharp a bend must be (degrees), TendrilSize = their thickness as a share of the strand's, TendrilSpeed = how fast they peel off (game units per second).
TendrilSize = 0.35                      # Tendrils: where the heat smoke or trail bends sharply (a quick change of the gun's direction, while you move it), a thin wisp peels off the bend and curls away, and a strand your body splits frays at its torn ends. Tendrils = the chance at each sharp bend (0 = never, 1 = always), TendrilAngle = how sharp a bend must be (degrees), TendrilSize = their thickness as a share of the strand's, TendrilSpeed = how fast they peel off (game units per second).
TendrilSpeed = 12.0                     # Tendrils: where the heat smoke or trail bends sharply (a quick change of the gun's direction, while you move it), a thin wisp peels off the bend and curls away, and a strand your body splits frays at its torn ends. Tendrils = the chance at each sharp bend (0 = never, 1 = always), TendrilAngle = how sharp a bend must be (degrees), TendrilSize = their thickness as a share of the strand's, TendrilSpeed = how fast they peel off (game units per second).
BurstDrag = 3.0                         # Air drag of the muzzle puff and ejection smoke: they burst out, slow down quickly, then drift and rise.
PuffForward = 25.0                      # How fast the muzzle puff blows forward out of the barrel (game units per second; BurstDrag slows it down). 0 = it only rises, like the sprite puff.
BurstPoints = 4                         # [1-12] Points each muzzle puff / ejection burst starts with (1-12), flying apart at different speeds and angles: more = a fuller, more irregular cloud.
Spacing = 0.04                          # Smallest gap in seconds between the points that shape the smoke (the heat smoke and trail keep about 30 points over the smoke's life, a puff or ejection burst about 60).
Noise = 0.55                            # Edge detail: a lumpy outline and wispy, eaten-away edges that travel with the smoke (more as it ages; the thick core stays whole). 0 = smooth, soft tubes; 1 = strong.
Brightness = 1.0                        # Brightness of the smoke in the scene's light.
SelfShadow = 0.5                        # Self-shadowing: the side away from the sun (indoors: the underside) is darker, and so is the inside of thick smoke. 0 = evenly lit.
Flash = 1.0                             # Muzzle flash light: each shot lights the smoke around the muzzle orange for a moment. Flash = how bright (0 = off), FlashRadius = how far it reaches (game units), FlashSeconds = how quickly it fades.
