Stir = 1.5                              # Your body: smoke never stays inside it or runs through it. Smoke ahead of you as you walk slides aside, a strand you walk through is split, some smoke is pulled into your wake, and stirred smoke thins out. PlayerRadius = your body's width from its middle and PlayerHeight = its height from your feet (game units; both a little over your real size, so smoke stays out of the camera too), PlayerPush = how hard it pushes, Stir = how quickly stirred smoke thins out (per second).
Diffuse = 0.5                           # Stirred smoke spreads out: smoke your body or the gun disturbs (or a whirlpool catches) billows wider, thins into a ragged veil and frays into wisps, as real smoke mixes into the air. 0 = off, 1 = normal, higher = more.
Burst = 0.5                             # Bursts: running or swinging the gun through smoke throws it outward in a quick puff that billows and rises, then settles (the air you shove keeps going). 0 = off, 0.5 = normal, higher = more.
Haze = 3.0                              # Gun-smoke haze: every shot leaves a big, thin blob of smoke that rises slowly and lingers, so a room fills with smoke as you keep firing. Haze = how much each shot leaves (0 = off), HazeLife = how long it hangs indoors (seconds; outdoors under half), HazeSize = a blob's radius when grown (game units).
HazeLife = 45.0                         # Gun-smoke haze: every shot leaves a big, thin blob of smoke that rises slowly and lingers, so a room fills with smoke as you keep firing. Haze = how much each shot leaves (0 = off), HazeLife = how long it hangs indoors (seconds; outdoors under half), HazeSize = a blob's radius when grown (game units).
HazeSize = 90.0                         # Gun-smoke haze: every shot leaves a big, thin blob of smoke that rises slowly and lingers, so a room fills with smoke as you keep firing. Haze = how much each shot leaves (0 = off), HazeLife = how long it hangs indoors (seconds; outdoors under half), HazeSize = a blob's radius when grown (game units).
Bullet = 2.0                            # Bullets: every shot punches a tunnel through the smoke in front of you (not the haze): smoke near the bullet's path is thrown outward and a little along it, billows and fills in again. Bullet = how hard (0 = off), BulletReach = how far from the path it reaches (game units; big puffs a little farther).
BulletReach = 8.0                       # Bullets: every shot punches a tunnel through the smoke in front of you (not the haze): smoke near the bullet's path is thrown outward and a little along it, billows and fills in again. Bullet = how hard (0 = off), BulletReach = how far from the path it reaches (game units; big puffs a little farther).
BulletOpen = 0.12                       # How a bullet's hole through the smoke runs: BulletOpen = seconds it takes to open (it fades in as it widens), BulletSeconds = seconds until the smoke has flowed back in and filled it (from its edge inward).
BulletSeconds = 1.4                     # [0.2-3] How a bullet's hole through the smoke runs: BulletOpen = seconds it takes to open (it fades in as it widens), BulletSeconds = seconds until the smoke has flowed back in and filled it (from its edge inward).
Pillows = 1.0                           # Texture (costs nothing extra): Pillows = how billowy the muzzle puff and ejection smoke are (round lobes and creases, like CS2's smoke), Streaks = how fibrous the heat smoke and trail are (fine streaks along the flow, like real gun smoke). 0 = smooth (the look before), 1 = full.
Streaks = 0.0                           # Texture (costs nothing extra): Pillows = how billowy the muzzle puff and ejection smoke are (round lobes and creases, like CS2's smoke), Streaks = how fibrous the heat smoke and trail are (fine streaks along the flow, like real gun smoke). 0 = smooth (the look before), 1 = full.
