DeferredFirstPerson = false # UNOFFICIAL (2026-11-15), restart, test only, off, needs DeferredRenderer 1 or 2 and GBufferV2 (docs/next/FD-FIRSTPERSON-RESULTS.md): the first-person arms, hands and gun go through the full deferred renderer: they are lit by every lamp of the room with its shadows, the sun with the view model's own shadow map, and the skin model, like the world. Aiming (iron sights, scopes), the Pip-Boy, VATS, third person, the Bodycam effect, the flashlight, MSAA and unusual first-person cameras stay forward (one log line says why). false = first person exactly as before.
DeferredFirstPersonLive = true # UNOFFICIAL (2026-11-15), live, test only: the A/B for ParityTest with DeferredFirstPerson on (parity Main.Main.Quality DeferredFirstPersonLive 64 3 false true): false = the view model forward as before, the world still deferred.
GearWeather = false # UNOFFICIAL (2026-11-15), live, test only, off, needs DeferredFirstPerson at startup: weather on the player's gear in first person. Rain wets the gun and gloves (darker, glossy), snow frosts them (rims and metal first), sandstorms and dry wind dust them (upward faces and grooves), moving over wet ground muddies them. Each builds up while its weather lasts and dries, melts or wears off indoors and over time; the pattern sticks to the gear through reloads. false = as before.
