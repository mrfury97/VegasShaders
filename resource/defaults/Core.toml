Depth = 0.7                             # Depth: the smoke is shaded as if round and lumpy (its side and top toward the light brighter, the far side darker, lumps catching light on one side), for a sense of depth. 0 = flat, 1 = normal.
Wind = 40.0                             # Wind: outdoors the smoke drifts with the weather's wind (indoors the air is still). Wind = drift speed at full wind (game units per second), WindPickup = how quickly smoke takes on the wind (per second; older smoke has had longer). WindDirectionOffset turns the drift (degrees): use 180 if the smoke drifts against the grass and trees.
WindPickup = 0.8                        # Wind: outdoors the smoke drifts with the weather's wind (indoors the air is still). Wind = drift speed at full wind (game units per second), WindPickup = how quickly smoke takes on the wind (per second; older smoke has had longer). WindDirectionOffset turns the drift (degrees): use 180 if the smoke drifts against the grass and trees.
