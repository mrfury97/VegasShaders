# Vegas Shaders RT test room (VS-AlphaLampTest.esp, cell VSAlphaLampTest): the settings the bench and the demo videos use.
# Apply it from the menu's preset browser (or, with the Preset Manager on, it applies by itself in that cell). The RT keys need a
# restart of the game once after the first apply. Only the keys below change; everything else stays as you have it.

[Main.Main.RayTracing]
HitTextures = true
AlphaTested = true

[Shaders.ShadowsInteriors.Main]
LightPoints = 63

[Shaders.ShadowsInteriors.RT]
Enabled = true
ExteriorForward = true
ExteriorManyLights = true

[Shaders.Reflections.Status]
Enabled = true

[Shaders.Reflections.Main]
Mirror = 1.0
MirrorSmoothOnly = true
RoughnessOverrides = "nv_ultralux_centertiles:0.1, ul_marbleblack:0.12, vs_mirror01:0.02"

[Shaders.Reflections.RT]
Enabled = true
MaxRoughness = 1.0
