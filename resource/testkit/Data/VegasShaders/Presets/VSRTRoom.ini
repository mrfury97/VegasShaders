# Vegas Shaders RT test room (VS-RTRoom.esp, cell VSRTRoom): the room's settings. Apply it from the menu's preset browser (or, with the
# Preset Manager on, it applies by itself in that cell). The RT switches need a restart of the game once after the first apply. Only the
# keys below change; everything else stays as you have it. The path tracer is left as you have it (2026-11-11: this preset used to
# switch PTRealtime off on entering, which undid a tester's own choice): turn PTRealtime on in the Ray tracing page to compare.

[Main.Main.RayTracing]
HitTextures = true
AlphaTested = true
GlowTextures = true

[Shaders.ShadowsInteriors.Main]
LightPoints = 63

[Shaders.ShadowsInteriors.RT]
Enabled = true

[Shaders.Reflections.Status]
Enabled = true

[Shaders.Reflections.Main]
Mirror = 1.0
MirrorSmoothOnly = true
RoughnessOverrides = "vs_mirror01:0.02, vs_sphere_chrome:0.05, vs_sphere_gold:0.2, vs_sphere_red:0.5, vs_glass01:0.02"

[Shaders.Reflections.RT]
Enabled = true
MaxRoughness = 1.0
