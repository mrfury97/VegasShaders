assBlur" # UNOFFICIAL (2026-10-25), hidden, read from this file only: the settings shown only with DeveloperOptions on, besides the test switches the menu finds itself (names ending in Check, Log, Probe, DebugView; descriptions that say diagnostic or test only). The last 17 are options measured to change almost nothing (under 0.25% of pixels in a still interior and exterior, no measurable cost). Section.Key, or Section.* for a whole section (comma separated). Measured low-impact options: work/bench/menu-tidy/LOW-IMPACT-OPTIONS.md.

