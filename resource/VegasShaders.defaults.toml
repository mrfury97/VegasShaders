[_Shaders.BloodFlow.Main]
CheapGather = true                   # UNOFFICIAL (2026-10-16): read the game's decals and bodies once a frame, only blood decals, cached skeleton walks, blood off screen not worked out (no picture change). Off: the old way. Applies immediately
GroundFit = true                     # UNOFFICIAL (2026-10-16): blood stays on its own surface without hard cut lines: pools fade out softly where the ground leaves them and follow a slope even when the ground round the body cannot be seen; splats and their arms and spray are no longer cut flat at the top on walls or along a line on slopes and bends. Off: the hard cuts as before. Applies immediately
GroundTestUnseen = false             # Test only: pools act as if the ground round them was never found (to check the fallback). Applies immediately
Splats = true                          # The game's blood splats grow streams that run down whatever they are on the way gravity pulls (straight down a wall, slantwise across a slope, round a rock), slowing as they go. A stream that reaches a ledge or the floor gathers in a small puddle; one that reaches an edge with nothing under it hangs in a drop that falls and leaves a stain where it lands. Wet while fresh, then darker and browner as it dries (thin trails first).
Pools = true                           # A pool of blood spreads under a body after death; on a slope it slides downhill and trickles run off its low side, gathering where the ground levels out. Wet at first, drying to a dark stain. Not under robots.
DripLength = 40.0                      # [0-120] Longest stream, in game units (about 1.4 cm each), measured along the surface. 0: no streams.
FlowSpeed = 1.0                        # [0.2-4.0] How fast the blood runs down slopes and walls, and how fast it creeps inside the streams.
Viscosity = 1.0                        # [0.0-2.0] How much noise breaks up the flow: higher = thicker, sludgier blood that creeps unevenly and bunches into clumps; 0 = a smooth even film.
BloodAmount = 0.75                     # [0.0-1.0] How much of the blood shows: a threshold on its thickness, so less blood breaks up into beads and clumps (streams, puddles, pools). 0 = none, 1 = all of it.
MaxFall = 200.0                        # [0-600] How far drops falling off an edge are followed down to where they land (game units). 0: drops hang at the edge but never fall.
DryTime = 120.0                        # [10-1800] Seconds for splats and streams to dry (thin trails dry in about half this, puddles take longer).
PoolSize = 1.0                         # [0.3-2.5] Pool size, as a share of the usual (about a body's width).
PoolSpreadTime = 25.0                  # [3-120] Seconds a pool takes to spread most of the way.
PoolDryTime = 300.0                    # [30-3600] Seconds for a pool to dry to a dark stain.
Gloss = 0.5                            # [0.0-2.0] How much fresh blood shines (small highlights from the sun and lamps, never brighter than the light there). Thick blood shines most; dry blood not at all.
FreshColorR = 0.42                     # [0.0-1.0] Fresh blood colour, sRGB, as it looks on a mid-grey wall in the same light. A thin film stains what it is on this colour.
FreshColorG = 0.03
FreshColorB = 0.028
DryColorR = 0.24                       # [0.0-1.0] Dried blood colour, sRGB: a dark, brownish red.
DryColorG = 0.085
DryColorB = 0.065
MatchGameColor = true                  # Fresh blood takes each game splat's own colour (the colour its decal is drawn with, times MatchShade), so streams and pools match your blood textures. false: FreshColor below. Dried blood keeps the same darkening and browning as DryColor over FreshColor.
MatchShade = 0.12                      # [0.01-1] The blood splatter texture's own grey (sRGB) that the game multiplies by the decal colour. 0.12 suits a dark splatter texture (measured on a popular 2048 blood replacer); raise it for a lighter one.
MatchBrightness = 1.0                  # [0.3-3.0] Brightens (above 1) or darkens the matched colour, if the streams still look lighter or darker than the game's splats in the same light.
MatchFloor = 0.2                       # [0-0.6] UNOFFICIAL (2026-10-27): the darkest a matched blood colour may be (sRGB, its strongest channel); a darker one is lifted to it, its hue kept. A dark splatter texture times the decal colour can come out near black (0.08 with a popular 2048 replacer), and then the wet sheen on top reads grey instead of red. 0: off.
Sheen = 0.45                           # [0-2] UNOFFICIAL (2026-10-27): how strongly wet blood mirrors the sky or the room at low angles, x what it was (1 = as before 2026-10-27, which made pools look grey and almost reflective). Also capped: never more than a quarter of the sky.
SheenTint = 0.6                        # [0-1] UNOFFICIAL (2026-10-27): how much of the blood's own colour the sheen (and the glints of drops in the air) takes: 0 white as before, 1 all red.
OldLook = false                        # Test only: the wet look as before 2026-10-27 (no MatchFloor, the old Sheen, white, not capped), to compare.
StreamWidth = 1.0                      # [0.2-3.0] Width of the streams running from a splat (and of their drops and the puddles they end in). Below 1 thinner, above 1 thicker.
Beads = 1.0                            # [0-3] Wet beads: glossy domed drops of blood over the game's own splats (where its splatter texture has blood), catching the sun and lamps, drying away drop by drop. 0: off.
BeadSize = 60.0                        # [1-200] Game units one tile of the drops texture covers: smaller = smaller, more numerous beads.
Splat = 1.0                            # [0-1] UNOFFICIAL: each splat gets its own impact shape, as paint thrown at a wall: a lumpy core, thick arms and dozens of thin spray lines shot out in random directions (bunched to one side for a glancing hit), droplets flung past them, and on walls and slopes drips running down from the core, the arms and the spray. No two alike. 0: off (the game's decal only).
SplatReach = 1.0                       # [0.2-3] How far the arms and spray lines reach, in splat radii.
SplatSpray = 1.0                       # [0-2] How many thin spray lines and how much fine mist.
SplatDrips = 1.0                       # [0-3] How far the splat's drips run down walls and slopes (in splat radii; none on level ground).
SplatFast = true                       # UNOFFICIAL (2026-10-22): draw the splat shapes the cheaper way (the same picture: parts of a splat that cannot reach a pixel are skipped there). Off: the old way, for comparison.
TestSplats = 0                         # UNOFFICIAL (2026-10-22), test only: this many made-up splats on the ground ahead (to measure the splat shapes' cost; fresh game splats are not in saves). 0: off.
SplatMask = true                       # UNOFFICIAL (2026-10-22): work each splat's shape out once into a mask (24 MB of video memory) and read it from there every frame, instead of working it out again for every pixel; again only while the splat is still growing or running. Off: as SplatFast says.
Merge = 0.6                            # [0-2] Splats that pile up merge into one (cheaper: one area to draw instead of many overlapping ones): centres closer than this x their radii. 0: off.
MergeCount = 3                         # [2-64] ... once at least this many lie together.
GibPools = 0.8                         # [0-3] A pool of its own grows under each cut-off limb (at the stump: neck, elbow, knee...), this size x the body's pool. 0: off.
GibHold = 1.0                          # [0-5] Seconds a gib's landing blood waits before BloodFlow draws it; if the gib bounces on, it is dropped (only where it comes to rest). 0: off.
MaxDistance = 3000.0                   # [500-10000] No streams or pools further than this (game units); they fade out over the last fifth.
MaxSplats = 48                         # [0-96] Most splats drawn at once (the nearest).
MaxPools = 12                          # [0-32] Most pools drawn at once (the nearest).
DebugView = 0                          # 2 (UNOFFICIAL 2026-10-16): the cuts -- where a splat's or pool's shape has blood, yellow if it shows, orange if a soft edge thins it, magenta if the test that keeps it on its own surface takes it away, red (GroundFit off) above the top of the old splat box. 1: what each splat and pool covers in green (white rings every 10 units round it), streams red, puddles and pools yellow, a drop at an edge blue, where drops land cyan, falling drops white.

[_Shaders.BloodFlow.Fluid]
Enabled = false                        # UNOFFICIAL (2026-10-26, BloodFlow v2): fresh blood becomes a real fluid, simulated on the GPU: thrown blood runs down walls, gathers under ledges and drips off them, a body's pool spreads and settles, then it all stops and dries into stains (BloodFlow's colours and drying). NEEDS the DXVK fork (the fork-built d3d9.dll); without it nothing changes. BloodFlow must be on. Applies immediately
Splats = true                          # Fresh blood splats (on screen as they appear) throw fluid blood at their wall or floor.
Pools = true                           # A body that has just died bleeds a fluid pool (BloodFlow's own pool is not drawn for that body). Bodies that were already dead keep BloodFlow's pool.
ReplaceStreams = true                  # While the fluid runs, BloodFlow's painted streams and splat drips are off (the fluid's runs replace them). The game's decals and BloodFlow's splat shapes stay.
Amount = 1.0                           # [0.2-3] How much blood: particles per splat and per pool, x.
MaxParticles = 16384                   # [2048-262144] Most blood particles at once (64 bytes each, plus 48 for drawing); the oldest go first. Changing it clears the blood.
SettleTime = 12.0                      # [3-60] Seconds blood keeps moving before it has settled (it slows from 40 % of this).
BleedTime = 8.0                        # [1-30] Seconds a body bleeds its pool.
Viscosity = 8.0                        # [0-30] How much the blood moves as one (higher: thicker, slower, fewer separate runs).
Cling = 300.0                          # [0-1000] How hard blood sticks to walls and undersides (higher: it hangs longer before it drips).
Friction = 40.0                        # [0-200] How fast a film on a wall or floor slows (lower: longer runs).
Lifetime = 900.0                       # [60-3600] Seconds before the fluid's stains fade out (over 10 s).
StainSize = 3.2                        # [1.5-5] Game units of stain each particle paints round it (bigger: smoother, wider films).
Threshold = 0.3                        # [0.1-2] How thick the blood must be to show (higher: thinner, more broken runs).
Bump = 0.6                             # [0-2] How rounded the blood's edges look (the highlights along them).
Drops = 0.3                            # [0-1] UNOFFICIAL (2026-10-27): share of the blood in the air drawn as drops (dripping off a ledge, a splash); the rest still falls and lands as stain. 1: every particle, as before.
DropSize = 0.55                        # [0.2-1.5] UNOFFICIAL (2026-10-27): a drop's size, x a particle's (1.3 before).
OldThrow = false                       # Test only: the throws and drops as before 2026-10-27, to compare: each fresh splat shot its blood out of the floor in a fountain (the 'orbs' round a hit NPC), a dying body's pool was born above the ground and ran off the body's front, every particle in the air was a big glinting drop. (Also as before 2026-10-27 evening: a level fallback floor under a pool, and blood on a slope you can see lifted back to it.)
TextureRelief = 1.0                    # [0-2] UNOFFICIAL (2026-10-27): how much thin blood follows the ground's texture: a film's edges creep into its cracks and dips first and break up on raised bits, and its wet highlights follow the bumps (read from the picture under the blood; thick pools stay flat). 0: off.
OldColour = false                      # Test only: the fluid's colour as before 2026-10-27 evening, to compare: lit by its own light estimate, never below the open sky's, so it came out bright pure red ('ketchup', 'full bright') next to the game's darker blood. Now it darkens what is under it in the blood's colour, as the game's blood decals do.
DebugView = 0                          # 1: stains red (paler = thinner), their faint edge orange, drops in the air white. 2: every particle as a dot: white in the air, red on a surface, yellow on the fallback ground, blue held (hidden from the camera), brown settled. 3 (test): the depth the fluid reads (one flat colour = the mod has no depth under this DXVK; see the log's WARNING line).
TestThrow = 0.0                        # Test only: every this many seconds a throw of blood from the camera at whatever is in the middle of the view. 0: off.
TestPour = false                       # Test only: a pool bleeds on the ground a little ahead of the player (once each time this is turned on).
StatsEvery = 0                         # Test only: every this many frames, log what the particles are doing (waits for the GPU: stutters). 0: off.
SteadyContact = true                   # UNOFFICIAL (2026-11-01), BUG FIX, applies immediately: wet blood pools flickered until they dried. A wet particle in a crowded pool is pushed off the ground by the blood round it and falls back every other simulation step; each time it was off it counted as a drop in the air (only a share of those is drawn, Drops), and the film thinned or thickened with how many steps the frame took (one or two at most frame rates). On: blood that touched a surface in the last 3 steps is drawn lying on it. Off: as before.
SteadyFloor = true                     # UNOFFICIAL (2026-11-01), BUG FIX, applies immediately: pools that looked settled kept shifting on flat ground. The blood finds the floor from the depth buffer, which TAA / FSR move by a fraction of a pixel every frame, and each step pushed it along that pixel's own slope. On: the floor is rebuilt on the moved pixel's own ray, blood already lying on a surface keeps a smoothed floor direction, and blood on a floor slower than RestSpeed rests there for good. Off: as before.
RestSpeed = 3.0                        # UNOFFICIAL (2026-11-01), [0-20], with SteadyFloor: blood lying on a floor that moves slower than this (game units a second; 70 = 1 m) stops for good. Higher: pools stop sooner and spread less; 0 = they move until SettleTime.
SteadyTiles = true                     # UNOFFICIAL (2026-11-01), BUG FIX, applies immediately: wet blood pools flickered (looked like z-fighting) where several lay in view, until they dried. The screen is cut into 16 x 16 pixel tiles and each lists at most TileCap blood particles; with more, a different set was drawn every frame. On: a full tile draws a fixed set (the same particles every frame, and in every tile they touch). Off: as before. StatsEvery logs how many tiles are full.
TileCap = 256                          # UNOFFICIAL (2026-11-01), [64-1024], applies immediately: how many blood particles one 16 x 16 pixel tile draws (was 128). Higher = fewer full tiles where many pools lie together, a little more memory and drawing time.


[_Shaders.BloodFlow.Status]
Enabled = false                        # Blood flow: blood splats run down walls and slopes, gather on ledges and floors, drip off edges, and dry; blood pools spread under bodies and run downhill. Costs nothing when no blood is near.

[_Shaders.Skin.Main]
SpecularStrength = 1.0              # (2026-10-25) Skin highlight strength: two layers, a tight oily sheen and a broad pore haze, at real skin's reflectance (not the plastic-like shine of the object shaders). 1 reads a half-grey specular mask as full skin; 0 none; 2 double.
Roughness = 0.45                    # (2026-10-25) Skin roughness, 0.1-1: lower is oilier (tighter, brighter highlights), higher is matte.
VanillaMatchedHighlights = 0.0      # [0-1] (2026-11-05, PB NVR's skin lighting) 1 makes skin highlights as strong as vanilla's own (its Blinn-Phong pass peaked at the specular mask), keeping the physically based shape; 0 the physically based strength. Matters most with a high Roughness.
Scattering = 1.0                    # (2026-10-25) How far light spreads under the skin, worked out per pixel from the surface's curvature: light wraps past the shadow line (red furthest) and small features soften (nose, ears, lips, fingers). 1 = twice real skin's measured spread (the true width barely shows on a head at game distances); 0 = plain shading; up to 4. Where the screen-space blur runs ([Shaders.Skin.Scattering]) the blur takes over.
Translucency = 0.5                  # (2026-10-25) Red light glowing through thin parts (ears, nostrils, fingers) against the light. 0 off, 2 strong.
ShadowScatter = 1.0                 # (2026-10-25) Light carried under the skin across shadow edges: the soft edge of sun and lamp shadows warms (red reaches furthest into the shadow), and the scattered light passes the skin's own shadow line just past it. 0 off, 2 strong.
SkyReflection = 1.0                 # [0-2] (2026-10-25) The sky reflected off skin at glancing angles, through the same two highlight layers. Outdoors only. 0 off, 2 strong.
RainWetness = 0.5                   # [0-1] (2026-10-25) How wet and glossy skin gets in the rain. 0 dry, 1 fully wet.
MuteGameHighlights = true           # (2026-10-25) The skin shader draws its own highlights, so the game's extra face highlight passes (drawn with the object shaders' plastic-like shine) are switched off. false keeps them as well: shinier faces, as the older skin shaders had them.
OverrideVanillaPlusSkin = true      # (2026-10-25) With the Vanilla Plus Skin mod installed: true = this build's skin shader is used anyway; false = VPS's own lighting, with the mod's sun shadows added, which also needs the optional Vanilla Plus Skin compatibility files (SkinVPSTemplate.hlsl, Includes\\SkinVPS.hlsl, a separate download since 2026-11-02; without them this build's skin shader is used). Needs a restart.

[_Shaders.Skin.Interiors]
SpecularStrength = 1.0              # (2026-10-25) Indoors: skin highlight strength.
Roughness = 0.45                    # (2026-10-25) Indoors: skin roughness. Lower is oilier.
Scattering = 1.0                    # (2026-10-25) Indoors: how far light spreads under the skin (per pixel, from the curvature).
Translucency = 0.5                  # (2026-10-25) Indoors: light through thin parts against a lamp.
ShadowScatter = 1.0                 # (2026-10-25) Indoors: light carried across the edges of lamp shadows.
ScreenSpace = true                  # Indoors: screen-space subsurface scattering on top of the skin shader (see [Shaders.Skin.Scattering]).
Width = 28.6                        # Indoors: how far light spreads under the skin on screen. (2026-10-19) 28.6 is Community Shaders' Blur Radius 1.0 (was 8 on a narrower kernel).
DepthFollow = 1.0                   # Indoors: how sharply the blur stops at depth edges.
AlbedoDetail = 1.0                  # Indoors: how much skin texture detail stays sharp (1 sharpest).
StrengthRed = 0.48                  # Indoors: how much of each colour scatters.
StrengthGreen = 0.41
StrengthBlue = 0.28
FalloffRed = 1.0                    # Indoors: how wide each colour spreads within the blur, 0-1.
FalloffGreen = 0.37
FalloffBlue = 0.3

[_Shaders.Skin.Scattering]
ScreenSpace = true                  # Screen-space subsurface scattering on top of the skin shader (outdoors): light spreads under the skin across the screen (separable SSS, the ENB look), the skin texture stays sharp. Needs the game's MSAA off: with MSAA on, D3D9 drivers (NVIDIA at least) draw nothing while its extra targets are bound, so it switches itself off and the skin shader's own per-pixel scattering ([Shaders.Skin.Main] Scattering) does the work.
Width = 28.6                        # How far light spreads under the skin on screen, x the measured skin profile. Higher is softer and waxier. (2026-10-19) 28.6 is Community Shaders' Blur Radius 1.0, its default (was 8 on a narrower kernel).
DepthFollow = 1.0                   # How sharply the blur stops at depth edges (nose against cheek, chin against neck).
AlbedoDetail = 1.0                  # How much skin texture detail (freckles, pores, brows, stubble) stays sharp: 1 diffuses only the light, 0 blurs the texture with it (the waxy look).
StrengthRed = 0.48                  # How much of each colour scatters. Red scatters most, which gives skin its warmth.
StrengthGreen = 0.41
StrengthBlue = 0.28
FalloffRed = 1.0                    # How wide each colour spreads within the blur, 0-1 (above 1 is clamped: it breaks the blur into dots). Use Width to spread further.
FalloffGreen = 0.37
FalloffBlue = 0.3

[_Shaders.Skin.Debug]
DebugView = 0                       # Skin diagnostics, indoors and out. 0 off. 1 which pass drew the skin: green one full pass, cyan one full pass with several lamps, yellow a light-only pass the game multiplies by the texture afterwards, red added for every extra lamp pass on top. 2 which settings are in use: blue Interiors, orange outdoors; bright where the screen-space blur takes the skin, dark where the per-pixel scattering stands in. 3 direct light (sun and lamps) on white skin. 4 ambient and sky light on white skin. 5 highlights alone (lobes, sheen, sky reflection). 6 material: red roughness, green highlight strength, blue wetness. 7 curvature: red the per-pixel scattering, green thin features (Translucency). 8 the screen-space blur's skin test: green blurred, red rejected by distance, blue rejected by colour. 9 scene brightness against the skin's own pass: green equal, red brighter (extra lamp passes), blue darker. 10 what the blur changed: dark nothing, bright a lot.
LogDraws = 0                        # Diagnostic: logs the first this-many skin draws of the world scene (pass, shader, blend). 0 off. Read at startup.
BindFaceGenMaps = true              # Diagnostic: the FaceGen map binding in the light-only face passes (used to divide the face colour out of the highlights). Switch off to compare.
LegacyFaceShadows = false           # (2026-10-27) Diagnostic, live: true = CharacterShadowReach measured along the sun's ray, as before 2026-10-27. For an A/B only; leave false.
[_Shaders.Skin.Status]
Enabled = true                      # (2026-10-25) The skin shader: light spreading under the skin, light through ears and fingers, real skin highlights and sheen, the sky's light and the sun's and lamps' shadows on faces and bodies, rain wetness. Off = the game's own skin shaders (no mod shadows or lighting on skin).


[_Shaders.Sky.Main]
