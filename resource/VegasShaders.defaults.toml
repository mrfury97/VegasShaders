[_Shaders.Grass.Main]
ScaleX = 1.0
ScaleY = 1.0
ScaleZ = 1.0
GameShaderFix = true                   # FIX (2026-10-17): only matters if the mod's grass pixel shaders are missing (since 2026-10-27 the mod draws grass with or without the game's MSAA and transparency multisampling, with its sun shadow; before, without them grass was drawn with the game's own pixel shader, and since P80 that one got its light without the sun angle and the blade's light scale: every blade fully sunlit on every side, too bright and flat. true = the game's values again (as P79). false = the P80 behaviour, for comparison only.
DrawFirst = true                       # UNOFFICIAL (2026-10-17): the grass is drawn before the ground, so the ground's expensive shading is skipped under it (the faraway fading grass is still drawn after the ground, as before). Same picture (checked in game at noon, dusk and night), about 1 ms faster in a dense grass field. Live. false = the old order.
DrawFirstRestore = 5                   # UNOFFICIAL, diagnostic (2026-10-17): with DrawFirst, which device state is put back after the early grass (1 shader constants, 2 render states, 4 sampler states, 8 texture stage states, 16 textures). Leave at 5 (constants + sampler states).
ShadowFix = true                       # FIX (2026-10-27): the sun shadow on grass was striped and fell on the wrong side of each tuft (its normal faced the camera, not the sun). true = the tuft takes the ground's shadow evenly. false = the old look, for comparison only.
SkyLightScale = true                   # FIX (2026-10-27): grass in shadow was a little too bright: the mod's sky light skipped the darkening the game gives each tuft's ambient light. true = the sky light takes it too. false = the old look, for comparison only. Live.
Brightness = 1.0                       # [0.0-4.0] Multiplies how bright the grass is lit, before fog: below 1 darker, above 1 brighter. 1 leaves it as the lighting makes it.
NightBrightness = 1.0                  # [0.0-4.0] Multiplies the moon and ambient light on outdoor grass at night, easing back to 1 through sunrise (the same curve as the other day/night transitions). Lamps on the grass are not affected. Below 1 darker grass at night, 1 as before.
CastShadows = true                     # UNOFFICIAL (2026-10-27): the grass tufts cast sun shadows on the ground and on everything drawn after them, as the placed bushes always did (before, grass took the shadows of others but threw none). They are drawn a second time into the near sun shadow map, so it costs some graphics card time where there is a lot of grass (the F10 profile shows it as "Grass shadows"). Needs DrawFirst on and the PCF sun shadow maps ([Shaders.ShadowsExteriors.ShadowMaps] Mode 3, the default). Near the camera only (the near shadow cascade). With Terrain Blending on too (since 2026-10-28: the grass is then drawn into the shadow map only before the land, and on screen at its usual place). Live.
CastShadowsReach = 1050.0               # UNOFFICIAL (2026-10-28) [0-4000], live: how far from you the grass casts sun shadows, in world units (70 is about 1 m; 1050 = 15 m). The nearest shadow map ends only 2-3 m out (with CascadeLambda 0.9), so the grass shadows used to fade there; now the tufts within this distance are also drawn into the next two sun shadow maps (a little softer there, as every shadow is). Costs more graphics card time the further it reaches in thick grass (F10 profile: "Grass shadows"). 0 = the nearest shadow map only, as before.
CastShadowsBlack = false               # UNOFFICIAL (2026-10-27), diagnostic, live: the grass shadows are drawn solid black (the tufts as if right against the sun), so you can see at once whether and where the grass casts. For checking only: leave off.
DrawFirstCull = true                   # UNOFFICIAL (2026-10-17): with DrawFirst, grass pieces that are all near or all in the distance fade are drawn once instead of twice. Same picture, less vertex work.

[_Shaders.Grass.GPUGrass]
Enabled = false                        # UNOFFICIAL (2026-10-27) GPU GRASS, a LOOK CHANGE, OFF by default (user 2026-10-27), NEEDS the DXVK fork 1.7-grass (does nothing on native D3D9, stock DXVK or an older DXVK fork: the game's grass cards as before, said once in the log), live: the near grass is drawn as thousands of thin strands that the graphics card places, culls and counts itself (one compute pass and two draws a frame), instead of the game's flat alpha-tested grass cards. Same places as the game's grass (the game's own tufts: positions, slopes, sizes, brightness, the grass types of each land texture), each clump in its card's own colours and outline, lit as the game lights its grass, in the grass wind (Grass Wind section) or the game's sway. The faraway fading grass stays the game's cards. Needs the grass drawn before the ground (Grass > Main > DrawFirst, off by default (user 2026-10-27); it stands aside while Terrain Blending is on). Off (or without the fork) = exactly the game's grass.
KeepCards = false                      # false = the strands replace the game's grass cards (what this option is for); true = the cards stay and the strands are added round them (a fuller clump).
BladeDistance = 7000.0                 # [0-20000] Grass pieces whose nearest tuft is farther than this (game units) stay the game's cards, a whole piece at a time. 7000 = everything before the default grass fade start.
Density = 1.0                          # [1-6] Clumps per tuft the game placed: 1 = exactly the game's tufts; 2-6 = extra clumps of the same plant beside each one, on the same slope (denser fields; the cost grows with it).
ExtraRadius = 60.0                     # [0-300] With Density above 1: how far from its tuft an extra clump may stand, in game units.
Blades = 64                            # [1-128] Strands per clump up to LodNear (thin twigs: with Coverage 1 about 1-2 units wide).
BladesFar = 8                          # [1-128] Strands per clump from LodFar on (in between it falls smoothly). Fewer strands far away are wider, so the field keeps its density (Coverage).
LodNear = 600.0                        # [0-20000] Up to this distance every clump has all its strands.
LodFar = 2500.0                        # [0-20000] From here on the far strand count.
DetailDistance = 1200.0                # [0-20000] Strands nearer than this are curves of 5 triangles, farther ones a single triangle each (cheaper; the curve is invisible that far).
Coverage = 1.0                         # [0.2-6] How much the strands of a clump cover together, as a multiple of the opaque part of the game's card (one card; a tuft is 2-3 crossed cards). Higher = bushier clumps, wider strands.
MinPixelWidth = 0.75                   # [0-4] No strand is drawn narrower than this many pixels (far strands widen instead of shimmering).
HeightScale = 0.9                      # [0.2-2] Strand height relative to the plant's height on its card (the card's opaque top).
LengthMin = 0.4                        # [0.1-1] The shortest strand of a clump as a share of the plant's height (the short ones at the edge make the dome of a bush).
TipReach = 1.0                         # [0.2-2] How far out the strands reach: tips between half of and this many times the card's outline at their height.
Spread = 0.15                          # [0-1] How far from the clump's centre a strand's root may stand, as a share of the card's half width.
Bend = 0.5                             # [0-1] How much a strand bows outward on its way to its tip.
Kink = 0.5                             # [0-2] A sideways wobble along each strand (a dry twig's kinks); 0 = smooth.
Droop = 0.5                            # [0-1] How far a strand leaning out to the clump's edge drops its tip.
Flutter = 0.15                         # [0-2] A sideways flutter in the wind on top of the sway.
Variation = 0.2                        # [0-1] Each strand a little lighter or darker (+-).
TipLift = 0.3                          # [0-1] A warm lift of the colour toward the tip.
Saturation = 1.0                       # [0-2] The strands' colour saturation (1 = the card's own colour).
MaxBlades = 524288                     # [4096-2097152] How many strands a frame can hold in each of the near and far lists (48 bytes each on the graphics card); strands past it are not drawn (the log says how many).
DebugView = 0                          # DIAGNOSTIC: 1 = near strands red, far strands blue; 2 = a colour per game grass draw. 0 = the real colours.
Log = 0                                # DIAGNOSTIC: 1 = the graphics card's counts (clumps, strands near / far) in the log every 300 frames (otherwise the first frames and once a minute).

[_Shaders.Grass.Interaction]
Enabled = true                         # Grass bends away from you as you walk through it and springs back after, like There Stands The Grass NVSE (which stands down when NVR owns the grass shaders). UNOFFICIAL VegasShaders 2026-11-04: in place of Grass Collision. The GPU grass and NewGrass strands do not bend. Same settings and defaults as that mod.
Radius = 100.0                         # [10-1000] Reach around your feet, in game units, within which the grass bends.
StrengthStanding = 120.0               # [0-1000] Push while standing; the blade tips move half of it.
StrengthMax = 150.0                    # [0-1000] Push at full running speed.
SpeedForMax = 300.0                    # [1-5000] Your speed (units per second) that reaches StrengthMax.
SpringBackSeconds = 0.5                # [0.01-10.0] How quickly the grass recovers when you slow down or leave.
PositionLagSeconds = 0.08              # [0.0-2.0] How tightly the bend follows you: higher trails further behind.
Debug = false                          # Tints the grass the bend reaches red and logs the bend strength every two seconds (NewVegasReloaded.log), to check the bend follows you.

[_Shaders.Grass.LOD]
Enabled = true                         # Grass fades by how big it looks, not only how far it is (after Community Shaders' Grass Optimizations): small pieces go sooner, big clumps last longer, and grass too small to see is skipped before it is shaded. Works under the game's own grass fade distance.
MinPixels = 3.0                        # [0-200] Grass shorter than this on screen, in pixels (at your resolution), is gone. Raise for more speed, lower to keep small grass longer. 0 turns the size fade off but keeps the detail bias.
FadePixels = 6.0                       # [0.5-200] It fades in over this many pixels above MinPixels, so nothing pops.
DetailVertices = 300.0                 # [1-65535] A grass mesh with this many vertices or more counts as fully detailed (rocks, flowers, dense clumps).
DetailStrength = 1.0                   # [0-10] How much sooner fully detailed meshes go: their MinPixels is raised by up to this much (1: twice as soon). 0 treats every mesh alike.

[_Shaders.Grass.Lights]
Enabled = true                     # Placed lights and the Pip-Boy light light the grass (never the sun, which the grass already gets). Costs nothing where no lamp is near. UNOFFICIAL VegasShaders 2026-11-04: in place of [Shaders.Grass.Main] PointLights.
MaxLights = 8                      # [0-8] The most lamps on the grass at once, nearest first.
Strength = 1.0                     # [0.0-1.0] How bright the lamps are on the grass.

[_Shaders.Grass.NormalMaps]
Enabled = true                     # A grass texture with a normal map beside it, named after it with _n (grass01.dds -> grass01_n.dds, rock_d.dds -> rock_n.dds; loose or in a BSA; also grass-placed meshes such as Rock Grass), gets per-pixel sunlight from that map. Grass without one looks exactly as before.
Strength = 1.0                     # [0.0-4.0] How much the normal map bends the light. 0 is the grass's own lighting.
EnableSpecular = true              # The sun's highlight on the grass (and grass-placed rocks). Where the grass has a normal map, its alpha says how shiny each spot is; grass without one shines evenly.
SpecularStrength = 0.5             # [0.0-4.0] How bright the highlight is.
Glossiness = 32.0                  # [1-512] How tight the highlight is: low a broad sheen, high a small sharp glint.

[_Shaders.Grass.Wind]
Enabled = false                        # UNOFFICIAL (2026-10-20) GRASS IN THE WIND, a LOOK CHANGE (off): the grass moves like a field in the wind instead of every tuft swaying on its own. Gusts roll across the grass along the weather's wind like waves through wheat (stronger and faster as the wind rises), each tuft flutters a little on its own, and the game's own sway follows the weather's wind direction -- the same wind cloth uses, so grass and coats agree (the game itself sways all grass north-south whatever the weather). Works on the game's grass cards. Off = exactly the game's sway. Live.
GustStrength = 2.0                     # [0-10] (2026-10-20) How far a passing gust leans the grass, as a multiple of the game's own sway (which already grows with the weather's wind speed and keeps each grass model's own stiffness). 1 = subtle, 3-4 = strong rolling waves, 0 = no gusts.
GustSize = 1200.0                      # [50-20000] (2026-10-20) Distance from one gust front to the next, in game units (1200 is about 17 m). Bigger = broad slow waves, smaller = choppy.
GustSpeed = 300.0                      # [0-3000] (2026-10-20) How fast the gusts roll across the field, in units per second at a middling wind (0.4x in dead calm up to 1.6x in a gale, as cloth). The flutter quickens with it (8 quivers per passing front).
Flutter = 0.3                          # [0-10] (2026-10-20) Each tuft's own small quiver, as a multiple of the game's sway, so neighbouring tufts never move in step. 0 = none.
UseGameWind = true                     # (2026-10-20) Take the wind's direction from the weather (as cloth does). false = Direction below.
Direction = 0.0                        # (2026-10-20) With UseGameWind off: where the wind blows toward, in degrees from north (0) toward east (90).
TimeOffset = 0.0                       # (2026-10-20) Test only: seconds the gust pattern is ahead (for pictures at set moments). Leave 0.
Log = 0                                # (2026-10-20) DIAGNOSTIC: 1 = a log line every 600 grass shader binds with the game's grass wind values, the weather's wind and these settings as the shaders get them.

[_Shaders.Grass.Status]
Enabled = true                        # Replaces the grass shaders.

[_Shaders.Plants.Wind]
Enabled = false                        # UNOFFICIAL (2026-10-20) PLANTS IN THE WIND, a LOOK CHANGE (off): the Mojave's plants move in the same wind as the grass (Grass Wind section): the same direction, strength and gusts, so a gust rolls through the grass and the bushes together. The common SpeedTree bushes' leaves swing harder and flutter as a gust passes (live); the static plants -- Joshua trees, yuccas, banana yucca, creosote, sagebrush (see Keywords) -- bend from the ground up, tall ones stiffer (NEEDS A RESTART: Save, then restart the game). Cacti and stumps stay rigid. Works with the grass wind itself on or off. Off = exactly the game's motion.
Bend = 6.0                             # [0-100] (2026-10-20) Static plants: how far a passing gust leans a plant's top, in units per 100 units of its height, at a middling wind (it grows and shrinks with the weather's wind, as the grass's sway does). 0 = no lean.
StiffHeight = 200.0                    # [20-5000] (2026-10-20) Static plants taller than this (in units) bend less: a Joshua tree's crown sways less than a bush's top.
Flutter = 0.25                         # [0-4] (2026-10-20) Static plants: their own small quiver, as a fraction of the gust lean, so a plant's parts never move in step.
LeafGust = 1.5                         # [0-10] (2026-10-20) SpeedTree bushes: how much a passing gust strengthens the game's own leaf swing (at the gust's crest the swing is 1 + this times as big).
LeafFlutter = 0.12                     # [0-1] (2026-10-20) SpeedTree bushes: extra leaf flutter (radians, grows with the wind).
LeafLean = 0.0                         # [0-50] (2026-10-20) SpeedTree bushes: units a gust leans the leaves downwind (the bushes' branches are the game's and do not follow: keep small). 0 = none.
LeafHeight = 120.0                     # [1-5000] (2026-10-20) SpeedTree bushes: height in the bush where the lean is full (it rises from 0 at the ground).
Keywords = "creosote,sagebrush,josh,yucca,mesquite,coyotetobacco,maize"   # (2026-10-20) Static plants: textures whose path holds one of these move. Every part of a plant must match, or its parts come apart: the vanilla Joshua trees AND yuccas use TreeJosh textures (texture packs: joshuatree), so josh covers both.
Exclude = "cactus,stump,agave,dead"   # (2026-10-20) A texture whose path holds one of these never moves, even when a keyword matches.
Log = 0                                # (2026-10-20) DIAGNOSTIC: 1 = a log line every 600 frames with the wind, the plant draws per frame and the leaves' values, and every newly matched plant texture.

[_Shaders.GodRays.Main]
SkipEmpty = false                     # UNOFFICIAL (2026-10-16), DROPPED (off): skip the god rays' blurs when the light mask is empty. Measured in game: the mask is never empty in daylight, so it only added a 0.07 ms check. Applies immediately
SkipIdle = true                       # PLAYTEST ON (2026-10-18; release default off): UNOFFICIAL, MAY CHANGE THE IMAGE: draw no god rays at all while the sun is high (20+ degrees up) and well outside the view (12+ degrees beyond the frame) and the sky is too dim to cast rays. Then the rays are exactly nothing and the picture is the one without them; every 4th frame a cheap check (sky mask + a 1-pixel occlusion query, ~0.15 ms, answered a frame later without waiting) tells whether the sky is still dim. Measured at game hours 8-16: the god rays cost ~0.45 ms, with this on ~0.04 ms on frames where the sun is not in view; nothing changes when the sun is in view (the full effect runs on that very frame). Not exact in one case: the sky turning bright within a few frames without the sun (a lightning flash): the rays then start up to ~8 frames late. Also makes the god rays pass return its input exactly where the rays are 0 (the old pass darkens most texels by one fp16 step, ~0.05 %). Needs occlusion queries, otherwise does nothing. Applies immediately
ProbeLog = 0                          # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = every 8th frame the largest sky-mask and light-mask values are read back (a GPU stall) and logged as GODRAYS PROBE.
DayMultiplier = 1.0                   # Strength of godrays during the day.
LightShaftPasses = 8                  # Not used.
Luminance = 0.8                       # Treshold for minimum luminosity of areas casting rays. Lower means more of the sky will cast rays.
NightMultiplier = 0.5                 # Strength of godrays during the night.
RayDensity = 1.0                      # Curve for reduction of the intensity of godrays near the sunglare.
RayIntensity = 1.0                    # Multiplier for the intensity of the bright areas being blurred to create the rays.
RayLength = 1.0                       # Multiplier for the length of rays.
RayVisibility = 50.0                  # Exponent for the godrays contrast.
SunGlareEnabled = true                # Strength of the effect will be scaled with the weather sunglare setting.
TimeEnabled = false                    # Strength of the effect will be strongest around sunset/sunrise and not at all during noon.
SunsetGlareFix = true                 # UNOFFICIAL (2026-10-29), CHANGES THE IMAGE: the sun glare the god rays start from gets the sunset colour boost ([Shaders.Sky.Main] SunsetR / G / B, red by default) at sunrise and sunset only, as the sun itself does. false = as before: the whole boost with the sun high and none at sunset (a red tint in the glare and the rays all day). Applies immediately.

