PTBounceLights = 0                   # UNOFFICIAL (2026-11-07 perf-ptcost) test only [0-1], live: 0 = a bounce hit (not the first) traces ONE light sample, the sun, the picked lamp or the emissive point, chosen by their unshadowed light (unbiased: one shadow ray instead of three); 1 = all three, as before.

[_Main.Main.Quality]
MaxQuality = false        # UNOFFICIAL (2026-10-15), FOR SCREENSHOTS, needs a restart: every effect normally worked out at half or a quarter of the screen size runs at the full size, every reduced-quality shortcut is off, and quality settings go to their highest reasonable values (the list is in VegasShaders.maxquality.toml, which you can edit). Expect a much lower frame rate (often half or less). Your own settings are never changed: turn it off and restart to get them back exactly.
MsaaEdgeFix = true        # UNOFFICIAL BUG FIX (2026-11-05), live, only with the game's own anti-aliasing (iMultiSample): see-through cutouts (pylon lattices, bushes, fences) under the volumetric clouds and the volumetric light. These effects read one depth per pixel, so a pixel a cutout covers only in part counted as all cutout or all sky; with the DXVK fork's Vulkan passes (on by default) the volumetric light took no sky share at all. On: every pixel takes its exact share of sky (the share of its samples where nothing was drawn), on the D3D9 and the Vulkan passes. Off: as before.
MsaaEdgeDebugView = 0     # UNOFFICIAL, test only (2026-11-05), live: 1 = the volumetric clouds and the volumetric light show, in place of their effect, red where the depth they read says sky and green for each pixel's exact sky share (the share needs the game's MSAA; without it only red).
SmoothNormals = 0         # UNOFFICIAL (2026-10-23), CHANGES THE IMAGE when above 0, live: every effect works from a surface normal rebuilt from the depth buffer, so low-poly ground and rocks get one flat normal per triangle and the cloud shadows (SunFar), the sun shadows' face offset and the snow step at each triangle edge. A value r (pixels, try 72 = AmbientLight's NormalSmoothing 36 at half resolution) smooths the normals buffer once, right after it is drawn, for every effect that reads it: the same edge-aware averaging AmbientLight uses (creases and silhouettes are kept). About 0.2-0.3 ms at 1440p; with it on, AmbientLight's own NormalSmoothing is skipped (done already). 0 = off, as before.
CapturedNormals = true    # UNOFFICIAL (2026-10-28, macintroll's idea; on by default since 2026-10-28: a fix; needs a restart: the lit shaders are compiled with it), CHANGES THE IMAGE: every effect that works from the surface normal (ambient occlusion, AmbientLight, sun / cloud / far shadows, specular, snow...) takes the surfaces' own smooth normals, written by the surfaces while they draw, instead of one flat normal per triangle rebuilt from the depth buffer: no more facets on low-poly rocks and characters, no shadow crust on rocks. Surfaces the mod's shaders do not draw (the game's own shaders, see-through things, water, grass) keep the old normal (SmoothNormals above still applies to them). Works under the DXVK fork and native D3D9 (not with the game's own MSAA on native: as off there). Off = exactly as before.
CapturedNormalsLeanHook = true  # UNOFFICIAL (2026-10-29; default on 21:40 after a clean A/B: Ultra-Luxe -0.16 ms, pictures equal), live, under the DXVK fork: CapturedNormals' per-draw hook takes the render targets, shader and blend states from the game's own calls instead of asking the graphics device for them on every draw (measured 1.5 ms of the main thread in the Ultra-Luxe). Same picture; off = as before.
SharedDrawState = true         # UNOFFICIAL (2026-10-29; default on 21:50 after a clean A/B: Ultra-Luxe -0.25 ms, pictures equal), live, under the DXVK fork with CapturedNormalsLeanHook: LinearScene's per-draw hook reads the render target, pixel shader and blend states CapturedNormals already tracks instead of asking the device again (fewer device calls a draw; the picture is unchanged). false = it asks the device as before.
ObjectMotion = true       # UNOFFICIAL (2026-10-29, on by default since 2026-10-30), CHANGES THE IMAGE, live: TAA and FSR 2 / 3.1 find where each pixel was last frame from the camera's move only, so things that move themselves (people walking, a grabbed object, doors, ragdolls) were followed as if they stood still: smearing and ghost trails behind them. With this on, the mod notes what moved while the world draws and draws just those again into a motion buffer (their world-space move since last frame, after skinning), which TAA and FSR's motion vectors subtract: moving people and objects keep a sharp, steady history. Costs a re-draw of the moved objects only (none when nothing moves). Not covered: the first-person view (as before), see-through things, particles, grass and wind sway. Off = exactly as before.
ObjectMotionSkipCameraFollow = true   # UNOFFICIAL (2026-10-30, BUG FIX, on by default), live, with ObjectMotion: the sky layers (AtmosphereDome, CloudDome, HorizonLayer*, LowerLayer: 450-1060 units round the camera) move by exactly the camera's move whenever the player walks, so ObjectMotion counted it as moving and gave its move to a ring of ground round the player at the dome's distance; with FSR / TAA after the mod's effects (low-res effects on) that ring was reprojected wrongly: a blurred circle round the player while walking. On: anything whose move is just the camera's move counts as still.
ObjectMotionIdentity = true   # UNOFFICIAL (2026-11-09, BUG FIX, on by default), live, with ObjectMotion: ObjectMotion remembers each drawn object's last position by its memory address; when the game freed an object and made a new one at the same address (a cell unloading, a body or weapon model swapped), the new one took the old one's position as its own last frame and got a false move for one frame (a smear in TAA / FSR's history). On: an object whose mesh, skin or parent differ from what was remembered at that address starts fresh. Off: as before.
MaterialBuffer = true    # UNOFFICIAL (2026-10-29), needs a restart, with CapturedNormals on: the mod's lit surfaces also write what they are into a screen-sized buffer while the world draws (TESR_MaterialBuffer: the material class -- object, worn gear, cloth, land, plant --, the object's size as a thickness, the roughness), for effects and the ray-traced passes to read instead of guessing from depth. Nothing reads it yet; costs one more screen-sized target while the world draws. Off = exactly as before.
MaterialBufferSkin = true    # UNOFFICIAL (2026-10-31), live, with MaterialBuffer: characters' skin is in the material buffer too (class 6 with its roughness; the skin shader has no target left, so it is copied in after the world draws, one cheap full-screen step). Off: skin stays unmarked (class 0), as before. Changes nothing on screen by itself.
MaterialBufferCheckEvery = 0    # UNOFFICIAL (2026-10-31), live, a test aid: the material buffer's self-check (a log line of what it holds) every this many frames as well. 0 = only at the usual few frames.
AlbedoBuffer = true      # UNOFFICIAL (2026-10-31), needs a restart, with CapturedNormals and MaterialBuffer on: the mod's lit surfaces also write their own base colour (the texture times the vertex colour, in linear light, before metal) into a screen-sized buffer while the world draws (TESR_AlbedoBuffer), for DLSS Ray Reconstruction ([Shaders.TAA.DLSS] RRAlbedo 2), AmbientLight's bounce ([Shaders.AmbientLight.Main] AlbedoBuffer) and later the ray-traced passes to read instead of guessing it from the lit picture. Characters' skin comes from the screen-space skin blur's own target (needs [Shaders.Skin.Scattering] ScreenSpace on; otherwise skin stays unwritten). Costs one more screen-sized target while the world draws. Nothing on screen changes until a reader is switched on. Off = exactly as before.
BackDepth = false         # UNOFFICIAL (2026-10-31), live, off (root plan B3), changes the image slightly: the back faces of the objects near the camera are drawn into a screen-sized buffer (TESR_BackDepthBuffer), so the sun's contact shadows and AmbientLight know how thick a thing in front really is: no contact shadow behind thin poles, rails, arms and leaves, and no ambient darkening on what lies behind a thin thing. Where nothing near was drawn (land, past BackDepthDistance) the effects guess as before. Costs one more draw of the near objects (CPU and GPU, see the F10 'Back-face depth' timers).
BackDepthDistance = 1500.0 # [0-10000] world units (about 70 to a metre): how far from the camera objects get their back faces drawn.
SharedNoise = true        # UNOFFICIAL (2026-11-01), live, CHANGES THE IMAGE slightly (less flicker): one frame counter and one history rule for every effect (docs/next/FLICKER-PROGRAM.md). With TAA / FSR / DLSS off nothing averages frames, so the noise of the effects that keep no history of their own (the tonemap and Sky Dither dithers, the god-ray march and the reflection trace without their Temporal, the skin blur's turn) now stands still instead of changing every frame (a fine still grain instead of a twinkle); with TAA / FSR / DLSS on it moves as before. The effects with a history (AmbientLight, BounceLight, the god rays and reflections with Temporal, the clouds, RT AO) keep moving, from the one shared counter, each shifted so their patterns do not beat, and all of them start their history again on the same events (a camera cut, a jump of more than 512 units, a pause of more than half a second, a change of the screen size, RenderScale or upscaler). Off = every effect as before (its own counter and reset rules).

[_Main.Main.ReducedQuality]
GodRaysLowRes = false       # UNOFFICIAL, CHANGES THE IMAGE: compute god rays at quarter instead of half resolution (4x fewer pixels). Rays get softer; thin shafts through foliage may shimmer when moving. Applies immediately.
AOLowRes = false            # UNOFFICIAL, CHANGES THE IMAGE: compute ambient occlusion at quarter instead of half resolution (4x fewer pixels). Corner shading gets softer and loses small creases; may look blotchier. Applies immediately.
PointShadowInterval = 1     # UNOFFICIAL, CHANGES THE IMAGE (only when above 1): redraw each point-light shadow cubemap (interiors, and exteriors with point shadows on) every N frames instead of every frame, 1-4. 1 = every frame, the original behaviour (the default since P49; earlier builds defaulted to 2). Each light's cubemap is redrawn at once when its light, position, radius or cell changes, and lights that only reach still objects keep their cubemap at any setting; in between, people and doors moving through the light cast shadows that lag up to N-1 frames, which can look like stuttering or flickering shadows on moving people. 2 cut the F10 'Point shadow cubemaps' timer by roughly 40% in one interior (about 1.2 ms GPU and 0.9 ms CPU, measured before P44 made still lights free). Applies immediately.
LampShadowMoveTolerance = 0.0 # UNOFFICIAL, CHANGES THE IMAGE (only above 0), indoors with the per-object lamp shadows: a lamp that moves less than this many units from where its shadow cube map was drawn (flickering fire lights jitter by about 0.6 units a frame, up to ~16 from where they started) keeps that cube map and casts its shadows from that point, instead of redrawing the whole cube map every frame. Shadows of such lights then hold still while the light flickers. Casino at 16: 'Point shadow cubemaps' -0.47 ms, frame -0.37 ms (7 fire lights). 0 = off (as before). Applies immediately.
CheapReflections = false    # UNOFFICIAL, CHANGES THE IMAGE: draw the water reflection map without the mod's per-object sun shadows and without terrain parallax, like the original game's reflections. Objects and ground seen IN the water lose their sun shadows and bumpy terrain detail; the game blurs the reflection, so the difference is usually small. Only matters where water is in view and the game reflects objects (bUseWaterReflections... in FalloutPrefs.ini). F10 timer: 'Water reflections (game)'. Applies immediately.
CheapUnderwaterTerrain = false # CHANGES THE IMAGE: ground below the water surface (lake and river beds, and everything when you are underwater) is drawn without terrain parallax (the fake 3D bumps) and its small shadows; you see that ground through moving, murky water. Only near water; dry ground keeps full parallax. Removes most of the frame-rate drop when wading or swimming (the terrain shader measured 51-78% cheaper on submerged ground; in one test standing in the Potomac, terrain cost 5.6 ms). Applies immediately.
ParallaxLite = false         # UNOFFICIAL, CHANGES THE IMAGE (slightly): cheaper parallax (the fake 3D bumps) on the ground and on objects that have it (many rocks, cliffs and walls). 8 search steps and one quick correction step at the found spot instead of 16 steps plus a second fine search; on the ground also 2 small-shadow samples instead of 4. The bumps can sit very slightly differently, most at grazing angles. In game (GTX 1070, 1440p): open desert terrain 3.7 -> 2.6 ms (about 81 -> 89 fps); rocky desert with many blended ground textures terrain 6.2 -> 4.1 ms (about 65 -> 73.5 fps). Switching it on also sets Shaders > Terrain > Parallax > MaxDistance once to 1024 units (about 15 m) at 1440p, 768 at 1080p, 1536 at 4K (only if it was longer), where the bumps are only a few pixels tall; that saved another 0.8 ms with no visible change. MaxDistance stays yours to change afterwards: raise it there for longer bumps and it is kept. Overrides HighQuality while on. Was TerrainParallaxLite in P60 (a saved value carries over). Applies immediately.
NearCascadeInterval = 1     # UNOFFICIAL, CHANGES THE IMAGE (only when 2): redraw the nearest sun-shadow cascade every 2nd frame instead of every frame, 1-2. Between redraws the cached cascade follows the camera's movement, so still shadows stay put; shadows of moving things (people, creatures, doors) lag one frame, and right after a very fast camera turn the newly visible area may use the softer next cascade for one frame. F10 timers: 'Sun cascade geometry', 'Shadow atlas prefilter', 'Sun cascades (CPU)'. Applies immediately.
StaggeredSunShadows = false # UNOFFICIAL, CHANGES THE IMAGE: redraw the middle sun-shadow cascade (with the default shadow settings roughly 3-9 m away) every 4th frame and the far and most distant ones every 8th, instead of every frame (the most distant one every 4th with ShadowsExteriors > ShadowMaps > LimitFrequency, the original). This was always on in P21-P48. Still shadows stay put, because a cached cascade follows the camera's movement, but people and creatures moving more than a few metres away get shadows that stutter and can flicker on their bodies. Saves roughly 0.5 ms GPU per frame outdoors (GTX 1070, 1440p) plus some CPU. F10 timers: 'Sun cascade geometry', 'Shadow atlas prefilter', 'Sun cascades (CPU)'. Applies immediately.
SunCacheByChange = false # UNOFFICIAL (2026-10-31), live, off (root plan A1), changes the image slightly: the middle, far and most distant sun-shadow cascades are kept and redrawn only when something changed -- the sun moved a step, the camera moved or turned by more than SunCacheMoveShare of the cascade's size, a person or creature is in it, or SunCacheMaxAge frames passed (doors and physics objects are not tracked: their distant shadows can lag by up to that). Standing still or walking slowly, those cascades are drawn a few times a second instead of every frame. Takes over from CachedDistantShadows (same kept maps, its fixed 4 / 8 frame schedule replaced).
SunLayers = false # UNOFFICIAL (2026-10-31), live, off (root plan A1, a layered cache), changes the image slightly: the middle and far sun-shadow cascades are built every frame from a kept picture of everything that never moves (land, buildings, rocks; redrawn only when the sun steps, the view slides past SunLayersMargin, new cells load or SunLayersMaxAge frames pass) plus a thin layer drawn every frame of what can move: people and creatures, doors, items, animated models (flags, fans), trees (SunLayersTreesMoving) and anything with cloth or plant wind. Takes over those two cascades from CachedDistantShadows / SunCacheByChange (the most distant cascade keeps their rules). Costs 2 x about 13 MB of video memory at the default resolution.
SunLayersMargin = 128 # [8-512] texels: how far the view can slide before the kept picture is redrawn (also its size: the cascade's plus twice this).
SunLayersMaxAge = 600 # frames: the kept picture is redrawn at least this often (the net for anything taken as still that moved).
SunLayersTreesMoving = true # SunLayers: trees are drawn every frame (their leaves sway in the wind); false = kept with the still things (cheaper, their wind shadows freeze).
SunLayersDebug = 0 # TEST: 1 = everything in the kept picture and no per-frame layer, 2 = an empty kept picture and everything drawn per frame, 3 = the kept picture redrawn every frame. 0 = normal.
SunCacheMaxAge = 30 # UNOFFICIAL (2026-10-31), live: [1-240] frames a kept cascade may go without a redraw.
SunCacheMoveShare = 0.05 # UNOFFICIAL (2026-10-31), live: [0-0.5] how far the camera may move or turn (its cascade region drifting), as a share of the cascade's radius, before it is redrawn.
CachedDistantShadows = false # UNOFFICIAL, CHANGES THE IMAGE (slightly): like StaggeredSunShadows (middle sun shadows every 4th frame, far and most distant every 8th), but a cascade that has the shadow of a person or creature in it is redrawn every frame, so moving characters keep correct shadows (people close to you are handled by the nearest shadows, which are always redrawn). Still objects look the same; other moving things (doors, objects knocked around) far away can lag a few frames. Saves shadow work where no characters are around (up to about 1 ms in quiet places, GTX 1070 1440p); on busy streets like the Strip there is nearly always someone in range and it saves only about 0.1 ms. Ignored while StaggeredSunShadows is on. Applies immediately.
FXAA = false                # UNOFFICIAL, CHANGES THE IMAGE: lean FXAA edge smoothing (about 0.15 ms at 1440p vs about 1 ms for SMAA). Meant to replace SMAA: turn SMAA off (Shaders > SMAA) when using it. Slightly softer than SMAA, weaker on thin distant detail. The game's own MSAA (iMultiSample in FalloutPrefs.ini) is not touched. Applies immediately.

[_Main.Main.Precipitations]
RemovePrecipitations = false   # Disables vanilla rain and other precipitations.

[_Main.Main.Water]
ForceReflections = true     # Always render the full world in reflection for HD reflections.
RemoveUnderwater = false    # Disables fog underwater. Not compatible with custom underwater shader.
ReflectionClipFix = true # UNOFFICIAL, BUG FIX (on by default): water reflections lost the far buildings and showed below-water ground when you looked level or up. The game sets the reflection's water-height clip plane once, before the reflection pass binds a vertex shader, and the driver then applies it wrongly to that pass's draws; the mod re-issues the same plane at every draw of the pass so it takes. Off = the game's behaviour. Applies immediately.

