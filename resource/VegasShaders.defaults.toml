UseOwnColour = false                   # UNOFFICIAL (2026-11-11): the beam takes ColorR/G/B below instead of your Pip-Boy's HUD colour (their hue: how bright it is stays Dimmer's). false = the Pip-Boy colour, as before.
ColorR = 2.0                           # [0-10] UNOFFICIAL (2026-11-11): red of the beam's own colour (only with UseOwnColour; 2, 2, 1 the old flashlight's warm white).
ColorG = 2.0                           # [0-10] UNOFFICIAL (2026-11-11): green of the beam's own colour (only with UseOwnColour).
ColorB = 1.0                           # [0-10] UNOFFICIAL (2026-11-11): blue of the beam's own colour (only with UseOwnColour).
Angle = 30.0                           # [5-63] UNOFFICIAL (2026-11-11): the beam's cone, the angle in degrees from its centre to its outer edge (half the full cone; full brightness inside half of it). Its shadow map and lens pattern follow it, and so does the path tracer. 30 = the beam as before.
OffsetX = 0.0                          # UNOFFICIAL (2026-11-11): moves the light along the beam, in game units, from where it sits (the weapon, the head in third person, or the camera). 0 = where it was.
OffsetY = 0.0                          # UNOFFICIAL (2026-11-11): moves the light along the second axis of what it rides (the weapon, head or camera), in game units. 0 = where it was.
OffsetZ = 0.0                          # UNOFFICIAL (2026-11-11): moves the light along the third axis of what it rides (the weapon, head or camera), in game units. 0 = where it was.
NearFade = 0.0                         # [0-1000] UNOFFICIAL (2026-11-11): fades the light out on surfaces closer to it than this many units, so point blank walls do not clip to white (the path tracer too). 0 off, as before.
HotspotLimit = 0.0                     # [0-10] UNOFFICIAL (2026-11-11): rolls off the brightest part of the lit pool without dimming the falloff round it; higher rolls off sooner (the path tracer too). 0 off, as before.
SoftEdges = false                      # UNOFFICIAL (2026-11-11): wrap lighting instead of the clamped diffuse, less speckle where normals scatter, a flatter beam. The light pass only (the path tracer shades physically). false = as before.

[_Shaders.Flashlight.Deferred]
Shadows = true                         # Everything in front of the flashlight casts a shadow in its beam (a shadow map drawn from the light every frame while it is on). (The old RenderShadows key.)
ShadowSoftness = 5.0                   # [0-16] How soft the shadow edges are: the PCF blur's radius in texels of a 512 map (the same width whatever ShadowMapSize is). 16 bilinear PCF samples.
ShadowBias = 0.004                     # [0-0.1] How far a surface may be behind its shadow map depth and still count as lit, as a share of the beam's reach. Raise it if surfaces shadow themselves in stripes; lower it if shadows lift off their casters.
ShadowMapSize = 2048                   # NEEDS A RESTART. [512, 1024, 2048, 4096] The flashlight's own shadow map resolution (it used the lamp shadows' ShadowCubeMapSize before). Higher: sharper shadow shapes, more video memory (2048: 16 MB).
Cookie = 0.0                           # [0-1] The flashlight lens pattern (Effects\Flashlight.png) over the beam. 0 a clean beam. (The old CookieStrength key; it follows Angle.)
Falloff = 4.0                          # [0-32] How fast the beam fades with distance: a windowed inverse square, bright close up, about a quarter as bright halfway to the reach (Distance) at 4, nothing at the reach. Higher: a shorter beam. 0: the lamps' falloff (still three quarters as bright halfway out).
GameLight = true                       # The flashlight is also a real game light (the Pip-Boy light, moved onto the beam), so everything a lamp lights reacts to it as to a lamp at night: leaves, your first-person view, see-through things and the env-map shine of glossy assets. What the light pass already lights gets none of it (no double light); the rest gets it as far as the object is in the beam.
DebugView = 0                          # DIAGNOSTIC: 1 the flashlight's light alone, 2 its shadow, 3 the normals it lights by. 0 off.
TestForceOn = false                    # TEST, for automatic tests: the flashlight on as if the Pip-Boy light were (and the game's Pip-Boy light switched on). Leave off.

