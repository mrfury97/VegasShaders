# This file is for the default values of settings. Do not modify

[_Main.CameraMode.Main]
ChasingFirst = false    # Use Chasing camera in first person.
ChasingThird = false    # Use Chasing camera in third person.
Crosshair = 0           # Display crosshair in Camera Mode.
Enabled = false         # Activate Camera Mode.
FoV = 90.0              # Custom FOV in Camera Mode.

[_Main.CameraMode.Positioning]
AimingOffsetX = -1.0
AimingOffsetY = 15.0
AimingOffsetZ = 4.5
DialogOffsetX = -50.0
DialogOffsetY = -50.0
DialogOffsetZ = 10.0
OffsetX = 0.0
OffsetY = 15.0
OffsetZ = 5.0

[_Main.Develop.Main]
DebugMode = false       # Enables debug features like capture shaders and print shadowmaps.
DebugVar1 = 0.0         # Custom variable used when developing shaders.
DebugVar2 = 0.0         # Custom variable used when developing shaders.
DebugVar3 = 0.0         # Custom variable used when developing shaders.
DebugVar4 = 0.0         # Custom variable used when developing shaders.
TraceShaders = 25       # Keyboard shortcut to print used shaders list to the log.
FailShaders = ""        # Test builds only (terrain flicker A/B): shader names, comma separated, loaded as a failed compile.
GpuDebugLabels = false  # Debug only (2026-10-26): every step (each effect, shadow map, sun cascade, the game's world scene, the DXVK extension's passes) is a named group in a frame capture (D3DPERF events). Under DXVK they need the environment variable DXVK_DEBUG=markers. Guide: docs/next/FORK-DEBUG-CAPTURE.md.
RenderDocCaptureKey = 0 # Debug only: keyboard key (DirectInput code, e.g. 87 = F11) that asks RenderDoc for a capture of the next frame(s). Works only when the game was started from RenderDoc (on the DXVK d3d9.dll); the mod never loads RenderDoc. 0 = no key.
RenderDocCaptureFrames = 1  # Debug only: how many frames the RenderDocCaptureKey captures (1-10).
FlashSelfTestEvery = 0  # UNOFFICIAL (2026-11-01), live, a test of the flash detector and its stage probes: every Nth rendered frame the effect named in FlashSelfTestEffect is left out for that one frame (a dropout on purpose). Each one must then give a "FLASH" block whose "source:" names that effect. 0 = off (normal play). Only for checking the detector: it makes the picture flicker.
FlashSelfTestEffect = "VolumetricLight" # UNOFFICIAL (2026-11-01), live: the effect FlashSelfTestEvery leaves out (its name as the log's effect lines spell it, e.g. VolumetricLight, AmbientLight, Bloom).
CrashTest = 0    # DIAGNOSTIC (2026-11-04), live: crashes the game on purpose, to check the log's CRASH lines (exception, stage, registers, call stack). 0 = never (always leave it there); 1 = an access violation; 2 = a C++ exception (the game or another plugin may catch it and carry on: the bench run did). The game closes within a second of setting it.
StallTest = 0    # DIAGNOSTIC (2026-11-07 perf-ptcost), live: freezes the game on purpose once, to check the log's STALL lines (the watchdog: where the render thread is during a freeze). 1-120 = the render thread sleeps that many seconds once (inside the frame, stage "StallTest"); set another value for another freeze; 0 = never.
FrameJournal = false    # UNOFFICIAL (2026-11-01), live, for flicker hunting (bench runs may turn it on): the log gets one "FJ" line, with the frame number of the line's "[time fN]" prefix, for every event that changes what is drawn: sun cascade redraws (and why), lamp shadow slot handovers, lamp ranking changes across the 16th place (deferred lamps), shadow pool draws, shadow atlas re-converts, temporal history resets (which effect, why), AmbientLight grid rebuilds, god rays SkipIdle switches, CasterFadeMin caster drops, reflection cube restarts. At most 20000 lines a session. Off = nothing extra (the minute counters of the HEARTBEAT line are always there).

[_Main.Develop.PixelInspector]
Enabled = false         # UNOFFICIAL DEBUGGING TOOL (2026-10-26), needs the DXVK fork with extension 1.5-debug (fork patch 0016; does nothing on native D3D9 or stock DXVK, and says so once in the log): for the screen pixel X, Y, records the value it has at every stage the mod can see each frame (the scene before the mod, the linear depth, the view normal, the picture after each effect that drew, the effects' own buffers such as the shadow buffer, the tonemapped picture, the final picture before the HUD) and shows them in a window while the menu is open (pick the pixel with the mouse there); the log gets them ('PIXEL INSPECTOR') when the pixel changes and every LogEvery frames. One tiny GPU copy per stage, read back a few frames later without ever waiting. Off: nothing is created. Applies immediately.
X = 960                 # UNOFFICIAL DEBUGGING TOOL (2026-10-26): the inspected pixel's column, in the game's render pixels (0 = left). Also the probe pixel of the shader counters.
Y = 540                 # UNOFFICIAL DEBUGGING TOOL (2026-10-26): the inspected pixel's row, in the game's render pixels (0 = top).
LogEvery = 0            # UNOFFICIAL DEBUGGING TOOL (2026-10-26): with Enabled, also log every stage every this many frames (0: only when the pixel changes, or with the window's 'Log now').

[_Main.Develop.ShaderCounters]
ReflectionsHiZ = false  # UNOFFICIAL DEBUGGING TOOL (2026-10-26), needs the DXVK fork 1.5-debug and Reflections' HiZ trace running (NvrDxvkPasses, HiZ, outdoors): the trace runs its counting build (Compute\ReflectionsTraceHiZCount.spv) that counts how every reflected ray's walk ended (the DebugView 9 rules), the cells walked and the DebugView 10 skips, plus the values of the pixel inspector's pixel; per-frame averages logged once a second ('SHADER COUNTERS') and shown in the pixel inspector window. Read back without waiting. Costs a little GPU time while on (atomic counters in every trace pixel). Off: the normal trace, nothing created. Applies immediately.

[_Main.Transitions.Main]
TransitionCurvePower = 1.0             # Day/night transition curve exponent. 1.0 = current smoothstep behavior. Higher values sharpen the transition; lower values soften it.

[_Main.FlyCam.Main]
Enabled = true
KeyAdd = 78
KeySubtract = 74
ScrollMultiplier = 2.0
StepValue = 1.0

[_Main.GunFX.Main]
Puff = false                            # GunFX (experimental, needs GunFX.dll): a small puff of smoke at the muzzle on every shot. Fine-tune everything in Data\NVSE\Plugins\GunFX.ini.
HeatSmoke = false                       # GunFX: a thin strand of smoke rising from the barrel once it is hot from sustained fire; it tapers off as the gun cools.
AfterFireTrail = false                  # GunFX: a thin, wispy trail rising from the barrel only after you stop firing (like a cigarette); fades as the barrel cools, stops when you fire again.
VolumetricSmoke = false                 # GunFX (prototype): draw the smoke (heat smoke, after-fire trail, muzzle puff, ejection smoke) as continuous volumetric smoke (lit, soft, unbroken while moving) instead of particles. Each smoke's own switch still applies; tuning in [Volume] in GunFX.ini.
VolumetricSmokeHalfRes = true           # GunFX: draw the volumetric smoke at half resolution (a quarter of the pixels; much cheaper, the smoke is soft). Off = full resolution.
VolumetricSmokeLowRes = true# GunFX: draw big, close volumetric smoke (pieces covering more than 1% of the screen, as when you walk into smoke) at an eighth of the resolution. Much cheaper in thick smoke; looks the same.
SmokeHaze = true                       # GunFX: the gun-smoke haze that slowly fills a room as you keep firing (with VolumetricSmoke). The most expensive part of GunFX: off skips its whole-screen pass. Applies immediately.
BulletTunnels = true                   # GunFX: bullets punch tunnels through the smoke and haze in front of you, which then fill back in. Off skips the pass that cuts them. Applies immediately.
VolumetricSmokeTest = 0                 # GunFX, for finding faults: 0 normal; 1 the volumetric smoke in plain green (shows exactly where it is drawn); 2 no muzzle flash light on it; 3 smoke worked out but not drawn; 4 nothing drawn at all. Leave on 0.
EjectionSmoke = false                   # GunFX: a burst of smoke from the ejection port with every casing, bigger when the barrel is hot.
BarrelGlow = false                      # GunFX: the barrel glows after sustained fire and cools down slowly.
HeatHaze = false                        # GunFX: heat shimmer around a hot barrel (screen effect).
MuzzleBlast = false                     # GunFX: a quick, wide ripple of heat shimmer at the muzzle on every shot, whatever the barrel heat.
EnergyWeapons = false                   # GunFX on energy weapons too (lasers, plasma and the like, including modded ones: decided by the weapon's Energy Weapons skill). Off = no GunFX effects on them.

[_Main.FrameRate.SmartControl]
FlowControl = -0.5
SmartControl = false
SmartControlFPS = 60

[_Main.FrameRate.Stuttering]
BackgroundThreadPriority = 5
SmartBackgroundProcess = false

[_Main.Main.Misc]
RetryFailedEffects = true             # UNOFFICIAL BUG FIX (2026-11-02), live: a part of an effect that switched itself off after an error (a texture or target that could not be made, a pass that failed to draw: CapturedNormals, DeferredLamps frame copy, exact pass sums, GodRays dedicated / packed passes, AO and Skylighting RT passes, the wet/snow cover map) tries again after the next cell change, up to 3 times. Each failure is listed in the menu's status bar. false = as before: off until the game restarts.
ForceMSAA = false           # Override game setting to force MSAA.
RenderEffects = true        # Toggle rendering of all effects.
LockpickEffects = false     # UNOFFICIAL (2026-11-01), live: the mod's effects and object shaders (PBR) while the lockpick screen is open. false = the game's own picture and shaders there (the lock came out black with PBR) (the mod's effects made the lock view look wrong, above all with a real-time-menus mod that keeps the world drawing behind the lock). true = as before.
RenderPreTonemapping = true # Toggle rendering of some effects in HDR before the game image space effects (can cause glitches).
ReplaceIntro = false        # The old project's intro movie, main menu video and menu music (needs their files: NVRGameStudios.bik, NVRMainMenu.bik, NVRMainMenu.mp3). Off = the game's own. Restart to apply.
ScreenshotKey = 87          # Keycode for custom screenshot hotkey (removes HUD and saves as jpg).
HDRScreenshot = false       # Save screenshots in fbx (use with DXVK HDR)
DxvkDescriptorHeapOff = true # UNOFFICIAL (2026-11-09), BUG GUARD, needs a restart, only with DXVK: tells DXVK not to use its newest way of handing textures to shaders (the "descriptor heap" binding model), which it switches on by itself with recent graphics drivers (NVIDIA from 595.84 on). The mod's own Vulkan passes were not written for it: on a tester's RTX 5090 one of them read a blank texture there, which showed as a screen-fixed diagonal triangle in the ray-traced bounce light and as dark trails. Nothing on disk is changed (it is passed to DXVK for this run only), and a dxvk.conf that sets dxvk.enableDescriptorHeap itself is left alone. false = DXVK chooses, as before.
PresetOldDefaults = false    # UNOFFICIAL (2026-11-10), needs a restart: presets and other mods' scripts made with an older build can switch [Shaders.AmbientLight.Main] AlbedoBuffer off again at every load (it was off by default before 1.0.6), which brings back tinted, over-bright bounce light indoors. Vegas Shaders now passes over that one change and says so in the log. true = let presets and scripts set it. The menu and your own settings file always can.
FlashDetect = true          # UNOFFICIAL (2026-11-01), live: the automatic flash / flicker detector. Each frame the finished picture is shrunk to 8x8 on the graphics card and read back three frames later without waiting for it (about 0.01-0.05 ms a frame; it turns itself off, logged, if it ever costs over 0.5 ms). A frame that goes darker or brighter than both the frame before and the frame after over a large part of the picture (a one-frame dropout, a black or white frame) writes a "FLASH" block to the log: which part of the screen, how much, what changed in that frame (shadow redraws, history resets, lamp handovers...) and every effect's state. Never around loading screens, menus, the Pip-Boy, VATS, dialogue or fast turns. At most one block every 10 s and 50 a session. Nothing personal is logged. false = off.
FlashStages = 1             # UNOFFICIAL (2026-11-01), live: the flash detector's stage probes, which tell a FLASH block WHICH effect's output jumped. The same 8x8 shrink is taken after every effect of the frame (and the scene before the mod), so the block names the first stage whose own change on the flashing part of the screen is large enough ("source: VolumetricLight ..."), the stages that amplified or damped it, and every stage's change. 1 = armed (default): the probes are off until a FLASH (or the report key) and then run for 60 s, so a flicker that repeats is attributed by its next flash and idle frames cost nothing. 2 = always on (about 0.05-0.2 ms a frame: one small copy per effect; they turn themselves off, logged, over 0.5 ms). 0 = off.
BeatDetect = true           # UNOFFICIAL (2026-11-01), live: the beat detector, for flicker too small for FlashDetect's one-frame rule (a steady every-2nd / 3rd / 4th-frame pulse of a few levels). While the camera is still it watches the last 48 frames of the detector's 8x8 picture; when at least 6 cells pulse with the same period, larger than their noise, it writes a "BEAT" line: the period and phase, how many cells, how much, where on the screen, and (with the stage probes running) which effect's output carries the beat. One line per 10 s, 100 a session; it arms the stage probes like a FLASH. false = off.
HistoryWatch = true         # UNOFFICIAL (2026-11-01), live: the history watch, for pictures that smear, melt or wash out over several frames (a temporal history that stops converging) rather than flash. Each frame the anti-aliasing / upscaler's input and output (TAA, FSR 2, DLSS at native resolution; RenderScale's upscale) are shrunk to 8x8 on the graphics card and read back three frames later without waiting. A "HISTORY" line is written when the output holds NaN or infinite values, when it drifts from its input for 24 frames in a row (RUNAWAY), or when it repeats exactly every N frames while still changing (CYCLE: the same few pictures in a fixed order, a frozen history); each line says the upscaler in use, its reset, jitter step, sizes and the frames since its last reset. One line per 10 s and rule, counted in the HEARTBEAT; it turns itself off over 0.5 ms a frame. false = off.
PresetManagerEnabled = false # Master toggle for automatic per-location Preset Manager resolution. Off = your own settings are authoritative; Save/Load/Delete in the Preset Manager panel still work. Defaults off: it silently wins the location-based settings that third-party tools like Cartographer -- which this feature supersedes -- also try to control, so turn it on deliberately once you're not running one of those alongside it.
MoreLampsPerObject = true    # UNOFFICIAL (2026-10-13), needs a restart: the game lit most shiny surfaces indoors (anything with a specular map) with at most 2-3 lamps each and dropped the rest; which ones it kept changed as you moved, so lamp light popped on and off whole wall and floor pieces. On: up to 6, like the game's other many-lamp passes. A little more GPU time where many lamps overlap. Off = the game's limit.
LampsInOnePass = false       # UNOFFICIAL, TEST (2026-10-18), live: shiny surfaces lit by 3-5 lamps (most lit walls and floors indoors) are drawn in ONE pass with all their lamps, as the game already does for 2 lamps, instead of 5-7 passes (base, extra lamps, texture, highlights, fog). With linear lighting each extra pass was added in the stored curve (too bright, a hazy look); in one pass the lamps add up exactly, so these surfaces come out darker and more contrasty. Far fewer draws, but measured SLOWER on the graphics card in the Ultra-Luxe (about +1 ms: the one many-lamp pass costs more than the passes it replaces); about the same in a casino. Needs MoreLampsPerObject (it holds the lamps; without it this stays off). Off = the game's choice.
LampCapsStats = 0           # UNOFFICIAL, DIAGNOSTIC (2026-11-04, test only): 1 = with the F10 profile on, the 'LAMP CAPS' log lines (per pass type: objects a frame, their own lamps, the lamps no pass carried; the skippable extra lamp passes). Before 2026-11-04 they ran with every F10 profile and made F10 timings read ~0.1 ms slower in lamp-rich rooms. Leave 0.
FoldFog = true               # UNOFFICIAL (2026-10-27), live: environment-mapped objects (shiny metal, chrome, marble with a reflection) get their fog in their lit pass instead of a separate fog pass afterwards: one draw fewer per such object (Vault 21 ~200, a casino up to ~280 a frame). The same picture; the reflection is fogged once instead of twice. Glass and other alpha-blended objects keep their fog pass. Off = as the game draws them.
ManyLampsGlow = true         # UNOFFICIAL (2026-10-27), live, only while ManyLampsOnePass is on: glow-mapped objects (lit signs, lamps, screens, vault wall lights) take the one pass too instead of the game's 5-7 passes (Vault 21 lobby: ~180 objects a frame, ~1,200 draws). Off = they stay multi-pass as the game draws them.
ManyLampsOnePass = true     # UNOFFICIAL (2026-10-27, from Conor's fork; ported 2026-10-28), needs a restart to come on (its shaders), then live: off goes back to the game's passes with the same shaders (to compare with F10); only under DXVK (stock DXVK or the DXVK fork; does nothing on native D3D9), with MoreLampsPerObject on: shiny surfaces lit by 3 to 24 lamps (most walls and floors in lamp-rich interiors: Vault 21, the casinos) are drawn in ONE pass with all their lamps instead of the game's 5-7 passes (light-only, extra lamp, texture, highlight and fog passes): far fewer draw calls indoors, which helps most when the processor holds the frame rate back. With LinearScene the picture is the same (the game's passes already add up exactly there). The mod hands the shaders every lamp of the object itself (the game's own arrays stop at 6), and the shaders light each lamp per pixel. Lamps 7-24 of an object get no forward cube-map lamp shadow (the screen-space lamp shadows still cover them). Off = exactly as before.
LightCommonLamps = true     # UNOFFICIAL (2026-10-29), needs a restart, only with ManyLampsOnePass on (the DXVK fork): the shiny objects drawn in one pass take their lamps from ONE lamp table a frame (a small texture) and light every lamp past the sixth in a real loop, instead of each lamp written out in the shader and its data in the draw's constants. Same lamps, same light (a test switch for the shared lighting code, docs\next\ROOT-ASSUMPTIONS-PLAN.md): shorter shaders and much faster to compile. Off = as before.
LampTableStandalone = false # UNOFFICIAL (2026-10-31), needs a restart to make it possible, then live (an EXPERIMENT, docs\next\DEFERRED-RENDERING-PLAN.md stage 2): the frame's lamp table and its screen-tile lists made once a frame on any setup (native D3D9 too, without ManyLampsOnePass), for the deferred lamps pass that comes next. Nothing reads it yet: the picture is unchanged; F10 logs its CPU cost (LAMP TABLE line). Off = as before.
ClusteredLamps = 0           # UNOFFICIAL (2026-10-30) [0-1], needs a restart to compile in (with LightCommonLamps and ManyLampsOnePass on, the DXVK fork), then live: clustered lighting. Each frame the lamps are sorted into screen tiles x depth slices, and the shiny one-pass objects light every lamp that reaches each pixel (31 a tile at most), not just the game's list for the object (24 at most), after their six shadowed lamps as before. 0 = the object's list, as before.
LandAllLamps = false                 # UNOFFICIAL (2026-10-30), needs a restart, off by default: the land is lit by ALL of its own lamps. Its lamps come from Vanilla Plus Terrain, which lights a land piece with at most 6, 12 or 24 of them and in lamp-dense places (Freeside at night: pieces with 7+ lamps) leaves some out; the mod adds the rest after VPT's (up to 24). A self-check logs whether it matched VPT's lamps (F10: LAND LAMPS line) and adds nothing if not.
LampsDepthFirst = 0          # UNOFFICIAL, TEST (2026-10-26), live, needs DXVK (stock DXVK or the DXVK fork; does nothing on native D3D9, where it measured slower): makes LampsInOnePass cheaper. The surfaces drawn in one pass with all their lamps are first drawn once with depth only, then shaded, so each pixel gets its lamps computed once, for the surface you actually see; those walls and floors then also hide what is behind them from the rest of the scene. Same picture. Measured with LampsInOnePass: Lucky 38 about 0.7 ms faster than LampsInOnePass alone and 0.1 ms faster than the game's passes; Ultra-Luxe 0.03-0.2 ms faster than LampsInOnePass alone. 1 = on, 0 = off.
LampsDepthFirstMinLamps = 0  # UNOFFICIAL, TEST (2026-10-26): LampsDepthFirst only for one-pass surfaces with at least this many lights (the main light counts). 0 = all of them.
LampsDepthFirstCount = 0     # TEST (2026-10-26), development builds only, F10 only: counts the pixels the one many-lamp passes shade ('LAMPS DEPTH FIRST counts' lines). 0 = off.
LampReachMargin = 16.0       # UNOFFICIAL, BUG FIX (2026-10-13), needs a restart: game units (about 70 to a metre). The game lights an object with a lamp only while the lamp's reach touches the object; fire lights flicker and move a few units, so a lamp at the edge of an object's reach switched on and off every frame and its light and shadow flickered over whole walls and floors. The object counts this much larger, so a lamp at the edge stays. Its light is already zero there, so nothing else changes. 0 = as before.
SpecularLODPasses = false    # UNOFFICIAL, BUG FIX (2026-10-18), live: shiny objects lit by 3-5 lamps (most lit walls, floors and props indoors) jumped in brightness at the distance where the game stops drawing highlights (2000-2300 units by default): near, the game drew them in several passes whose sums come out too bright with linear lighting; past that distance in one exact pass. On: the game picks the same set of passes on both sides of that distance (only the highlight passes are left out far away), so nothing pops as you walk towards or away from them. Far objects with 3-5 lamps then look as they do up close. Off = the game's choice.
ActorsInOnePass = false      # UNOFFICIAL (2026-10-18), live, a LOOK OPTION: shiny actors (NPCs, the player's body) and the first-person model keep ONE lighting pass up to 5 lamps (needs MoreLampsPerObject). Without it, a moving actor that walks into a third lamp switches to several passes: with linear lighting it turns up to 2-3x brighter at once and loses its metal look, and back again as it walks on. On: no such pops on moving things; they keep exact sums and their metal with 3-5 lamps (darker and more contrasty there than the walls around them, which keep the game's passes). Off = the game's choice.
PbrPopLog = 0                # TEST (2026-10-18), development builds only: 1 writes every lit object that changes its set of lighting passes from one frame to the next to the log ('PBR POP' lines: name, distance, lamps, where on the screen), and how fast the _rmaos maps arrive ('RMAOS STREAM' lines). 0 = off.
PassFamilyView = 0           # TEST (2026-10-21), development builds only, diagnostic: every lit object indoors and out drawn in one flat colour by the family of lighting passes the game draws it with: one pass with 0-1 lamps blue, 2 lamps green, 3+ cyan; several passes (light, extra lamps, texture, highlights, fog) with 3 lamps yellow, 4 orange, 5 red, 6+ magenta; other shaders grey. Four shades per family tell neighbouring pieces apart. Logs the coloured objects once ('PASS FAMILY' lines). THE PICTURE IS WRONG while on. 0 = off.
CasterView = 0               # TEST (2026-10-28), development builds only, diagnostic, live, outdoors: every lit object drawn in one flat colour by what the sun shadow cascade covering it did with it this frame: green casts, yellow casts only into another cascade, red casts nowhere (too small for that cascade, MinRadius, or filtered), magenta still fading in (shadows pop at 75 % of the fade), cyan / orange object LOD casting / not, grey beyond the shadows. The log gets one "CASTER VIEW" line per object with its reason. For hunting shadow pop-in. 0 = off.
LinearSceneCensus = 0        # TEST (2026-10-28), development builds only, diagnostic, live: 1 = every 600 frames the log gets "LINEAR CENSUS" lines: every draw into the world and the first person counted by pixel shader (the mod's or the game's), blend (opaque, add, multiply, alpha) and whether it is in the main opaque list. Step 1 of the linear-scene plan (docs/next/LINEAR-SCENE-PLAN.md). Costs a little CPU while on. 0 = off. (2026-10-31: also the main list by blend, templates against the game's shaders, and every blended template draw in it: docs/next/DEFERRED-RENDERING-PLAN.md stage 0a.)
LampCapsCensus = 0           # TEST (2026-10-31), development builds only, needs a restart (it compiles a view into the lamp-shadow shaders): 1 = [Shaders.ShadowsInteriors.Forward] DebugView 4 then paints red every pixel where the mod's shaders light a lamp that has no shadow source (no cube map, atlas tile or traced entry: lamps past the live and pool slots, lamps 7-24 of a one-pass object). The LAMP CAPS lines (F10 profile) count the game's extra lamp and highlight passes whose object's base pass is a mod template as well. Stage 0 of docs/next/DEFERRED-RENDERING-PLAN.md. 0 = off, the shaders exactly as before.
PbrPopSpecLODEnd = 0.0       # TEST (2026-10-18), development builds only: moves the game's highlight distance to this many units (its fade range kept) and rebuilds every object's passes, to see objects cross it with a still camera. 0 = the game's own.

[_Main.Main.Performance]
GpuProfile = false             # UNOFFICIAL TEST AID (2026-11-05), live: switching this on or off does what F10 does (the GPU PROFILE lines in the log, per effect), for unattended benches that cannot press keys. Leave off for play.
SkipRedundantConstants = true # UNOFFICIAL: skip shader-constant uploads that set exactly what the graphics device already holds (measured indoors: about 9 in 10 of them). Same picture; less work for the CPU, which indoors is what limits the frame rate. Live: F10 logs a CONSTANT FILTER line. Turn off if anything ever renders wrong.
SettingsCache = true         # UNOFFICIAL (2026-10-30), live: each setting's value is read from the settings file's tree once and kept until any setting changes (the effects read theirs every frame; about 2 % of the main thread). Same values. false = every read walks the tree as before.
SkinnedShadowFaceTest = true # UNOFFICIAL: lamp shadows (interior cube maps) draw characters only into the cube faces their skeleton can reach, instead of all six; bounds rebuilt from the bones each frame, so the shadows are the same. Big CPU saving with many NPCs near lamps. Live: F10 logs a POINT SHADOWS skinned casters line. Turn off if a character's shadow ever goes missing near a lamp.
ParallelShaderCompile = true # UNOFFICIAL: at game start, the mod's shaders and (since 2026-10-28, after Conor's fork) its effects are prepared and compiled on all your CPU cores at once instead of one after another (the same shaders and cache files, only sooner: a start without a shader cache takes about as long as the slowest effect, VolumetricClouds, instead of all of them in a row). Off: one at a time, as before.
NewEffectCompiler = true    # UNOFFICIAL (2026-10-29): the mod's effects are compiled with Windows' own shader compiler (d3dcompiler_47, on every Windows 10 and 11) instead of the old D3DX one: the big effects take seconds instead of minutes on a start without a shader cache (the snow effect took over 8 minutes, enough to look like the game would not start). Where it is missing or refuses an effect, the old compiler is used as before (logged). false = the old compiler only. Switching recompiles the effects once by itself (no need to clear the cache).
EffectNoPreshaders = false    # UNOFFICIAL (2026-11-02), test only: the effects are compiled without preshaders (the CPU-side expressions stay in the shaders), so a frame recorded for the frame replay tool holds their raw settings and a rewritten effect can be swapped in and checked on it. A little slower; ignored by release builds. Switching recompiles the effects once by itself.
ShaderWarmUp = false        # UNOFFICIAL, EXPERIMENTAL (did not remove the hitches in the first test: the driver compiles per drawing setup, which the test draw does not match): at the main menu, draw each shader you have used in play once into a tiny hidden target, so the graphics driver compiles it there instead of the first time it appears in the world (that first compile was the 50-250 ms hitch when new areas came into view). The list fills as you play (Shaders\VegasShaders\Shaders\Cache\WarmUp.txt). Skipped with DXVK, which compiles shaders ahead anyway. Same picture.
ShaderWarmUp2 = 0           # UNOFFICIAL, EXPERIMENTAL (2026-10-18): a shader preloader for plain Direct3D 9 (DXVK does this by itself). The graphics driver finishes each shader's compile the first time it is drawn, once per drawing setup, which made the 50-250 ms stutters when new places came into view. 1 = record: every new drawing setup is written to Shaders\VegasShaders\Shaders\Cache\WarmUp2.txt as you play. 2 = record + warm up: at the main menu those setups are drawn once into a hidden target, so the driver compiles them there instead of in the world (the menu may pause for a moment). 0 = off. Restart to change. Skipped with DXVK. Same picture.
ShaderWarmUp2BudgetMs = 150 # UNOFFICIAL (2026-10-18): with ShaderWarmUp2 = 2, the warm-up time per main-menu frame in ms (the rest is done in the next frames while the menu is up).
ShaderWarmUp2MinMs = 0.0    # UNOFFICIAL (2026-10-18): with ShaderWarmUp2 = 2, only setups whose first draw took at least this many ms when recorded are warmed up (0 = every recorded setup; 2026-10-19: the first-draw time does not show a compile when the graphics driver compiles on its own thread).
GrassTiming = 0             # UNOFFICIAL, TEST BUILDS ONLY, test only (2026-11-09, grass-cache study): 1 = the game's grass functions (placement, density grid, grass geometry, grass draws) are timed on every thread and logged as GRASSTIME lines; 2 = also counts every tuft (adds ~0.1 us per tuft). Not in release builds. Restart to change.
ArrivalSampler = 0          # UNOFFICIAL, TEST BUILDS ONLY (2026-10-20): 1 = a sampling profiler of the game's main thread writes what it was doing in every frame over 50 ms to VegasShaders-Logs\ArrivalSamples_<time>.txt (for finding the cause of stutters on arrival). Not in release builds. Restart to change.
IOWorker2 = 0               # UNOFFICIAL, EXPERIMENTAL (2026-10-20): 1 = the game gets a second loading thread that only loads models and textures (the game has one; after a loading screen it is busy for up to a second while you already wait, mostly building NPC face textures and decoding textures). Off by default while it is being tested: if the game crashes or a model / texture looks wrong with it on, turn it off. Restart to change.
HiddenObjectCulling = false # UNOFFICIAL, EXPERIMENTAL (2026-10-11): indoors the game draws most objects several times (the base pass, then extra passes for more lamps and shine). An object that was completely covered by other things a few frames ago gets only its base pass; its extra passes are skipped. Mostly saves CPU (about 0.5 ms in the Rivet City hangar), so it shows most where the CPU limits the frame rate. Worst case: an object that has just come out from behind something misses its extra lamp light for a few frames; answers from before a fast camera turn or move are never used. Live: F10 logs a HIDDEN OBJECT CULLING line. Was FNVProbe's culling version 2.
PreDecodeCache = true       # UNOFFICIAL (2026-10-21), live, CPU: with linear lighting's PreDecode on, the decoded lamp and ambient colours are remembered (exactly what the slow power function gave before) and each upload of them is sent in one piece. Same picture, bit for bit; less CPU work in lamp-rich interiors (the Ultra-Luxe made ~28,000 such copies per frame).
FastCasterHash = true       # UNOFFICIAL (2026-10-21), live, CPU: the check whether anything that casts a lamp shadow (interiors) moved or changed is done 4 bytes at a time and once per object per frame instead of byte by byte for every lamp. Same shadows; less CPU work indoors. Switching it on or off redraws every lamp shadow once.
CasterListCache = false      # UNOFFICIAL (2026-10-30), live, CPU, with FastCasterHash: each lamp keeps the list of what casts its shadow (interiors), so the check whether any of it moved no longer looks every object up again for every lamp. Same shadows. Switching it redraws every lamp shadow once.
SkyOnWorker = true          # UNOFFICIAL (2026-11-03), live, CPU: outdoors the sky light on objects (the sky's colours summed over the dome, and the physical sky's brightness match) is worked out on a second thread while the game goes on drawing the frame, instead of on the game's own thread before it (about 0.45 ms a frame of the game's thread in Goodsprings on a fast CPU, more on slower ones). Same values, bit for bit; the frame waits for them only where they are first used. Off: worked out on the game's thread, as before.
SkyOnWorkerCheck = 0        # UNOFFICIAL, DIAGNOSTIC (2026-11-03, development builds only, release builds ignore it): leave 0. 1 = every sky projection made on the worker is made again on the game's thread and the two compared bit for bit ('SKY ON WORKER CHECK' log lines every 120). Test only.
DrawStateTracking = true    # UNOFFICIAL (2026-11-04), live, CPU, native D3D9 and stock DXVK (the Vegas Shaders DXVK fork already does this with CapturedNormalsLeanHook): the per-draw hooks of the world's draws (normals capture, linear lighting) know the render targets, pixel shader and blend states from the device's own calls instead of asking the device again on every draw (measured ~1 ms a frame of the game's thread in the Ultra-Luxe on native D3D9). Same decisions, same picture; the kept record is compared with the device now and then, and any difference turns this off for the session. Off: the per-draw device queries, as before.
DrawStateTrackingCheck = 0  # UNOFFICIAL, DIAGNOSTIC (2026-11-04): leave 0 (= compare every 1024th draw). N = compare the kept record with the device every N draws (1 = every draw, a test only: as slow as off). 'DrawStateTracking:' log lines every 600 frames. Test only.
MenuHiddenLean = false       # UNOFFICIAL (2026-10-30), live, CPU: with the mod's menu closed, the menu no longer asks Windows for the mouse every frame. Nothing changes on screen.
LampScissor = true          # UNOFFICIAL (2026-10-11): the passes that add an extra lamp's light to an object (indoors) are drawn only inside the screen rectangle that lamp's light can reach, instead of over the whole object. A lamp only lights up to its radius, so nothing outside the rectangle changes. Same picture, less work for the graphics card in lamp-lit interiors. Live: F10 logs a LAMP SCISSOR line. Turn off if lamp light ever looks cut off along a straight line.
LampScissorExact = true     # UNOFFICIAL (2026-10-21): LampScissor's rectangle is the exact outline of each lamp's reach on screen, also for lamps near you (before, a lamp whose reach came close to or behind you drew its pass over the whole screen, most of them indoors). Same picture, less work for the graphics card in lamp-lit interiors. Live. Off = the older, looser rectangle.
TrimLampPasses = true       # UNOFFICIAL (2026-10-11): indoors the game adds each extra lamp's light in its own pass over the whole object, even where that lamp cannot reach. Those pixels add exactly nothing; now they are dropped instead of being blended in. Same picture, less work for the graphics card in lamp-lit interiors. Live. Turn off if anything indoors ever looks different.
LampPassTestSkip = 0        # UNOFFICIAL DIAGNOSTIC (test builds): skips the passes a merged lamp pass would replace, THE PICTURE IS WRONG while on. 1 the extra lamp passes, 2 the highlight passes, 3 both. Keep 0
LampPassOrderLog = 0        # UNOFFICIAL DIAGNOSTIC (test builds): log the order of the world's draw passes for N frames. Keep 0
HiddenObjectCullingMaxAge = 4 # UNOFFICIAL: how old (in frames, 1-7) a 'was it covered' answer from the graphics card may be and still be used by HiddenObjectCulling. The card answers 2-4 frames late when it is busy; lower = fewer skips but less chance of a late light. Live.
FrameChain = true           # UNOFFICIAL: effects alternate between two buffers instead of copying the whole frame after every effect. Faster, identical image. Applies immediately.
CompositeApply = true       # UNOFFICIAL: apply exterior sun shadows and ambient occlusion inside the fog pass instead of in their own full-screen passes (with AmbientLight on, the sun shadows inside its passes). Faster, same result. Applies immediately.
ChainUsesGameTexture = true # UNOFFICIAL: use the game's own frame as one of the effect chain's two buffers, avoiding whole-frame copies at the start and end of each chain. Needs FrameChain. Applies immediately.
MergedDepthNormals = false  # UNOFFICIAL, EXPERIMENTAL, keep off: reconstruct normals in the depth pass instead of a separate full-screen pass. On a GTX 1070 (native D3D9) the driver silently skips this draw, so depth and normals stop updating (wrong AO, fog, god rays, SMAA). Since P40 it checks itself the first time it runs: the log line 'UNOFFICIAL merged depth/normals check' says whether the driver really drew it, and if it did not, the switch turns itself off until the game is restarted (separate passes, correct image). Applies immediately.
SkipIdentityExposure = true # UNOFFICIAL (2026-10-17): skip the exposure pass while its MaxBrightness is 0 (the Night default): the pass then hands the picture back unchanged (a full-screen read and write for nothing, 0.15 ms). Same picture. Applies immediately.
AvgLumaCompute = false      # UNOFFICIAL (2026-10-23), needs the DXVK fork (the fork's d3d9.dll, docs\next\NVR-DXVK-EXTENSION.md); does nothing on native D3D9 or stock DXVK: the screen's average brightness (exposure, depth of field focus) is computed by a Vulkan compute pass that reads every pixel once (exact), instead of the D3D9 pass's 112 sample points. Same smoothing, same speeds, same texture for the other effects. Applies immediately. The log says 'Vegas Shaders DXVK' at start whether the extension was found.
AvgLumaComputeCheck = 0     # UNOFFICIAL TEST TOOL (2026-10-23), with AvgLumaCompute and the DXVK fork: N > 0 = every N frames run both the compute and the D3D9 average-luma pass and log them side by side ('AvgLuma check'); the D3D9 pass keeps the texture while this is on. Those frames wait for the graphics card: leave 0 while playing.
NvrDxvkPasses = true        # UNOFFICIAL (2026-10-23), needs the DXVK fork (does nothing on native D3D9 or stock DXVK): the effects ported so far (Exposure, ImageAdjust, Sharpening, FXAA, LowHF, SkyDither, BloodLens, WaterLens, LUT, Lens, MotionBlur; since 2026-10-25 also Coloring, DitherBuster, BarrelHaze, HeatHaze, Cinema, DepthOfField's distant blur and autofocus, Bodycam, SkinScattering, BloomLegacy, Snow, Precipitations, ShadowsInteriors, SkyView, ShadowsExteriors, SunFar, VolumetricLight, WetWorld, GodRays, SMAA, Specular, Underwater, Reflections, Bloom, TAA, Sandstorm, SnowAccumulation, BounceLight, PointShadows, PointShadows2, CombineDepth, Normals, VolumetricClouds, SunShadows, VolumetricSmoke, AmbientOcclusion, VolumetricFog, AmbientLight) run as Vulkan passes through the DXVK fork's extension instead of their D3D9 shaders, same picture by construction (the GLSL in src\hlsl\NewVegas\Compute is the .fx.hlsl line for line). The point is the route (no 16-sampler / 224-constant / instruction limits for what comes next), not speed. An effect whose pass fails falls back to its D3D9 shader for the session (logged). Applies immediately.
NvrDxvkVariants = true      # UNOFFICIAL (2026-10-26), needs the DXVK fork with NvrDxvkPasses on: a Vulkan pass uses its compile-time variant (Shaders\VegasShaders\Compute\<name>-<variant>.spv, the D3D9 technique's fixed switches: unused paths compiled out, as the D3D9 shaders are) where one exists, else the general shader. Same picture either way; off only to compare speed. Applies immediately.
NvrDxvkStencil = true       # UNOFFICIAL (2026-10-26), needs the DXVK fork 1.6 with NvrDxvkPasses on: a Vulkan pass tests a stencil where its D3D9 technique does (SMAA's costly weight pass runs only on the edge pixels its edge pass marked, as on D3D9). Same picture either way; off only to compare speed. Applies immediately.
NvrDxvkAmbientLight = false # UNOFFICIAL (2026-11-01), with NvrDxvkPasses on: AmbientLight also runs as Vulkan passes. OFF by default: a tester saw rapid flickering with AmbientLight on Vulkan (steady on D3D9; not reproduced yet). Off = AmbientLight draws its D3D9 passes, the other effects stay on Vulkan; same picture, about the same speed (measured 2026-10-26). Note: [Shaders.AmbientOcclusion.RT] feeds AmbientLight only with this on. Applies immediately.
NvrDxvkClouds = false       # UNOFFICIAL (2026-11-01), with NvrDxvkPasses on: the volumetric clouds also run as Vulkan passes. OFF by default: a tester saw the whole world darkened with the clouds on Vulkan (fine on D3D9; not reproduced yet). Off = the clouds draw their D3D9 passes, the other effects stay on Vulkan; same picture. Note: [Shaders.Reflections] CloudSky needs this on (its sky probe is Vulkan only). Applies immediately.
NvrDxvkMixCheck = false     # UNOFFICIAL (2026-10-30), DIAGNOSTIC, needs the DXVK fork, read at launch (restart after changing it): logs which images cross between the D3D9 and the Vulkan passes. Every render target remembers the frame, path and pass that last wrote it; a pass that reads one nothing has written yet (MIXCHECK EMPTY), one written several frames ago (STALE; 1 frame is normal for history buffers), or one written this frame on the other path (EDGE) gets one log line per image, reader and NvrDxvkPasses / NvrDxvkKeepD3D9 combination, and every 600 frames the reads that were sometimes stale are listed (intermittent). Costs some CPU per draw while on; leave off for play.
NvrDxvkKeepD3D9 = ""        # UNOFFICIAL (2026-10-26), test tool for NvrDxvkPasses: effect names (as in the log, e.g. "PointShadows"; several separated by commas) that keep their D3D9 passes while the other ported effects run as Vulkan passes, so the frame time shows what one pass costs. Empty for normal play. Applies immediately.
NvrDxvkTestSuffix = ""      # UNOFFICIAL (2026-10-26), test tool for NvrDxvkPasses: a Vulkan pass with compile-time variants uses Shaders/VegasShaders/Compute/<name>-<variant><this>.spv where that file exists (shader experiments in one launch). Empty for normal play. Applies immediately.
AmbientLightSmoothCompute = false # MEASURED SLOWER 2026-10-25 (GTX 1070, 1080p: blur 0.20 vs 0.09 ms, smoothing 0.32 vs 0.11 ms incl. prepare), same picture: keep off. UNOFFICIAL (2026-10-25), needs the DXVK fork (does nothing on native D3D9 or stock DXVK): AmbientLight's normal smoothing ([Shaders.AmbientLight.Main] NormalSmoothing) runs as one Vulkan compute dispatch (src\hlsl\NewVegas\Compute\AmbientLightSmooth.comp) instead of its two half-resolution D3D9 passes: the same taps, weights and 16-bit rounding between the two directions, so the same picture; the point is the measurement (F10 'Ambient light prepare + smooth (half)' covers either path). If it fails it is logged once and the D3D9 passes run for the session. Applies immediately.
AmbientLightBlurCompute = false # MEASURED SLOWER 2026-10-25 (GTX 1070, 1080p: blur 0.20 vs 0.09 ms, smoothing 0.32 vs 0.11 ms incl. prepare), same picture: keep off. UNOFFICIAL (2026-10-25), needs the DXVK fork (does nothing on native D3D9 or stock DXVK): Ambient Light's two blur passes (across, then down) run as one Vulkan compute pass that keeps a tile of the picture in the graphics card's fast on-chip memory, instead of two passes through a half-resolution buffer. Same taps, weights and depth tests, the in-between result rounded to 16-bit as the buffer does: same picture. F10 times it as 'Ambient light blur X (half)' ('blur Y' then shows nothing). If it fails, the log says so and the D3D9 passes take over for the session. Applies immediately.
NvrDxvkReplacements = false # UNOFFICIAL (2026-10-24), needs the DXVK fork 1.2 (does nothing on native D3D9, stock DXVK or an older DXVK fork): when a pixel shader is loaded and Data\Shaders\VegasShaders\Compute\Replace\<shader name>.spv exists (for example Replace\SLS2001.pso.spv), that SPIR-V fragment shader runs in its place, with the game's textures, samplers and float constants still arriving (the .txt next to it lists which; docs\next\NVR-DXVK-EXTENSION.md). This is the route around ps_3_0's limits for the lit-object shaders (phase 2); no replacement ships yet, so with no Replace folder it does nothing. A missing or refused replacement leaves that shader as it is (logged). Read at load.
NvrSm6Shaders = false       # UNOFFICIAL (2026-10-26), needs the DXVK fork (does nothing on native D3D9 or stock DXVK): the mod's own effect passes that have an SM6 build (Data\Shaders\VegasShaders\Compute\Sm6, made by tools\nvr-sm6 from the same .fx.hlsl the D3D9 path compiles) run from that SPIR-V instead of their ps_3_0 shader: no 224-constant, 16-sampler, 32-temporary or instruction limit, so a pass can do what ps_3_0 could not fit. First pass with an SM6 build: VolumetricFog's dedicated estimate and reconstruct (plain and composite), which on the fork also give the fog's sky colour the sky's horizon tint and saturation (did not fit in ps_3_0). A pass whose SM6 build is missing, stale (its .hlsl changed since the build) or refused keeps its D3D9 shader (logged once). Applies immediately.
NvrDxvkDisplacement = false # UNOFFICIAL, EXPERIMENTAL (2026-10-27), needs the DXVK fork 1.7-displace (does nothing on native D3D9, stock DXVK or an older DXVK fork): the land gets real bumps from its own height maps (the ones its parallax reads) instead of only looking bumpy: near the camera every land triangle is split into many small ones through Vulkan tessellation and each point is moved up or down by the height, so stones and ruts get real outlines against the sky, real depth for fog, AO and reflections, and catch the sun's shadow edges. Strength, reach and detail in [Shaders.Terrain.Displacement]. Needs a game restart to turn ON (the land's shaders are registered with DXVK as they load); turning it off works at once. Since 2026-10-27 the bumps also cast sun shadows ([Shaders.Terrain.Displacement] CastShadows). Since 2026-10-28 rocks, cliffs and other objects with a parallax height map can get real bumps too ([Shaders.POM.Displacement], off by default; with this on their shaders are compiled for it at startup). Not yet: grass, decals and feet keep to the flat land.
LampMaskScissor = true   # UNOFFICIAL (2026-10-18), on: in-game check 330 scissored checks, 0 differing values in the skipped area, 28 inside at 1/65535 (same shader both ways): the lamp light mask (the point-shadow pass, run every frame outdoors and indoors) is drawn only inside the screen rectangle its lamps' light can reach, and not at all when no lamp reaches the screen (open country by day, lamps behind you); everywhere else it would write 0, which the buffer's clear already holds (up to about 0.15-0.37 ms at 1440p). Same picture. Applies immediately.
InteriorShadowFold = false # UNOFFICIAL (2026-10-18), off: indoors with the lamp shadows drawn on each object (Shadows Interiors > Forward, KeepDarkening on, DarkeningBlur off), applies the darkening of what no tracked lamp reaches inside the fog pass instead of in its own full-screen pass (F10 'Interior shadow apply'): -0.24 ms in the casino, -0.33 ms pass in the Ultra-Luxe (the fog pass +0.07 / +0.15). Same function, rounded the way the separate pass's 16-bit frame stores it (measured once per GPU). Off because a same-frame check (InteriorShadowFoldCheck) still finds a few pixels next to the void (gaps in a ceiling, the far plane) differing by a few 16-bit steps: about 50 pixels a frame in the casino, invisible but not bit for bit. Not while an effect between them reads the picture. Applies immediately.
InteriorShadowFoldRound = 0 # UNOFFICIAL DIAGNOSTIC: leave 0 (InteriorShadowFold rounds as this GPU stores 16-bit floats, measured once at the first interior: round toward zero on a GTX 1070). 1 = no rounding, 2 = round toward zero, 3 = round to nearest even: test only.
CubeFaceCopySkip = false # UNOFFICIAL (2026-10-18, off): with RedrawActorsOnly, a lamp cube face no moving caster reaches that still holds its walls-and-furniture copy is not copied again. Exact, but it saved nothing in the casino (people and wind-moved plants reach almost every face: 0 faces skipped per frame). Applies immediately.
CubeFaceCopySkipCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. N = every Nth frame up to two lamp cube faces that CubeFaceCopySkip left alone are read back and compared bit for bit with the static face they should equal (logged as CUBE FACE CHECK). Stalls the GPU.
CubeFaceViewCull = true # UNOFFICIAL (2026-10-18): indoors, a lamp whose shadow is redrawn every frame anyway (people or wind-moved plants in its reach, or a flickering light that moves) no longer draws the faces of its shadow cube map that no pixel on screen can look up (its reach wholly outside the view, with a margin; within 100 units of the camera always drawn). Those faces are drawn again as soon as they can be seen, and in full before the lamp's shadow is kept. Casino: F10 'Point shadow cubemaps' 2.04 -> 1.29 ms, frame -0.68 ms (-0.75 with people moving). Same picture (a test that fills the left-out faces with shadow showed nothing). Applies immediately.
CubeFaceViewCullCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = the faces CubeFaceViewCull leaves out are filled with "everything in shadow" instead of being left alone, so a face that is looked up after all shows as a dark area (test only: changes the picture where the culling would be wrong).
InteriorShadowFoldCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. N = every Nth frame in which InteriorShadowFold would apply, the frame is drawn the old way (separate pass) and the folded fog pass is drawn as well from the same input into a spare target; both are read back and compared bit for bit (logged as INTERIOR SHADOW FOLD CHECK). Stalls the GPU.
FogReferenceTest = 0 # UNOFFICIAL DIAGNOSTIC (2026-10-18, development builds only, release builds ignore it): leave 0. 1 = the volumetric fog is drawn with the original fog's own shader (upstream master, technique FogReference) at full resolution in one pass, with the sun shadow and AO applies as passes of their own, as the original drew it: to compare ClassicLook with it on the same frame.
LampMaskScissorCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = every 8th frame in which LampMaskScissor cut the lamp mask, the result is read back and compared with the whole pass drawn as before (logged as LAMP MASK CHECK; the frame then uses the whole pass). Stalls the GPU.
SlimDepthBuffer = true      # UNOFFICIAL: store the effects' depth buffer as one 32-bit channel instead of two (the second is recomputed exactly), halving depth reads in every effect. Requires a game restart.
ReShadeDepthCompat = false  # UNOFFICIAL (2026-10-11), for ReShade users: keep the game's depth buffer attached while the mod's effects draw (they normally detach it briefly), and give up the two speedups that need it detached (the low-resolution two-target fog pass and SMAA's own stencil). Turns itself on while ReShade is loaded, whatever this says; set it only to try it without ReShade. Applies immediately.
ReShadeNVRDepth = true      # UNOFFICIAL (2026-10-15; 2026-10-18 also with ReShade as a Vulkan layer under DXVK), only does something with ReShade loaded: ReShade's depth buffer becomes a copy of the mod's, which holds your first-person gun and arms as well as the world (the game's own depth buffer loses them before they are drawn, so ReShade's depth effects shaded and blurred across them). Same direction as the game's depth buffer, so your RESHADE_DEPTH_INPUT settings stay as they are. Off: ReShade's Generic Depth picks the game's depth buffer as before. Applies immediately.
ReShadeBeforeHUD = true     # UNOFFICIAL (2026-10-15), only does something with ReShade loaded as d3d9.dll (not as a Vulkan layer): ReShade's effects are drawn right after the mod's, before the HUD, Pip-Boy and menus, instead of over them. Off: ReShade draws at the end of the frame as before. Applies immediately.
ReShadeUnderNVRMenu = true  # UNOFFICIAL (2026-10-25), only does something with ReShade loaded as d3d9.dll: while the mod's menu is open, ReShade's effects (bloom and the like) are always drawn under it, never on the menu itself. Covers the frames ReShadeBeforeHUD cannot (main menu, loading screens, some game menus, or ReShadeBeforeHUD off); there ReShade still draws over the game's HUD and menus as usual. Off: those frames get ReShade over the mod's menu as before. Applies immediately.
ReShadeDepthNearRemap = true # UNOFFICIAL (2026-10-18), with ReShadeNVRDepth: your first-person gun and arms sit closer than the world's near plane, so in ReShade's depth they came out as values past the nearest possible depth, which ReShade's depth decoding turns into negative distances (depth effects then misread or ignore the gun). On: only the depth of things closer than about twice the near plane (the gun, arms, a wall right in front of your face) is folded back into the valid range, keeping its order; every other pixel of the world is handed over exactly as before. Off: handed over unchanged. Applies immediately. (Map adapted from NVR Depth Bridge, MIT.)
ReShadeMenuGuard = false    # UNOFFICIAL (2026-10-18), for ReShade users: pause the ReShade effect files listed in ReShadeMenuGuardEffects while a menu or the Pip-Boy is open (for example lighting or depth-of-field effects that look wrong over menus). Only effects you have switched on are paused, they come back by themselves when the menu closes, and your ReShade preset is never changed. Applies immediately. (Idea from NVR Depth Bridge, MIT.)
ReShadeMenuGuardEffects = "" # UNOFFICIAL (2026-10-18), for ReShadeMenuGuard: the ReShade effect file names to pause, separated by commas, exactly as ReShade lists them (for example "MXAO.fx, DisplayDepth.fx"). Empty: nothing is paused. Applies immediately.
ReShadeMenuGuardVATS = false # UNOFFICIAL (2026-10-18), for ReShadeMenuGuard: also pause them in VATS. Off: VATS keeps them (the world is still shown there). Applies immediately.
ReShadeGameValues = true    # UNOFFICIAL (2026-10-25), only does something with ReShade loaded: ReShade effects that ask for the game's weather, time of day, worldspace or interior cell get them (the same names FNV ReShade Helper by doodlum and Wall_SoGB uses, so presets made for it work without that plugin). Effects that don't ask see no difference. Off: those effects get nothing, as without the helper. Applies immediately.
ReShadeDepthCheck = 0       # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = every 64th frame the depth handed to ReShade is made with and without ReShadeDepthNearRemap and both are compared in the log ('UNOFFICIAL ReShade depth check' lines; stalls the GPU). 2 = ReShadeMenuGuard acts as if a menu were open (for the auto-test, whose pictures cannot be taken in real menus). 3 = both.
WorldSceneGuard = true      # UNOFFICIAL: if the game stops rendering the world scene for 10 frames in a row (seen once after loading a save directly into an interior, where the image comes out almost black), skip the mod's effects until it starts again instead of running them on a stale depth buffer. Applies immediately.
MenuSceneGuard = true       # UNOFFICIAL (2026-10-20), with WorldSceneGuard: in a menu shown over a still picture of the world (the Pip-Boy), skip the mod's effects from the first frame instead of after 10. Those 10 frames ran the effects on the Pip-Boy itself, and the reflections of your surroundings took in its green screen and orange buttons: the Pip-Boy's glass then showed them as a blurred glow for as long as it stayed open. Over such a menu the game's own bloom is used (the mod's is not drawn there; its last one used to stay frozen on screen). Off: as before. Applies immediately.

[_Main.Main.RayTracing]
SceneRadius = 8192                   # UNOFFICIAL (2026-10-28), the DXVK fork + a GPU with ray tracing + NvrRtHelper.exe (Data\NVSE\Plugins\NvrRt\): the ray tracing core's scene holds the opaque static geometry (land and objects; not actors, alpha-tested or blended meshes, tree leaves, decals) of the loaded cells within this many units of the camera. It is only built while an RT effect is on ([Shaders.ShadowsExteriors.RT] Enabled). Larger: more geometry kept in the helper (GPU memory, a little build time when cells load). Live. docs\next\FORK-RT-CORE.md.
FarObjectLOD = false                 # UNOFFICIAL, EXPERIMENTAL (2026-10-31), with RT reflections: the ray tracing scene also holds the game's distant object LOD (the far buildings, rocks and skyline past the loaded cells) in a ring from SceneRadius out to FarRadius, so reflections show the skyline instead of the surroundings cube's guess. Their own mask bit (0x80): other RT effects see them too unless they leave 0x80 out. More instances and triangles in the helper. Live. Off: nothing past SceneRadius.
FarLandLOD = false                   # UNOFFICIAL, EXPERIMENTAL (2026-10-31), with RT reflections: the distant terrain (LOD land: the mountains on the skyline) past SceneRadius out to FarRadius in the ray tracing scene, so wet ground and glass reflect the mountains instead of missing them. Mask 0x80 like FarObjectLOD. Inside SceneRadius the real land is used (the LOD quads stand above it). Live. (2026-11-07) PTRealtime turns it on by itself (the hills block the low sun and the sky light; RT-DETAIL-GAPS.md 7).
FarRadius = 40000                    # UNOFFICIAL (2026-10-31), with FarObjectLOD: the far ring's outer edge in game units (RT reflections reach this far then). Live.
ActorUpdateInterval = 1              # UNOFFICIAL (2026-10-29; 2026-11-07: 1 by default, was 2: a pose a frame late put people's traced shadows a frame behind them), with Actors on: each actor is re-posed every this many frames (staggered), the frames between keep its last pose; 1 = every frame. Posing and rebuilding actors is most of the RT cost with people around. Live.
ActorRadius = 3000.0                 # UNOFFICIAL (2026-10-29), with Actors on: only actors this many units from the camera (horizontally) go into the ray tracing scene (each one is posed and rebuilt every frame; 3000 = about 43 m). Live.
FirstPersonBody = true               # UNOFFICIAL (2026-11-05; off 2026-11-07 morning, on again 2026-11-07 ptaaa-firstperson), with Actors: in first person your own body (the third-person one the game hides) is in the ray tracing scene too: you show in reflections (puddles, water, mirrors, metal), and your body casts its shadow on the ground and walls. Rays that start or end within arm's reach of your eye (about 1 m: your gun and hands, a counter you stand at, the flashlight and the Pip-Boy light you carry) pass it by, since its third-person pose never matches your first-person arms there: that was the strange cut-out ("reverse shadow") testers met, the light of a lamp you carry coming through only the gaps of the hidden body. The camera never sees it (no head over the sky). Live.
ActorStillSkip = false               # UNOFFICIAL (2026-10-31), with Actors on: an actor whose bones have not moved since its last pose (standing, sitting, sleeping, dead) is not posed and rebuilt again; its ray tracing structure stays as it is and follows the camera. Saves most of the actors' RT cost in towns. Live.
ActorStillThreshold = 0.05           # UNOFFICIAL (2026-10-31), with ActorStillSkip: how far (game units) a bone may move and still count as still. Live.
ActorRebuildInterval = 8             # UNOFFICIAL (2026-10-31; 2026-11-07: 8 by default, was 0), with Actors on: every this many poses an actor's ray tracing structure is built afresh instead of updated in place (a refit's tree gets slower to trace as the limbs move away from the pose it was built in); 0 = never. Needs a helper of 2026-10-31 or later (an older one keeps refitting). Live.
FaceMorphs = true                    # UNOFFICIAL (2026-11-07), with Actors on: the faces of people near you follow their expressions and lip-sync in the ray tracing scene (their traced shadows and reflections move their mouths). Each head part within FaceMorphRadius has its vertices checked every frame; a change re-poses it even when ActorStillSkip or ActorUpdateInterval would not. Where the game keeps the morphs only in the head's own vertex copy, the traced head is taken from that copy. The log reports what it found for the first heads ("RT CORE face morphs"). Live.
FaceMorphRadius = 800.0              # UNOFFICIAL (2026-11-07), with FaceMorphs: how far from the camera (game units) a head is checked for expressions and lip-sync (800 = about 11 m: conversation distance). Live.
Actors = true                        # UNOFFICIAL (2026-11-05: on by default, so RT reflections, shadows and GI see people, textures, cut-outs and glow; was off) (2026-10-29), with an RT effect on: the actors (NPCs, creatures, the player's third-person body) go into the ray tracing scene too, posed every frame from their bones (their rigid parts like weapons as well), so the rays see people (RT sun shadows from actors). Costs a rebuild of each actor's structure every frame. Needs fork patch 0033 (d3d9.dll 1.8-rt-skin) and a helper restart (game restart).
AlphaTested = true                   # UNOFFICIAL (2026-11-05: on by default, so RT reflections, shadows and GI see people, textures, cut-outs and glow; was off) (2026-10-29), with an RT effect on: alpha-tested meshes (foliage cards, fences, chain link, wires) go into the ray tracing scene too, tested against their diffuse alpha (64 x 64 a texture) by the RT passes that support it (RT sun shadows); without it they cast only through the shadow maps. Needs fork patch 0029 (d3d9.dll 1.8-rt-uv) and a helper restart (game restart). docs\next\FORK-RT-SUN.md.
BlendedHair = true          # UNOFFICIAL (2026-11-10), BUG FIX, with AlphaTested: the game's own hair, eyebrows and beards are see-through-blended meshes with no cut-out test, and such meshes were left out of the ray tracing scene: with the unmodded game, people had no hair in ray-traced shadows and reflections and were bald under the path tracer. They now go in as cut-outs at half transparency. false = as before (hair from mods that use a cut-out test was never affected).
Decals = true                        # UNOFFICIAL (2026-11-07), live, with AlphaTested: decals (posters, cracks, the game's blood splats; meshes the game flags decal or dynamic decal; never glass or refraction) go into the ray tracing scene as cut-outs (their texture's alpha; blended ones cut at half), lifted 0.5 unit off what they lie on: RT reflections, RT GI and the path tracer's bounces see them; RT shadows, RT AO and visibility rays pass them (thin and flat on a surface, they must not shadow it). Blood comes and goes as the game makes and drops it. Off: no decals in the traced scene, as before. docs/next/RT-DETAIL-GAPS.md section 5.
AlphaDetail = 256                    # UNOFFICIAL (2026-11-06) [64, 128, 256], needs a restart, with AlphaTested: how many texels a texture the ray traced cut-outs (fences, chain link, foliage, grates) keep for their alpha test. 256 = thin wires keep their pattern in traced shadows and reflections (the alpha atlas takes 128 MB of video memory); 128 = 32 MB, softer; 64 = 8 MB, as before (thin wires turn into a faint even shadow).
AlbedoDetail = 128                   # UNOFFICIAL (2026-11-06) [64, 128, 256], needs a restart, with HitTextures: how many texels a texture the ray traced hits keep for their colour (what RT reflections show of things off screen: a person's front in a mirror, their face; what the path tracer bounces off). 128 = 64 MB of video memory (sharp enough for faces in a mirror); 256 = 256 MB, sharpest; 64 = 16 MB, as before (smeared).
RealTextures = true                  # UNOFFICIAL (2026-11-07), needs a restart, with HitTextures / AlphaTested: ray traced hits read the game's OWN textures (full size, every mip, filtered, the mip picked by the ray's footprint) instead of the atlases' 64-256 texel copies: sharp people and objects in RT reflections and the path tracer, no blocky texels up close, no speckle far away, exact cut-outs (fences, leaves, hair) in RT shadows. Needs the RT helper of the same build (protocol 8 since 2026-11-07 rtgap-textures). Off: the atlases as before.
OpacityMicromaps = true               # UNOFFICIAL (2026-11-07, ptaaa-omm), live, with AlphaTested: on a GPU with VK_EXT_opacity_micromap (RTX 40 / 50 and other drivers that expose it), the RT helper gives alpha-tested meshes (fences, foliage, grass, leaf cards) opacity micromaps: the parts of each triangle whose texels are surely solid are resolved by the GPU itself, the rest by the shaders' alpha test as before, so the picture is the same and cut-out-heavy scenes trace faster. Each micromap is checked against the shaders' own alpha test before use; any mismatch turns them off for the session (NvrRtHelper.log). Without the extension (AMD today, older NVIDIA) it does nothing. Needs the RT helper of the same build (protocol 9).
RealTextureMaxSize = 0               # UNOFFICIAL (2026-11-07; 0 = auto since 2026-11-07 rtgap-textures) [0, 256-4096], needs a restart, with RealTextures: the largest texture size sent to the RT helper; bigger textures send their mip of this size and down. 0 = by the GPU's video memory (logged once): 16 GB+ 2048, 12 GB+ 2048, 8 GB+ 1024, less 512. 4096 needs the BC routes (fork patch 0035; without them 2048 is sent).
RealTextureBudgetMB = 0             # UNOFFICIAL (2026-11-07; 0 = auto since 2026-11-07 rtgap-textures) [0, 64-8192], needs a restart, with RealTextures: the most GPU memory the RT helper's copies of the textures use (their real size: BC when the fork copies the game's blocks, else RGBA8). When full, textures unused for a while are released for new ones (least recently used first); if all are in use new ones keep the atlas for now. 0 = by the GPU's video memory: 16 GB+ 2560, 12 GB+ 2048, 8 GB+ 1024, less 512 (2026-11-13: were 4096 / 3072 / 1536 / 768; the copies share the GPU with the game's own textures). (2026-11-13) Textures the game has unloaded (cells left behind, fast travel) are released at once whatever the budget: the RT copy and the game's texture both leave video memory. (2026-11-13 rt-audit) Auto is also at most 20 % of the game process's video memory budget (Windows' figure, logged), and lowered live while the game and the RT helper together pass 90 % of it (unused copies released).
RealTextureCompressed = true         # UNOFFICIAL (2026-11-07 rtgap-textures), needs a restart, with RealTextures: the game's DXT1 / DXT5 / ATI2 textures go to the RT helper as their compressed blocks (a quarter to an eighth of the memory and copy bandwidth of decoding them; RealTextureMaxSize 4096 possible). Needs the Vegas Shaders DXVK fork with patch 0035 (1.8-rt-bc); an older one decodes everything to RGBA8 as before (logged). Off: always RGBA8 (for an A/B).
RealNormalMaps = true                # UNOFFICIAL (2026-11-07), needs a restart, with RealTextures: each textured mesh's own normal map goes to the RT helper too, so surfaces seen by ray tracing keep their bumps (cracks, bricks, panels) in the path tracer's bounces, RT reflections and RT GI instead of shading flat. Normal maps use at most 3/4 of RealTextureBudgetMB (the rest stays for colour). Off: flat hits (or the NormalTextures atlas).
Displacement = true                  # UNOFFICIAL (2026-11-07), live, with the game's tessellation bumps on ([Shaders.Terrain.Displacement] and / or [Shaders.POM.Displacement] Enabled, NvrDxvkDisplacement) and RealTextures + HitTextures: the ray traced scene gets the same bumps (RT shadows, reflections, AO / GI and the path tracer see them, and rays no longer start under the bumpy ground). The RT helper keeps a split copy of each land piece and parallax object within FadeEnd, moved by the same height maps, redone as you move. Does nothing while the bumps are off. Off = the RT scene stays flat.
DisplaceSpacing = 16.0               # UNOFFICIAL (2026-11-07) [4-256], live, with Displacement: how far apart (game units) the new points of the RT copies are aimed to be: each game triangle is split N x N, N = its mesh's longest edge / this (at most DisplaceMaxSplit). Smaller = closer to the drawn bumps, more triangles (memory, build time).
DisplaceMaxSplit = 8                 # UNOFFICIAL (2026-11-07) [1-16], live, with Displacement: the most N (each game triangle split N x N, N x N triangles). Parallax objects need 3 or more (their bumps fade to nothing at their triangles' edges).
DisplaceRefresh = 32.0               # UNOFFICIAL (2026-11-07) [1-1024], live, with Displacement: how far (game units) the camera moves (or, for objects, turns times their distance) before a copy is redone for the bumps' distance fade. Smaller = closer to the drawn fade, more GPU work while moving.
DisplaceTrianglesPerFrame = 2000000  # UNOFFICIAL (2026-11-07), live, with Displacement: the most copy triangles built or redone a frame (new copies first, then the stalest); the rest wait a frame (traced flat until built).
DisplaceMaxTriangles = 262144        # UNOFFICIAL (2026-11-07), live, with Displacement: the most triangles one copy may have (a bigger mesh gets a smaller N).
GlowTextures = true                  # UNOFFICIAL (2026-11-05: on by default, so RT reflections, shadows and GI see people, textures, cut-outs and glow; was off) (2026-10-30), with HitTextures: each textured mesh's glow map (neon, lit signs and windows) goes into a glow atlas next to the diffuse one, so RT GI / reflections take the glow's real colour, only where the map glows (rtHitGlow), instead of the whole mesh in its diffuse colour. One more 2048 x 2048 shared image (16 MB) and a second upload per glowing texture. Needs a helper restart (game restart).
NormalTextures = false               # UNOFFICIAL (2026-11-02), with HitTextures: each textured mesh's normal map also goes into an atlas (64 x 64 a texture, one more 2048 x 2048 shared image, 16 MB), so ray hits get the surface's bumps (the reference path tracer's shading and normals view). Needs a helper restart (game restart).
HitTextures = true                   # UNOFFICIAL (2026-11-05: on by default, so RT reflections, shadows and GI see people, textures, cut-outs and glow; was off) (2026-10-29), with an RT effect on: every textured mesh in the ray tracing scene keeps its texcoords and its diffuse texture (64 x 64 a texture, in a shared atlas), so the rays read the real colour where they hit (RT GI bounce, RT reflections) instead of the mesh's average colour. More geometry data (2 floats a vertex) and atlas uploads. Needs fork patch 0029 and a helper restart (game restart). docs\next\FORK-RT-CORE.md.
Compact = false                      # UNOFFICIAL (2026-10-30), with an RT effect on: the helper compacts each new static mesh's ray tracing structure after its build (about half the GPU memory, a small one-time copy). Needs a helper of 2026-10-30 or later (an older one ignores it). Live.
DenoiseBackbone = false              # UNOFFICIAL (2026-10-31), with an RT effect that denoises (soft RT sun, RT lamp shadows, RT AO / GI): one shared pass a frame works out, for every pixel, where it was on screen last frame (the camera's move and, with [Main.Main.Quality] ObjectMotion on, the object's own move) and whether it is newly seen; every RT denoiser then follows moving people and things instead of smearing their history, and starts fresh where something was uncovered; RT GI's sample reuse ([Shaders.AmbientOcclusion.RT] GIReuse) follows them too. Off: each denoiser follows the camera only, as before. Live.
DenoiseTimeBased = true             # UNOFFICIAL (2026-11-07, perf-history), live, with any RT denoiser (path tracer, RT sun / lamp shadows, RT reflections, RT AO / GI, RT fog): the denoisers' history settings (PTDenoiseHistory, DenoiserHistory, CacheFrames, the fog's Temporal ...) mean frames AT 60 FPS and are kept as the same SECONDS at any frame rate (the frame time smoothed over half a second). At 20 fps a 32-frame history is then 11 frames (0.53 s, as at 60 fps) instead of 1.6 s of trails; at 60 fps nothing changes; faster than 60 fps keeps at most twice the frames. Off: the settings are frames whatever the frame rate (as before).
DenoiseMaxHistorySeconds = 0.0      # UNOFFICIAL (2026-11-07, perf-history) [0.0-4.0], live, with DenoiseTimeBased: no denoiser history longer than this many seconds at any frame rate (e.g. 0.4: PTDenoiseHistory 32 keeps 24 frames at 60 fps, 8 at 20). 0 = no cap (the settings' own seconds).
BuildTrianglesPerFrame = 0           # UNOFFICIAL (2026-10-30): new meshes farther than BuildNearRadius wait for a later frame once this many triangles were sent this frame, so a cell change does not build everything in one frame (0 = no limit). Live.
BuildNearRadius = 2048.0             # UNOFFICIAL (2026-10-30): with BuildTrianglesPerFrame, meshes nearer than this (game units) are always built at once. Live.
LeafCards = 0                        # UNOFFICIAL (2026-10-30): SpeedTree bush and tree leaves in the ray traced scene (AO, GI, reflections, sun): 0 off, 2 two crossed upright cards a leaf, 3 and a level card. Each tree model's leaves are built once as fixed alpha-tested cards (no wind). Needs AlphaTested.
LeafCardsOpaque = false              # UNOFFICIAL (2026-10-30) debug: LeafCards traced as opaque objects (no alpha test), to see where the cards are.
PlantSway = true                     # UNOFFICIAL (2026-10-30): with Plants in the Wind on ([Shaders.Plants.Wind]), the ray traced copy of each wind-bent plant leans with the drawn one, so traced shadows, AO and reflections sway with it (a shear of the plant's traced instance: no extra cost). Off = traced plants stand still while the drawn ones bend. Does nothing while plant wind is off. Live.
CullSmallAngle = 0.0                 # UNOFFICIAL (2026-10-30): objects whose size seen from the camera is below this angle (radians: bound radius / distance) stay out of the ray traced scene (e.g. 0.005 drops cans and bottles at a few hundred metres; 0 = off). Land and people never. Live.
Grass = false                        # UNOFFICIAL (2026-10-30), with AlphaTested: the grass near you goes into the ray tracing scene (each grass type's tuft once, every tuft within GrassRadius as a copy of it, cut out by its card texture), so RT sun shadows (and the other RT effects that test alpha) get grass shadows. No sway (the tufts stand as placed). Needs a helper restart (game restart). (2026-11-07) PTRealtime turns it on by itself (live, no restart) within GrassRadius 1000 at most (RT-DETAIL-GAPS.md 6).
GrassRadius = 1500.0                 # UNOFFICIAL (2026-10-30), with Grass: only tufts this close to the camera (game units; 1500 = about 21 m) go into the scene. Live. Under PTRealtime at most 1000 (2026-11-07).
GrassMaxTufts = 8192                 # UNOFFICIAL (2026-10-30), with Grass: at most this many tufts a frame (the nearest draws first come first). Live.
ArenaMB = 16                         # UNOFFICIAL (2026-10-28), with an RT effect on: the size of the shared image new geometry crosses to the ray tracing helper in, MB per frame. Geometry that does not fit waits for the next frames (a cell's objects then show up in the rays a few frames after it loads). Needs the helper to restart (a restart of the game, or a resolution change).
HelperWait = 0                       # [0-1] UNOFFICIAL (2026-11-10), read when the ray tracing helper starts (a restart, or the menu's shader reload): 1 = the helper waits on the CPU until the game's pictures are ready, then hands its work to the GPU with nothing left to wait for (as the DLSS helper does since 2026-10-30). 0 = its work waits for the game's on the GPU itself (as before). Measured before this: 5-8 ms of every ray traced frame went to that hand-over, whatever the tracing cost
PTRealtime = false                   # UNOFFICIAL (2026-11-04), live: the PATH TRACED GAME in one switch: the reference path tracer on (ReferencePT), its picture becomes the game's (PTReplace), each frame's single path a pixel goes through the ray tracing denoiser (PTDenoise), its bounce rays test only the nearest cut-out card (PTBounceAlpha 3: about a third faster outdoors, the same picture indoors), and 3 bounces unless PTBounces is changed (2026-11-07: quality first, was 1; section 46). Overrides those settings while on. Needs a GPU with ray tracing for 64-bit programs; heavy: ~0.3-0.5 s a frame at 720p on an RDNA2 iGPU, meant for RTX-class cards. docs/next/RT-PATH-TRACING.md section 31. (2026-11-07) It also turns on the RT grass (with AlphaTested; GrassRadius at most 1000) and FarLandLOD (RT-DETAIL-GAPS.md 6 + 7); FarObjectLOD stays as set.
ReferencePT = false                  # UNOFFICIAL (2026-11-02), the REFERENCE path tracer (a ground truth to compare the game's lighting with, not a play setting; docs\next\RT-PATH-TRACING.md): with the ray tracing core running (the DXVK fork, NvrRtHelper.exe, a GPU with ray tracing), every pixel is path traced from the camera through the RT scene (PTBounces diffuse bounces, the sun, the sky, the nearest 8 lamps and glow maps; best with HitTextures, GlowTextures and AlphaTested on) and drawn over the finished picture. It keeps getting cleaner while the camera stands still (and starts over when the camera, the sun or a PT setting moves). Slow: several rays a pixel. Live.
PTBounces = 4                        # UNOFFICIAL (2026-11-02), with ReferencePT: how many times a path bounces (1 = direct light + one bounce). Live (the picture starts over).
PTSamples = 1                        # UNOFFICIAL (2026-11-02), with ReferencePT: paths a pixel each frame (1-16). More: the picture cleans up in fewer frames, each frame is slower. Live.
PTMaxSamples = 4096                  # UNOFFICIAL (2026-11-02), with ReferencePT: once each pixel has this many paths the tracing stops and the picture stays (no more cost). Live.
PTSky = 0.25                         # UNOFFICIAL (2026-11-02; default 1.0 -> 0.25 on 2026-11-08, ptlook: RT-PATH-TRACING.md team ptlook), with ReferencePT: the sky's light on paths that leave the scene outdoors (the sky panorama as the screen showed it, else a gradient from the game's horizon colour to its sky colour) x this. The screen's sky is about as bright as the game's sun colour, so at 1.0 the sky lit a shaded face as much as the sun lights a sunny one: faces came out flat. 0.25 gives a noon sun-to-sky ratio near a real one. Live.
PTAmbient = 0.0                      # UNOFFICIAL (2026-11-02), with ReferencePT: indoors, paths that leave the scene take the game's ambient colour x this (0: interiors are lit by their lamps only, as a path tracer sees them). Live.
PTGlow = 1.0                         # UNOFFICIAL (2026-11-02), with ReferencePT and GlowTextures: glow maps (neon, lit windows, lamp globes) give light x this. Live.
PTClamp = 0.0                        # UNOFFICIAL (2026-11-02), with ReferencePT: caps each path's brightness (removes single bright dots; 0 = no cap, the true answer). Live.
PTExposure = 1.0                     # UNOFFICIAL (2026-11-02), with ReferencePT: the shown picture's brightness (display only, the tracing goes on). Live.
PTSplit = 0.0                        # UNOFFICIAL (2026-11-02), with ReferencePT: 0 = the traced picture over the whole screen; 0.5 = the right half only (the game's own picture on the left for an A/B). Live.
PTDebugView = 0                      # UNOFFICIAL (2026-11-02) [0-10], with ReferencePT, diagnostic: 1 = the colour (albedo) each camera ray hits, 2 = the hit's normal, 3 = the first hit's direct light only (sun + lamps, no bounce), 4 = roughness (red) and metal (green), 5 = the light arriving at the first hit from one bounce on (no first surface colour, no direct light: RT GI's units; use PTBounces 1, PTSky 0), 6 / 7 = RT GI's bounce light (raw / denoised) shown the same way, to compare with 5. (2026-11-03) 8 = the first hit's direct highlight only (sun, lamps, glow lights through the GGX lobe, no diffuse), 9 = the first hit's reflection only (what its GGX lobe sees from one bounce on; no direct light): with PTSpecular on and PTDenoise off. (2026-11-07) 10 = the radiance cache's light at the first hit (PTRadianceCache; 0 where it has no cell yet). Live.
PTPrimary = true                     # UNOFFICIAL (2026-11-02), with ReferencePT: the first surface each pixel sees takes its colour and smooth normal from the game's own screen buffers (the land's blended ground layers, decals, people and grass the ray tracing scene lacks) instead of the ray tracing scene's small textures. Needs the AlbedoBuffer ([Main.Main.Quality], on by default). Off: every hit traced. Live.
PTSpecular = true                    # UNOFFICIAL (2026-11-02), with ReferencePT: surfaces also have glossy highlights and reflections (GGX), with the roughness and metal the game's own material buffer gives each pixel on screen; surfaces the rays reach off screen are a rough non-metal. Off: matte everywhere (the first version). Live.
PTDenoise = false                    # UNOFFICIAL (2026-11-03), with ReferencePT: the interactive mode: each frame's own paths go through the ray tracing denoiser (as RT shadows / GI use it) instead of building up a still picture, so the camera can move. A step toward real-time path tracing; not a reference. Live.
PTReplace = false                    # UNOFFICIAL (2026-11-03), with ReferencePT: the path traced picture goes INTO the game's scene right after the world is drawn (instead of over the finished picture), so the tonemap, bloom and colour grading run on it as on the normal frame: the fair comparison, and with PTDenoise a path traced game. Vegas Shaders' own AO, ambient light and specular passes step aside meanwhile (no light twice). Live.
PTGameLamps = 4                      # UNOFFICIAL (2026-11-03) [0-4], with ReferencePT, live: the lamps lit with the game's own maths: 1 its falloff ((1 - (d/r)^2)^2.2: Pointlights.hlsl vanillaAtt decoded by LinFalloff, FalloffMatch 1, LampFalloff off), 2 its colour (colour x dimmer decoded together, the dimmer at most 1 without HDR: ManyLamps.h), 3 both, 4 (default) the game's own lamp table (the lamps the deferred pass lights, their reach and colour as the game's shaders get them) with its falloff: its direct light 1.07x the game's at Lucky 38. 0 = the older guess ((1 - d/r)^2, the colour decoded before the dimmer), as RT GI's bounce lamps still are. Checked against the game's own lamp light ([Shaders.ShadowsInteriors.Deferred] DebugView 7): docs/next/RT-PATH-TRACING.md section 21.
PTGlowLights = false                 # UNOFFICIAL (2026-11-03), with ReferencePT and GlowTextures: glowing surfaces (neon signs, lit windows, lamp globes: meshes with a glow map) are aimed at as lights, not only found when a bounce ray happens to hit them: less noise where glowing surfaces really are the light. (At Lucky 38 they are not: the game lights its neon with lamps, glow maps give ~1 % of the light there, and this setting made no difference but cost ~45 % more time; docs/next/RT-PATH-TRACING.md section 14.) The 32 glowing meshes that matter most near the camera each get a sphere (their bounds) that one extra ray a hit is aimed into; the light itself still comes from the real glowing surface, and that ray and the bounce rays share it by weight (multiple importance sampling: no light counted twice, the same picture on average, only less noise). Meshes bigger than 512 units stay found by bounce rays only. Costs one more ray at every hit. Live.
PTGlowFromFrame = true               # UNOFFICIAL (2026-11-05), with ReferencePT, live: glowing surfaces you look at directly (neon, lamp globes, lit signs) show as the game draws them: their glow maps read as light are much dimmer than the game's own look (Lucky 38's red lamp globes came out dark). Off: lit and glowing as the path tracer computes them. docs/next/RT-PATH-TRACING.md section 32.
PTLightGrid = true                   # UNOFFICIAL (2026-11-04), with ReferencePT, live: when the frame lists 40 lamps or more, they are found through a world grid built each frame (each cell lists the lamps whose reach touches it), so a hit only weighs the lamps that can light it instead of every lamp of the frame (up to 256). The same picture, bit for bit (a lamp out of reach gives no light either way); 256 lamps then cost about what 21 do (-30 % on the iGPU at Lucky 38). Below 40 lamps the plain loop is cheaper and is used. Off = always every lamp at every hit. docs/next/RT-PATH-TRACING.md section 25.
PTLightGridMinLamps = 40             # UNOFFICIAL (2026-11-04) test only: PTLightGrid from this many lamps on (fewer: every lamp at every hit is cheaper; RT-PATH-TRACING.md section 25).
PTBounceAlpha = 1                    # UNOFFICIAL (2026-11-04) [0-3], with ReferencePT, live: how the path tracer's BOUNCE rays (not the camera's or the shadow rays) meet cut-out surfaces (leaves, grass cards, fences: AlphaTested): 1 (default) tested texel by texel like the camera's rays, 0 taken as solid cards, 2 left out (light passes through), 3 only the nearest card is tested (its texel; through a hole the ray goes on past the other cards): nearly 1's picture at nearly 2's cost. The test is ~30 % of the trace outdoors; 0 / 2 change the indirect light under and through plants. docs/next/RT-PATH-TRACING.md section 27.
PTBounceDistance = 0                 # UNOFFICIAL (2026-11-04) [0-60000 units], with ReferencePT, live: the longest a bounce ray goes (0 = 60000, as before). Shorter is cheaper (4000: ~-15 % outdoors); a ray that ends there takes the sky outdoors and no light indoors (indoors keep it at 0 or long: section 19's GIDistance lesson). docs/next/RT-PATH-TRACING.md section 27.
PTIndirectClamp = 0                  # UNOFFICIAL (2026-11-04) [0-1000, linear], with ReferencePT, live: caps the brightness of light that reaches a surface through a bounce (not its direct sun / lamp light), the usual cut for fireflies when the picture is denoised from one path a pixel (PTDenoise). Biased (bright bounce light comes out darker); 0 = no cap (the reference). docs/next/RT-PATH-TRACING.md section 28.
PTRealtimeClamp = 4                  # UNOFFICIAL (2026-11-09) [0-1000, linear], live, with PTRealtime: the cap PTIndirectClamp puts on light that reaches a surface through a bounce, used by the real-time path tracer while PTIndirectClamp itself is 0. A matte surface next to a shiny one (a floor round a chrome ball) otherwise shows single white pixels: rare paths hundreds of times brighter than their neighbours, which no denoiser removes reliably and which DLSS Ray Reconstruction is handed raw. Biased: very bright bounce light comes out a little darker. 0 = no cap (as before). The reference path tracer (PTRealtime off) is never capped by this key.
PTBounceRoughen = -1                 # UNOFFICIAL (2026-11-09) [-1 to 1], live, with ReferencePT: a surface a path meets AFTER a bounce counts as at least (the roughest bounce so far x this) rough, so the light a matte floor gets by way of a mirror or a chrome ball is spread out instead of arriving as rare white pixels. What you see directly in a mirror, and a mirror seen in a mirror, stay as sharp as before; light patterns thrown by shiny things onto matte ones come out softer. -1 = 0.35 under PTRealtime, off otherwise; 0 = off (as before); up to 1.
PTBlendedLayer = 0                   # [0-1] UNOFFICIAL (2026-11-10), live, with PTRealtime: what the game draws AFTER its solid world (a fire's flames and smoke, neon tubes and glow cards, strings of light bulbs, lit window glows, water, hair) is not in the path tracer's scene, so the traced picture showed the wall or ground behind it. 1: that layer is carried over from the game's own picture onto the traced one, as the game drew it (two cheap full-screen steps; it does not light the scene). 0 = off (as before)
PTRealtimeLevel = 0                  # [0-2] UNOFFICIAL (2026-11-10), live, with PTRealtime: how much the real-time path tracer trades for speed. 0 = full quality, as before. 1 = balanced: two bounces instead of three, and most paths end at their first bounce in the radiance cache (PTCacheShort 8): about a quarter less tracing time; light that has bounced twice or more gets a little blurrier. 2 = performance: one bounce (the rest of the light comes from the radiance cache) and glowing signs no longer sampled as lights (PTEmissive off): more than half the tracing time saved; rooms a few percent darker in corners, more noise next to neon. Measured on the test rig, not yet on an RTX card. A PTBounces, PTEmissive or PTCacheShort you set yourself is kept. For more speed still, use a DLSS mode below DLAA: the path tracer traces at the render resolution.
PTCacheShort = 0                     # [0-64] UNOFFICIAL (2026-11-10), live, with PTRadianceCache: 0 = off. N = one path in N is traced in full; the others stop at their first bounce where the radiance cache already knows the light there (that spot's own direct light is still traced). Same brightness (within 1 % on the test rig), 18 % less tracing time at 8; light after the first bounce is as coarse as the cache's cells. PTRealtimeLevel 1 sets 8.
PTRouletteFrom = 0                   # [0-1] UNOFFICIAL (2026-11-10) test only, live: 1 = paths that carry little light are ended one bounce earlier (Russian roulette before the second bounce ray). Measured on a captured Lucky 38 frame: 12 % less tracing time on an NVIDIA L4, the same converged picture, 12 % more noise in a single frame. PTRealtimeLevel 1 and 2 turn it on.
PTDenoiseIterations = 2              # UNOFFICIAL (2026-11-04) test only: PTDenoise's a-trous passes (0-5; steps 1, 2, 4, 8, 16). 2 (was 4): 4 over-blurred, still and after a camera turn, indoors and out (docs/next/RT-PATH-TRACING.md section 30).
PTDenoiseHistory = 32                # UNOFFICIAL (2026-11-04) test only: PTDenoise's temporal history in frames (1-256). Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
PTDenoiseClamp = 0.0                 # UNOFFICIAL (2026-11-06) [0.0-8.0] test only: PTDenoise clamps its history to the new frame's 3 x 3 mean +- this many deviations (a moving camera or light leaves no trail). 0 = off.
PTDenoiseCeiling = 200               # UNOFFICIAL (2026-11-11) [0-60000], BUG FIX, live, with PTRealtime / PTDenoise: the brightest light (divided by the surface's colour) the path tracer hands to its denoiser. The denoiser keeps the square of the brightness in a number that overflows above about 256, and a pixel past that turned BLACK: an object lit by the flashlight from close by became a black shape. 200 is far brighter than anything the screen can show as other than white. 0 = no ceiling (as before: the black shapes return).
PTDenoisePeopleHistory = 4.0         # UNOFFICIAL (2026-11-07) [0.0-256.0], live, with PTDenoise / PTRealtime: people's pixels (skin, skinned armour and clothes; needs [Main.Main.Quality] CapturedNormals) keep at most this many frames of the denoiser's history instead of PTDenoiseHistory. A talking face changes shape with no motion the denoiser knows of (lip-sync, expressions): with the full history the old mouth and the hat's old shadow trailed behind in dialogue. Lower: no trail, grainier faces. 0 = off (the full history everywhere). Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
PTDenoiseAntiLag = 3.0              # UNOFFICIAL (2026-11-07) [0.0-16.0], live, with PTDenoise / PTRealtime: anti-lag (as NVIDIA's NRD denoisers): beside its long history (PTDenoiseHistory) the denoiser keeps a fast one of 4 frames; where the long history's brightness leaves the fast one's window (this many standard errors) the light really changed there (a shadow moved, a lamp went on, the camera turned onto something new) and the long history restarts at 4 frames, so trails clear in a few frames instead of 32. Lower: faster, a little noisier; 0 = off (as before). Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
PTDenoiseGuide = 0.35               # UNOFFICIAL (2026-11-07) [0.0-4.0], live, with PTDenoise / PTRealtime: the denoiser's smoothing stops at the edges the game's own picture shows (its shading: normal maps, cracks, creases), not only where the smooth normals or the depth change: a tap whose shading differs from the pixel's by this share is weighed down by 1 / e. Lower: crisper, a little noisier; 0 = off.
PTDenoiseSplit = true                # UNOFFICIAL (2026-11-07) with PTDenoise / PTRealtime: the path tracer's diffuse and specular light are denoised apart (as NVIDIA's NRD ReLAX), each divided by its own albedo; the specular light follows the reflected thing (its hit distance) instead of the floor, so reflections stay sharp and do not smear while the camera moves. Off: one combined signal (as before). Turning it ON needs a game restart when it was off at the start (one more full-size image); off is live.
PTDenoiseVirtual = true              # UNOFFICIAL (2026-11-07) live, with PTDenoiseSplit, test: the specular light is reprojected by its hit distance (the point behind the mirror), mixed with the surface's by roughness. Off: the surface's reprojection only (the A/B: reflections smear when the camera moves).
PTDenoiseMirrorHistory = 12.0        # UNOFFICIAL (2026-11-07) [1.0-256.0] live, with PTDenoiseSplit: the frames of history a mirror-smooth surface's reflection keeps (rough surfaces keep PTDenoiseHistory). Lower: reacts faster, grainier mirrors. Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
PTDenoiseMirrorSurface = 0.1        # UNOFFICIAL (2026-11-09) [0.0-1.0] live, with PTDenoiseSplit: path-traced MIRRORS and CHROME (smooth metals under this roughness) are denoised as the thing they reflect: its colour is divided out and the reflection keeps the reflected surface's full history (PTDenoiseHistory, following the point behind the mirror, also on curved chrome) and is smoothed like any surface, so mirrors come out clean instead of grainy, with sharp reflected textures. Rough metals (gold, brushed steel) are not affected. 0 = off (as before: PTDenoiseMirrorHistory frames, no smoothing on mirrors). Not while DLSS Ray Reconstruction denoises the path tracer. docs/next/PT-MIRRORS-2026-11-09.md.
PTDenoiseObjectMotion = true         # UNOFFICIAL (2026-11-07) live, with PTDenoise / PTRealtime and [Main.Main.Quality] ObjectMotion: the denoiser's history follows things that move themselves (a walking NPC, an opening door) instead of the camera only, so they do not leave a ghost trail.
PTDenoiseMovingHistory = 8           # UNOFFICIAL (2026-11-07) [0-256] live, with PTDenoiseObjectMotion: surfaces that move themselves keep at most this many frames of history (their light changes as they move). 0 = no cap. Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
PTDenoiseUnderRr = 0                 # UNOFFICIAL (2026-11-07) [0-1] live, with [Shaders.TAA.DLSS] RayReconstruction: 0 = while DLSS Ray Reconstruction runs it denoises the path tracer's raw paths, with the path tracer's own diffuse / specular albedo and roughness as its guides (the path tracer's denoiser steps aside; each start / stop is logged); 1 = the path tracer keeps its own denoiser under RR (as before).
PTDenoiseHistoryFix = 3.0            # UNOFFICIAL (2026-11-07) [0.0-16.0] live, with PTDenoise / PTRealtime: pixels the denoiser has seen for this many frames or fewer (just uncovered behind a moving lamp, an NPC, a turning object) are smoothed with their neighbours regardless of brightness, more the newer (as NVIDIA's NRD ReLAX "history fix"), so their single noisy path does not stay as a speckle trail. 0 = off (as before). Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
PTDenoiseMeanVariance = 2.0          # UNOFFICIAL (2026-11-07) [0.0-64.0] live, with PTDenoise / PTRealtime: the denoiser's smoothing judges a pixel's noise by its accumulated mean over up to this many frames instead of one path, so fine converged shadows (a chain-link fence's wires) are kept as edges: 2 keeps 83 % of a 1-pixel shadow (61 % before) for +2 % noise; 4 keeps 97 % for +5 % noise. 0 = off (as before).
PTDenoiseAntiFirefly = -1            # UNOFFICIAL (2026-11-07) [-1-1] live, with PTDenoise: anti-firefly (as NVIDIA's NRD denoisers): a single path far brighter than its neighbours and its own recent past (a bounce that found a small bright light, a glint off chrome) is clamped to what they support, and the clamped light is spread over the 5 x 5 pixels round it instead of dropped, so rooms lit by bounces keep their brightness without white dots; glints and thin bright lines that are there every frame stay. -1 = on under PTRealtime, off otherwise; 0 off; 1 on.
PTDenoiseFireflyK = 2.0              # UNOFFICIAL (2026-11-07) [0.0-64.0] test only: PTDenoiseAntiFirefly's tolerance, in deviations of the pixel's recent past (lower: fewer dots, more of the rare light spread).
PTDenoiseFireflySpread = 4            # UNOFFICIAL (2026-11-09) [0-64], live, with PTDenoiseAntiFirefly: how much of one clamped firefly's light is passed on to the 5 x 5 pixels round it, as a multiple of what that pixel's neighbours and its own recent past support. A single path hundreds of times brighter than its surroundings otherwise left a white square that lingered for seconds (dozens of them in a room lit by small bright lights). The rest of such a path's light is dropped: rooms lit only by rare bright bounces come out slightly darker. 0 = no cap, as before.
PTDetail = 1.0                     # UNOFFICIAL (2026-11-07) [0.0-1.0], live, with PTRealtime / PTReplace: the path-traced light takes the game's own fine shading (its picture against the surface colour, against the same surface a few pixels round): the normal maps' bumps, cracks and glints the path tracer's smooth normals and denoiser lose (testers: "losing texture quality with RT"). Its large-scale light (bounces, soft shadows, sky) stays the path tracer's. 0 = off.
PTDetailRadius = 4.0               # UNOFFICIAL (2026-11-07) [1.0-16.0], live: PTDetail's local average, this many pixels round (larger: coarser detail too).
PTDetailEdge = 2.0                 # [0.0-16.0] UNOFFICIAL (2026-11-10), BUG FIX, live, with PTDetail: PTDetail puts the game's own fine shading (bumps, cracks) back on the path-traced light, but the game's picture also holds the game's own lamp and sun shadows, and their edges came through as thin dark and light lines over people and walls. Where the game's shading changes by about this factor within a few pixels (a shadow edge, not a bump) the detail is left off. 0 = off, the old behaviour (the lines). Lower = stricter.
PTViewModel = true                 # UNOFFICIAL (2026-11-07 ptaaa-firstperson), live, with PTRealtime / PTReplace + PTDenoise: your first-person arms, gun and Pip-Boy are lit by the path tracer too (their colour, normals and material are captured while the game draws them), so a gun in a dark room is dark and a lamp's or the flashlight's light falls on it; off, they keep the game's own lighting over the path-traced picture. Needs what the path tracer's first hit needs (CapturedNormals, MaterialBuffer, AlbedoBuffer), no MSAA and no RenderScale below 1: otherwise (and where a shader writes no G-buffer) the model keeps the game's pixels.
PTContactShadows = 1.0             # UNOFFICIAL (2026-11-07) [0.0-1.0], live, with PTPrimary: screen-space contact shadows at the path tracer's first hit: from each pixel a short march over the depth buffer toward the sun and the chosen lamp, so what the screen has but the ray-traced scene lacks still casts a shadow where it touches (the tessellated bumps, grass that is not in the RT scene, small props, decal edges). Taken with the traced shadow ray: the darker. 0 = off.
PTContactLength = 24.0             # UNOFFICIAL (2026-11-07) [1-128], live: how far the contact march looks, in pixels on screen (and at most 64 game units).
PTGlass = 2                          # UNOFFICIAL (2026-11-07) [0-2], live, with AlphaTested, the path tracer (ReferencePT / PTRealtime): GLASS. Windows, bottles and shop glass (alpha blended or refraction meshes whose texture the material rules call glass: VegasShaders.materials.txt) go into the traced scene as thin panes of real glass (n 1.5): they reflect (4 % head on, more at grazing angles) and let the light through, tinted by PTGlassTint. 1: for the light only (sun and lamps through windows, tinted; reflections and the view through glass at the bounces); 2: the camera's rays too (windows show the traced reflection and the room behind them instead of the game's glass); 0: no glass in the scene, as before. Only the path tracer sees the panes (every other RT effect passes them). docs/next/RT-PATH-TRACING.md section "materials".
PTGlassTint = 0.5                    # UNOFFICIAL (2026-11-07) [0.0-1.0], live, with PTGlass: how much the glass texture's hue tints the light through it (its darkness never does: glass textures are drawn see-through). 0 = clear glass.
PTFoliage = 0.4                      # UNOFFICIAL (2026-11-07) [0.0-1.0], live, with the path tracer: light through LEAVES and GRASS (thin cut-out cards: SpeedTree leaves, the RT grass, cut-outs whose texture the material rules call plant, and the screen's plant pixels). This share of a leaf's diffuse light comes out of its far side: back-lit leaves glow green against the sun. Leaves keep their colour on the lit side (a white card would lose what goes through). 0 = off (leaves as opaque cards).
PTSkin = 1.0                         # UNOFFICIAL (2026-11-07) [0.0-2.0], live, with the path tracer: SKIN scattering on people (actors' skin parts and the screen's skin pixels): the light wraps past the shadow line, red farthest (softer, warmer faces: never brighter than plain skin under an even sky), and red light comes through thin parts (ears, fingers, nostrils) against the light. 0 = off (plain diffuse), 2 = twice the wrap and the light through.
PTClothSheen = 0.5                   # UNOFFICIAL (2026-11-07) [0.0-1.0], live, with the path tracer and PTSpecular: a velvet-like SHEEN on cloth (the screen's cloth pixels: flags, banners, curtains; MaterialBuffer class 3): a soft rim of light at grazing angles, its colour the fabric's. The diffuse gives up what the sheen takes (no extra light). 0 = off.
TessStartSlack = true              # UNOFFICIAL (2026-11-07), live: while the tessellated bumps are on ([Shaders.Terrain.Displacement] / [Shaders.POM.Displacement]), the ray-traced effects start their rays the bumps' Strength off the surface (the ray-traced scene has the flat land, the screen the bumpy one: a ray from a hollow started under the flat land and was blocked at once, dark speckles in RT shadows, AO and the path tracer). Nothing changes while the bumps are off. false = as before (for comparing).
PTDenoiseSigma = 1.0                 # UNOFFICIAL (2026-11-06) [0.25-16.0] test only: PTDenoise's a-trous brightness edge stop (lower keeps lamp shadow edges sharper, leaves more noise). 1 (was 4): rtsigma-int, still RMSE -12 %, the railing's shadow stripes -18 %, 0.6 % darker.
PTBounceHalf = -1                    # UNOFFICIAL (2026-11-06) [-1-1], with ReferencePT, live: the bounce traced for half the pixels each frame (8 x 8 tiles in a checkerboard that swaps every frame; their bounce light counted double), about a third faster for a little more noise. -1 = auto (off: since 2026-11-07 also under PTRealtime: the checkerboard showed as a tile grid while the camera turned); 0 off; 1 on. Not with PTRestirGI.
PTLastSky = -1                       # UNOFFICIAL (2026-11-06) [-1-1], with ReferencePT, live: outdoors the path's last hit also takes the sky's light (as if one more bounce left to the sky, unoccluded): the light of further bounces 1-bounce tracing leaves out. -1 = on under PTRealtime when it traces 1 bounce (PTBounces 1), off otherwise; 0 off; 1 on. (Goodsprings: the ground 0.981 -> 0.992 of a 4-bounce reference, no tile overbright.)
PTLastBounce = -1                    # UNOFFICIAL (2026-11-06) [-1-1], with ReferencePT, live: the path's last hit also takes the light of further bounces, estimated as if its surroundings were lit as it is (its albedo x its own direct light x a fixed share; no extra rays): the light 1-bounce tracing leaves out indoors and out. -1 = on under PTRealtime when it traces 1 bounce (PTBounces 1), off otherwise; 0 off; 1 on. (RT-PATH-TRACING.md section 44.)
PTLampFalloff = 0                    # UNOFFICIAL (2026-11-06) [0-1], with ReferencePT, live: how the path tracer's lamps fade with distance. 0 = as the game lights them ((1 - (d/r)^2)^2.2: bright to near the radius, then a fairly sharp rim where the light ends); 1 = physical (inverse square with a soft window: brighter near the lamp, a long natural tail out to twice the game's radius, no rim; the same total light per lamp at PTLampGain 1). (RT-PATH-TRACING.md section 45.)
PTLampGain = 1.6                     # [0.1-8.0] UNOFFICIAL (2026-11-06), with PTLampFalloff 1, live: the physical lamps' brightness. 1 = the same total light as the game's lamp (rooms look dimmer between lamps), about 2.5 = the same light as the game's at half its radius (rooms brighter overall).
PTRestirGI = false                   # UNOFFICIAL (2026-11-04), with ReferencePT and PTDenoise, live: ReSTIR GI on the path tracer's first bounce: each pixel's bounce sample is weighed against last frame's of the same surface and of its neighbours (reservoir resampling), so one path a pixel carries the best of many: less noise before the denoiser. Lambert at the first bounce in this mode (the first surface's glossy reflections are left out; its direct highlights stay). docs/next/RT-PATH-TRACING.md section 29.
PTRestirMaxM = 20                    # UNOFFICIAL (2026-11-04) test only: PTRestirGI's history cap (samples a reservoir stands for).
PTRestirSpatial = 4                  # UNOFFICIAL (2026-11-04) test only: PTRestirGI's neighbours a pixel (0 = temporal only).
PTRestirRadius = 16                  # UNOFFICIAL (2026-11-04) test only: PTRestirGI's neighbour radius in pixels.
PTRestirDepth = 0.03                 # UNOFFICIAL (2026-11-04) test only: PTRestirGI's same-surface test, distance (relative).
PTRestirNormal = 0.9                 # UNOFFICIAL (2026-11-04) test only: PTRestirGI's same-surface test, normal (cosine).
PTAllLamps = -1                      # UNOFFICIAL (2026-11-07) [-1-1], with ReferencePT and PTGameLamps 4, live: the lamps the path tracer lights with. 0 = the ones the game lights THIS view with; 1 = every lamp of the game's lamp table that is not hidden, also those the game left out of this view (a lamp behind you still lights what you see, through a bounce or its own reach). -1 = 1 under PTRealtime, 0 otherwise. (RT-PATH-TRACING.md section 47.)
PTRadianceCache = -1                 # UNOFFICIAL (2026-11-07) [-1-1], with ReferencePT, live: a world-space radiance cache (as NVIDIA's SHaRC): every path vertex stores the light that came back through it in a cell of the world, and the path's last hit takes the light of all further bounces from its cell, so light keeps bouncing past the traced bounces (multi-bounce light without more rays). -1 = on under PTRealtime, off otherwise; 0 off; 1 on. Not with PTRestirGI. (RT-PATH-TRACING.md section 48.)
PTCacheCell = 8                      # UNOFFICIAL (2026-11-07) test only: PTRadianceCache's cell size near the camera (game units); cells grow with the distance (about distance / 32).
PTCacheMaxSamples = 256              # UNOFFICIAL (2026-11-07) test only: how many samples deep a cache cell's running mean is (lower follows changing light faster, noisier).
PTCacheMaxFrames = 8                 # UNOFFICIAL (2026-11-07) test only: how many frames deep a cache cell's running mean is at most (the cache feeds itself, each frame one more round of bounces: deeper follows changing light slower). Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
PTCacheMinSamples = 8                # UNOFFICIAL (2026-11-07) test only: the samples a cache cell needs before it is read.
PTCacheMaxAge = 120                  # UNOFFICIAL (2026-11-07) test only: frames a cache cell lives without a new sample.
PTCacheEntriesLog2 = 20              # UNOFFICIAL (2026-11-07) test only, restart: the cache's size (2^n cells of 64 bytes: 20 = 64 MB of GPU memory).
PTEmissive = -1                      # UNOFFICIAL (2026-11-07) [-1-1], with ReferencePT and GlowTextures, live: glowing surfaces (neon signs, lit windows, lamp glass: meshes with a glow map) become real lights in the path tracer, sampled triangle by triangle by how much light each gives (its glow map's brightness x its size), the way RTXDI samples emissive triangles: every hit aims one shadow ray at a point of a glowing triangle, so a sign lights the wall and floor around it smoothly instead of as rare bright speckles, and with PTRestirDI the glow and the game's lamps share one ReSTIR reservoir. The light still comes from the real glow map at that point (x PTGlow), and that ray and the bounce rays share it by weight (multiple importance sampling: the same picture on average, no light counted twice). Replaces PTGlowLights. -1 = on under PTRealtime, off otherwise; 0 off; 1 on. Not with PTRestirGI. (RT-PATH-TRACING.md, section ptaaa-emissive.)
PTEmissiveMax = 64                   # UNOFFICIAL (2026-11-07) test only [0-128]: PTEmissive's glowing meshes a frame (the nearest, biggest first; every hit weighs each of them once).
PTEmissiveTriangles = 65536          # UNOFFICIAL (2026-11-07) test only [0-65536]: PTEmissive's triangles a frame in all (a mesh that does not fit is left to the bounce rays).
PTRestirDI = -1                      # UNOFFICIAL (2026-11-07) [-1-1], with ReferencePT and PTDenoise, live: ReSTIR DI for the lamps where the camera's rays land: each pixel's lamp sample (picked from every lamp in reach) is weighed against last frame's of the same surface and its neighbours', with real shadow rays, so rooms with many lamps get every lamp's light and shadow with far less noise. -1 = on under PTRealtime, off otherwise; 0 off; 1 on. Not with PTRestirGI. (RT-PATH-TRACING.md section 47.)
PTRestirDILampMatch = 32.0           # [0-256 units] UNOFFICIAL (2026-11-10), BUG FIX, live, with PTRestirDI: flickering lights (a fire) move and change reach every frame, and were treated as a new lamp each frame: under PTRealtime their light all but vanished (a fire barrel lit nothing). A lamp now keeps its history when the nearest unmatched lamp of the last frame is within this many units and its reach within 2 x. 0 = the old rule (within 1 unit)
