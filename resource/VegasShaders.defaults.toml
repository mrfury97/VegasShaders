[_Shaders.Sky.Physical]
Enabled = true                      # UNOFFICIAL: a physical sky. The sky's colours come from the air itself (blue overhead, pale near the horizon, a bright glow round the sun, red and gold as it sets) instead of the weather's painted gradient. The weather still sets how bright the sky is, and WeatherTint keeps some of its colour; the game's own twilight and night sky take over once the sun is down. The sky light on objects follows the sky on screen. Switching it on or off needs a restart (off, the sky shader is exactly as before).
Brightness = 1.0                    # [0.0-4.0] Brightness against the weather's sky (1 = the same overall brightness).
WeatherTint = 0.35                  # [0.0-1.0] How much of the weather's own sky colour to keep (0 = the air's colours only, 1 = the weather's colours with the air's light and shade).
Haze = 1.0                          # [0.0-10.0] Dust and haze in the air: a wider, whiter glow round the sun and a paler horizon. Desert air is dusty: 1.5-3 looks hazier.
ExactSunlight = false               # UNOFFICIAL, off by default (a precision fix that moves the picture at a low sun). The sun's light through the air is worked out exactly (a table) instead of by the closed-form estimate the physical sky started with, which is 5-17% short in air at a low sun (Hillaire 2020 / Bruneton 2008 method): sunsets and sunrises get redder at the horizon (blue-to-red ratio about -25% at 5 degrees of sun, -5% at 15), the brightness at 15 degrees and above changes under 1% and a high sun not at all to the eye. Live switch, a few ms once when it is turned on. Needs the physical sky on.
MultipleScattering = false          # UNOFFICIAL, off by default (a look change). Adds the light that has scattered more than once in the air (Hillaire, EGSR 2020) and the light the ground sends back into it: the horizon is brighter and the sky bluer and softer, the zenith relatively darker; the weather's overall sky brightness is kept. Includes ExactSunlight. Live switch; the tables behind it are drawn once (and again when Haze or GroundAlbedo change). Needs the physical sky on.
GroundAlbedo = 0.3                  # [0.0-1.0] With MultipleScattering: how much sunlight the ground reflects back into the air (0.3 = desert and soil, 0.1 dark rock, 0.8 fresh snow). Lifts the horizon most at a high sun.
LightsObjects = false               # UNOFFICIAL (2026-10-25), live, off by default (the physical sky's light on surfaces double-dipped with the terrain / PBR sky settings): the physical sky also lights the world (the sky-colour light on objects, terrain, skin, hair and grass). false (default) = they take the game's own sky light, as without the physical sky, while the sky itself, the fog and the clouds keep it: for setups whose terrain / PBR sky settings already tint the surfaces (the light would otherwise count twice).

[_Shaders.Sky.Clouds]
