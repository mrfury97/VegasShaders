[_Shaders.PBR.Metal]
MetalOn = true                       # UNOFFICIAL: switches the metal look below on and off (the Enabled button at the top of the panel switches ALL of the PBR shaders, not just this).
FirstPerson = 1.0                    # [0-1] UNOFFICIAL: metal on your first-person weapon (0 = off, 1 = full). New Vegas has no metal maps, so every surface was lit like plastic: white highlights in the sun, flat and matte in the shade. Metal is guessed from the textures (grey colour, and the shininess mask the artists painted) and then has no flat diffuse light: it shows tinted highlights and reflects the sky and its surroundings. DebugView shows what counts as metal.
World = 0.5                          # [0-1] The same for everything else in the world (0 = exactly as before). Grey concrete or cloth can be taken for metal, so it starts off.
FadeDistance = 0.0                   # [0-4000] How far away the metal look on the world is gone, in game units (about 70 to a metre); it fades out from 60% of that. 0, or anything further, uses the distance where the game starts dropping highlights from objects (fSpecularLODStartFade in Fallout.ini, usually 2000): past it the game draws objects without highlights, and the metal would vanish at once.
GreyMetal = 0.5                      # [0.0-1.0] How metal a grey part is where the shininess mask is bare (most of a gun's body). The painted mask always makes it fully metal.
ColourStart = 0.25                   # [0.0-1.0] Colour saturation from which a part starts to count as painted or plastic instead of metal...
ColourEnd = 0.55                     # [0.0-1.0] ...and from which it never counts as metal (wood, coloured paint, brass is in between).
Roughness = 0.3                      # [0.05-1.0] Finish of bare metal: 0.05 mirror, 0.5 satin, 1 rough cast.
PolishedRoughness = 0.65             # [0.05-1.0] Finish where the shininess mask is painted fully (edges, worn spots).
Reflections = 0.6                    # [0.0-4.0] Strength of what metal reflects from its surroundings (the sky and the ambient light).
DebugView = 0                        # 1: metal shown in orange (brighter = more metal) over a dim grey image.
SharpSky = 0.5                       # [0-1] UNOFFICIAL: 0-1. Reflections on metal and shiny objects take the sky's light from the direction they reflect (a gun facing a sunset turns warm on that side). 0 = as before.
CubeReflections = 1.0                # [0-1] UNOFFICIAL: 0-1. Metal reflects what is really around it (the street, the neon, the room's lamps) instead of only the sky and ambient light: the live surroundings cube that Shaders > Reflections keeps (needs Reflections on with CubeMap on). Darker in dim places, colourful near neon. Switching it on or off from 0 needs a restart. 0: as before.

[_Shaders.PBR.EnvMaps]
Lighting = 0.5                       # [0-1] UNOFFICIAL: the "chrome" reflections the game draws on guns, glass and metal props follow the light round them (1), or keep the game's fixed brightness (0), which gleams the same in a dark cave as at noon.
Strength = 1.5                       # [0.0-8.0] Brightness of those reflections in the light: about the game's at 1.5 in daylight, dimmer in shade and at night, faint in the dark.
WithMetal = 0.6                      # [0.0-1.0] Where the metal look ([Shaders.PBR.Metal]) is on, it already reflects the surroundings, so these reflections are scaled by this (1 = both in full).
CubeReflections = 1.0                # [0-1] UNOFFICIAL: 0-1. The game's chrome and glass reflections show what is really around them (the live surroundings cube from Shaders > Reflections, needs Reflections on with CubeMap on) instead of the game's painted picture. Switching it on or off from 0 needs a restart. 0: as before.
FromGameData = false                 # UNOFFICIAL, EXPERIMENTAL (2026-11-09), needs a restart to turn on (then applies immediately), needs [Shaders.PBR.Rmaos] Enabled: which surfaces look like metal (mirror-like) follows the game's own data instead of the mod's guess from grey colour and shine. The game marks the surfaces it gives a chrome shine (the env-map flag) with a strength and, where the artist made one, a mask (the "_m" texture): flag + mask = metal where the mask is white; flag without a mask = see FromGameDataNoMask; no flag = no metal at all, whatever the colour. An _rmaos material map still decides where there is one. The metal strengths in [Shaders.PBR.Metal] (World, FirstPerson) still scale it. Eyes and windows are never made metal. false = the guess, as before.
FromGameDataNoMask = 1.0             # [0.0-1.0] UNOFFICIAL (2026-11-09), applies immediately, with FromGameData: an env-mapped surface WITHOUT a mask: 1 = the whole surface at the flag's strength; 0 = only where its normal map's alpha (the shine mask) is bright, which is what the game's own chrome pass uses when there is no mask.
FromGameDataAmount = 0.5             # [0.0-1.0] UNOFFICIAL (2026-11-09), applies immediately, with FromGameData: how much of the env-map flag's strength counts as metal. The game's own chrome pass adds a reflection on top of the surface, it does not turn the surface into a mirror: at 1 every flagged wall and floor became full metal. Hair and FaceGen heads are never made metal by the flag.

[_Shaders.PBR.MaterialRules]
Enabled = true                       # UNOFFICIAL: per-texture material classes (guns, glass, wood, rock, chrome...) from the editable table VegasShaders.materials.txt next to the DLL: which surfaces may look like metal and how rough or polished each kind is. Lets the metal look ([Shaders.PBR.Metal], needs MetalOn) reach guns, robots and steel in the world without turning concrete and cloth into metal. Textures the table does not name look exactly as with this off. Switching it on or off needs a restart (off, the shaders are exactly as before and cost nothing).
DebugView = false                    # Shows each class in its own colour (guns red, wood brown, glass cyan, plants green, rock grey...) over a dim grey picture; textures without a rule stay grey. For checking the table.
LogMatches = false                   # Writes each texture's class to the log the first time it is drawn ("[MaterialRules] <texture> -> <class>").

[_Shaders.PBR.Rmaos]
MetalFromMap = false                 # UNOFFICIAL (2026-10-28), live: metal from the maps' green channel. Off (default) = metal from [Shaders.PBR.Metal] (World, FirstPerson, GreyMetal, ...) as on objects without a map; the maps still give roughness and occlusion. The mod's generated maps carry that same metal guess baked at World 0.5, so with them on the Metal sliders did nothing. On = for hand-made PBR maps whose metal is authored.
Enabled = true                       # UNOFFICIAL: PBR material maps. Where a texture has a <name>_rmaos.dds beside it (or under textures\pbr\ at the same path; the Community Shaders "True PBR" layout: red roughness, green metal, blue ambient occlusion, alpha specular level), objects take their roughness, metal and occlusion from it instead of the guesses. Loose files only. Restart to switch (it is compiled into the object shaders).
On = true                            # With Enabled: use the maps (live switch, for comparing). Off: objects as without them.
SpecularFromMap = true               # UNOFFICIAL (2026-11-02): the maps' alpha (specular level) sets how much non-metal surfaces reflect: white = the usual 0.04, darker = less (Community Shaders True PBR meaning). The mod's generated maps are white there, so they look the same either way; hand-made maps with a painted specular level now use it. false = ignore it (0.04 everywhere, as before). Restart to switch.
Occlusion = 1.0                      # [0.0-1.0] How much the maps' ambient occlusion darkens the ambient light.
DebugView = 0                        # [0-4] 1: the maps' roughness in grey; 2: metal; 3: occlusion; 4: objects that have a map in green, others dim grey. 0: normal picture.
LogMatches = false                   # Writes each texture to the log the first time it is drawn, with its map or "none" ("[Rmaos] <texture> -> <file>"): which textures a place uses.
UploadBudget = 0.0                   # UNOFFICIAL (2026-10-18), live: [0.0-8.0] milliseconds a frame for making newly read maps into textures. 0 = two maps a frame (a new interior's few hundred maps then take a few seconds to arrive, and objects change their look when theirs comes in).
FadeIn = 0.5                         # UNOFFICIAL, BUG FIX (2026-10-18), live: [0.0-2.0] seconds over which a material map that has just arrived (they load a few a frame after a new place appears) blends in, instead of the object's roughness, metal and shading changing at once in view. 0 = at once, as before.
ReloadTest = 0                       # TEST (2026-10-18), development builds only: a new nonzero value drops every loaded map so they arrive again, as in a new place. 0 = nothing.

[_Shaders.PBR.Dust]
Enabled = false                      # UNOFFICIAL (2026-11-04) Dust on top surfaces: a thin sand-coloured coat where things face up -- the tops of rocks and cliffs, car roofs and hoods, ledges, crates -- as sand settles in the desert (Death Stranding, Uncharted 4). Part of the surface's own colour, so the sun and lamps light it and the fog sits in front of it. Not on people, creatures or hair. Needs a restart to turn on or off; off, the object shaders are exactly what they were.
Amount = 0.35                        # [0.0-1.0] (2026-11-04) How thick the coat is where it is fullest (1: the dust's colour alone; 0.35: the surface still shows clearly through; at 0.55 a flat rock top already read as ground on the bench).
ColorR = 0.66                        # [0.0-1.0] (2026-11-04) The dust's colour, red (as a colour picker would show it).
ColorG = 0.56                        # [0.0-1.0] (2026-11-04) green.
ColorB = 0.43                        # [0.0-1.0] (2026-11-04) blue. The default is Mojave sand.
Patchiness = 0.6                     # [0.0-1.0] (2026-11-04) 0: an even coat on every upward face; 1: patches with bare spots between.
Size = 600.0                         # [32-20000] (2026-11-04) Game units across one patch (70 = 1 m).
UpFrom = 0.55                        # [-1.0-1.0] (2026-11-04) How upward a face must be before dust starts (the height of its normal: 1 = facing straight up, 0.55 = about 57 degrees from flat).
UpFull = 0.85                        # [-1.0-1.0] (2026-11-04) From here up the coat is full.
Exteriors = true                     # (2026-11-04) Outdoors.
Interiors = false                    # (2026-11-04) Indoors too (ruins, dusty rooms).

[_Shaders.PBR.MicroShadow]
Enabled = false                      # UNOFFICIAL (2026-11-04) Micro-shadowing: the bumps of a surface's normal map shadow themselves, so cracks and crevices look deep instead of painted on, more so when the light comes in low (Naughty Dog's technique, Uncharted 4 / The Last of Us Part II). Uses the occlusion in the _rmaos material maps ([Shaders.PBR.Rmaos], needs them on): objects without a map are not changed. Needs a restart to turn on or off; off, the shaders are exactly what they were.
Strength = 1.0                       # [0.0-3.0] (2026-11-04) How much of it: 0 none, 1 the material maps' occlusion as it is, 2-3 their crevices twice or three times as deep (the effect only shows where the occlusion is fairly dark; [Shaders.PBR.Rmaos] DebugView 3 shows it).

[_Shaders.Cloth.Main]
Enabled = false                      # UNOFFICIAL (2026-10-16): NEEDS A RESTART (Save, then restart the game; changing it in the menu alone does nothing until then). Cloth (capes, dusters, coats, flags, banners, curtains) moves in the wind, and worn coats and dusters follow your movement (2026-10-19: they trail behind when you walk or run, swing when you stop, flare when you turn), done in the vertex shader (no physics). The values below apply immediately
Keywords = "cape,cloak,duster,coat,flag,banner,curtain,drape,tarp,poncho,robe,scarf,shawl,tent,lucassimms/outfit,mysteriousstranger/outfit,rangerarmor/nv_ranger,rangerpatrol,rileysranger/outfit,oasisdruid/outfit,wastelanddoctor01/outfit,projectpuritydoctor/outfit,bosscribe/outfit,arcadesdoctor,combatranger,riotgear"   # (2026-10-18) Textures whose path holds one of these pieces are cloth: found ANYWHERE in the path (lecloak, leflag, bosbanner count); words of 4 letters or fewer must end a word (flag is not flagstone). A piece with a / (lucassimms/outfit) names a folder and file start: the vanilla dusters have no 'duster' in their texture names
Exclude = "scape,probe,microbe,wardrobe,drobe,content,intent,extent,patent,potent,latent,flagpole,flagstone,pole,stone"   # (2026-10-18) A texture whose path holds one of these is NOT cloth even when a keyword matches (landscape, flagpole...)
ExcludeParts = "hat,helmet,head,hair,glove,boot,shoe,mask,goggle,hand,body,beard,mouth,teeth,eyes"   # (2026-10-18) A texture whose FILE NAME has one of these words is NOT cloth (a hat or gloves sharing the garment's folder do not move)
MaskMode = 2                         # 0: the mesh's vertex colour RED says how loose each part is (1 loose ends, 0 pinned) -- for meshes authored with such a mask; 1: the whole mesh moves; 2: by height, pinned at the top (works with unauthored meshes)
SkinMask = 1                         # (2026-10-18) Worn clothing: 1 = by height above the feet (HeightTop = pinned, HeightBottom = loosest; the vertex heights are the mesh's own, so it works whatever the pose; boots and legs below LegCut stay still); 2 = by the garment's own height range (top PinFraction stays still); 0 = the old actor-height mask (shoulders moved too)
PinFraction = 0.4                    # (2026-10-18) SkinMask 2: the top part of a worn garment (0-0.9 of its height) that does not move at all (shoulders, chest)
SkinSpace = 1                        # (2026-10-18) Worn clothing: the space the skeleton puts vertices in: 1 = camera-relative world (verified in game), 0 = the skin root's own (the old assumption), 2 = world. Leave at 1
HeightTop = 95.0                     # SkinMask 1 (and 0): units above the actor's feet where worn cloth is pinned (above this nothing moves; ~waist)
HeightBottom = 25.0                  # SkinMask 1 (and 0): units above the feet where worn cloth is loosest (coat hem)
LegCut = 14.0                        # (2026-10-18) SkinMask 1: below this height above the feet (boots, ankles) nothing moves; full strength 10 units higher
HeightFromFeet = true                # SkinMask 0 only: measure those heights from the actor's feet (true) or from the skeleton's root (false)
UseGameWind = true                   # Take direction and strength from the weather's wind (the values below still scale it). Outdoors only: indoors there is no weather, see Cloth > Interiors
CalmFactor = 0.6                     # (2026-10-18) With the game's wind: the strength in dead calm as a fraction of WindIntensity (0-1.7; it rises to 1.7 in a gale). It was 0.3: in the calm desert cloth moved 4 cm, which nobody sees
WindDirX = 1.0                       # Wind direction (world, used when UseGameWind is off; indoors with Cloth > Interiors on, the draught blows this way)
WindDirY = 0.0
WindDirZ = 0.0
WindSpeed = 220.0                    # How fast the billow travels along the wind (units per second)
WindIntensity = 6.0                  # How far loose cloth moves (units; 6 is about 9 cm)
Wavelength = 260.0                   # Length of one billow (units)
FlutterSpeed = 3.0                   # High-frequency flutter (cycles per second)
FlutterAmount = 0.35                 # Flutter strength (0-1)
RippleAmount = 0.5                   # Billow out of the cloth's plane (0-1)
RippleScale = 0.012                  # Size of the small ripples (cycles per unit)
MotionDrag = 0.1                     # (2026-10-19) Worn coats follow the wearer: how far the hem trails behind per unit/s of speed at a walk (~100 units/s: ~8 units), rising softly to MotionMax (a run: ~20 units, 30 cm). 0 = off
MotionMax = 30.0                     # (2026-10-19) The most the hem trails behind (units, approached softly)
MotionSpring = 1.5                   # (2026-10-19) How fast the hem swings back after you stop or turn (swings per second)
MotionDamping = 0.25                 # (2026-10-19) 0.05 = swings on and on, 1 = settles without swinging past
StrideSwing = 6.0                    # (2026-10-19) Side-to-side swish of the hem with your steps at a run (units; about half walking, none standing). 0 = off
StrideLength = 250.0                 # (2026-10-19) Units run per swish (one left and one right step); steps are shorter when walking
TurnLag = 0.12                       # (2026-10-19) Seconds the hem lags behind a turn, so the coat flares out. 0 = off
MotionIndoors = true                 # (2026-10-19) Worn coats follow the wearer indoors too (the wind part indoors: Cloth > Interiors)
UseSkeleton = true                   # (2026-10-19) Worn clothing: only what stands off the legs and arms moves, and only below the hips, found from each garment's own skeleton (no per-armour numbers; legs, trousers, hands and torso stay still). Off = the height mask below (SkinMask)
LimbGap = 1.0                        # (2026-10-19) UseSkeleton: how far beyond the garment's own leg thickness (measured from its mesh: the trousers under a coat) cloth starts to move, in units. Raise it if trousers move
LimbFade = 6.0                       # (2026-10-19) UseSkeleton: how many units further off the legs cloth moves fully. Smaller = more of a coat moves but its lining and shell drift apart; larger = calmer
UseWeights = true                    # (2026-10-19) Worn clothing: each garment's own mesh decides what moves, worked out once per garment (trouser legs and boots found from the mesh and kept still; the coat pinned at the hips, loosest at the hem; its outside and its lining move together). Off = the skeleton mask above (LimbGap, LimbFade). Applies immediately
WalkSim = true                       # (2026-10-20) Worn coats get a small walking simulation: the coat hangs from the hips instead of riding your legs like trousers, its hem trails behind, the knees push it forward at each step, it swings and settles when you stop. Needs UseWeights. Applies immediately
WalkHang = 1.0                       # (2026-10-20) WalkSim: how fully the coat hangs from the hips (0 = rides the legs as the mesh was made, 1 = hangs from the hips). It fades out by itself when you sit or crouch
WalkSpring = 1.4                     # (2026-10-20) WalkSim: how fast the hem swings back (swings per second)
WalkDamping = 0.2                    # (2026-10-20) WalkSim: 0.02 = swings on and on, 1 = settles without swinging past
WalkDrag = 1.0                       # (2026-10-20) WalkSim: how much the air holds the hem back while you move (0 = none: it only lags while speeding up)
WalkLegMargin = 1.5                  # (2026-10-20) WalkSim: how far (units) the hem is kept off your legs
WalkMaxSwing = 25.0                  # (2026-10-20) WalkSim: the most the hem moves away from where it hangs (units, reached softly)
WalkMaxAngle = 35.0                  # (2026-10-20) WalkSim: the most the hem swings out from hanging straight down (degrees; it flew out level at a run)
WalkDragCap = 180.0                  # (2026-10-20) WalkSim: above about this speed (units/s) the air holds the hem back no further (a run trails about as much as a brisk walk)
WalkHemSmooth = 1.0                  # (2026-10-20) WalkSim: 0..1, how smoothly the hem moves as one piece (less sharp folds when you turn and run fast; 0 = as before). Applies immediately
StillWeights = true                  # (2026-10-20) Still cloth (tents, flags, banners, curtains): only the thin cloth moves, worked out once per object from its own shape -- poles, ropes, pegs and other solid parts stay still, the cloth is held where it touches them, at the ground and along its top, and moves most at its free edges (a flag's end, a tent's door flap, a banner's hem); two-sided cloth moves as one. Off = as before: the whole object moved and its bottom the most (a tent's poles, its ropes and its edge on the ground swung). Applies immediately
AutoDetect = false                   # (2026-10-20) Worn clothing that no keyword names moves too when its own mesh hangs free of the legs -- coats, dusters, robes, dresses (Ulysses' duster, Elijah's robes, Colonel Autumn's coat, the gambler dresses...); trousers, power armour and tight suits stay still. Each garment is measured once (in the background, a moment after it first appears) and every verdict goes to the log (LogAuto). Applies immediately
AutoShare = 2.0                      # (2026-10-20) AutoDetect: [0-50] how much of a garment (%) must hang free for it to move. Higher = only long coats and robes. Applies immediately
ForceOff = "gore/,meatcap,creatures/" # (2026-10-20) Textures whose path holds one of these NEVER move, whether a keyword or AutoDetect picked them (by default the dismemberment caps and creatures: a brahmin's belly measured as 'hanging free'). Add a piece of an armour's texture path here to keep it still
LogAuto = true                       # (2026-10-20) AutoDetect: writes each garment's verdict to the log once (moves or still, and why)
LogMatches = false                   # Diagnostic: writes every worn texture (cloth or not) and every matched texture to the log with its mesh numbers
TimeOffset = 0.0                     # Test only: seconds the wave pattern is ahead (for pictures at set moments)

[_Shaders.Cloth.Interiors]
Enabled = false                      # UNOFFICIAL (2026-10-21): cloth indoors (curtains, banners, flags, drapes, tents -- and the wind part on worn coats) sways gently, with the values below instead of the outdoor ones: there is no weather indoors, so the game's wind never changes them, and the draught blows along Cloth > Main WindDirX/Y/Z. Off = cloth stays still indoors, as before (worn coats still follow you there: Cloth > Main MotionIndoors). It replaces Cloth > Main's old Interiors switch, which moved indoor cloth as much as outdoors (a saved 'true' carries over). Needs Cloth > Main Enabled. Applies immediately
Strength = 1.0                       # [0.0-2.0] (2026-10-21) Indoors: one knob for all of it -- how much indoor cloth moves, as a share of WindIntensity (0 = still, 0.5 = half as far, 2 = twice). Applies immediately
WindIntensity = 2.0                  # [0.0-12.0] (2026-10-21) Indoors: how far loose cloth moves (units; 2 is about 3 cm -- outdoors it moves 4 to 10 by the weather). Applies immediately
WindSpeed = 80.0                     # [0-400] (2026-10-21) Indoors: how fast the slow sway travels across the cloth (units per second; outdoors 220). With Wavelength it sets the pace: 80 / 400 = one sway every 5 seconds. Applies immediately
Wavelength = 400.0                   # [16-1000] (2026-10-21) Indoors: the length of one sway across the cloth (units; outdoors 260). Longer = a curtain sways more as one piece. Applies immediately
FlutterSpeed = 0.8                   # [0.0-6.0] (2026-10-21) Indoors: the small quiver on top of the sway (cycles per second; outdoors 3). Applies immediately
FlutterAmount = 0.1                  # [0.0-1.0] (2026-10-21) Indoors: how strong that quiver is (outdoors 0.35). Applies immediately
RippleAmount = 0.3                   # [0.0-1.0] (2026-10-21) Indoors: how much the cloth billows out of its own plane (outdoors 0.5). Applies immediately

[_Shaders.PipboyFit.Main]
Enabled = true                       # UNOFFICIAL (2026-11-03): NEEDS A RESTART to switch on or off (Save, then restart the game). In first person, armor sleeves are pulled in under the arm-mounted Pip-Boy so they no longer poke through its casing (done in the vertex shader after skinning; only vertices on the left forearm move). The values below apply immediately
Strength = 1.0                       # How much of the pull is applied (0 = none, 1 = sleeves end on the ellipse below)
Knee = 0.7                           # Where the soft pull starts, as a share of the ellipse radius: sleeves inside it never move, past it they are eased in so nothing passes the ellipse
Falloff = 2.0                        # Units over which the pull fades in at the elbow end and out past the wrist end (avoids a step in the sleeve)
Start = 4.5                          # Where the Pip-Boy casing starts along the forearm (units from the elbow, in the "Bip01 L ForeTwist" bone's frame; the vanilla casing spans 4.4 to 17.1, the wrist is at 18.1)
End = 17.0                           # Where the casing ends along the forearm
CenterY = 0.1                        # The casing's inner ellipse: its centre across the forearm (bone y, units)
CenterZ = 0.4                        # Its centre across the forearm (bone z, units; +z is the screen side)
RadiusY = 2.6                        # Its radius along bone y (units; the vanilla casing's inside is about 2.7-3.6). Smaller = sleeves pulled in further
RadiusZ = 2.6                        # Its radius along bone z (units; about 2.7-3.5 inside)
WristScale = 0.6                     # The casing narrows towards the wrist (inside about 2 units across its last 4): the radius is scaled down to this at End
Axis = 0                             # Which axis of the ForeTwist bone runs along the forearm (0 x, the vanilla skeleton's; 1 y, 2 z)
PowerArmor = false                   # Also fit while you wear power armor (off: power armor arms are left as they are, its gauntlets are too bulky to squeeze). Live
ThirdPerson = true                   # Also fit your own sleeves in third person (only your character; NPCs are never changed)
Exclude = "pipboy"                   # Meshes whose name holds one of these (comma-separated) are never squeezed: the Pip-Boy itself
[_Shaders.PBR.Linear]
LinearScene = true                  # UNOFFICIAL (2026-10-28; on by default since 2026-10-28: user, it "completely resolved the pop in issue"), needs a restart (then live), with linear lighting: THE fix for pieces looking lighter than the same surface next to them (floor tiles, rubble, road pieces, by day and at night): the game draws some surfaces in several passes (light, extra lamps, texture, highlights) and adds them in the picture, and each pass used to add its own already-encoded colour, which comes out too bright. On, the world is kept in linear light while it is drawn, so the passes add up exactly, and encoded once afterwards; LampSums, HighlightSums and ExactPassSums are then not needed (switched off by themselves). Surfaces drawn in one pass look as before; the game's own shaders (texture passes, signs, sky, water, glass) draw as before. Costs a few full-screen steps a frame (the log's "LinearScene" line counts them). Eyes keep the mod's shader while it is on. false = as before.
ExactPassSums = 0                    # UNOFFICIAL TEST (2026-10-16): objects lit in several passes add them up in linear light (the extra lamp passes and the highlight passes were each added in the stored curve: up to 3.7x too bright indoors). 0 off, 1 lamps, 2 highlights, 3 both (the numbers were listed the other way round until 2026-10-25). Test only (a full-screen fold-in per run); LampSums and HighlightSums are the play versions. Applies immediately
Enabled = true                       # UNOFFICIAL: linear lighting on objects and the ground. The game adds light up in gamma space, so lit sides drop off too fast into shade, two lamps add up too dark and coloured light tints too little. On, colours are decoded to linear, lit, and encoded back: softer, fuller light falloff and truer colour mixing. Changes the look (brighter mid-tones and ambient), so the exposure and ambient may want retuning. Switching it on or off needs a restart (off, the shaders are exactly as before and cost nothing).
PreDecode = true                     # UNOFFICIAL (2026-10-17), needs a restart: with linear lighting on, the light and ambient colours of each object are converted to linear once (on the CPU, as the game sends them) instead of again in every pixel. Same picture; measured indoors: lit objects up to -0.47 ms. Off: as before.
Gamma = 2.2                          # [1.0-3.0] The gamma the colours are decoded with, live. 2.2 is standard; 1.0 looks the same as off.
NightGamma = 0.0                     # [0, 1.0-3.0] UNOFFICIAL (2026-10-20), live: linear lighting's gamma outside at night; Gamma blends into it over dusk and dawn like the other day/night settings (Transitions curve). Interiors keep Gamma. 0 = the same as Gamma (off).
FalloffMatch = 1.0                   # [0.0-1.0] UNOFFICIAL (2026-10-20), live: 1 = each lamp reaches exactly as far and as strongly as in the game (its distance falloff is decoded like its colour); lamps still add up in linear light. 0 = the falloff used as is in linear light, as before: lamps 2-3.5x brighter along their reach, big rooms like Rivet City's hangar about twice too bright

[_Shaders.PBR.LampFalloff]
Exterior = false                     # UNOFFICIAL (2026-10-21) Lamps outdoors (street lights, lanterns, fires) fall off like real light: bright by the lamp, dimming smoothly over its reach to nothing at its edge, instead of the game's evenly lit disc that stops at a hard edge (inverse-square light with a smooth end, as in Unreal Engine 4: Karis 2013). The lamp gives off as much light in all as before. Changes the look; off = exactly as before. Needs a restart the first time one of Exterior, Interior or MatchEverywhere is switched on (they are then built into the shaders); after that it switches live
Interior = false                     # UNOFFICIAL (2026-10-21) The same for lamps indoors: pools of light by the lamps, darker between them. Changes the look; off = exactly as before (restart the first time, as Exterior)
Falloff = 0.25                       # [0.05-1.0] UNOFFICIAL (2026-10-21), live: how fast a lamp's light dims with distance (the bright core's size, as a share of the lamp's reach). Small = a bright spot by the lamp and a long dim tail; 0.5 = close to the game's own curve; 1 = flatter still
Brightness = 1.0                     # [0.1-4.0] UNOFFICIAL (2026-10-21), live: the lamps' strength with Exterior / Interior on. 1 = as much light in all as the game's lamps give
MatchEverywhere = false              # UNOFFICIAL (2026-10-21) With linear lighting on: the ground, skin and hair fall off from each lamp as objects do (Shaders.PBR.Linear FalloffMatch). Off = as before: on them a lamp stays nearly full bright almost to the edge of its reach and then stops (the flat disc with a hard edge on the ground, brighter than the road next to it). Exterior / Interior shape them too. Restart the first time, as Exterior

[_Shaders.PBR.Status]
Enabled = true                       # Adds PBR specular formula to object shaders

[_Shaders.POM.Main]
HeightMapScale = 0.4                 # Parallax mapping scale. Keep 0.4 for a widely working value.

[_Shaders.POM.Displacement]
Enabled = false                      # EXPERIMENTAL (2026-10-28): real bumps on rocks, cliffs and the other objects with a parallax height map (the ones this page's parallax works on), through the same tessellation as the land: near the camera their triangles are split into small ones and moved in and out by the object's own height map, so a rock's or cliff's outline gets real bumps against the sky and its depth follows them (fog, AO, reflections). Needs [Main.Main.Performance] NvrDxvkDisplacement on when the game starts (under the DXVK fork; with it on, these objects' shaders are compiled in the layout this needs, whatever this says; 2026-10-28: except with [Main.Main.Quality] CapturedNormals on, where that layout is used only when this is on at startup, as it leaves no room for the rocks' smooth normal: then turning this on needs a restart). Off by default. Live. Costs: every such object within FadeEnd is drawn as many small triangles in each of its passes (lit, lamp and highlight passes, the water's reflection). Not yet: the bumps cast no shadows of their own (the sun's shadow maps keep the flat object).
Strength = 8.0                       # [0-64] how far apart the lowest and the highest point of the bumps can be, in game units (70 = 1 m). 0 = the objects' own triangles exactly. Live.
Center = 0.5                         # [0-1] 0.5 = the bumps go in and out round the object's own surface, so feet and things standing on a rock stay right on average. Lower moves the whole surface outward by (0.5 - Center) x Strength. Live.
Contrast = 2.0                       # [0-32] how strongly the height map's differences are stretched (1 = as the height map has them; high values round off at the Strength limit). Live.
EdgePixels = 12.0                    # [2-64] how far apart the new points are on screen, in pixels. Smaller = finer bumps, more work for the graphics card. Live.
EdgeFade = 1.5                       # [0-8] the bumps fade to nothing on the edges of the object's own triangles, over this many steps of the new points. No edge then ever moves, so no crack can open where a rock's texture or shading seams meet (its triangles are split there, and the two sides would move differently). 0 = no fade (TEST only: cracks can open at seams). Live.
MaxFactor = 16                       # [1-64] the most new points along one edge of an object's triangle. Live.
FadeStart = 1024.0                   # game units from the camera where the bumps start to fade out ... Live.
FadeEnd = 2048.0                     # ... and where they are gone and the objects are drawn as before. Live.
LodBias = 0.0                        # [-2-4] detail level of the height lookups: 0 matches the spacing of the new points; higher = smoother bumps, lower = sharper but they may flicker as you move. Live.
SameHeight = true                    # UNOFFICIAL BUG FIX (2026-11-01), live: every pass of a displaced object takes its height from the map its main pass used. Indoors the lamp and texture passes often found another texture in their height slot (left there by an earlier draw), so they landed on another depth and the object came out as white, untextured light in patches that moved with the view. false = as before.
FixedFactor = 0                      # TEST: > 0 splits every object triangle edge this many times at any distance (1 with Strength 0 = the game's triangles exactly). 0 = by EdgePixels. Live.
DebugView = 0                        # 0 off. 1 wireframe of the displaced objects (proof that they are split: the lines get dense near the camera). Live.
Winding = 0                          # TEST: 0 = the game's triangle facing (expected). 1 = the other one: only if displaced rocks disappear (seen from inside) with 0. Live.

[_Shaders.POM.Status]
Enabled = true                       # Parallax mapping on object shaders to simulate extra detail.

[_Shaders.Precipitations.Main]
Bloom = 0.5                          # Rain effect that is blocked by objects above and refracts light.
Coloring = 1.1                       # Base coloring amount added to the refracted color.
Opacity = 1.0                        # Opacity of the drops.
Refraction = 1.0                     # Distance of the refraction of the screen image by the droplets.
Speed = 3.0                          # Multiplier for the rain speed.
VerticalScale = 1.6                  # Multiplier for the length of the drops/streaks.
SkipHiddenLayers = true              # UNOFFICIAL: skips the rain layers that lie behind walls and ground (they add nothing): same picture, less work. Off = as before.
ForceRain = false                    # UNOFFICIAL TEST AID (2026-10-25), live: the rain effects act as if it rained outdoors in any weather (FalloutNV.esm has no rainy weather; the DLCs and weather mods do), like Snow's ForceSnow. Leave off for play.

[_Shaders.Precipitations.Status]
Enabled = true                       # Rain effect that is blocked by objects above and refracts light.

[_Shaders.GPUParticles.Main]
Enabled = false                      # UNOFFICIAL (2026-10-26), NEEDS the DXVK fork 1.5-particles (does nothing on native D3D9, stock DXVK or an older DXVK fork), live: while it rains or snows outdoors (ForceRain / ForceSnow count), real falling drops round the camera, simulated on the graphics card: they fall, land on what they hit (roofs, trees and ground from the rain's top-down map, and whatever the camera sees), splash (rain) or settle for a few seconds (snow), and start again at the top. Drawn over the frame after the screen-space rain (Precipitations, which stays as it is). Off = nothing changes.
Count = 32768                        # [64-262144] How many drops live round the camera. More = denser rain and more cost (the simulation and the drawing both grow with it).
Size = 1.0                           # [0.2-4] Drop width / splash and flake size, in game units (about 70 to a metre). Thinner than a pixel fades instead of flickering.
Speed = 1.0                          # [0.2-3] Fall speed multiplier (rain ~650 units/s, snow ~70 units/s at 1).
Opacity = 0.8                        # [0-1] How strongly the drops show.
Radius = 1200                        # [200-4000] Half the width of the box round the camera the drops live in (game units). Larger reaches further but spreads the same Count thinner.
Splashes = true                      # A landed rain drop is a small splash for 0.4 s (a snow flake settles for 4 s). Off: it simply starts again at the top.

[_Shaders.ShadowsExteriors.Main]
SkinnedAlphaTest = true                # UNOFFICIAL BUG FIX (2026-11-02), live: in sun shadows, characters' alpha-tested parts (hair cards, fringes, ragged cloth) cast only where their texture is solid, as alpha-tested objects already did. false = the whole card casts, as before.
TwoSidedCasters = false                # UNOFFICIAL: sun shadows (and the volumetric light, which reads them) are cast by both sides of every object. Fixes sunlight and light shafts shining through one-sided walls (the game uses them where you never see the other side). Same picture for closed objects; a little more shadow-map drawing.
Quality = 4                          # Quality preset - 0: Low, 1: Medium, 2: High, 3: Full, 4: Custom (UNOFFICIAL 2026-10-27: every preset uses PCF sun shadow maps; the presets set distance and resolution; the old VSM / EVSM modes and their Mode, Format, Prefilter and MSAA settings are gone)
Enabled = true                       # Enable sun shadows using rendered shadow maps.
ForwardShadows = true                # Evaluate sun shadows per-object in the lighting shaders
                                     # instead of as a screen-space composite. Scales only the
                                     # sun term, so shadowed surfaces keep correct ambient/sky
                                     # light. Takes effect immediately: turning it off hands the
                                     # cascades back to the deferred pass in the same frame.
                                     # Starting the game with it false compiles the forward path
                                     # out entirely, so turning it on then needs a restart.
SmoothCharacterShadows = true        # UNOFFICIAL (2026-10-20), live, on by default (user 2026-10-20): sun and lamp shadows on faces and skin follow the smooth shape of the head instead of its triangles. Fixes blocky, jagged shadow edges on faces close up, nose and brow shadows that come and go triangle by triangle as a head turns, and triangle-shaped light and dark patches on the shaded side of faces (old skin shader); sun shadow edges on skin also fade over a few millimetres (CharacterShadowSoftness) instead of cutting off hard. Off = as before.
CharacterShadowSoftness = 0.4       # UNOFFICIAL (2026-10-20), live, with SmoothCharacterShadows: how far a sun shadow edge on skin fades, in world units (about 70 = 1 m; 0.4 is about 6 mm), as light carried under real skin softens it. Hides the shadow map's stair steps and the head's triangle edges close up. 0 = hard edges (as before). Needs contact hardening switched on at game start (the default).
CharacterShadowReach = 0.5          # UNOFFICIAL (2026-10-22), live, with ForwardShadows and PCF (Mode 3): how close to the skin a thing may be and still cast its sun shadow on it, in world units on the nearest shadow cascade (0.5 is about 7 mm; 70 = 1 m), measured from the skin (since 2026-10-27: before, it was measured along the sun's ray, which at a low sun let a face shadow itself in grains). The shadow lookups give the skin's own surface a few shadow-map texels of slack, and on the coarser cascades (past about 3 m at CascadeLambda 0.9, past 1 m at 0.997) that is 2-5 cm: hair, nose and collar shadows on a face vanished there while the face was still big on screen in third person. With this, the slack on the nearest cascade is capped at this distance and the coarser cascades keep the same cap in their map's depth units (so it grows with their texels, never below what a flat face needs). Skin only: armour, clothes and the world keep their texel slack (the 2026-10-14 stripes on the power armour at a low sun). Close up (within the nearest cascade) the face already had its shadows; they look lighter than the deferred path's because forward shadows take away only the sun's light and leave the sky's and the ambient. 0 = off (as before).
CasterReachEverywhere = false        # UNOFFICIAL (2026-10-22), a TEST switch, needs a restart: CharacterShadowReach's limit on every forward shader (armour, clothes, ground, walls), not only skin. Expect fine stripes on flat surfaces at a low sun; here for A/B checks only.
CharacterObjectReach = false         # UNOFFICIAL (2026-10-23), needs a restart to switch on (live after that): CharacterShadowReach's limit also on the parts of a character drawn with the ordinary object shaders that sit on the head: hair, face masks, eyes, hats and helmets (any mesh skinned to head and neck bones only, or hung under the head bone). Fixes a face mask losing the hair's and nose's shadow sooner than the skin face next to it as the camera zooms out. Body armour and clothes keep their normal limit (no stripes at a low sun). Off = as before.
CharacterObjectReachLog = false      # UNOFFICIAL (2026-10-23), diagnostic: with CharacterObjectReach, log which meshes count as head parts (the first 400).
Darkness = 0.75                      # Darkness of shadows.
NightMinDarkness = 0.35              # Darkness of shadows during dark moon phase. Set to 0 to disable shadows completely when there is no moon.
SkipWhenFaded = true                 # UNOFFICIAL: around sunrise and sunset the sun's shadows are faded out completely; while they are, the lit shaders skip their shadow lookups, and the screen-space contact shadows and the shadow maps are not drawn when nothing reads them (the volumetric fog's sun glow reads the shadow maps, so with the fog on they are kept). The picture is the same. false: everything runs anyway.
SkipWhenFadedCheck = 0               # UNOFFICIAL, DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = what SkipWhenFaded skips is filled with "full shadow", so anything still reading it would show; 2 = the same, skipping even what is still read (a test that the checks matter: the picture changes); 3 = the lit shaders' sun shadow lookups off at any hour (to measure their cost: by day the sun shadows disappear); 4 = the shadow maps filled with 'full shadow' at any hour, nothing skipped (shows that 1 and 2 reach the shaders).
SunCascadeStats = 0                  # UNOFFICIAL, DIAGNOSTIC (development builds only, release builds ignore it): leave 0. Every 240 frames (or per auto-test shot) the log gets 'SUN CASCADE STATS' lines: 1 = the sun shadow cascades' CPU time per frame; 2 = also how it splits into walking the loaded cells and drawing, with counts of objects tested and drawn and of state changes between draws (the timers themselves add a little).
SunCascadeVerify = 0                 # UNOFFICIAL, DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = every sun shadow cascade drawn with SunCascadeOneWalk is also walked the old way and both lists of shadow casters are compared ("SUN CASCADE VERIFY" lines in the log); 2 = also each cascade is drawn both ways and the two shadow maps compared texel by texel (stalls the GPU: slow).
SunCascadeSkipFlat = true            # UNOFFICIAL (2026-10-21), the same picture for less CPU time: while the sun stands straight overhead (with QuantizeSun, any sun within 7.5 degrees of the zenith is rounded to exactly overhead), the sun shadow maps are built with a camera whose up direction is the sun's own, which flattens them: nothing can be drawn into them and they stay empty. Until now every object in the loaded cells was still sent to all four of them (about 7 ms of CPU time per frame on the Strip at midday on a fast PC). On: those maps are only cleared. Off: as before. Applies immediately.
SunCascadeOneWalk = true             # UNOFFICIAL (2026-10-21), the same picture for less CPU time: the sun shadow cascades drawn in a frame share one walk through the loaded cells instead of each walking all of them again; every cascade still gets exactly the same objects in the same order. Off: as before. Applies immediately.
SunCascadeLeanDraws = true           # UNOFFICIAL (2026-10-21), the same picture for less CPU time: each object drawn into the sun shadow maps sends the graphics card only the settings that changed since the object before it (before, every setting again), and the cloth and plant wind checks are skipped for objects whose texture is neither cloth nor plant (they never moved them). Off: as before. Applies immediately.
OverheadSunFix = true                # UNOFFICIAL (2026-10-21), changes the picture: while the sun stands straight overhead (with QuantizeSun, any sun within 7.5 degrees of the zenith is rounded to exactly overhead; on the Strip that is around 13:00) the sun shadow maps stayed empty, so the sun cast no shadows at all from those maps. On: they are built facing north instead and the sun casts its normal shadows then, for the normal cost of sun shadows (about 1 ms of CPU time per frame) instead of almost nothing. Any other sun position: nothing changes. Off: as before. Applies immediately.
FitToDepth = false                   # UNOFFICIAL (2026-10-27), live, every Quality: fit the four sun shadow cascades to what is really on screen, so the same shadow-map size covers less ground and the shadows there are sharper. Each frame the depth on screen is measured on the graphics card (a small grid of blocks, counted by queries that come back a few frames later without waiting; native D3D9 and DXVK alike) and, when everything you see ends sooner than the shadow Distance (looking down, a street of buildings, under a canopy, a canyon) or starts later, the cascades past that point are re-split over the depths you can see. A new layout is only used when no visible spot gets a coarser cascade (never more than 5 %), some get at least 25 % finer and the whole view finer on average, so open views to the horizon and your own character's shadows stay as they are. While the camera turns or moves fast the normal split is used at once, and the fit comes back about a tenth of a second after it stops; with sky in view and the volumetric light on, the last cascade still reaches the full Distance for the light shafts. Costs about 0.05 ms of GPU time a frame (F10 profile: "Sun depth fit"); fewer objects are drawn into the shadow maps while a fit is in use. false = exactly as before (nothing is measured).
FitToDepthDebug = 0                  # UNOFFICIAL (2026-10-27), diagnostic view, live, works with FitToDepth on or off: 1 = each sun shadow cascade coloured over the picture as the lit shaders pick it (red nearest, green, blue, yellow farthest, grey none; stripes where one hands over to the next), with a bar along the top: the thick bar is the layout in use, the thin one under it the layout without the fit (depth on a square-root scale up to the shadow Distance; the white mark is the nearest visible depth used). 2 = the measured block grid (grey: how far each block reaches, magenta: past the cascades, orange: nearer than the nearest depth used, cyan: shows sky). 0 = off.
FitToDepthLog = false                # UNOFFICIAL (2026-10-27), diagnostic: with FitToDepth, a log line whenever the cascade layout changes (the splits, what was measured, why).
OrthoMapResolution = 256             # Resolution of the texture used to store the ortho map.
OrthoRadius = 8000                   # Max distance for rendering of ortho map.
UsePointShadowsDay = false           # Whether to cast shadows from point lights. Requires a slight darkening of the entire screen.
UsePointShadowsNight = false         # Whether to cast shadows from point lights during Nights. Requires a slight darkening of the entire screen.

[_Shaders.ShadowsExteriors.RT]
SunAngle = 0.0                       # UNOFFICIAL (2026-10-29): soft RT sun shadows: the sun's disc in degrees (the real sun 0.53; more = softer, wider penumbrae). 0 = one hard ray (the old look). Above 0 each pixel traces toward a different point of the disc every frame and the shared RT denoiser (temporal + edge-stopping a-trous) smooths it. Live.
Denoise = true                       # UNOFFICIAL (2026-10-29): with SunAngle above 0, run the shared RT denoiser over the traced sun visibility (off: the raw one-ray noise, for comparison). Live.
DenoiseKernel = 5                    # UNOFFICIAL (2026-10-29): the shared RT denoiser's spatial kernel for the soft RT sun shadows: 5 (5 x 5 taps, smoother) or 3 (3 x 3, about 2.5 times cheaper). Live.
HalfResolution = false               # UNOFFICIAL (2026-10-29): trace the RT sun shadows at half resolution (a quarter of the rays; the trace is the cost: 8 ms hard / 15 ms soft at 720p on an iGPU), denoise at half size and upsample bilinearly. Softer shadow edges. Live.
Enabled = false                      # UNOFFICIAL (2026-10-28), needs the DXVK fork (fork patch 0028), a GPU whose 64-bit Vulkan driver has ray tracing (RTX 20 / RX 6000 or newer, or a Ryzen 7000+ integrated GPU) and NvrRtHelper.exe in Data\NVSE\Plugins\NvrRt\: ray-traced sun shadows. One ray per pixel toward the sun against the real geometry (the ray tracing core's scene: [Main.Main.RayTracing]), so small and thin casters, contact and long shadows are exact where the cascades blur, miss or acne. Without any of those, or off: the shadow maps exactly as before. Live. docs\next\FORK-RT-SUN.md.
Mode = 0                             # UNOFFICIAL (2026-10-28), with Enabled: 0 = combine (the cascades and contact shadows stay; the traced shadow is multiplied in: nothing is lost, the rays add what the maps miss), 1 = replace (inside Range the traced shadow replaces the cascades, which fade in only over the last 15% of Range; the object shaders' own cascade lookups are switched off meanwhile). Alpha-tested casters (leaves, fences) and actors are not traced yet: in Mode 1 they cast no sun shadow inside Range. Live.
Strength = 1.0                       # [0-1] UNOFFICIAL (2026-10-28), Mode 0: how strongly the traced shadow darkens (1 = fully). Live.
Range = 6000                         # UNOFFICIAL (2026-10-28): the view distance (units) the rays are traced to; they fade out over its last 15% (Mode 1: the cascades fade in there). Live.
NormalBias = 2.0                     # UNOFFICIAL (2026-10-28): how far (units) each ray starts off the surface along its normal, against a surface shadowing itself (acne). Live.
NormalBiasPerUnit = 0.0005           # UNOFFICIAL (2026-10-28): extra normal offset per unit of view distance (the depth and normals are coarser far away). Live.
StartBias = 1.0                      # UNOFFICIAL (2026-10-28): how far (units) each ray also starts toward the sun. Live.
CloudShadows = false                 # UNOFFICIAL (2026-10-30), with the volumetric clouds' shadows on (Volumetric Clouds, Shadows): the clouds' shadow goes into the traced sun visibility (the clouds' shadow map where the sun ray from each pixel meets the cloud base, as strong as the clouds' own shadows), so it darkens only the sunlight, exactly like the shadows of things. The clouds' own shadow pass (through SunFar, or the clouds' composite) then leaves the clouds out in those frames, so they are never applied twice. Off: the clouds' shadows as before. Live.
Penumbra = false                     # UNOFFICIAL (2026-10-31): physically sized soft RT sun shadows that harden at contact, as in current ray-traced games. The sun is a disc (SunAngle; 0 here = the real sun, 0.53 degrees), each pixel traces one ray to a point of it a frame, the history averages them, and then each shadow edge is softened by its own penumbra width: the distance to what casts it times the sun's size (a foot on the ground stays sharp, a roof's shadow far below gets a wide soft edge). Replaces the denoiser's fixed-size smoothing for the sun. Needs Denoise. Live.
ContactShadows = 1.0                 # UNOFFICIAL (2026-11-07) [0-1], with Mode 1 (replace): screen-space contact shadows in the traced sun shadow: a short march over the depth buffer toward the sun, so what the screen has but the ray-traced scene lacks (the tessellated bumps, grass not in the RT scene, small props) still shadows where it touches. Where the raster contact shadows ([Shaders.ShadowsExteriors.ScreenSpace]) draw, this fades out as they fade in (never both). Mode 0 keeps the cascades and the raster contact shadows: nothing added there. 0 = off. Live.
ContactLength = 24.0                 # UNOFFICIAL (2026-11-07) [1-128]: how far that march looks, in pixels (at most 64 game units). Live.
PenumbraMaxRadius = 32.0             # UNOFFICIAL (2026-10-31), with Penumbra: the widest soft edge in screen pixels (the cost is the same at any size). Live.
ShadowDenoiser = true                # UNOFFICIAL (2026-11-07): the RT shadow denoiser (docs/next/RT-DENOISER.md) for the RT sun shadows: one ray a pixel over the sun's disc (SunAngle; 0 = the real sun, 0.53 degrees), then a denoiser of the kind current ray-traced games use (a history that follows the camera and moving things, a blur sized to each penumbra: sharp where a shadow meets its caster, softer away from it). Replaces Denoise and Penumbra (they stand aside while it runs). Off: the old path. Live (ObjectMotion for its history needs it on at the start).
DenoiserHistory = 32.0               # [1-64] UNOFFICIAL (2026-11-07), with ShadowDenoiser: frames a soft shadow is averaged over at most (hard edges keep one frame). Live. Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
DenoiserMaxRadius = 32.0             # [1-64] UNOFFICIAL (2026-11-07), with ShadowDenoiser: the widest blur in full-size pixels. Live.
DenoiserStabilize = 4.0              # [0-16] UNOFFICIAL (2026-11-07), with ShadowDenoiser: frames of the result's own short history (0 off). Live. Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
DenoiserDebugView = 0                # [0-5] UNOFFICIAL, DIAGNOSTIC (2026-11-07), with ShadowDenoiser: the visibility replaced by 1 the raw one-ray signal, 2 the temporal average, 3 the penumbra width (pixels / DenoiserMaxRadius), 4 the history length (/ DenoiserHistory), 5 the blur before the stabilization. Live.
DenoiserCore = 0                     # [0-2] UNOFFICIAL, TEST (2026-11-07), with ShadowDenoiser: which denoiser runs. 0 = ours (the default: best on every host measure, docs/next/RT-DENOISER.md); 1 = AMD FidelityFX Shadows denoiser (MIT); 2 = FidelityFX with its blur widened by our penumbra size. For A/B only. Live.
RayLength = 30000                    # UNOFFICIAL (2026-10-28): how far (units) a ray looks for a caster (a caster beyond the scene's SceneRadius is not there anyway). Live.
DebugView = 0                        # UNOFFICIAL (2026-10-28), diagnostic: 1 = the traced shadow alone (the cascades and contact shadows left out of the sun shadow), 2 = traced but not applied (the cascades alone; the cost of the rays stays, for A/B), 3 = the distance to the caster (white = free or 4096+ units), 4 = the traced visibility alone as grey over the whole finished picture (white = sun reaches the pixel, black = a traced caster blocks it). 7 (with HitTextures) = the hit's colour at each camera ray's hit as grey; 8 (2026-10-30, with [Main.Main.RayTracing] GlowTextures) = the hit's glow as grey (black no glow; white nothing hit). Live. 9 / 10 (2026-10-30, with CloudShadows): the clouds' transmittance at each pixel alone / the clouds' shadow map as the trace gets it, stretched over the screen (grey). 11 (2026-10-31, with Penumbra): each pixel's penumbra width as grey (black = sharp, white = PenumbraMaxRadius). 12: the penumbra pass' own output as a flat grey (a check that it runs). 13 / 14 (2026-10-31, with [Main.Main.RayTracing] DenoiseBackbone): newly seen pixels (white) / how far each pixel moved on screen since last frame (grey, white = 1 % of the screen or more).

[_Shaders.ShadowsExteriors.SunSmoothing]
SmoothSun = 1						 # Smooth the sun rotation by interpolating between positions.
QuantizeSun = 1						 # Quantize the sun rotation by making sure the sun moves in constant size increments, instead of constantly.
SmoothingFactor = 0.174			 # [0.0-1.0] Lower number means slower smoothing between positions, higher means more instantenous.
YawStepSize = 15.0					 # [0.0-15.0] Step size for changes in the horizontal rotation of the sun, angle in degrees.
PitchStepSize = 15.0				 # [0.0-15.0] Step size for changes in the vertical rotation of the sun, angle in degrees.
MaxJumpAngle = 5.0					 # [5.0-30.0] A maximum angle difference for which smoothing works, if higher the jump is instaneous. Required for time jumps / waiting.
GlideSeconds = 3.0                   # [0.0-10.0] UNOFFICIAL: real seconds each step of the sun slides over, instead of all sun shadows jumping at once about every in-game hour. Bigger jumps (waiting, sleeping, loading) stay instant. 0 = the original behaviour.
CrossFade = false                    # UNOFFICIAL, needs a game restart: instead of turning the shadows over GlideSeconds, fade from the old shadows to the new ones over that time, so shadow edges never crawl while the sun moves. Costs a second copy of the shadow maps in video memory (about 72 MB at the default CascadeResolution) and a little GPU time during each fade only. Needs ForwardShadows (the default).

