StrengthMultiplier = 1.0                # Global AO strength/darkness multiplier.

[_Shaders.AmbientOcclusion.GTAO]
Enabled = false                      # UNOFFICIAL (2026-10-16): ground-truth ambient occlusion (GTAO, Jimenez et al. 2016) instead of the old SSAO: open flat ground is no longer greyed, corners and creases darken by how closed they really are, no halo round things in front. Uses the same Range, strength and fade settings. Applies immediately
MaxRadius = 64.0                     # [4-256] Largest search radius on screen, in pixels (close up the Range would cover half the screen)

[_Shaders.AmbientOcclusion.Skylighting]
Enabled = false                        # UNOFFICIAL (2026-10-17, new): outdoors, the sky's light is taken away where something above blocks the sky: under roofs, porches, bridges, overhangs and at the foot of cliffs. Uses a top-down map of the world round you and needs the ambient occlusion or (UNOFFICIAL 2026-10-20) AmbientLight on. Version 2 takes away only the sky's share of the light, so sunlit spots keep their sunlight.
Version = 2                            # UNOFFICIAL 2026-10-17: 2 = the sky's share only, its own clean and rarely redrawn map, quarter resolution (about 0.1-0.2 ms); 1 = the first version (darkens through the ambient occlusion, whole pixel, map redrawn every 4th frame).
Strength = 1.0                         # [0.0-1.0] How much of the blocked sky light is taken away.
Distance = 800.0                       # [64-4000] How far (game units) to look for something above. Larger: big overhangs and cliffs count from further away; smaller: only close cover. (Version 1 was tuned at 600.)
ShareApply = true                      # Version 2: take away only the sky's share of the light (false: the whole pixel, as a comparison).
OpenThreshold = 0.85                   # [0.5-1.0] Version 2: a spot that sees at least this much of the sky counts as open (no change), so open ground next to buildings keeps its light. 1.0: every bit of blocked sky counts.
DepthNormals = false                   # Version 2: work out the surface's slope from the depth (false: from the normals buffer, which is wrong on some road meshes and ground stains).
OwnProjection = false                  # Version 2: draw its top-down map with its own straight-down projection round you (false: the rain map's projection).
AmbientScale = 1.0                     # [0-10] Version 2: how strong the sky light is against the sun when the sky's share is worked out. Higher: sunlit surfaces under partial cover darken more.
CleanMap = true                        # Version 2: the top-down map takes leaves and fences with their holes and leaves out see-through effects (dust devils, glass), which would block the sky over open ground.
MapRefresh = 60                        # [1-100000] Version 2: frames between redraws of the top-down map while you stand still (cells that stream in). It is also redrawn when you move MoveRefresh units.
MoveRefresh = 200.0                    # [1-100000] Version 2: how far (game units) you move before the top-down map is redrawn.
SoftWidth = 40.0                       # [1-500] Version 2: how soft (game units) the edge of cover is in the test (against hard steps).
DebugView = 0                          # [0-4] Version 2, test views: 1 sky visibility, 2 the sky's share of the light, 3 the final darkening, 4 'covered' (something above the point in the map). 0 = off.
Reflections = false                    # UNOFFICIAL (2026-10-19) Skylighting step 3: the sky's reflection also goes where the sky cannot be seen, so wet floors, puddles and shiny ground under roofs, porches and overhangs stop mirroring a bright sky (the Specular effect's sky reflection and the wet-ground reflections' sky). Needs Skylighting Version 2 on. Costs next to nothing. After Community Shaders' Skylighting (GPL-3.0).
MinReflection = 0.1                    # [0-1] (2026-10-19) How much of the sky's reflection stays where the sky is fully hidden (Community Shaders' default 0.1).
LightCap = 0.1                         # [0-10] UNOFFICIAL (2026-10-20): the most light Skylighting may take from a spot, in multiples of the sky's light (x Strength x how much of the sky is hidden), so lamp-lit walls and glowing signs and bulbs under a roof or canopy keep their own light (the sky can only take the light it gave). 0.1 keeps lamps and glow and changes nothing in daylight; 0 = no limit (before 2026-10-20: a wide canopy at dusk turned everything under it, the bulbs too, black). Applies immediately.
OpenSides = 1.0                        # [0-1] UNOFFICIAL (2026-10-20): under a canopy, porch roof or bridge the sky test cannot see the open air at its sides, so it counted every spot under a wide cover as seeing no sky at all. 1 = for such a spot the low sky counts as open wherever nothing taller than the spot stands at the test's reach (an open-sided canopy keeps its side light; a cliff or the house beside a porch still blocks). 0 = as before (stronger darkening under covers). Applies immediately.

[_Shaders.AmbientOcclusion.RT]
Enabled = false                        # UNOFFICIAL (2026-10-28, the DXVK fork, ray tracing): ambient occlusion and sky visibility from rays traced against the real scene instead of the screen: what is off screen, behind the first surface or thinner than it looks still darkens, and no light leaks through walls. Takes the place of the screen estimate of AmbientLight (or of this AO when AmbientLight is off) and of Skylighting's top-down map; the strength and fade settings stay theirs. Needs the DXVK fork's d3d9.dll with ray tracing, [Main.Main.Performance] NvrDxvkPasses on and a GPU with ray queries (AMD RDNA2+, NVIDIA RTX, Intel Arc); anywhere else it does nothing and the current AO runs (logged once). Applies immediately
RayCount = 2                           # [1-16] Rays per pixel (half resolution) and frame for the occlusion. More: less grain before the blur and history smooth it, cost grows with the count (2: as good as 4 after the smoothing, about 40 % cheaper). Applies immediately
Distance = 120.0                       # [8-1000] How far (game units, about 70 = 1 m) a ray looks for something that occludes. Longer: broader, softer occlusion (under cars, in rooms); shorter: contact shadows only, cheaper. Applies immediately
Sky = true                             # The sky visibility (Skylighting, which must be on) from rays too, instead of its top-down map: overhangs, bridges and the inside of buildings block the sky by their real shape. Applies immediately
SkyRays = 16                           # [8 or 16] Rays per pixel for the sky visibility (fixed directions round the normal: no grain, no flicker). 8: one ring, cheaper. Applies immediately
SkyInsideFix = true                    # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: a sky ray that starts just under the traced ground (a road or path drawn a little below the land, the depth a little off far away) hit that ground from underneath and took it for cover, so Skylighting with RT AO darkened whole roads and paths with hard straight edges (the RT AO's own rays already passed such a hit, so RT AO alone looked right). On: the ray carries on past it. Off: as before.
GIAmbientUnits = true                 # UNOFFICIAL (2026-11-11), BUG FIX, applies immediately: the bounce hits' ambient (GIAmbient, GISky) is now scaled by the game's ambient scale (PBR AmbientScale), as the game's lit shaders do and as the sun already was (with GIGameLamps on). Unscaled, the ambient and sky share at a hit was off by that factor. Off: as before.
SkySoftEdges = true                    # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: cover near the end of a sky ray counts less and less (as the AO rays' cover does), and the ray-traced sky factor fades out over the last quarter before 8000 units instead of stopping there, so Skylighting with RT AO draws no hard line at SkyDistance from walls, cliffs and banks, or at 8000 units. A little lighter in places. Off: as before.
RtFarFade = true                       # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: the rays are traced out to 8000 units only, but AmbientLight kept the traced occlusion and the RT GI bounce light on out to its own DrawDistance, so with DrawDistance above 8000 (or a high GIStrength) they stopped dead at 8000 units: a hard line across the ground, worst where the bounce light is strong against DarkestOcclusion. On: both fade out between 6000 and 8000 units. Off: as before.
SkyDistance = 800.0                    # [64-8000] How far (game units) a sky ray looks for cover (Skylighting's Distance). Applies immediately
DebugView = 0                          # Test views: 1 the ray-traced visibility alone, before strength (through AmbientLight's occlusion view, or as this AO); 2 the ray-traced sky visibility (through Skylighting's view 1); 3 black where rays began inside something (depth and scene disagree), else grey by the mean hit distance; 4 and 5 (test only) the rays' input: view distance / 2000 and the normal's up component (white up, black down, grey sideways); 6 the bounce light alone (GI on); 7 the same with every bounce hit lit as if off screen (shows RadianceCache's whole share); 8 (2026-11-09, test only) the tangent frame the AO and GI rays' directions are built in: white = flat normals (n.z 0.999 or more), grey = tilted ones, the shade = the angle of their tangent (through AmbientLight's occlusion view; set DarkestOcclusion to 0 to see it plainly): two regions of another shade are two frames. 0 = off.

GI = false                             # UNOFFICIAL (2026-10-29, ray tracing, needs Enabled above and AmbientLight): one bounce of light from what is really around a spot, on screen or not: a sunlit wall tints the shaded ground beside it, a lamp-lit floor lights the underside of a table. One ray per pixel (half resolution) and frame, smoothed over frames by AmbientLight. Applies immediately
GIDistance = 1500.0                    # [100-8000] How far (game units) a bounce ray looks for a surface that sends light back. Applies immediately
GIStrength = 1.0                       # [0-20] How much bounce light is added (x the surface's own colour), as ComputeGIStrength. Applies immediately
GIOffscreen = 1.0                      # [0-1] The light of bounce rays' surfaces, worked out from the sun and the lamps, times this (1 = in the same units as the reference path tracer, checked 2026-11-03: docs/next/RT-PATH-TRACING.md section 17; was 0.1, set against the old screen-space GI, which made most of the bounce 10 times too dark). With GIScreenLight on it scales only the hits off screen. Applies immediately
GIScreenLight = false                  # UNOFFICIAL (2026-11-03) On: bounce rays that hit something on screen take the light the game drew there (the old way). It is not in the bounce's units: it also carries the game's ambient light (a second copy indoors: 15 times the real bounce in Lucky 38) and outdoors only about half the sun's bounce. Off (default): every hit's light is worked out from the sun and the lamps. Applies immediately
GIGameLamps = true                     # UNOFFICIAL (2026-11-03) The bounce rays' surfaces are lit by the game's own lamps: the lamps the game lights the frame with (its lamp table), their reach, colour and falloff (the reference path tracer's PTGameLamps 4 matches the game's direct lamp light this way: docs/next/RT-PATH-TRACING.md section 21). Off = the older lamp list and falloff (dimmer over most of a lamp's reach). Needs LightCommonLamps (on by default). Applies immediately.
GIClamp = 1.0                          # [0.05-4] The brightest one bounce ray may bring back (luminance, 1 = white in the game's frame): a ray that lands on a lamp's glow otherwise lights one pixel far more than its neighbours (flickering specks). Lower: calmer, but bright surfaces bounce less. Applies immediately
Denoise = true                         # The ray-traced occlusion through the shared RT denoiser (a temporal pass and three edge-aware smoothing passes, as the RT sun shadows use) before the occlusion is applied: calm from few rays. Off: the raw rays (AmbientLight's own blur and history still smooth them). Applies immediately
Interleave = 1                         # 1, 2 or 4: trace every pixel each frame, or every 2nd (a checkerboard), or every 4th (one of each 2 x 2, in turn); the others keep their last result and the smoothing over frames blends them. 2 or 4 cut the ray cost by about half or three quarters; when you turn fast the shading catches up over a few frames. Applies immediately
AOAlpha = 1                            # 0, 1 or 2: alpha-tested meshes (leaves, fences, signs) for the occlusion rays: 0 left out, 1 solid (cheap: a leaf card occludes whole), 2 tested against their texture's alpha (exact, about 3x the occlusion cost). Needs [Main.Main.RayTracing] AlphaTested; applies immediately
DenoiseKernel = 3                      # 3 or 5: the smoothing filter's size (3 is about 2.5x cheaper, a little less smooth). Applies immediately
GlowGI = 0.0                           # 0-4: glowing surfaces (neon signs, lit windows, lamp globes, screens) light their surroundings through the bounce light, with their own colour, this strong; also when they are off screen. 0 = off. Needs GI; best with [Main.Main.RayTracing] HitTextures. Applies immediately
GlowDirect = 0.0                       # 0-8: glowing objects (neon signs, lit windows, lamp globes, screens) light nearby floors and walls directly in their own colour, with soft shadows (the 32 strongest in view of the camera, one picked per pixel). 0 = off. Needs GI with GIReuse above 0. Applies immediately
GISpatial = 0                          # 0-4: with GIReuse, also merge this many neighbouring pixels' bounce samples (ReSTIR's spatial step): less noise, no extra rays; may leak a little light into contact shadows. Applies immediately
GIReuse = 8                            # 0-32: the bounce light reuses good samples from earlier frames on the same surface (ReSTIR GI), at most this many frames back: much less noise for the same rays; a light switched off fades over that many frames. 0 = no reuse (the old way). With GIInterleave 4 it is cheaper than full-rate GI and clean in motion (the old way smears there). Applies immediately
GIInterleave = 1                       # 1, 2 or 4: the bounce rays (GI) in every, every 2nd or every 4th block of pixels each frame, in turn (on top of Interleave); the others keep their last bounce light, which the smoothing blends. The bounce rays are about two thirds of the ray tracing's cost. Applies immediately
GIAmbient = 0.0                        # [0-1] How much of the ambient light a bounce ray's surface sends back too (0: only the sun and the lamps it gets: the game's ambient already stands for the indirect light; 1 brightened Lucky 38 by about 25 %). Applies immediately
GISky = 0.0                            # [0-1] UNOFFICIAL (2026-11-10) Outdoors, a bounce ray that finds nothing within GIDistance brings back the sky's light (the game's ambient colour, full for rays above the horizon, none below it), times this. Then open ground, roofs and the tops of rocks get bounce light too and GIStrength brightens them; ground beside walls, rocks and under overhangs gets less, as their rays meet those instead of the sky. 0 (default) = as before: a ray that finds nothing brings back nothing (the game's ambient already stands for the sky's light, so this adds a second copy of it, and GIStrength multiplies it too: keep GISky x GIStrength at about 0.5 or less; start with 0.1). Needs GI. Applies immediately
RadianceCache = false                  # UNOFFICIAL (2026-10-31, ray tracing, needs GI and GIReuse above): light that bounces more than once. A grid of light cells round you (32 x 32 x 16, fixed in the world) keeps what light reaches each spot after one, two, three... bounces (each cell traces rays to what it sees, lit by the sun, the lamps and the grid itself); bounce rays that hit something off screen add it, so a room lit from behind you or a corner two bounces from the sun is no longer black. Applies immediately
CacheStrength = 1.0                    # [0-2] How much of the grid's light a bounce ray's surface sends back. Applies immediately
CacheCellSize = 128.0                  # [32-512] Size of one grid cell in game units (128: about 1.8 m; the grid covers 32 x 32 x 16 cells round you). Smaller: finer, shorter reach. Applies immediately
CacheRays = 8                          # [1-32] Rays a cell traces when it is updated (1 in CacheSpread cells each frame). More: less flicker in the cells, more cost. Applies immediately
CacheFrames = 16                       # [1-32] How many updates a cell's light averages at most (more: steadier; fewer: follows a lamp switched on or off sooner). Applies immediately Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
CacheExteriors = false                 # [true/false] UNOFFICIAL (2026-10-31): the radiance cache outdoors too. Off = interiors only (outdoors most bounce rays land on screen, where the lit frame already holds the light, and the cache cost 7.8 ms a frame on an iGPU in Goodsprings). Applies immediately
CacheSpread = 8                        # [1, 2, 4, 8, 16, 32] Updates 1 in this many cells a frame (indoors). Higher: cheaper, slower to follow a lamp switched on or off. Applies immediately
CacheRaysExterior = 4                  # [1-32] CacheRays outdoors (with CacheExteriors). Applies immediately
CacheSpreadExterior = 8                # [1, 2, 4, 8, 16, 32] CacheSpread outdoors (with CacheExteriors). Applies immediately
CacheVisibility = true                 # [true/false] UNOFFICIAL (2026-11-12, sun-GI phase 3, needs RadianceCache): the light grid stops leaking through thin walls. Each cell also remembers how far its rays travelled in six directions, and a bounce ray's surface weighs the eight cells round it by whether they can see it (DDGI's visibility test), so a lit room next door no longer lights this one through the wall. Costs a few more texture reads per lookup. Applies immediately (the grid starts over)
CacheCascades = 2                      # [1-2] UNOFFICIAL (2026-11-12, sun-GI phase 3, needs RadianceCache): 2 adds a second grid four times as coarse (the same 32 x 32 x 16 cells, 4 x CacheCellSize), updated 1 in 2 x CacheSpread cells a frame, for open areas and far hits: the fine grid is used where you are and fades out over its outer 2 cells. 1 = the single fine grid as before. Applies immediately (the grid starts over)
SkyMissSH = true                       # [true/false] UNOFFICIAL (2026-11-12, sun-GI phase 3, only where a missed bounce ray brings sky light: GISky above 0 or AmbientLight's AmbientReplace): the sky light a ray that finds nothing brings back comes from the sky's own harmonics in the ray's direction (bluer overhead, paler and warmer toward the horizon, none below it) instead of one flat ambient colour; the light grid's rays use it too. Off = the flat ambient as before. Applies immediately
GIMovingHistory = 4                    # 0-16, with [Main.Main.RayTracing] DenoiseBackbone on: the bounce light's smoothing over frames keeps at most this many frames on people and things that move themselves (a walking NPC: the bounce light on it changes as it walks, and 16 frames of it trail behind). 0 = no limit. Applies immediately Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
GIReuseSpread = true                   # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: with GIReuse, a bounce sample carried over from the last frame onto ground you are now closer to (running forward, turning) is shared by several pixels; each copy now keeps only its share of the sample's weight, so the copies do not all hold on to it for GIReuse frames. Off: dark and light streaks fanned out along the way you move (as before).
GIReuseShuffle = true                  # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: with GIReuse, last frame's bounce sample is taken from a pixel next to the matching one, shuffled each frame (every pixel still used once), so samples copied side by side part ways next frame: fine noise the smoothing removes instead of streaks. Off: as before.
GIDenoiseAntiLag = 3.0                 # UNOFFICIAL (2026-11-08) [0.0-16.0], applies immediately: the bounce light's smoothing over frames keeps a fast 4-frame history beside its long one; where the long one drifts outside the fast one's range by this many standard errors (a shadow moved, you turned onto something new), the light really changed and the history restarts short, so trails clear in a few frames (as the path tracer's PTDenoiseAntiLag). Lower: quicker, a little noisier. 0 = off (as before).
GIDenoiseSunGI = true                  # [true/false] UNOFFICIAL (2026-11-12, sun-GI phase 4), applies immediately, only while Ambient light's SunGI is on and you are outdoors: the bounce light's denoiser (the one smoothing over frames) runs with its history clipped to the new frame's local range (1.5 deviations, so a moved light or a turn leaves no old bounce behind), a 5 x 5 kernel with 3 passes (outdoor bounce light is low frequency; the 3 x 3 kernel left noise), the game's lit frame and albedo buffer as an edge guide (the path tracer's PTDenoiseGuide, sigma 0.5; when the albedo buffer holds this frame's and Render scale is 1), and object motion when [Main.Main.Quality] ObjectMotion is on. GIDenoiseAntiLag and GIMovingHistory stay as set. false: the old denoiser settings with SunGI on, for comparing.
GIDenoiseTune = 2                      # [0-2] UNOFFICIAL (2026-11-13, RT GI review R9 / R10), applies immediately, with SunGI outdoors: 1 = settled bounce light is smoothed less than fresh (crisper), newly seen pixels are smoothed by shape only (no speckles); 2 = and the 3 x 3 history clamp is off (the anti-lag does that job; less noise while turning). 0 = the settings before.
GISamplePoints = false                 # [true/false] UNOFFICIAL (2026-11-13, RT GI review B3), applies immediately, needs GIReuse: the bounce light's reuse also remembers WHERE each kept sample's light comes from. Neighbours' samples are then checked against this surface (its angle, its distance, one visibility ray), so bounce light no longer spreads sideways through walls and indirect shadows stay. A little more GPU time (one more ray on some pixels).
GIScreenAmbientOut = false             # [true/false] UNOFFICIAL (2026-11-13, RT GI review B6), applies immediately, with GIScreenLight and SunGI outdoors: surfaces on screen that bounce light no longer send their share of the game's flat ambient light on (it is unoccluded, and SunGI takes that ambient out of the picture elsewhere); they send the radiance cache's light instead, as surfaces off screen do. The bounce then no longer changes when a lit surface leaves the screen. It lowers the bounce a little (more under an overcast sky).
GIValidate = true                      # [true/false] UNOFFICIAL (2026-11-13, RT GI review B3), applies immediately, with GISamplePoints: each frame 1 pixel in 8 re-checks that its kept sample is still reachable (a door closed, a person walked in between) and drops its history if not.
SampleLockFix = true                   # UNOFFICIAL (2026-11-09), BUG FIX, applies immediately: the AO and GI rays' two sample numbers were locked together, so every pixel's ray came from one spiral of directions that turned 0.14 of a turn each frame: the bounce light pulsed every 7.3 frames (about 8 times a second) and showed a screen-fixed diagonal step where the surface normals' tangent frame changes. On: independent numbers. Off: the old ones, to compare.
NormalGuard = true                     # UNOFFICIAL (2026-11-09), BUG FIX, applies immediately: the ray-traced occlusion and bounce light read each pixel's surface direction without a texture sampler, and a pixel whose entry is still not a real direction gets one rebuilt from the depth picture. On one tester's graphics driver the old read came back blank on every pixel: all rays started from one wrong direction, which showed as a screen-fixed 45-degree triangle in the bounce light and as dark trails when moving. false = the old read (for comparing).
GIStrengthNight = -1.0                 # [-1-20] UNOFFICIAL (2026-11-10), applies immediately: outdoors at night GIStrength becomes this (blended over dusk and dawn, as the game's own day/night change). -1 = no night value: GIStrength all day (as before). Indoors: GIStrength
GISkyNight = -1.0                      # [-1-1] UNOFFICIAL (2026-11-10), applies immediately: the same for GISky. -1 = GISky all day (as before)
GIStrengthInterior = -1.0              # [-1-20] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIStrength. -1 = the same value indoors and out (as before)
GIAmbientInterior = -1.0               # [-1-1] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIAmbient. -1 = the same value indoors and out (as before)
GIClampInterior = -1.0                 # [-1-4] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIClamp. -1 = the same value indoors and out (as before)
GIDistanceInterior = -1.0              # [-1-8000] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIDistance. -1 = the same value indoors and out (as before)
GlowGIInterior = -1.0                  # [-1-4] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GlowGI. -1 = the same value indoors and out (as before)
GlowDirectInterior = -1.0              # [-1-8] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GlowDirect. -1 = the same value indoors and out (as before)
LegacyTiltInterior = -1.0              # [-1-1] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces LegacyTilt. -1 = the same value indoors and out (as before)
LegacyTilt = 0.0                       # [0-1] UNOFFICIAL (2026-11-10), live, a LOOK option, off at 0: brings back the much darker ray-traced AO, sky light and bounce light that 1.0.6 gave on some NVIDIA drivers by mistake (every ray started from one fixed direction, left-down-toward the camera, instead of the surface's own normal), without the dark triangle that came with it. The value is how far each surface's normal is bent toward that direction: 0.5 is a clear darkening, 1 is the old picture exactly (the look then changes as you turn the camera, and dark trails behind moving things can come back). Not physically right at any value above 0.

[_Shaders.AmbientOcclusion.FastPaths]
Enabled = true                         # UNOFFICIAL (2026-10-17): the same ambient occlusion for less GPU time outdoors: sky and distant pixels really skip the occlusion samples and both blurs (the shader compiler had turned that early exit into work every pixel did). Off = the original passes. Applies immediately

[_Shaders.AmbientOcclusion.Status]
Enabled = true                          # Shadows based on object proximity/creases for more realistic light contribution.

[_Shaders.AmbientLight.Main]
Radius = 250.0                      # [10-1000] UNOFFICIAL: how far the occlusion and the bounce reach, in world units (about 70 = 1 m).
OcclusionStrength = 2.5             # [0-4] How dark creases, corners and the ground under things get.
DrawDistance = 6000.0               # [500-50000] Distance from the camera where the effect has faded out.
DarkestOcclusion = 0.25             # [0-1] The darkest the occlusion may make a pixel (as AmbientOcclusion's ClampStrength).
BrightnessFade = 0.7                # [0-4] Bright surfaces keep their light: the occlusion fades out above this brightness (as AmbientOcclusion's LumThreshold).
BlurRadius = 1.0                    # [0.5-4] Smoothing of the grain, in half-resolution pixels per step (x3 each way).
GridBounce = 0.0                    # [0-40] UNOFFICIAL, EXPERIMENTAL: the sun's bounce light from a 3D light grid round you (light propagation volume), outdoors in daylight. It is AmbientLight's bounce light: it does not depend on what is on screen, so it neither shimmers nor comes and goes as you turn; soft (room-sized) light. Indoors and at night it takes the light of lamps and neon seen on screen (GridScreenStrength). 0 = no bounce light (nothing extra drawn).
GridCellSize = 200.0                # [50-800] Size of one grid cell in world units (32 x 32 x 16 cells round you: 200 covers about 90 x 90 x 45 m). Smaller = finer but shorter reach.
GridSteps = 8                       # [1-16] How many cells the light spreads from what it bounces off.
GridSpread = 0.3                    # [0-0.6] How much light passes on from cell to cell each step.
GridScreenStrength = 6.0            # [0-40] Indoors and at night (no sun): how strongly the light surfaces show on screen (lamps, neon, fire) feeds the grid. It remembers what it saw, so the bounce stays when you turn away.
GridBlocking = 1.0                  # [0-4] How much walls and other surfaces stop the grid's light passing through them (0: light leaks through everything).
GridWallMemory = true               # UNOFFICIAL (2026-10-22): indoors and at night the grid also remembers the walls and floors it has seen on screen, so GridBlocking stops the light there too (before, it only knew surfaces outdoors in daylight, and a lit room's light crossed the wall into the next). Off = as before. Applies immediately.
GridLamps = 8.0                     # [0-40] UNOFFICIAL (2026-10-22): indoors and at night the game's lamps light the walls and floors the grid remembers (GridWallMemory), and that light bounces round the room: soft light pooling round lamps, stopped by walls. Before, the grid only had the light it saw on screen, which barely showed. 0 = off, as before. Applies immediately.
GridFine = true                     # UNOFFICIAL (2026-10-22): outdoors in daylight, a second, four times finer grid round you (about 16 x 16 x 8 m) for the sun's bounce light: light and shade the size of a door or a car near you instead of a room, fading into the coarse grid further out. Made from the same sun map (no extra drawing); off = the coarse grid alone, as before. Applies immediately.
GridColour = 0.25                   # [0-1] UNOFFICIAL (2026-10-18): how much of the colour of what lights the room the bounce light carries (1: all of it - a fire-lit room turns orange; 0: white light). Applies immediately.
InteriorBalance = true              # UNOFFICIAL (2026-10-18): indoors the room keeps its own brightness: the occlusion darkens only the ambient light (not the lamps' light), and the bounce gives back at most the light the occlusion takes (InteriorBounceShare), so light moves from creases to the surfaces next to lit ones instead of lifting the whole room. Off = as P81 (the bounce added on top of the room's own ambient: interiors much brighter). Outdoors it changes nothing. Applies immediately.
AlbedoBuffer = true                 # UNOFFICIAL (2026-10-31; ON by default since 2026-11-09), live, needs [Main.Main.Quality] AlbedoBuffer on at startup (it is, by default): the bounce light (RT GI, the light grid) is multiplied by the surfaces' own base colour where the mod's shaders wrote it (TESR_AlbedoBuffer) instead of a colour guessed from the lit picture (everywhere else the guess stays: the game's own shaders, skin without the screen-space skin blur). Why on: the guess is the lit colour itself, so in a lamp-lit or tinted room the light's colour was applied twice and dark surfaces were lifted as if bright (bench, a red-lit casino floor at GIStrength 4: 2.8 x brighter and redder with the guess, 1.1 x with this on; the "deep fried" tester report). With the DXVK fork's Vulkan AmbientLight passes (NvrDxvkAmbientLight, off by default) the Apply and balance passes then run as D3D9 passes. Changes the image only where AmbientLight's bounce is on (RT GI, GridBounce / GridScreenStrength): shadowed corners take the colour of the surface itself. Off: the colour guessed from the lit picture, as before.
AlbedoFallbackCap = 0.12            # [0-1] UNOFFICIAL (2026-11-10), BUG FIX (seen on an RTX-class card: saturated patches of a fire's colour on plants beside it with the cap off, none with it), live, with AlbedoBuffer above: the bounce light on surfaces the buffer has no colour for (grass, and anything drawn by a shader that is not this mod's). Those pixels take a colour guessed from the lit picture; the guess used to go up to 0.6 while real surfaces in this game are 0.05-0.15, so the bounce (RT GI, the light grid) was several times stronger on grass than on the ground next to it, and tinted by the light. The guess is now capped at this level. 0 = the old 0.6. Raise it if grass looks too dark under bounce light.
InteriorBounceShare = 1.0           # [0-4] UNOFFICIAL (2026-10-18): with InteriorBalance, how much of the light the occlusion takes the bounce may give back indoors (1 = the room's average brightness stays as without AmbientLight; 0.5 = a little darker; above 1 = brighter, at most what GridBounce gives). Applies immediately.
ExteriorBalance = true             # UNOFFICIAL (2026-11-11, sun-GI study F4): outdoors the occlusion now darkens only the ambient share of a pixel (albedo x the sky's ambient, as InteriorBalance does indoors), not the direct sunlight: before it multiplied the whole lit pixel, so sunlit ground and walls went dark in creases and under overhangs. Off = as before (lit x occlusion). Applies immediately. Needs AlbedoBuffer for a real surface colour; otherwise the colour is SurfaceColour's guess.
GISingleHistory = true             # UNOFFICIAL (2026-11-11, sun-GI study F7): when the RT bounce light has already been through the RT denoiser (its own 16-frame history), AmbientLight's accumulate no longer adds a second 0.9 history on top of the bounce (the occlusion keeps its history): about a third of the bounce lag and ghosting gone. Off = as before (both histories). Applies immediately.
GIGrassBlur = true                 # [true/false] UNOFFICIAL (2026-11-13), applies immediately: RT bounce light on grass and bushes is smoothed by Ambient light's own blur again (blades each sit at their own depth, so the RT denoiser cannot average them and the bounce sparkled there). Solid surfaces keep the sharp, unblurred bounce. false = no extra smoothing anywhere.
AmbientReplace = 0.0              # [0-1] UNOFFICIAL (2026-11-11, sun-GI study phase 2): outdoors, with the RT bounce light on (Shaders.AmbientOcclusion.RT GI), take this share of the game's own ambient (flat sky-plus-bounce light, as the occlusion sees it) out of every pixel and let the bounce light put it back: rays that reach the open sky now bring the full sky light, so the bounce light replaces the ambient instead of adding to it (before, turning the bounce up just lifted everything). 0 = off, exactly the old picture; 1 = fully replaced (never below AmbientFloor). Start around 0.5-0.8 and raise Bounce light strength if the shade looks dark. Applies immediately. Ignores Bounce light on open ground (GISky) while on.
AmbientFloor = 0.15                 # [0-1] UNOFFICIAL (2026-11-11, sun-GI study phase 2): with AmbientReplace, the least share of the game's ambient light that always stays (and is darkened by the occlusion as usual), so shade never goes black where the bounce light finds little. Applies immediately.
SunGI = false                       # [true/false] UNOFFICIAL (2026-11-12, sun-GI phase 4): ONE switch for the exterior sun bounce (before: Ambient light on + Ambient occlusion RT Enabled + GI + Sky + RadianceCache + CacheExteriors + AlbedoBuffer + AmbientReplace, in three sections). On, OUTDOORS only, in memory (the toml is not written): Ambient light's own Status switch counts as on, the ray-traced occlusion, bounce light, sky visibility, radiance cache and CacheExteriors are on, ExteriorBalance is on, AlbedoBuffer (this section's key) is on, and AmbientReplace is its key if above 0, else 0.8; your strength and quality keys (GIStrength, GIDistance, RayCount, ...) are left alone. The bounce light's denoiser also gets sharper, steadier settings (Shaders.AmbientOcclusion.RT GIDenoiseSunGI). Without the ray-tracing core (native D3D9, stock DXVK, a GPU without ray tracing) there is no AmbientReplace and the light grid is the sun bounce instead: GridBounce is its key if above 0, else 1.0 (with the ray-traced bounce running GridBounce stays your own value, so the two do not add). Indoors nothing changes at all: every key is yours and Ambient light does not render there unless you switched it on yourself. Needs [Main.Main.Quality] AlbedoBuffer on at start (a restart key) for the bounce to use the surfaces' real colours; the log says when it is off. Applies immediately. Off: exactly the old picture.
NoEdgeOutline = true                # UNOFFICIAL (2026-10-21): no thin light outline round things. The rule that keeps the occlusion from shimmering on grass took the edge of every object for grass, so a line round every character, table and booth kept only a quarter of its darkening (most visible in dim rooms). On: only depth that is busy over several pixels (grass, bushes) counts, the same picture everywhere else. Off = the old look. Applies immediately.
EdgeReject = true                    # UNOFFICIAL (2026-11-01), BUG FIX, applies immediately: when the occlusion (worked out at half resolution) is scaled up to the screen, a sample at another depth (across an object's edge) now counts nothing instead of a little less, so the ground's darkening no longer bleeds into grass and thin objects and back (blocks on grass and a dark wedge beside it, worst with FSR / DLSS at a low RenderScale). Off: as before.
TemporalJitterFix = true             # UNOFFICIAL (2026-11-01), BUG FIX, applies immediately, with Temporal: TAA / FSR / DLSS draw every frame shifted by a fraction of a pixel (up to three screen pixels at RenderScale 0.33), and the occlusion kept from last frame was read back without that shift, so while you move it smeared into streaks (most visible at dawn, with long shadows). On: it is read where the shift puts it. Off: as before.
MinReach = true                      # UNOFFICIAL (2026-11-01), BUG FIX, applies immediately: the occlusion's nearest samples are kept at least two samples' width from the point they test. Past some distance they fell back on to the point itself, which counts as a wall, and the ground darkened itself from that distance on: a ring round you, close by and visible with FSR / DLSS LowResEffects at a low RenderScale (three times closer at 0.33). Off: as before. (2026-11-08: the DXVK fork's AmbientLight passes, used at RenderScale 1 with NvrDxvkAmbientLight, do it too; before they kept the old reads, which darkened far ground.)
MinReachTexels = 0.75                # [0-8] UNOFFICIAL (2026-11-02), BUG FIX, applies immediately, with MinReach: how many of the occlusion buffer's texels the nearest samples keep from the point they test. 2 (the first MinReach) left the ground lighter with FSR / DLSS below RenderScale 1 (colours looked washed out: the short creases lost their shade at the small frame's coarser texels); under 0.75 the samples fall back on their own texel and bright ground darkens. Measured best: 0.75.
LowScaleFullRes = true               # UNOFFICIAL (2026-11-01), NEEDS A RESTART: with FSR or DLSS at RenderScale 0.5 or less, AmbientLight works at the internal resolution itself instead of half of it (at 0.33 half of it is a sixth of the screen: 6 x 6 screen pixels a sample, which showed as blocks). Costs about what half resolution costs at RenderScale 0.7, plus graphics memory for full-size buffers. Restart after changing RenderScale. Off: half, as before.
SlimPrep = true                      # UNOFFICIAL (2026-11-09), needs a restart, SPEED: the effect's working texture that holds each pixel's depth and normal is stored in half the memory (it only ever held two numbers; the same precision). Every later step reads it many times, so this is less work for the graphics card, most on older cards. The picture is the same. Not used with AmbientLightSmoothCompute. false = the old, larger format, to compare.
NormalSmoothing = 36                # [0-64] UNOFFICIAL (2026-10-21): the surface direction the occlusion and Skylighting work from is rebuilt from the depth buffer, so every triangle of a low-poly rock gets one flat direction and the darkening cut off hard along its edges (one face dark, the next light; at night with Skylighting whole faces went black). The direction is averaged over the half-resolution pixels this far round each one (3 taps each side along x, then along y), only where they lie on the same surface: object edges and real corners keep theirs. 0 = off, as before. Applies immediately.
NormalSmoothingWorld = 0.0           # [0-64] UNOFFICIAL (2026-10-24), OPTIONAL, live (not the cause of the 2026-10-24 facets; 8 is a sensible value): the same smoothing, at least this many world units wide (about 70 = 1 m). NormalSmoothing is in screen pixels, so close to the camera, where a character's triangles are hundreds of pixels across, it covered only a thin band at each edge and the faces stayed flat with hard edges (indoors above all, where this effect shades the ambient light characters are lit by). 8 spans a couple of a character's triangles at any distance; small creases keep their own occlusion (it comes from the depth, not the direction). 0 = pixels only, as before.
HorizonBias = 0.0                   # [0-45] UNOFFICIAL (2026-10-21): degrees a neighbouring surface must rise above a pixel's own before it counts as hiding the sky (HBAO's angle bias). Measured no help on the rock faces (it only lightens creases a little), so off; try 10-15 for softer shallow creases. Applies immediately.
HiZ = 0                            # [0-6] RETIRED 2026-10-26, does nothing (measured no win). UNOFFICIAL (2026-10-26), needs the DXVK fork and NvrDxvkPasses (does nothing on native D3D9 or stock DXVK): the far occlusion samples read a coarse level of the shared depth pyramid (Hi-Z, built once a frame in one compute pass) instead of the half-resolution buffer, so neighbouring pixels share a few cached texels. A sample at least 2^(HiZ+1) half-resolution pixels away reads the coarse level (3: 16 pixels and more). Slightly darker far creases (the coarse level keeps the nearest depth). 0: off (as before). Applies immediately.
Temporal = true                     # UNOFFICIAL: keeps the occlusion from frame to frame (moved with the camera) and turns its sample pattern every frame, so its grain averages out instead of crawling. Off: each frame on its own.
ComputeGI = false                   # UNOFFICIAL (2026-10-27), EXPERIMENTAL, needs the DXVK fork with [Main.Main.Performance] NvrDxvkPasses on (does nothing on native D3D9 or stock DXVK): the occlusion's own search also gathers one bounce of light from what is on screen (screen-space GI, "visibility bitmask"): a lit wall tints the floor and corners next to it, a sunlit ground lights the shaded side of rocks and posts. The occlusion itself stays as it is. Adds to the light grid (GridBounce), which keeps the light from what is off screen. Off = exactly as before. Applies immediately.
ComputeGIStrength = 1.0             # [0-20] UNOFFICIAL (2026-10-27), with ComputeGI: how much of the bounced light is added (1 = one physical bounce off what is on screen; 0 = none: at ComputeGIQuality 0 the same picture as ComputeGI off, for comparing the cost). Applies immediately.
ComputeGIThickness = 100.0          # [5-500] UNOFFICIAL (2026-10-27), with ComputeGI: how thick things are taken to be, in world units (about 70 = 1 m): a surface in front gives its light (and, with ComputeGIThinOcclusion, its shade) only for what lies within this depth behind it, so a thin post in front of a lit wall does not hide the wall's light. Smaller = thin things block less, but walls seen at a slant let more through. Applies immediately.
ComputeGIThinOcclusion = false      # UNOFFICIAL (2026-10-27), with ComputeGI, EXPERIMENTAL: the occlusion from the same thickness rule too, so thin things (poles, chair legs, railings) no longer darken everything behind them (no dark halo round them). Off = the occlusion exactly as AmbientLight's own. Applies immediately.
ComputeGIQuality = 0                # [0-2] UNOFFICIAL (2026-10-27), with ComputeGI: how many samples each pixel takes (for the occlusion and the bounce light alike): 0 = 16 (AmbientLight's own), 1 = 36, 2 = 64. More = smoother, steadier bounce light and occlusion, but the cost grows faster than the samples (Lucky 38, 1080p, whole effect: about +0.25 ms at 0, +1.9 at 1, +3.5 at 2; F10 'Ambient light estimate (half)'): keep 0. Applies immediately.
ComputeGITest = 0                   # [0-2] UNOFFICIAL (2026-10-27), TEST ONLY: 1 = ComputeGI's estimate pass alone (AmbientLight's own accumulate and apply after it), 2 = its estimate and accumulate (AmbientLight's own apply). With ComputeGIStrength 0 each must give the picture of ComputeGI off. 0 = normal.
DebugView = 0                       # [0-13] 7: the light grid's bounce alone. 0 off, 1 the occlusion alone (white open, black hidden), 2 the bounce light alone; 3-6 diagnostics (normal, depth, reach, raw values); 8 the grid's screen memory; 9 the grid's light before the surface colour; 10 the surface colour the bounce is multiplied by; 11 (2026-10-21) where the grass rule lifts the occlusion (white); 12 (2026-10-22) the walls the grid knows in each cell (red, green, blue: across east-west, north-south, up-down); 13 (2026-10-27, with ComputeGI running) ComputeGI's bounce light alone, as it arrives (x ComputeGIStrength, before the surface colour; without ComputeGI: as 12).

