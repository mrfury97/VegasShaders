[_Shaders.WetWorld.Main]
FastPaths = true                    # UNOFFICIAL (2026-10-17): the same rain picture for about 1 ms less GPU time (2560x1440): the wet pass's early exits (sky, distance, water, dry or roofed ground, your weapon), its puddle colour and its lamp loop really skip work (the shader compiler had turned them into work every pixel did). Measured: within the frame-to-frame rain flicker; the only place it can differ is the puddle reflection's rare screen-edge cases. Off = the original pass. Applies immediately
FixedReflectionTrace = false        # UNOFFICIAL (2026-10-17): fixes the puddle reflection (the screen-space trace of WetWorld). Its loop exits never worked on the GPU, so it kept the last hit it found at full strength, ran past the screen border and flipped under any recompile. Fixed: the first hit counts, rays that pass behind a thin object are no hit, and the reflection fades out towards the screen borders and with distance. Looks slightly different (softer, no border patches), so it is off by default. Costs about 0.1-0.2 ms in rain. Applies immediately
KeepHighlights = true               # UNOFFICIAL (2026-10-16): in rain the wet pass no longer cuts the picture at full white before the tonemapper (sun, bright sky and wet highlights keep their soft roll-off). Off = the old clamp. Applies immediately
Amount = 0.0                        # Darkness of puddles
Decrease = 0.0                      # Time it takes in game hours for puddles to dissipate
Increase = 0.0                      # Time it takes in game hours for puddles to appear
PuddleCoeff_B = 0.48                # Not used.
PuddleCoeff_G = 0.62                # Not used.
PuddleCoeff_R = 0.72                # Not used.
PuddleSpecularMultiplier = 0.2      # Not used.
Persistent = false                  # UNOFFICIAL (2026-10-27): wet ground and puddles are kept spot by spot in a map round you, instead of one amount for the whole world. The rain wets only what it reaches (ground under a roof stays dry), and after the rain each spot dries on its own: sunlit ground first, shaded ground and everything at night more slowly, so the street you left wet is still wet when you look back. Off = as before (puddles and wet ground vanish as the rain stops). Costs about 0.05 ms a frame on average for the map, and the wet pass keeps running until the last wet spot has dried. Uses 32 MB of video memory. Applies immediately (the map starts from the current rain).
PersistentWetTime = 0.25            # [0-24] (Persistent) Game hours of rain for open ground to get fully wet. 0: at once.
PersistentDryTime = 1.5             # [0-48] (Persistent) Game hours for wet ground in full sun to dry after the rain. Shade and night take longer (PersistentShade).
PersistentPuddleFill = 0.5          # [0-24] (Persistent) Game hours of rain for the puddles to fill. 0: at once.
PersistentPuddleDry = 4.0           # [0-96] (Persistent) Game hours for puddles in full sun to dry up after the rain.
PersistentShade = 0.35              # [0.02-1] (Persistent) How fast shaded spots dry compared with sunlit ones (also everything at night): 0.35 = about three times slower; 1 = no difference. Shade is found from the heights of roofs, walls and trees round each spot, towards the sun.
PersistentMapSize = 8192            # [1024-65536] (Persistent wetness and snow) Width of the map round you in game units (8192 = about 117 m). Beyond it the single amount for open ground applies. Shared with SnowAccumulation's Persistent. Applies immediately (the map starts again).
PersistentMapResolution = 1024      # [128-4096] (Persistent wetness and snow) Texels across the map: 1024 at 8192 units = 8 units (about 11 cm) a texel, 32 MB of video memory (4x for 2048). Applies immediately (the map starts again).
PersistentDebugView = 0             # (Persistent wetness and snow) Test view. 1: the map drawn top-down in the top-left corner, north up, you at the red dot: grey = dry ground, blue = wet, cyan = puddle water, white = snow, brown = trodden snow, darker = in shade, dark lines = the height of the top surfaces it has seen (a line every 256 units), diagonal hatching = no height seen there yet (the spot follows the open-ground amounts), yellow = the map's edge, purple = the map holds nothing yet. 2: the map's wetness and snow painted over the world (red tint where the single amount applies). 0: off.

[_Shaders.WetWorld.Status]
Enabled = true                      # Water ripples on surfaces, and puddles based on physical terrain pockets during rainy weathers. 
[_Shaders.WetnessEffects.Status]
Enabled = false                     # UNOFFICIAL (2026-11-04), restart: Wetness Effects (from Physically-Based-Reloaded, after Community Shaders), in place of WetWorld's screen-space wet pass: in the rain surfaces darken and gain a glossy water film, puddles form on flat ground, drops ripple on the land, nothing gets wet under cover. Needs the sun cross-fade off ([Shaders.ShadowsExteriors.SunSmoothing] CrossFade). While on, WetWorld draws nothing (its rain tracking still drives the weapon drops, the persistent wet cover and PBR's rain).

[_Shaders.WetnessEffects.Main]
MaxRainWetness = 1.0                # [0.0-2.5] Rain Wetness: how wet surfaces open to the sky get in the rain (darker, with a glossy water film).
MaxPuddleWetness = 1.5              # [0.0-6.0] Puddle Wetness: how much the puddles on flat ground fill.
PuddleRadius = 1.0                  # [0.1-3.0] Puddle size.
PuddleMaxAngle = 0.95               # [0.6-1.0] How flat ground must be to hold a puddle (the up component of its normal).
PuddleMinWetness = 0.85             # [0.0-1.0] The wetness at which puddles start to form.
MinRainWetness = 0.65               # [0.0-0.9] The least a surface gets wet in the rain: walls and undersides, which the rain does not fall straight on.
WeatherTransitionSpeed = 3.0        # [0.2-8.0] How fast things get wet when the rain starts and dry after it stops (3: about 20 seconds; puddles take three times as long to dry).
HeightAwareness = 1.0               # [0.0-1.0] Terrain only: how much the land textures' height maps shape the wetness. Water runs off the ridges and gathers in the crevices, which fill with standing water first. 0 off.
CreviceFill = 0.5                   # [0.0-1.0] Terrain only: how high the standing water rises in the crevices at full wetness, as a height (0 the deepest point of a texture, 1 its highest). Higher floods more of the ground.
NormalAwareness = 0.5               # [0.0-1.0] Terrain only: how much the land textures' normal maps decide how wet each spot gets. The tops of bumps and stones soak like flat ground, their steep sides less, and puddles keep off rough patches. 0 goes by the ground's slope alone.

[_Shaders.WetnessEffects.Raindrops]
EnableRaindropFx = true             # Raindrop effects on the ground open to the sky near the camera (the terrain only, not objects).
EnableRipples = true                # Ripples: rings spreading where drops land on puddles and flat wet ground.
RaindropFxRange = 1000.0            # [0-4096] Raindrop effects up to this distance, in game units.
RaindropGridSize = 4.0              # [1-32] Raindrop spacing in game units: at most one drop per cell this size per interval.
RaindropInterval = 1.0              # [0.1-4.0] Seconds between drops in a cell.
RaindropChance = 1.0                # [0.0-1.0] Chance a cell gets a drop each interval, at full rain.
RippleStrength = 1.0                # [0.0-3.0] How strongly ripples bend the water's surface.
RippleRadius = 1.0                  # [0.1-2.0] How far a ripple spreads, in cells.
RippleBreadth = 0.5                 # [0.05-1.0] Width of a ripple's ring, in cells.
RippleLifetime = 0.5                # [0.05-4.0] How long a ripple lasts, in seconds.

[_Shaders.WetnessEffects.Debug]
WetnessOverride = -1.0              # [-1.0-1.0] Force the wetness, whatever the weather (for testing: vanilla New Vegas has almost no rain). -1 off.
PuddleOverride = -1.0               # [-1.0-1.0] Force the puddle wetness. -1 off.
RainOverride = -1.0                 # [-1.0-1.0] Force the rain intensity (ripples). -1 off.
ShowCover = false                   # Debug view of what counts as under cover: green open to the sky, red covered, yellow outside the top-down map (counted open), blue no map, dark blue land with no map slot.

[_Shaders.WetnessEffects.HudRaindrops]
Enabled = true                       # Raindrops on the first-person arms and weapon in the rain (after Screen Space Shaders' HUD raindrops), drawn in their own shaders so they stay on the surface: they magnify the surface under them and catch the light. They gather while you stand in the rain (not under cover) and dry off afterwards. UNOFFICIAL VegasShaders: restart to switch on (compiled into the object, parallax and skin shaders); not indoors with the lamps' shadows on. In place of Wet World's HudDrops.
AllObjects = true                    # Drops on every object out in the rain too (buildings, props, people; never the ground itself), not just your arms and weapon. Objects under cover stay dry (the top-down ortho map).
AnimSpeed = 1.0                      # [0-8] How fast the drops come and go while it rains (faster in heavy rain).
Darkness = 0.3                       # [0-1] How much a drop darkens the surface under it, as water soaking in. 0 leaves the colour as it is.
Density = 0.6                       # [0-1] How many drops gather at full wetness.
DebugView = 0                        # [0-1] 1 keeps the arms and weapon wet without rain, to try it out.
DropSize = 8.0                       # [0.5-64] The drop pattern's tile in game units: the biggest drops are about a fortieth of it across. Bigger gives bigger drops.
Gloss = 0.8                          # [0-1] How glossy the drops are.
Reflection = 2.5                     # [0-8] How strongly the drops tilt the surface's normal: their highlights and reflections.
Refraction = 1.0                     # [0-4] How strongly the drops bend and magnify the surface under them.
WetGloss = 0.3                       # [0-1] How much glossier the wet surface between the drops gets.
WetTime = 20.0                       # [0.5-600] Seconds in heavy rain for the arms and weapon to wet through (lighter rain takes longer), and for the drops to dry off again after the rain, under cover or indoors.

[_Shaders.WetnessEffects.Reflections]
Enabled = true                      # Screen-space reflections on the water film and puddles: wet ground and objects reflect what is around them on screen, not just the sky. Needs Wetness Effects on and [Shaders.PBR.Main] SkylightingMode 0.
Strength = 1.0                    # [0.0-2.0] How much of what wet surfaces reflect comes from the scene on screen instead of the sky.
MaxDistance = 1500.0                # [100-10000] How far a reflected ray looks, in game units. Longer finds farther things, at more cost per step.
Thickness = 30.0                    # [1-500] How far behind a surface on screen a ray may pass and still count as hitting it. Too low and thin things go missing; too high and reflections smear under objects.
Steps = 24                          # [4-64] Ray steps per wet pixel. More is finer and costs more.
RoughnessCutoff = 0.5               # [0.05-1.0] Water films rougher than this reflect only the sky (fading in from half of it). Puddles are the smoothest.
EdgeFade = 0.1                      # [0.01-0.5] Reflections fade out near the screen's edges, over this share of the screen, where what they show runs out.
MaxCameraDistance = 4000.0          # [500-50000] No screen-space reflections on wet surfaces farther than this from the camera.
DebugView = false                   # Shows the reflections alone.

[_Shaders.Puddles.Status]
Enabled = false                     # Puddles (2026-11-08, restart; needs [Shaders.WetnessEffects.Status] Enabled): rain puddles that fill where water would gather (low spots, the land's crevices, flat open ground), grow while it rains and shrink back from their edges after it stops, over game hours. Inside a puddle a flat, mirror-like water layer with rain ripples; a soaked ring round it; water running down walls in the rain. Mirrored by the reflections too (SSR, and RT with the Vulkan reflection passes).

[_Shaders.Puddles.Main]
Quality = 2                         # [0-3] 0 off (Wetness Effects' own puddles), 1 low (puddles, water layer), 2 medium (+ the land's crevices fill first, soaked rings, wall streaks, ripples on the land), 3 high (+ ripples on objects, finer puddle edges).
Coverage = 0.25                     # [0.0-1.0] Share of flat open ground under water when the puddles are full.
Size = 420.0                        # [32-8192] Size of the puddle pattern, in game units.
FillHours = 0.5                     # [0.01-48] Game hours of steady rain to fill the puddles (heavier rain fills faster).
DryHours = 3.0                      # [0.01-96] Game hours for full puddles to dry in sunshine. They shrink from the edges in.
NightDrying = 0.35                  # [0.0-1.0] How fast puddles dry at night or under cloud, as a share of the sunny speed.
Roughness = 0.03                    # [0.01-0.5] Roughness of the water's surface: low is a sharp mirror.
Darkening = 0.6                     # [0.0-2.0] How much deeper water darkens the ground under it.
EdgeSoftness = 0.05                 # [0.005-0.5] How soft a puddle's shore is.
SlopeStart = 0.92                   # [0.5-0.999] How flat ground must be for a puddle to start (the up component of its normal).
SlopeFull = 0.97                    # [0.5-1.0] How flat ground must be for a full puddle.
Cavity = 1.0                        # [0.0-2.0] How strongly the ground's own relief places the water: hollows, cracks and ruts fill first, bumps stay dry islands (the land's height maps, else the colour texture's dark detail; objects: the colour texture). 0 = the noise pattern alone.
WetRing = 0.12                      # [0.0-0.5] Width of the soaked, darker, glossy rim round each puddle (it wanders along the shore).
Ripples = 1.0                       # [0.0-2.0] Strength of the rain ripples on the puddles.
Streaks = 1.0                       # [0.0-2.0] Strength of the water running down walls in the rain. 0 off.
StreakWidth = 6.0                   # [1-64] Width of a streak lane, in game units.
StreakSpeed = 1.0                   # [0.0-8.0] How fast the water runs down the walls.
MapMode = true                      # Restart. The large-scale puddle terms (the field, the rim wander, the rain cover) in a world-space map built on the NVR DXVK extension (Compute\PuddleMap), so every surface gets the full puddles (no lean or dry fallbacks; 7-layer land gets its rain cover; its seventh layer's normal map is then flat). Without the extension: the in-shader path.
ObjectPuddles = false               # Standing water and soaked rims on objects too (road pieces, concrete slabs, rocks). Off: only the land gets puddles; objects keep the rain's dampness and wall streaks. Characters and the first-person model never get them.
ReflectionPuddles = true            # The reflection passes ([Shaders.Reflections], Vulkan: screen-space and ray-traced) mirror the puddles too, also after the rain.

[_Shaders.Puddles.Debug]
LevelOverride = -1.0                # [-1.0-1.0] Force the puddles' water level (for testing in dry weather). -1 off.
DebugView = 0                       # [0-5] 1 where it is wet (red puddles, green soaked rings, blue wall streaks), 2 the ripples, 3 the levels (red rain wetness, green the puddles' water level, blue rain falling), 4 the streaks' inputs (red open to the sky, green how steep the face is, blue the raw lanes), 5 the puddle map's terms in map mode (red its field, green this point against its top surface: 0.5 = on it, blue it holds data). 0 off.
