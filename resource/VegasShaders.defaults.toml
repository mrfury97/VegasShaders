AdaptExposure = 1.0                 # [0.0-1.0] UNOFFICIAL, with Mode 1 (eye adaptation): strength of the eye adaptation's auto-exposure indoors. 1 = full, 0 = off (the white balance can stay on).
AdaptWhiteBalance = 1.0                 # [0.0-1.0] UNOFFICIAL, with Mode 1 (eye adaptation): strength of the auto white balance toward daylight (D65) indoors: warm or blue light is partly neutralised, as a camera or the eye does. 0 = off.
