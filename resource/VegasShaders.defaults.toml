[_Shaders.Particles.Main]
Strength = 1.0                       # [0-1] UNOFFICIAL, optional: how much blood, smoke, dust and debris particles follow the lighting (0 = as the game draws them, unlit; 1 = fully lit).
SunShare = 0.6                       # How much of the sun a particle catches outdoors (they are thin and see the sun from all sides). Shaded particles get only the ambient and lamps.
SunPhase = 0.3                       # [-0.9-0.9] UNOFFICIAL 2026-11-09: how the sun on particles depends on where you look from (Henyey-Greenstein anisotropy). Above 0, smoke and dust glow toward the sun when it is behind them and read darker from the sun's side; the average over all directions stays SunShare's. 0 = the old even share (exactly the old shader path).
SoftScale = 0.25                     # UNOFFICIAL 2026-11-04 soft particles (after Vanilla Plus Particles): smoke, dust, blood and spark particle systems fade where they meet the ground, walls and objects behind them, over their own size times this, instead of cutting a hard line. 0 = off. Needs Enabled below on at startup.
MeshSoftScale = 0.25                 # The same for unlit effect meshes (glows, lamp cards, muzzle and impact flashes, the dust storm walls), over the mesh's bounding radius times this. Big meshes such as the dust storm fade over a long way: lower this if they look too faint near the ground. 0 = off.

[_Shaders.Particles.Status]
Enabled = false                      # UNOFFICIAL, optional: lights blood, smoke, dust and debris particles and the blood decals on characters by the ambient, the sun (through the sun shadows) and nearby lamps, so they no longer glow in the shade, at night or indoors. With SoftScale / MeshSoftScale above 0, every particle and unlit effect (muzzle flashes, fire, sparks, glows) also fades softly where it meets the scene. Off = exactly the game's own particle shaders.

[_Shaders.PBR.Main]
ReflectivityExterior = 1.0           # [0.0-3.0] UNOFFICIAL (2026-10-25), REFLECTIVITY OUTDOORS, applies immediately: how shiny and reflective surfaces look outdoors, all in one slider. Scales the highlights of the sun and lamps on objects and the land, what metal reflects of its surroundings, the game's "chrome" reflections on guns and glass, and the dry ground sheen and polished-floor reflections of Shaders > Reflections. 0: no shine at all; 0.5: half; 1: as before (default); 2: twice. Rain wetness, Wet World puddles and skin keep their own settings.
ReflectivityInterior = 1.0           # [0.0-3.0] UNOFFICIAL (2026-10-25), REFLECTIVITY INDOORS, applies immediately: the same in interiors (a quick fix for casino floors, tiles and counters that look too glossy or too dull). 1: as before (default).
HairHighlight = 1.0                  # [0.0-4.0] UNOFFICIAL (2026-11-01), applies immediately: how bright the hair's strand highlight (its shine) is. 1 = the game's own strength; lower for duller hair, 0 = none. The hair has its own shader: Reflectivity and Roughness above do not reach it.
HairHighlightGameLook = true         # UNOFFICIAL (2026-11-01), applies immediately: true = the hair's highlight is added the way the game adds it (from the game's light colours, after the linear lighting's encode), so hair shines as in the game. false = summed in linear light with the PBR light strength, as before: about twice as shiny on screen with linear lighting on.
VanillaBridge = true                 # UNOFFICIAL (2026-11-05), needs a restart (off: the object shaders exactly as before): object highlights from the sun and lamps keep the size and strength the game's own art gave them (the normal map's shininess mask and each mesh's glossiness), drawn with the PBR highlight instead of a generic roughness: authored glints on power armour, polished metal and lacquer come back; surfaces without authored shine look as before. Objects with an _rmaos material map follow the map. Diagnosis and idea from the PBR-Reloaded fork's author.
VanillaBridgeAmount = 1.0            # [0.0-1.0] UNOFFICIAL (2026-11-05), applies immediately, with VanillaBridge on: 1 = the highlights as the game's art made them; 0 = the old PBR highlights exactly (for comparing); between, a blend.
VanillaBridgeOverMaps = false        # UNOFFICIAL (2026-11-05), applies immediately, with VanillaBridge on: the game's own highlight data also decides the highlights of objects that have an _rmaos material map (the map then keeps only its occlusion and metal). Off: a map decides, as before. Worth trying with generated maps: they guess the roughness from the colour and know nothing of the game's glossiness, so power armour and polished metal with one keep the old flat sheen.
VanillaBridgeDielectricMax = 0.08   # [0.01-1.0] UNOFFICIAL BUG FIX (2026-11-06), needs a restart, with VanillaBridge on: the most a NON-METAL surface's highlight may reflect head-on when the game's own highlight data decides it. The bridge matches the game's peak, which for a wide highlight (low glossiness, common on rock, concrete, wood and plaster meshes) with a bright shine mask (or a normal map without one, which reads as full) came out near a metal's strength: cliffs and walls looked wet. Real non-metal surfaces reflect 2-8 %, so 0.08 keeps their highlights in that range; metal keeps the full authored strength (power armour glints unchanged), and sharp authored glints are below the cap anyway. 1 = no cap (as 1.0.5).
EnergySplit = false                  # UNOFFICIAL (2026-10-16), SHELVED (off): smooth surfaces seen at a low angle no longer send back more light than they receive (up to 8.9% too bright, white-furnace test). Correct, but invisible in game on every real surface tested (incl. the Ultra-Luxe floor), so off. Applies immediately. Has no effect while SmithCorrelated is 1 (that term does its own energy balance).
GameShaderEyes = true                # UNOFFICIAL (2026-10-27; 2026-11-09 the eye variant), applies immediately: eyeballs get their own lighting. Since 2026-11-09 (EyeShaderOld false): the ambient light plus the sun's and the lamps' light wrapped round the eyeball, no shadows (the head's and the eyelids' shadows turned the eyes black), no metal, the game's own eye shine on top; with linear lighting too. false = the mod's ordinary object lighting on the eyes, as before.
EyeShaderOld = false                 # UNOFFICIAL (2026-11-09), A/B, applies immediately, with GameShaderEyes on: true = the eyes as before 2026-11-09 (the game's own shaders while LinearScene is off; the mod's ordinary object shader while it is on, the default, which could turn them black). false = the eye variant.
GameShadersInMenus = true            # UNOFFICIAL (2026-11-09), BUG FIX, applies immediately: the character creation / face menu draws its head (hair, eyes, teeth, clothes) with the game's own shaders. The mod's shaders use the world's sun shadow, lamps and light levels, which do not belong to that menu's picture: it came out dark, with black eyes. The skin has had this rule since 2026-10-27. false = the mod's shaders there, as before.
UnlitShadowSkip = true               # UNOFFICIAL (2026-10-17), needs a restart: outdoors, objects skip the sun-shadow lookups on the parts that face away from the sun (the sun adds no light there, so the shadow cannot change them). Same picture; measured: lit objects -0.14 ms in the river city morning view, nothing to skip under a high sun. Off: the shaders exactly as before.
LampReachSkip = true                 # UNOFFICIAL (2026-10-17), needs a restart: objects lit by several lamps skip each lamp's lighting math on the pixels that lamp cannot reach (it adds nothing there). Same picture. Off: the shaders exactly as before.
DxvkLampBranches = true             # UNOFFICIAL (2026-10-25), needs a restart, only under DXVK (stock DXVK or the DXVK fork; does nothing on native D3D9): the shiny-object shaders that take up to 6 lamps skip, per pixel, the lamp slots the object does not use and the lamps that cannot reach it, including their shadow lookups. Native D3D9 refuses shaders that long (about 3,600 instructions), so there every slot is computed and multiplied by zero. Same picture; meant to make LampsInOnePass cheaper.
SmithCorrelated = 0                  # UNOFFICIAL (2026-10-18), needs a restart, a LOOK OPTION (0 off, 1 on): highlights on objects use the exact masking term of the microfacet model (height-correlated Smith, Heitz 2014; idea from the Physically-Based-Reloaded fork) instead of the game-friendly approximation, which dims highlights seen or lit at a low angle (up to 80% on smooth surfaces). On: brighter, more mirror-like highlights at low angles and on edges; the diffuse light gives up what the highlight gains, so nothing sends back more light than it receives. Measured (2026-10-18): lit highlights in a lamp-lit casino about 6% brighter (72% of the picture brighter by 1 level or more), sun glints on smooth rubble at noon; no new sparkles; the shaders are 0-3% FASTER on. 0: the shaders exactly as before. Any value other than 1 counts as off. While on, EnergySplit has no effect (this term does its own energy balance).
SmithCorrelatedTest = 1.0            # [0.0-1.0] No effect: it belonged to the SmithCorrelated = 2 test mode, which has been removed. Kept only so older config files still load.
MarkShadersFrom = 0                  # UNOFFICIAL 2026-10-22, test only: the object pixel shaders SLS<From>..SLS<To> draw flat magenta, to see which shader draws what. Both 0 = off.
MarkShadersTo = 0
MarkShadersVanilla = 0               # test only: 1 = the marked pixel shaders and the vertex shaders SLS<VsFrom>..SLS<VsTo> are the game's own instead of magenta; 3 = only those vertex shaders; 2 = save the game's lamp falloff texture once (NVR-attenuation-*.png in the log folder)
MarkShadersVsFrom = 0
MarkShadersVsTo = 0
MarkShadersFamily = 0                # test only: 0 the SLS shaders, 1 the parallax (PAR) ones, 2 every other pixel shader (From/To ignored, To must be above 0)
SpecularDistance = 100000.0          # UNOFFICIAL (2026-10-27), applies immediately: how far from the camera objects keep their full PBR shading (highlights, metal, shine), in game units (70 = 1 m). The game drops it beyond 2300 units (about 33 m, set by its Specularity Fade slider), so PBR switched off at that line on every shiny mesh, and at a different spot in first and third person (the line is measured from the camera). 100000 = everywhere objects are drawn. Lower it (say 6000) to save some graphics card time on far objects; 0 = the game's own distance.
SpecularFade = true                  # UNOFFICIAL, BUG FIX (2026-10-18), needs a restart: object highlights fade out with the game's own specular distance fade (as the game's shaders did) instead of vanishing at once where the game stops drawing them (2000-2300 units by default), and the diffuse light slides to the plain form there, so objects no longer pop as you walk towards or away from them. Changes the picture only in that distance band. Off: the shaders exactly as before.
FoldHighlights = true                # UNOFFICIAL, BUG FIX (2026-10-21), needs a restart (then live): shiny surfaces reached by 3 or more lamps (many floors and walls indoors) no longer look shinier than the same surface next to them with 2 lamps. The game draws those in several passes and adds each highlight on its own, which with linear lighting came out several times too strong (and without metal); now their highlights are drawn together with their lamps' light, the way the one-pass surfaces always were. Changes only those surfaces (their sheen comes down to match). Off: the shaders and passes exactly as before.
LampDistanceFix = true               # UNOFFICIAL, BUG FIX (2026-10-22), needs a restart: lamps light big flat surfaces again (rugs, floors, wall tiles, posters, walls). Objects lit by 2 or 3 lamps worked each lamp's falloff out at the corners of each triangle and blended it across, which on a big triangle with the lamp over its middle left almost no lamp light (the Prospector saloon's rug 3-4x darker than the game's). Now worked out per pixel, as the game's own shaders do. Off: the shaders exactly as before.
LampSums = true                      # UNOFFICIAL, BUG FIX (2026-10-21; on by default 2026-10-25: owner, the hard steps in indoor lamp light at tile and object edges), needs a restart (then live), with linear lighting: surfaces reached by 3 or more lamps (many floors and walls indoors) add the light of their extra lamps exactly, the way a surface lit in one pass does. The game draws those lamps in a pass of their own and adds it on top, which with linear lighting came out too bright: lamp-rich rooms like the Ultra-Luxe hazier and brighter than the same surface lit in one pass (with FoldHighlights on, what is left of that). On, those rooms get darker and cleaner; costs about 0.3-0.4 ms indoors where such surfaces are on screen (one copy of the frame). Off: the shaders and passes exactly as before.
HighlightSums = true                 # UNOFFICIAL, BUG FIX (2026-10-25), needs a restart (then live), with linear lighting: the highlight layers the game adds on top of some objects (parallax rubble, rocks and roads above all, and anything FoldHighlights cannot handle) are added in linear light, like the rest of the object, instead of in the stored curve. Lamp-rich pieces (3 or more lamps reaching them, common in towns like Novac even by day) came out a lot lighter than identical pieces next to them, with sharp edges, and lowering Roughness or the linear Gamma only hid it. Off: those layers exactly as before.
Roughness = 1.0                      # Roughness scale.
Metallicness = 0.0                   # Metalicness scale - unused, no metalic maps yet.
AmbientScale = 0.5                   # Ambient lighting scale.
SkylightingScale = 0.5               # Sky-colour ambient boost. 0 disables it.
SkylightingMode = 0                  # 0 spherical harmonics, 1 directional sample. Recompiles shaders.
SmoothObjectNormals = true           # UNOFFICIAL (2026-10-24), needs a restart (recompiles shaders): clothing, armour, hair and the older skin shaders take the smooth vertex normal for their sun and lamp shadow lookups and for the sky-colour ambient, instead of a normal built per triangle. Fixes characters whose every triangle showed as a flat facet with hard edges in lamp-lit interiors (and softer versions of it outdoors). false = as before.
SkylightingDirectionality = 0.6      # Mode 1 only: 0 samples straight up, 1 along the normal.
SkylightingSaturation = 1.0           # UNOFFICIAL: colour strength of the sky light (0 = grey, 1 = as the sky, above 1 = more colourful). Default skylighting mode (0) only.
LightingScale = 0.725                # Directional and point light scale.
Saturation = 1.0                     # Color saturation.
MetalnessScale = 1.0                 # UNOFFICIAL (2026-10-18), materials with an _rmaos map only: [0.0-1.0] their metal (green channel) times this, in this weather/time (idea from the Physically-Based-Reloaded fork). Metal is lit almost only by what it reflects, so with little around to reflect (night) it goes dark: lower keeps some of its colour. 1.0 = the map as it is. Applies immediately.
AOScale = 1.0                        # UNOFFICIAL (2026-10-18), _rmaos maps only: [0.0-1.0] how much of their ambient occlusion applies in this weather/time (times [Shaders.PBR.Rmaos] Occlusion). 1.0 = as authored.
RoughnessScale = 1.0                 # UNOFFICIAL (2026-10-18), _rmaos maps only: [1.0-2.0] their roughness times this in this weather/time (rougher only, at most 1). 1.0 = the map as it is.

