PTRestirDIRadius = 16                # UNOFFICIAL (2026-11-07) test only: PTRestirDI's neighbour radius in pixels.
PTRestirDIMaxM = 20                  # UNOFFICIAL (2026-11-07) test only: PTRestirDI's history cap (samples a reservoir stands for).
PTRestirDINormal = 0.9               # UNOFFICIAL (2026-11-07) test only: PTRestirDI's same-surface test, normal (cosine).
PTRestirDIPlane = 0.05               # UNOFFICIAL (2026-11-07) test only: PTRestirDI's same-surface test, distance from the plane (share of the distance from the eye).
