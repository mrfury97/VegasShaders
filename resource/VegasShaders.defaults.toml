SunsetG = 0.0                       # Color boost for sunset/sunrise sun color (Green)
SunsetB = 0.03                      # Color boost for sunset/sunrise sun color (Blue)
StarTwinkle = 1.0                   # Speed of the star twinkling
ColorLook = true                    # UNOFFICIAL (2026-10-28), live: the master switch for the mod's sky colour settings below (TintDay / TintNight, the horizon tints, SaturationDay / SaturationNight) and the sunset colour boost (SunsetR / G / B). Off = all of them stand aside (on the sky, the sky light on objects and the fog's sky colours) and the sky is the weather's own (or the physical sky's). For checking whether a colour on the sky comes from these settings. true = as before.
TintDayR = 1.0                      # UNOFFICIAL (2026-10-25), live: colour of the sky by day (a colour wheel in the menu). The sky, the sky the clouds blend into, and the sky light on objects are multiplied by it. White = no change. Fades into TintNight over dusk on the same curve as SkyMultiplier.
TintDayG = 1.0
TintDayB = 1.0
TintNightR = 1.0                    # UNOFFICIAL (2026-10-25), live: colour of the sky at night (a colour wheel in the menu), e.g. a little blue for moonlit nights. White = no change.
TintNightG = 1.0
TintNightB = 1.0
TintKeepsBrightness = true          # UNOFFICIAL (2026-10-26), live: the sky colour wheels (TintDay, TintNight and the horizon ones) change only the sky's colour, not how bright it is: a paler or deeper colour on the wheel no longer makes the whole sky brighter or darker. false = the colour multiplies the sky as it is (a pale colour brightens it, a dark one darkens it).
TintHorizonDayR = 1.0               # UNOFFICIAL (2026-10-26), live: an extra colour for the sky near the horizon by day (a colour wheel in the menu), fading out going up to TintGradientHeight, on top of TintDay; e.g. a pale grey-blue for a hazy desert horizon under a deeper blue overhead. White = no change.
TintHorizonDayG = 1.0
TintHorizonDayB = 1.0
TintHorizonNightR = 1.0             # UNOFFICIAL (2026-10-26), live: the same at night. White = no change.
TintHorizonNightG = 1.0
TintHorizonNightB = 1.0
TintGradientHeight = 0.3            # UNOFFICIAL (2026-10-26), live [0.01-1.0]: how high up the horizon colour reaches before it has faded out (0.3 = about 17 degrees above the horizon, 1 = all the way overhead).
SaturationDay = 1.0                 # UNOFFICIAL (2026-10-26), live [0.0-2.0]: how colourful the sky is by day, without changing its brightness. 1 = no change, lower = paler and greyer (e.g. 0.6 tones down a strong weather blue), higher = more colourful. Also the sky the clouds blend into and the sky light on objects.
SaturationNight = 1.0               # UNOFFICIAL (2026-10-26), live [0.0-2.0]: the same at night.
