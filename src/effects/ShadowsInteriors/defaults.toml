[_Shaders.ShadowsInteriors.Main]
UseCastShadowFlag = false            # Objects without the cast shadow flag will not be rendered to the shadow maps
Activators = true                    # Wether to include objects with "Activator" flag when rendering shadowmaps.
Actors = true                        # Wether to include objects with "Actors" flag when rendering shadowmaps.
AlphaEnabled = true                  # Wether to take into account alpha of objects when rendering shadowmaps.
Apparatus = true                     # Wether to include objects with "Apparatus" flag when rendering shadowmaps.
Books = true                         # Wether to include objects with "Books" flag when rendering shadowmaps.
Containers = true                    # Wether to include objects with "Containers" flag when rendering shadowmaps.
Darkness = 0.65                      # Darkness of shadows.
Doors = true                         # Wether to include objects with "Doors" flag when rendering shadowmaps.
Furniture = true                     # Wether to include objects with "Furniture" flag when rendering shadowmaps.
LightPoints = 24                     # How many lamps can cast shadows at once (24 = default). UNOFFICIAL: indoors with forward shadows ([Shaders.ShadowsInteriors.Forward] Enabled) up to 64; each lamp past 12 needs about 6 MB of video memory at ShadowCubeMapSize 512 (12 MB with people near it, RedrawActorsOnly) and about 0.3-0.4 ms whenever its shadow is redrawn whole (lamps with nothing moving near them are drawn once; with RedrawActorsOnly, lamps with people near them redraw only the people). Outdoors, and indoors without forward shadows, at most 12.
ExteriorLightPoints = 12             # UNOFFICIAL (2026-10-13) [0-44]: OUTDOORS, how many lamps cast shadows (needs [Shaders.ShadowsExteriors.Main] UsePointShadowsDay/Night on). 12 = as before. Above 12 the shadow pass is drawn in batches of 11 lamps (about 0.3 ms each at 1440p) and each lamp needs a shadow cube map (about 6 MB at ShadowCubeMapSize 512, plus its drawing whenever things near it move).
LightRadiusMult = 1.5                # A muliplier for the lights radius to render shadows for.
MinRadius = 10.0                     # Wether to include objects with a radius of less than x pixels on the screen in the shadowmaps.
Misc = true                          # Wether to include objects with misc flags when rendering shadowmaps.
NearFade = 0.0                       # UNOFFICIAL [0-128]: things within this many world units of a lamp (about 70 to a metre) cast less of a shadow from it, none at the lamp itself. Standing right at a lamp made your shadow fill the room, sharp and black, sometimes on several walls at once. A real lamp's shadow from that close is too blurred to see. 0 = as before.
EdgeFade = 0.0                       # UNOFFICIAL [0-0.9], OFF (0 = exactly as before): fades each lamp's lit disc, and the shadows in it, out over this fraction of its radius instead of ending on the hard circle where a bright lamp's clamped light amount drops. 0.4 was tried on 2026-10-07 and darkened the ring round every lamp (with forward shadows on this mask is the room darkening), so it is off; see LampReachMask for the cure. Applies immediately.
MaskSkipFar = true                   # UNOFFICIAL (2026-10-16): the lamp mask skips each lamp's maths where the lamp cannot reach (exactly the same picture; cheaper). Applies immediately
ContactShadows = 0.0                 # UNOFFICIAL (2026-10-16) [0-1]: contact shadows from lamps indoors -- the small dark lines where a prop meets the floor or a table meets the wall, which the lamps' shadow maps are too coarse to show (the mod had them for the sun only). Strength; 0 off. Applies immediately
ContactLength = 40.0                 # [4-200] How far toward the lamp the contact shadow looks, in world units (about 70 to a metre)
ContactThickness = 12.0              # [1-100] How thick a surface is taken to be: thinner things in front do not cast a contact shadow
ContactDistance = 3000.0             # [200-20000] Contact shadows fade out by this distance from the camera
LampReachMask = false                # UNOFFICIAL, CHANGES THE IMAGE indoors (2026-10-07): the darkening pass faded each lamp out with its own falloff on top of the game's lamp lighting, which already fades, so the floor past a certain distance was darkened twice and a shadow on it seemed to stop at a circle. On: a lamp counts in full out to its game radius and fades over the rest of its LightRadiusMult reach (the game's own light does the fading), so its shadows show in full; the outer part of each lamp's reach is a little brighter than before. Applies immediately. (2026-10-24: always used while the per-object lamp shadows, [Shaders.ShadowsInteriors.Forward] Enabled, are on: without it, near interior lamps every triangle of a character was darkened on its own, hard-edged; see ForwardReachMask for that mode.)
ForwardReachMask = 2                 # [0-2] UNOFFICIAL (2026-10-25), live, with or without the per-object lamp shadows ([Shaders.ShadowsInteriors.Forward] Enabled; without them too since the evening of 2026-10-25, so no setting combination brings the facets back): near interior lamps every triangle of a character (skin and clothes) was darkened on its own and showed as a hard-edged facet (the room darkening took each lamp's angle from a flat per-triangle surface direction). 2 = fixed, the room as bright as before (the lamp's distance fade kept, the angle dropped). 1 = fixed with LampReachMask's rule (rooms a little lighter: the darkening's distance fade goes too). 0 = as before (facets). LampReachMask on overrides it.
PlayerInsideLamp = true           # UNOFFICIAL, BUG FIX: a lamp whose light point sits inside your body (or within PlayerLampMargin of it) leaves you out of its shadow cube map. A point inside a model is blocked on every side, so without this the player threw room-sized shadows onto every wall when walking through a light that has no fixture. Applies immediately.
RedrawActorsOnly = true              # UNOFFICIAL: a lamp with people (or wind-blown leaves) in reach draws its walls and furniture into its shadow once and keeps them; each refresh copies that and redraws only the people on top. Off = the whole shadow is redrawn every refresh, as before. Same image either way.
PlayerLampMargin = 16.0              # [0-64] How close (world units, about 70 to a metre) a lamp may come to your character before it counts as inside.
Quality = 1                          # Not currently used.
ShadowCubeMapSize = 512              # The resolution of one face for the point light shadow cubemaps.
Statics = true                       # Wether to include objects with "Statics" flag when rendering shadowmaps.
TorchesCastShadows = true            # Used in Oblivion to enable shadows on torches.
SkinnedAlphaTest = true              # UNOFFICIAL BUG FIX (2026-11-02), live: in lamp shadows, characters' alpha-tested parts (hair cards, fringes, ragged cloth) cast only where their texture is solid. Before, the whole card cast, so hair under a lamp sat in its own shadow and came out near black. false = as before.
TwoSidedCasters = false              # UNOFFICIAL (2026-10-29), live, TEST: lamp shadows drawn from both sides of every object, as the sun's are. Without it a lamp's shadow map kept the side of each object turned AWAY from the lamp, so open or thin things (cups, glasses, bowls, characters near a lamp) cast rings or shadows that trace the inside of the mesh. false = as before.
DrawDistance = 4000                  # Max distance for point light shadow rendering.
PlayerShadowThirdPerson = true       # Enable shadows for Player Model in third person in pointlights shadows
PlayerShadowFirstPerson = false      # Enable shadows for Player Model in first person in pointlights shadows

[_Shaders.ShadowsInteriors.Forward]
PoolLamps = 0                # UNOFFICIAL (2026-10-29) [0-192], live: lamps past the LightPoints that get a lamp shadow (a cube map) each frame: only those cast shadows, and the light of every other lamp fills the shadows in (rooms with many lamps, Vault 21 has hundreds). This many more lamps of the same order get a STILL shadow of their own: walls and furniture only (people keep theirs from the LightPoints lamps), drawn once, a few lamps a frame (PoolDrawsPerFrame), and kept while the lamp stays where it is. Costs video memory (one cube map per lamp at ShadowCubeMapSize: 6 MB each at 512) and a few cube maps drawn per frame after arriving somewhere, then nothing. Needs LightPoints below 63. 0 = off, as before.
ShadowContrast = 0.0           # UNOFFICIAL (2026-10-29) [0.0-1.0], above 0 needs a restart the first time (then live), with ManyLampsOnePass: lamp shadows indoors darken the rest of the light too (the ambient, lamps without a shadow) by the share of the pixel's light the shadows took, so they come out solid instead of grey and specked while lit parts of the room keep their brightness. With ManyLampsOnePass it is done in the lamp shader itself; with the game's lamp passes (ManyLampsOnePass off) it also needs [Main.Main.Quality] MaterialBuffer (restart) and costs one full-screen step indoors. 0 = as before.
PoolDrawsPerFrame = 2        # UNOFFICIAL (2026-10-29) [1-32], live: how many PoolLamps lamps get their still shadow drawn per frame at most (nearest first). Each is a whole cube map of walls and furniture (measured: 4 a frame = a 6-11 ms frame on a GTX 1070 when arriving in Vault 21); 2 fills 50 lamps in under half a second. Higher fills a room faster after arriving, lower spreads the cost.
ShadowHold = 2.0             # UNOFFICIAL (2026-10-30, 2 by default since 2026-10-30) [0.0-10.0] seconds, live, BUG FIX for shadows that pop in and out while walking in rooms with many lamps (Vault 21): a PoolLamps lamp keeps its shadow this long after it drops just out of the pool's rank, a pool lamp keeps its last shadow map until the new one is drawn (it had none meanwhile), a lamp's small flicker no longer forces a redraw, and FadeIn no longer starts over when a lamp moves between a LightPoints slot and the pool. 0 = off, as before.
SteadyLampShadows = true         # UNOFFICIAL (2026-10-31; on by default since 2026-11-01, a saved false moves to true once), live, with ManyLampsOnePass: objects lit by more than six lamps give their cube-map shadows to six of them, and which six depended on the way you walked there (the order the game added lamps to the object), so a lamp's shadow on a wall came and went as you walked back and forth (Rivet City market). On: the six that light the object most get the shadows, wherever you came from. Off: as before.
VisibleRanking = 1            # UNOFFICIAL (2026-10-30, on by default since 2026-10-30) [0-2], live (2 = measure only, for tests: the F10 profile's SHADOW FLIPS line then counts the lamps lighting something visible), indoors with forward lamp shadows: which lamps get the LightPoints shadow slots is decided by how much of what you SEE each lamp lights (measured on the picture, so walls hide the rooms behind them) x its brightness, instead of brightness x reach / distance round you. In rooms with hundreds of lamps (Vault 21) the slots went to lamps lighting rooms behind walls while the visible ones took turns: shadows popped in and out as you walked. With ShadowHold above 0 a lamp also keeps its slot that many seconds after it would have lost it. Costs up to 128 tiny measuring draws a frame. Off: as before.
Enabled = true                       # UNOFFICIAL: indoor lamp shadows drawn on each object, lamp by lamp, instead of one dark mask over the finished picture: a lamp's shadow takes away only that lamp's light, so lamp glow, lit windows and the room's ambient light stay bright and two lamps on a wall each cast their own shadow. Needs a restart (the indoor shaders are compiled once, then cached).
Strength = 1.0                       # [0.0-1.0] How dark a lamp's shadow is (1 = none of its light). 0 = the old screen-space shadows again, live, to compare.
Softness = 0.4                       # [0.0-2.0] 0 = sharp shadow edges (cheapest). About 0.75 = softer edges, about 1-2 ms slower in busy rooms.
Quality = 1                          # UNOFFICIAL (2026-10-10) [0-3]: how smooth lamp shadow edges are (with Softness above 0). 0 Low = one lookup, sharp edges (cheapest, as Softness 0). 1 Medium = 4 lookups, as before. 2 High = 10, smoother edges. 3 Ultra = 20, smoothest. Applies immediately.
ContactHardening = false             # UNOFFICIAL (2026-10-10): lamp shadows sharp where an object touches what it shadows (a chair leg on the floor) and blurred by Softness further away. Indoor lamps only; the sun has its own [Shaders.ContactHardening]. Needs Quality 1 or more. Off = as before. Applies immediately.
ContactHardeningStrength = 2.0       # [0.0-8.0] How fast the shadow softens with distance from the object casting it. Higher = soft sooner.
ContactHardeningMinSoftness = 0.2    # [0.0-1.0] How sharp the edge is right at contact, as a share of Softness (0 = razor sharp).
LampSize = 0.0                       # UNOFFICIAL (2026-10-20) [0-64], a LOOK OPTION, applies immediately: lamp shadows soft by distance, as a real lamp of this radius (world units, about 70 to a metre) casts them: sharp where an object touches what it shadows, softer the further the shadow falls from the object, and blurred away where the object is right at the lamp (its own fitting, fan blades just above its globes). 4-8 = a bulb or a small shade. Softness stays the sharpest edge, MaxSoftness caps the blur; with Quality 2-3 the wide blurs are smoother. Replaces ContactHardening while above 0. 0 = off: every shadow as sharp as Softness along its whole length, as before.
MaxSoftness = 8.0                    # [1-32] The widest blur LampSize may give a lamp shadow, in shadow-map texels (at ShadowCubeMapSize 512 one texel is about 0.2 degrees seen from the lamp). Higher = softer far shadows, but with few PCF taps (Quality) a wide blur shows steps.
InvisibleLightShadowStrength = 1.0   # UNOFFICIAL (2026-10-20) [0.0-1.0], a LOOK OPTION, applies immediately: how dark the shadows of the game's INVISIBLE lights are. New Vegas lights its rooms mostly with lights that have no lamp: the level designers placed them for mood (fill, key, ambient) wherever they wanted light, often far from any lamp you see (Doc Mitchell's house: 24 of its 25 lights; the Prospector Saloon: 18 of 24). The game never gave lamps shadows, so where they stand did not matter; with shadows they throw a lamp's whole outline onto the wall behind it, fan blades onto the ceiling, and shadows from places where nothing glows. A light counts as invisible when no glowing mesh (lamp glass, bulb, glow, flame) is within FixtureDistance of it. 0 = no shadow from them (they light as before, as in the game, and leave their shadow slot to the real lamps); 1 = full shadows, as before.
LampGlassShadows = true              # UNOFFICIAL (2026-10-20), a LOOK OPTION, applies immediately: false = a lamp's glowing parts (its glass shades, bulbs, glow sprites, flames: small meshes that glow) cast no lamp shadows. They are the light itself, yet drawn as solid blockers they threw a lamp's whole shade outline onto the wall behind it (a sconce's glass tulips: a dark cone above it). Lights built into lamp models (each chandelier globe, each sconce bulb) sit right inside them. true = as before.
OwnGlassDistance = 24.0             # UNOFFICIAL (2026-10-30) [-1-128], a LOOK OPTION, applies immediately: a lamp's OWN glowing glass (bulb, globe, glow; a lamp part within this many world units of the light) casts nothing into that light's shadow, so the light shines out through its glass; other lamps' shadows keep it. Vault 21's floor lamps sit inside their glass and lost their floor pools to it once they had a shadow. Below 0 = as before.
LampModelShadows = true              # UNOFFICIAL (2026-10-20), a LOOK OPTION, applies immediately: false = each light leaves the LAMP MODELS near it (within LampModelDistance) out of its own shadows: the whole lamp -- a sconce with its arms, a chandelier, a ceiling fan's blades, a hanging or arm lamp, a table lamp -- found by its model file's name (light, lamp, fan, chandelier, sconce, bulb, lantern, candle, torch). The level designers put the game's invisible lights right next to the lamps, and from there a lamp threw its whole outline onto the wall or ceiling, hard and room-sized (fan blades as black ovals, a sconce's brackets as a dark cone). Every other shadow -- furniture, props, walls, people -- stays, so the invisible lights can keep InvisibleLightShadowStrength 1. true = as before.
LampModelDistance = 160.0            # [0-512] How near (world units, about 70 to a metre) a lamp model's edge must be to a light for LampModelShadows to leave it out of that light's shadows. 160 covers the designers' lights in Goodsprings (10-160 units from their lamps).
LampModelOwnDistance = 24.0          # [-1-128] (with LampModelShadows false) A lamp keeps shadowing its OWN light: one built into its model, or a light built into another object (a bulb model inside a shade) within this many world units of one of the lamp's small parts, so a shade still shapes its bulb's light. The game's invisible designer lights never count, wherever they stand (one placed inside a chandelier's globes made the chandelier throw its frame across the ceiling). 0 = only lights built into the lamp's own model. Below 0: no lamp keeps shadowing any light near it (a test: shades then let light through).
NoShadowLampModels = "lantern,lamplightlamp" # UNOFFICIAL (2026-10-27), a LOOK OPTION, applies immediately: lamp models whose file name holds one of these words (comma separated, any case; "lamplightlamp" is the game's small oil lantern, LamplightLamp.NIF; e.g. add "candle") cast NO shadow for the lights inside or near them (within LampModelDistance), their own light included. A small lantern's frame and glass threw a cage of shadows round the room that moved with the flickering flame. Every other lamp keeps its shadows (LampModelShadows). Empty = as before.
InvisibleShadowFromLamp = 0.0        # UNOFFICIAL (2026-10-20) [0-1024], a LOOK OPTION, an EXPERIMENT, applies immediately: the game's invisible lights cast their shadows from the nearest VISIBLE lamp within this many world units (about 70 to a metre) instead of from where they stand. The room is still lit exactly as the level designers placed those lights; only where their shadows fall from changes, so every shadow comes from a lamp you can see. Lights with no lamp in reach cast from where they are. 0 = off (as before).
InvisibleLightSize = 0.0             # UNOFFICIAL (2026-10-20) [0-128], a LOOK OPTION, applies immediately: the lamp size (as LampSize, world units) the game's invisible lights cast their shadows with. They stand in for broad room light (the level designers' fill and key lights), so a large size suits them: their shadows stay where an object meets the floor or a wall, and blur away the further they fall from it, instead of throwing sharp outlines across the room. Lets them keep their shadows (InvisibleLightShadowStrength 1) without the hard projections. MaxSoftness caps the blur. 0 = the same size as the other lamps (LampSize).
FixtureDistance = 48.0               # [0-256] How close (world units, about 70 to a metre) a glowing mesh must be to a light for it to count as a real lamp's light (InvisibleLightShadowStrength). LogLamps writes each light's answer and distance to the log.
Bias = 0.018                         # [0.0-0.1] Keeps surfaces from shadowing themselves (speckles). Raise a little if lit walls show dark speckles.
NormalOffset = 0.0                   # [0.0-4.0] Another cure for speckles, pushing the lookup off the surface. 0 = off.
AutoNormalOffset = true              # UNOFFICIAL (2026-10-24; on by default since 2026-10-25: a tester's facets with the per-object lamp shadows on and LampReachMask on were this, and per-area setting add-ons can reset NormalOffset), live: NormalOffset is raised to the softening's reach (Softness, MagnifiedSoftness, in shadow-map texels). Without it, close to the camera a lamp's soft shadow lookup caught the surface's own depth wherever it was tilted more than about 57 degrees from the lamp, and since a character is flat per triangle, every triangle came out lit or dimmed on its own: a faceted, low-poly look on skin and clothes indoors. false = NormalOffset alone, as before.
FirstPerson = true                   # Shadows on your weapon and arms too.
KeepDarkening = true                 # Keep the old darkening of what no tracked lamp reaches (rooms keep their mood). Off = brighter unlit corners, and about 0.8 ms saved.
DarkeningBlur = false                # Blur that darkening as the old pass did (about 0.9 ms more).
MaskHalfRes = false                  # UNOFFICIAL (2026-10-16): work out the room darkening's lamp reach at half resolution (cheaper; edges of objects a little softer). Applies immediately
SmoothEdges = true                       # UNOFFICIAL (2026-10-15), needs a restart: smoother lamp shadow edges indoors. The shadow maps are read so each edge fades over one of their texels instead of stepping along them (the blocky look, worst with ContactHardening). Adds about 50 instructions to the 4-lamp object shaders (compiled in only when on). Off: the plain, blockier edges.
EvenTaps = true                       # UNOFFICIAL (2026-10-21), a LOOK OPTION, needs a restart: Quality 2 (High) and 3 (Ultra) spread their extra lookups evenly instead of on a grid (High 8 lookups instead of 10, Ultra 16 instead of 20, the same blur width). On the grid an edge got only five lookup places across it (eight of Ultra's twenty on the centre line), so wide soft lamp shadows (LampSize, MaxSoftness) showed as stacked, stepped copies of their edge. Off: the grid, exactly as before.
MagnifiedSoftness = 2.0               # UNOFFICIAL (2026-10-21) [0-8], a LOOK OPTION: where one texel of a lamp's shadow map covers many screen pixels (big shadows far from their lamp, seen close up), the shadow's edge is blurred over at least this many texels, so it stops showing the shadow map's stair-steps; everywhere else nothing changes (it ramps in between 2 and 8 pixels per texel). 2 = smooth. Turning it on from 0 needs a restart (it is compiled in only then); after that it applies immediately. 0 = off (as before).
TexelFilter = false                   # UNOFFICIAL (2026-10-21), a LOOK OPTION, needs a restart: lamp shadows filtered the way the sun's shadows are: the shadow map is read at exact texel centres round each point and blended with a smooth curve by where the point sits between them, so edges are smooth curves instead of the shadow map's stair-steps, however close you look. Wide soft shadows (LampSize) use the same filter on a coarser grid. Replaces Quality's lookups (Medium, High and Ultra filter alike; Low stays one sharp lookup), SmoothEdges, EvenTaps and MagnifiedSoftness; NearFade does not apply. Edges at the narrowest are a little softer than Ultra's (one texel at least, as the sun's). Off: as before.
LampSwitchMargin = 0.2               # [0.0-0.9] Only so many lamps can cast shadows at once (LightPoints); they are picked by distance. A lamp that already has a shadow keeps it until another is this much nearer (0.2 = 20%), and while it is a little behind you, so shadows stop popping on and off as you walk and turn. 0 = pick purely by distance, as before.
ShadowClusterEnabled = false          # UNOFFICIAL (2026-10-26): indoors, lamps closer together than ShadowClusterDistance share ONE shadow, the brightest lamp's. The others still light as before, just without their own shadow, so rooms with many bulbs stop running out of shadow slots (flicker). With LogLamps on, the log says how many lamps were merged. false = as before.
ShadowClusterDistance = 128.0        # [0-512] Units: lamps this close to a brighter lamp share its shadow (ShadowClusterEnabled).
ShadowClusterInvisibleOnly = false   # UNOFFICIAL (2026-10-29), live, with ShadowClusterEnabled: only the level designers' invisible fill lights (no glowing lamp part within FixtureDistance) give up their own shadow; lamps that are really there always keep theirs.
ShadowClusterMinLights = 0           # [0-64] UNOFFICIAL (2026-10-29), live, with ShadowClusterEnabled: a light joins a neighbour's shadow only where at least this many lights (itself included) stand within ShadowClusterDistance, so crowded spots (Vault 21: hundreds of lights) are thinned and rooms with a few lights keep every shadow. 0 = anywhere.
FadeIn = 0.25                        # [0.0-2.0] (UNOFFICIAL: 0.25 by default since 2026-10-30) Seconds a lamp's shadow takes to fade in when the lamp gets one, instead of popping in. 0 = at once, as before.
FadeOut = 0.25                       # UNOFFICIAL BUG FIX (2026-11-01) [0.0-2.0] seconds, live, indoors with the forward lamp shadows: a lamp that lost its shadow slot (another lamp ranked above it) had its shadow vanish at once, while a newcomer's faded in. Now it keeps its slot and its shadow fades out over this time, then the slot goes to the newcomer (which takes a free slot at once if there is one, otherwise waits for it and then fades in). LightPoints stays the number of shadow slots. 0 = as before.
LampRanking = 1                      # 1: lamps get shadows by how much of the scene they light (brightness x reach / distance), so a big room lamp is not pushed out by small bulbs near you as you move. 0 = the nearest lamps, as before.
KeepLampsInView = true               # UNOFFICIAL, BUG FIX (2026-10-08): the game lights each object only with the lamps it thinks are in view, and its test dropped lamps whose light was still on screen: turning the camera, their light and shadow popped off and on across whole mesh pieces (forward shadows live in each object's own lamps; the old screen-space shadows hid it). Lamps whose light reaches the view now stay. false = the game's test alone.
CameraIndependent = true             # UNOFFICIAL (2026-10-08): lamps get shadows by where you are, not where you look. A busy room has far more lamps than shadow slots (the Tops: 50-70 for 11), and picking them by the view swapped them as you turned: shadows and whole floor pieces popped at the edges of the screen. Now only walking changes them. false = the view test, as before.
FillLightRadius = 1000               # UNOFFICIAL (2026-10-08) [0-4000]: lamps that reach farther than this (game units) are a level's big fill lights, placed up near the ceiling to light a whole area; FillLightShadowStrength decides their shadows. 0 = no lamp counts as one.
FillLightShadowStrength = 0.5        # UNOFFICIAL (2026-10-08) [0.0-1.0]: how dark fill lights' shadows are. 0 = none (they light as before; at full strength a fill light's ceiling and the staircases under it blacked out whole floor pieces, and they take shadow slots from real lamps). 0.5 = half: staircases, tables and people still shade the floor under them. 1 = full, like a real lamp.
LogLamps = false                     # DIAGNOSTIC, for finding faults: write to the log every lamp that gains or loses its shadow, and why.
ScopeFix = true                      # B42 Optics (picture-in-picture scopes): no lamp shadows (indoors) or sun shadows (outdoors) on the scope's lens or in the scope's picture, where they would land in the wrong places (it is drawn from another camera). Off = as before.
DebugView = 0                        # 1: the light a shadow takes away is drawn in the lamp's own colour instead. 2: each lamp that casts shadows tints what it lights in its colour. 3 (diagnostic): only the red lamp's shadow map, read at every pixel whatever lamps the object has: red = blocked, pale colours = the six sides of its shadow map, a checker every 64 units, objects that lamp does not light at a third of the brightness. 0 off.


[_Shaders.ShadowsInteriors.Atlas]
Enabled = true                      # UNOFFICIAL (2026-10-30), needs a restart, on by default since P85 under DXVK (native D3D9 keeps the cube maps, whatever this says; docs/next/INTERIOR-SHADOWS-MODERN.md step 1): every lamp shadow indoors (the live LightPoints lamps and the PoolLamps lamps' still maps) is read from ONE octahedral shadow atlas instead of six cube maps per object. Same shadows, resampled; with PoolLamps raised every lamp past the live slots gets its still shadow. Off = the cube maps, as before.
Size = 8192                          # [2048, 4096, 8192] The atlas's size (R16F: 8192 = 128 MB of video memory). The live lamps get tiles of Size / 8, the pool's lamps Size / 16.
TraceSlot = 0                        # Test: the live slot [Shaders.ShadowsInteriors.Forward] DebugView 3 traces (0 = as before).
TableLamps = false                   # UNOFFICIAL (2026-10-31), needs a restart, off by default (an EXPERIMENT, docs\next\DEFERRED-RENDERING-PLAN.md stage 2; needs Enabled above and [Main.Main.Misc] LightCommonLamps + ManyLampsOnePass, the DXVK fork): the shiny objects' lamps past the sixth get their lamp shadow from the atlas when the lamp has a tile there (the live lamps and the PoolLamps lamps), with a 4-tap soft lookup (Medium; ClusteredLamps' extra lamps stay unshadowed). Off = those lamps unshadowed, as before.
TableLampsLive = true                # Live A/B for TableLamps (applies immediately): false = those lamps unshadowed again, the shaders unchanged.
TableLampsParity = false             # Test (2026-10-31), live: with TableLamps on, F10 logs whether each table lamp's shadow tile, position, radius and fade equal what the same lamp gets as one of an object's first six (TABLE LAMPS PARITY line). Reads shader constants back every draw: test runs only.
NearTiles = 8                        # UNOFFICIAL (2026-10-31; 8 by default since P85), needs a restart, 0 or 8: 8 = the first 8 live lamps' shadows get 2048 x 2048 tiles (sharper than the game's 512 cube maps; 1024 otherwise, visibly blockier than the cube maps). Leaves the PoolLamps fewer tiles (64 with LightPoints 24). 0 = as before.
NearCubeSize = 0                     # UNOFFICIAL (2026-11-01), NEEDS A RESTART, 0 = off (as before): lamp shadow cube slots 0-7, the lamps NearTiles gives the big atlas tiles, are drawn at this size (1024 or 2048) instead of [Shaders.ShadowsInteriors.Main] ShadowCubeMapSize, so their shadows are sharper; with a 512 cube the 2048 near tiles only hold a resampled 512 map. Costs graphics memory (1024: about 200 MB, 2048: about 800 MB, twice that with RedrawActorsOnly) and drawing time for those lamps. Try 1024 first.
TruePCF = true                       # UNOFFICIAL (2026-11-01), BUG FIX, applies immediately: interior lamp shadows read from the atlas compare each texel with the surface first and blend the results (bilinear PCF). Fixes shadows that grew past the caster's outline along the texel grid and showed the caster's own depth relief (an imprint of its lit side) as patches inside the shadow. false = the old linear-filtered taps.
WorldStartConvert = false            # Test: the live lamps' tiles converted again as the world scene starts.
Dump = 0                             # Diagnostic: 1 writes the atlas and the first live lamp's cube map to the log folder (DDS) once, then goes back to 0.


[_Shaders.ShadowsInteriors.Deferred]
Enabled = true                      # UNOFFICIAL (2026-10-31), needs a restart, on by default since P85 (runs on DXVK only; docs\next\DEFERRED-C1-SPEC.md; the DXVK fork with [Main.Main.Misc] ManyLampsOnePass + LightCommonLamps, [Shaders.ShadowsInteriors.Atlas] Enabled, the forward lamp shadows, CapturedNormals + MaterialBuffer + AlbedoBuffer, LinearScene): indoors the shiny many-lamp objects are drawn without their lamps and ONE pass adds every lamp of each pixel's screen tile afterwards, with the same lighting maths and the full lamp-shadow filter from the atlas. Off = as before.
Live = true                          # Live A/B (applies at the next frame): false = the objects light their own lamps again (the forward shaders).
UnshadowedLamps = 1                  # [0-1] Lamps without a shadow tile: 1 lit (as the forward shaders do), 0 left out.
DebugView = 0                        # [0-7] Test views: 1 lamp colour x falloff only (which lamps reach a pixel), 2 position checker, 3 normal, 4 1 - fog, 5 lamps in the screen tile, 6 none (with [Shaders.ShadowsInteriors.Forward] DebugView 6: the records' tangent frame), 7 (2026-11-03) the lamps' light alone over the frame (no ambient or other light; beside the reference path tracer's PTDebugView 3).
PrecisionBias = 4.0                  # UNOFFICIAL BUG FIX (2026-11-01; 4 by default since the flicker bench: the Vault 21 stair rail lamps went from 420 flickering pixels a frame to 0 with TAA on) [0-4], live: the deferred lamp shadows push their lookup off the surface by this x 0.1 % of the camera distance (the pass rebuilds positions from a 16-bit distance; with TAA jitter, lamps sitting on a surface flickered between lit and shadowed unless you were close). 0 = as before.
Shadows = true                       # Test (live): false = the pass lights every lamp unshadowed.
StableOrder = true                   # UNOFFICIAL BUG FIX (2026-11-01), live: each screen tile's lamp list was sorted by brightness x reach / distance from the camera, so walking re-ordered it; the first 16 lamps of a pixel's list get the full shadow filter and the rest a cheaper one, so lamps near 16th place switched filter and their shadow edges shimmered as you moved. Now sorted by brightness x reach only (the same order wherever you stand; ties by lamp, small brightness flicker ignored). false = as before.


[_Shaders.ShadowsInteriors.Capsules]
Enabled = false                      # UNOFFICIAL (2026-10-31), needs a restart, off by default (an EXPERIMENT, docs/next/INTERIOR-SHADOWS-MODERN.md steps 2-3; any GPU, no ray tracing): indoors, people's lamp shadows from capsules round their bones, and small contact shadows (cups, plates, fingers, rims) the shadow maps cannot resolve, for each pixel's three strongest shadow lamps, in one pass. Needs [Shaders.ShadowsInteriors.Forward] Enabled. With the RT lamp shadows running (an RT GPU) those are used instead. Off = the lamp shadow maps as before (the shaders unchanged).
Capsules = true                      # Live A/B: people's lamp shadows from capsules (soft, sized from LampSize). false = from the lamp shadow maps as before. Applies immediately.
DropActors = true                    # With Capsules on: people are left out of the lamp shadow maps, so a lamp is not redrawn when someone walks by (the CPU win); their shadows then come from the capsules alone. false = both (the darker). Redraws the maps when switched.
Contact = true                       # Live A/B: contact shadows, a short ray toward each of the three lamps through the depth buffer. Applies immediately.
MaxActors = 8                        # [0-16] People with capsules, nearest the camera first (the player in third person). Applies immediately.
MaxDistance = 2000.0                 # [0-8000] World units from the camera. Applies immediately.
PlayerFirstPerson = false            # The player's body casts capsules in first person too (its third-person skeleton). Applies immediately.
RadiusScale = 1.0                    # [0.1-3] Capsule thickness (1 = an average adult). Applies immediately.
Strength = 1.0                       # [0-1] How dark a capsule shadow gets (1 = blocks the lamp fully where it covers it). Applies immediately.
SelfMargin = 2.0                     # [0-16] Units round each capsule within which a pixel does not shadow itself with it (the body's own surface). Applies immediately.
LampSize = 6.0                       # [0-64] Units: the lamp's radius as the capsules see it (the soft edge of people's shadows). Applies immediately.
InvisibleLightSize = 32.0            # [-1-128] The same for the game's invisible lights (broad fill lights: softer). -1 = LampSize. Applies immediately.
ContactLength = 20.0                 # [0-128] Units: how far toward the lamp the contact ray looks (about 30 cm). Applies immediately.
ContactSteps = 12                    # [1-32] Depth tests along it. Applies immediately.
ContactThickness = 6.0               # [0.5-64] Units: how thick something in front must be at most to block (thicker = a wall the maps already have, or a gap). Applies immediately.
ContactStrength = 1.0                # [0-1] Applies immediately.
ContactBias = 0.002                  # [0-0.02] Share of the view distance a depth hit must be in front by (against the surface finding itself). Applies immediately.
ContactJitter = false                # The ray's start varied every frame (smoother with TAA, noisier without). Applies immediately.
StartOffset = 0.5                    # [0-16] Units off the surface the tests start. Applies immediately.
StartOffsetPerUnit = 0.002           # [0-0.02] Plus this x the view distance. Applies immediately.
RankBy = 0                           # [0-1] How each pixel picks its three lamps: 0 light brought (brightness x falloff x N.L), 1 the game's falloff alone. Applies immediately.
[_Shaders.ShadowsInteriors.RT]
Enabled = false                      # UNOFFICIAL (2026-10-28), EXPERIMENTAL, needs a restart, needs the DXVK fork with the RT core (patch 0028, and NvrRtHelper.exe in Data\NVSE\Plugins\NvrRt) AND a GPU with ray tracing (an AMD RX 6000 / Radeon 680M-780M or newer, an NVIDIA RTX, an Intel Arc; NOT a GTX 10-series: there it stays off and nothing changes): indoor lamp shadows traced against the room's real geometry instead of read from each lamp's shadow cube map, for the per-object lamp shadows ([Shaders.ShadowsInteriors.Forward] Enabled, needed). No cube-map stair-steps, seams or bias speckles; shadows sharp where things touch and softer further away (LampRadius). The tracing runs beside the game (a 64-bit helper) and arrives a frame or so later; where the result does not match what is on screen (something just moved in front, the edge of the screen) the cube map is used, so the cube maps stay as the fallback and the A/B (Live). The log says whether it is on and why not. docs/next/FORK-RT-LAMPS.md.
Live = true                          # Live A/B: true = the traced shadows, false = the cube maps again (same lamps, same shaders). Applies immediately.
MaxLamps = 63                        # [0-63] (2026-10-29) How many of the lamps with shadows (the mod's ranking, LightPoints) go into the trace's table; each pixel then traces only the LampsPerPixel that light it most, so every lamp is traced where it matters. Lamps past this keep their cube maps. Applies immediately.
LampsPerPixel = 2                    # [1-3] (2026-10-29) Lamps a pixel traces: its strongest ones (unshadowed light x falloff x angle). Weaker lamps at that pixel keep their cube map there. 2 looks the same as 3 (0.1-0.2 % of pixels in Lucky 38 and Vault 21) for ~20 % less; 1 differs a little (1.8 %). Applies immediately.
ManyLights = false                   # (2026-10-31) EXPERIMENTAL, needs a restart, interiors. Every lamp that lights something on screen gets a traced shadow, not only the ones with a cube shadow slot (ReSTIR-DI style): each pixel traces its two strongest lamps exactly and ALL its other lamps together by reservoir sampling (ManyLightsRays rays a pixel, reused over neighbours and frames), and each other lamp takes that traced share. A lamp with no shadow map of its own was unshadowed before. LampsPerPixel, Filter and Denoise do nothing meanwhile. docs/next/RT-MANY-LIGHTS.md.
ManyLightsMax = 254                  # [64-254] (2026-10-31) Lamp ids in the trace's table with ManyLights: 63 for the cube-slot lamps, the rest for the other lamps the drawn objects use (first come). Applies immediately.
ManyLightsRays = 1                   # [1-4] (2026-10-31) Rays a pixel for all its other lamps together (each picks a lamp by the light it brings). Applies immediately.
ManyLightsSpatial = 1                # [0-2] (2026-10-31) Neighbours the other lamps' samples are averaged with (same surface only): 0 none, 1 = 3 x 3, 2 = 5 x 5. Applies immediately.
ManyLightsHistory = 16               # [1-64] (2026-10-31) Frames the other lamps' traced share is averaged over (where the surface was seen in the previous frame). More = smoother, slower to follow moving shadows (the one-ray trace clamps old frames to what this frame's rays see, so moved shadows do not trail; it stops at 31). Applies immediately.
ManyLightsRestStride = 2             # [1-2] (2026-10-31) 1 = every pixel traces a ray for its other lamps each frame; 2 = one pixel of each 2 x 2 a frame, in turn (the neighbour and frame averaging fill the rest): about a quarter of those rays. Without ManyLightsOneRay only. Applies immediately.
ManyLightsOneRay = true               # (2026-10-31, restart) With ManyLights on: ONE shadow ray a pixel a frame (today's trace casts two): each pixel traces its strongest lamp, its second or one of the others in turn, and takes the rest from its neighbours (same lamp) and the frames before (ObjectMotion follows moving things). false = the older ManyLights trace (two exact rays + the others), about 3 x the cost.
Rays = 1                             # [1-8] Rays per lamp per pixel. 1 = cheapest; with LampRadius above 0 the soft edge is then noise that TAA smooths (with TAA off use 4 or more). Applies immediately.
LampRadius = 4.0                     # [0-32] World units (about 70 to a metre): the size of the lamp the rays aim at, for soft shadows (sharp where things touch, softer further away). 0 = a point: hard shadows, no noise. Applies immediately.
InvisibleLightRadius = 24.0          # [-1-128] The same for the game's invisible lights (fill and mood lights with no lamp; see InvisibleLightShadowStrength): broad light, so a large size. -1 = LampRadius. Applies immediately.
Jitter = true                        # Turn the rays' pattern every frame (for TAA to average). false = a fixed pattern. Applies immediately.
StartOffset = 0.5                    # [0-31] World units a ray starts off the surface, against a surface shadowing itself. Applies immediately.
LampStop = 12.0                      # [0-64] A ray stops this many world units short of its lamp: the bulb and glass round the light point never shadow it. Applies immediately.
GlowStopMax = 24.0                   # [0-128] (2026-11-04) The most a lamp's own glowing part (globe, bulb, shade glass) may add to that stop: rays end before the far side of the glow, which can be 40-80 units off a fixture and left shelves, beams and thin ceilings next to the lamp casting nothing (light leaking through). The glass itself never blocks its light (SkipLampGlass). Raise it if a lamp's own fixture shadows its light; 0 = no cap (as before). Applies immediately.
SkipLampModels = true                # The lamp models (fixtures, shades, chandeliers, fans: LampModelShadows' list) do not shadow their own light: over the last LampModelDistance ([Shaders.ShadowsInteriors.Forward]) of each ray they are skipped, so a chandelier still shadows the room's other lamps. Applies immediately.
SkipLampGlass = true                 # Lamp glass, bulbs and glow meshes never block a ray (they are the light). Applies immediately.
ActorsFromCubeMaps = true            # Only while the RT scene has no people ([Main.Main.RayTracing] Actors off, or a d3d9.dll without fork patch 0033): with actors in it they cast traced shadows and this is ignored. true = each traced lamp takes the darker of the traced shadow and its cube map, so people still cast their shadows (and the cube map's own faults stay where it is darker); false = traced only (no shadows of people from traced lamps). Applies immediately.
DepthTolerance = 0.02                # [0-0.2] How close (share of the distance) a point must be to what the traced frame saw at the same place to use the traced result; else the cube map. Applies immediately.
DebugView = 0                        # 1 = compare: each traced lamp's light white where traced and cube map agree it is lit, black where both are blocked, RED where only the traced result is blocked, GREEN where only the cube map is (where nothing was traced, both show the cube map). 2 = coverage (diagnostic): each traced lamp's light GREEN where the traced result is used (brightness = how lit), BLUE where the point was off the traced frame's screen, RED where the traced frame saw another depth there (brighter = further off), YELLOW where that pixel traced other, stronger lamps. 3 = one traced lamp (diagnostic, DebugLamp): its traced visibility at every pixel, white lit, black blocked, magenta no traced data. 4 = ManyLights (diagnostic): R, the traced share of each pixel's other lamps (cyan lit .. black blocked, magenta no traced data, dark blue ManyLights not running). 0 off. Applies immediately.
SkipTracedCubes = true               # (2026-10-29) The cost win: a lamp the trace covers keeps the shadow cube map it has (used only where the traced picture has no answer: the screen edge, something that just moved in front) instead of redrawing it. Still drawn when a lamp has none of its own yet, and while people move near it with ActorsFromCubeMaps on. false = the cube maps redraw as without RT. Applies immediately.
Interleave = 1                       # [1, 2, 4] (2026-10-29) Trace 1/2 (checkerboard) or 1/4 of the pixels a frame, in turn; the others keep their last answer (a surface that moved since takes its cube map until its turn). Cuts the trace's cost about that much. Applies immediately.
Denoise = false                      # (2026-10-29) Needs a restart. Soft lamp shadows the cheap way: LampRadius with 1 jittered ray, then the shared RT denoiser (temporal + spatial, per lamp: taps of another lamp are not mixed) on each pixel's two strongest lamps. Not measured yet.
Exteriors = false                    # (2026-10-29) Needs a restart. OUTDOORS at night (with [Shaders.ShadowsExteriors.Main] UsePointShadowsNight on): the lamps' shadows traced instead of cube maps (street lamps, Freeside, the Strip, Novac, campfires): the trace writes the lamp mask that pass draws, from the same lamps, and the outdoor cube maps are not drawn while it does. Live false = the cube maps again. Not measured yet.
RankBy = 0                           # [0-1] (2026-10-30) Which lamps a pixel traces (LampsPerPixel of them): 0 = those bringing it the most light (brightness x falloff x angle), 1 = by the game's own falloff over each lamp's radius, as the game picks the lamps it lights an object with (outdoors at Novac the brightest were not the draw's own lamps). Applies immediately.
StartOffsetPerUnit = 0.002           # [0-0.02] (2026-10-30) The rays' start offset grows by this much per world unit of distance from the camera (0.002: +2 units at 1000, +4 at 2000): far surfaces (outdoors) otherwise shadow themselves, the position rebuilt from the depth being off by more there. Applies immediately.
ExteriorForward = false              # (2026-10-30) Needs a restart (and Enabled + [Shaders.ShadowsInteriors.Forward] Enabled: the indoor records it builds on). OUTDOORS: each lamp's light on an object is shadowed inside the object's own lighting, as indoors (street lamps, the Strip, Novac, campfires): the lit shaders get an outdoor record that reads the traced result (no cube maps outdoors; a lamp not traced at a pixel stays lit, as before). Takes precedence over Exteriors. Not measured yet.
ExteriorLampStop = 40.0              # [0-200] With Exteriors: outdoors a ray stops this many world units short of its light, past the lamp's own head (a street lamp's housing, a lantern's frame), which would shadow everything below it. Applies immediately.
ExteriorDebug = 0                    # DIAGNOSTIC (2026-10-30), with Exteriors: 1 = the traced lamp mask 0 everywhere (no lamp light counted), 2 = 1 everywhere: shows how much the lamp mask moves the night picture. Applies immediately.
Flashlight = false                   # (2026-10-30) Needs a restart. The flashlight (the mod's Pip-Boy light, [Shaders.Flashlight]) casts traced shadows: one ray a pixel toward it, people included; its shadow map is not drawn meanwhile, and RenderShadows need not be on. Needs the DXVK fork's passes. Not measured yet.
FlashlightStop = 40.0                # [0-200] With Flashlight: a ray stops this many world units short of the flashlight (past the player's own body and weapon). Applies immediately.
DenoiseHistory = 16.0                # [1-64] Frames the denoiser averages at most (more: smoother, slower to follow moving shadows). Applies immediately.
Filter = false                       # (2026-10-29) Smooth the soft edges' noise (LampRadius with 1 ray) per lamp: each pixel averages its lamps' visibility with the neighbours that traced the same lamp on the same surface (5 x 5 taps, depth and normal weighted). Parked: +14 ms on an iGPU for no visible gain (rtlamp-11). Turning it on needs a restart (its image is made at the start); off applies immediately.
FilterStep = 2                       # [1-4] Pixels between the filter's taps (2: a 9 x 9 pixel reach). Applies immediately.
FilterDepthSigma = 1.0               # [0.01-8] How much depth difference (against the local slope) a tap may have and still count. Applies immediately.
FilterNormalPower = 32.0             # [0-128] How strictly a tap's surface must face the same way. Applies immediately.
OneSided = false                     # DIAGNOSTIC (2026-10-29): rays count only the closest surface, and only if it faces the lamp, the way the cube maps draw their casters (one-sided). For telling a cube-map light leak (a surface facing away from the lamp) from a traced fault. false = every surface blocks both ways (correct). Applies immediately.
DebugLamp = 0                        # [0-62] DebugView 3's lamp: its cube slot (LogLamps' LAMPSLOT lines and the "RT lamp shadows: trace N" line say which lamp it is). Applies immediately.

