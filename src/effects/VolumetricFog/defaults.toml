[_Shaders.VolumetricFog.Main]
ClassicLook = 0                     # [0-2] UNOFFICIAL (2026-10-18), outdoors and indoors, applies immediately: 1 = the fog looks as in the original this build grew from (upstream master, September 2026): its drifting patches painted on the surfaces at their own spot (not averaged through the air along the view), its sunlight shaded by the sun's shadow at that spot, its sky colour and sky light from the game's own sky (not the physical sky), and the full glow round a low sun (SunGlow is ignored). Keeps this build's speed-ups. FogVolume does nothing while it is on. 2 = the same, every pixel worked out at full resolution in one pass, as the original drew it (exact, slower). 0 = the fog as it is now. LegacyFog wins over it.
FogVolume = true                    # Outdoors, with the volumetric light's Froxels on: the fog's patches and its sunlight are worked out through the air along each view (its density, drifting noise and the sun's shadow on a 3D grid), instead of from four noise points and the shadow at the far end. Fog in shade stays dark, patches sit in the air. The fog's amount and colours are unchanged.
Amount = 0.4                        # Global multiplier for the final fog strength in exteriors.
FogSaturation = 1.7                 # Tune the saturation of the fog color.
BaseDensity = 0.2                   # mod-authored fog density baseline, independent of vanilla weather fog.
WeatherImpact = 0.5                 # How much the vanilla weather's own fog near/far/power/color feeds into density and color, on top of BaseDensity. 0 = ignore vanilla weather fog, 1 = fully vanilla-driven.
FoggyWeatherImpact = -1.0           # UNOFFICIAL (2026-11-13), outdoors, applies immediately, -1 = off (WeatherImpact for every weather, as before). 0-2: WeatherImpact for FOGGY weather. One WeatherImpact either greys clear days from 50 m or strips the fog from foggy ones; with this set, WeatherImpact counts in clear weather and this in fog, by the weather's own fog distance (the two keys below).
FoggyWeatherFar = 12000.0           # UNOFFICIAL (2026-11-13), with FoggyWeatherImpact: a weather whose fog far distance is this or nearer (game units) counts as fully foggy.
ClearWeatherFar = 26000.0           # UNOFFICIAL (2026-11-13), with FoggyWeatherImpact: a weather whose fog far distance is this or farther counts as clear (WeatherImpact alone). Between the two the share eases over.
GameFogFloor = 0.0                  # UNOFFICIAL (2026-10-30), [0-2], outdoors, applies immediately, 0 = off (as before): at least the game's own fog for the weather (its fog near / far / power, as the game fogs with the mod's fog off) hazes the picture, times this; where the mod's fog already covers as much, nothing changes. The mod's own fog is thin and the same in every weather (about 1 % of the colour at 20000 units by day; the game's 25 % in clear and 61 % in cloudy weather), so the hills stay crisp in clear weather. About 0.8 looks like the game's fog (the mod blends in linear light, the game in its stored curve); 1 = the game's curve. The colour is the mod's fog colour (WeatherImpact, WeatherFogColor, the sky look) without the sun's glow; never on the sky. The night share: [Shaders.VolumetricFog.Night] GameFogFloorScale. ClassicLook and LegacyFog ignore it.
WeatherFogColor = 1.0               # UNOFFICIAL (2026-10-30), [0-1], outdoors, applies immediately, CHANGES THE IMAGE: the colour WeatherImpact blends in is the weather's own fog colour for the hour (with the sky's tint and saturation on top), so a weather's fog colour shows in the fog again (at WeatherImpact 0.5 half the fog's colour, the other half the sky's light; all of it at 1). Where the fog lies over the sky itself (Rainy / CloudyDisablesSkyFilter) it keeps the sky's colour, as the game's own fog leaves the sky alone. 0 = as before: the sky's colour toward the horizon, and the weather's fog colour only showed in very dense fog (a weather with a pure red fog changed nothing). ClassicLook and LegacyFog keep their original colours (they ignore this).
MorningFogDip = 0.5                 # How much the mod-driven density dips around solar noon (0 = no change, 1 = fully cleared at noon). Ramps back to full by evening.
SunriseSunsetBoost = 0.3            # Extra density/inscattering bump specifically during the sunrise and sunset transitions, on top of vanilla/base density.
HeightFalloff = 50.0                # How far up the fog reaches before it thins (the fog's scale height). HIGHER = the fog thins MORE SLOWLY with height (the old description had it backwards). At 50 it thins only over about 333000 units (about 4.7 km) divided by the weather's fog power, so over the map the fog has no visible top; 0.5-2 gives a top a few thousand units up. With HeightLayer on it is not used: LayerBase and LayerThickness set the height instead.
MaxHeight = 3.0                     # Where the fog's height curve starts, in steps of 1000 game units above z -10000 (3 = z -7000). At the default HeightFalloff it changes the density almost nowhere (about 0.3 % a step); lower HeightFalloff for it to move the fog. With HeightLayer on it is not used (LayerBase instead).
HeightLayer = false                 # UNOFFICIAL (2026-11-01), outdoors, applies immediately, off by default: a fog layer with a height you can set in game units. The fog is full at and below LayerBase and thins out above it over LayerThickness, worked out along each view from the camera to what it shows: a valley below the base fills with fog, a hill top above it stays clear, the sky gets little. The noise is weighed by it too, so its patches sit in the layer. Replaces HeightFalloff and MaxHeight while on (HeightInfluence still blends it with the flat fog, MinDensityFloor still applies). ClassicLook and LegacyFog ignore it. Off = the fog exactly as before.
LayerBase = 0.0                     # UNOFFICIAL (2026-11-01), with HeightLayer: the height the fog is full below, in game units (70 = 1 m). World height by default (the Mojave floor is mostly between about 0 and 10000; use the console's player.getpos z to find a spot's height); with LayerFollowsCamera on it is measured from the camera instead.
LayerThickness = 2000.0             # UNOFFICIAL (2026-11-01), [50-100000], with HeightLayer: how far above LayerBase the fog thins to about a third (in game units, 70 = 1 m; 2000 is about 28 m). Small = a sharp fog top, large = haze that reaches high.
LayerFollowsCamera = false          # UNOFFICIAL (2026-11-01), with HeightLayer: true = LayerBase is measured from the camera's height (the layer moves up and down with you, e.g. LayerBase -100 keeps the fog top about 1.4 m under the camera); false = a fixed world height (fog that pools in valleys).
HeightInfluence = 1.0               # 1 = normal height-based falloff. 0 = uniform density regardless of height, falloff purely from distance. Meant to be tuned down for interiors; exteriors want this at 1.
Extinction = 3.0                    # Light lost to absorption when seen through the fog.
Inscattering = 1.6                  # Light gained from scattering when seen through the fog.
WindAngle = 45.0                    # Compass direction (degrees) the fog's density noise drifts toward.
WindSpeed = 0.3                     # Speed of the fog's density noise animation.
NoiseScale = 1.0                    # World-space frequency of the procedural 3D density noise.
NoiseStrength = 0.7                 # How much the procedural noise modulates density (0 = flat, 1 = fully noise-driven).
PhaseAsymmetry = 0.6                # Henyey-Greenstein scattering asymmetry toward the sun (higher = stronger "silver lining" look facing the sun).
SunGlow = 0.25                         # UNOFFICIAL (2026-10-15) [0-2]: the fog's bright glow round the sun (strongest with a low sun and distant fog toward it). 0.25 keeps a soft glow about as bright as the sun without fog; 1 = as in the mod before (the sun looked blown out with the fog on). 0: no glow.
ShadowStrength = 1.0                # Blend of the shadow-cascade visibility term on the sun's in-scattered light (0 = skip shadow sampling entirely, cheaper).
RainyDisablesSkyFilter = true       # In Rainy weather, stop excluding the sky dome from the fog composite, so fog blends fully into the overcast sky instead of masking it out. Does not affect the mod's own density, noise/wind animation, or the sunrise/sunset boost -- those stay active in every weather. Since FNV has no distinct "Foggy" weather type, an actual fog weather is almost always authored as Cloudy, not Rainy -- see CloudyDisablesSkyFilter below for the one that matters for that.
CloudyDisablesSkyFilter = true      # Same as above, but for Cloudy weather -- which is what most fog weathers are actually authored as. Turn off if you prefer a sharp fog/sky boundary even under overcast/foggy skies.
AerialStrength = 0.5                # Strength of the mid-to-far distance aerial-perspective tint on terrain/mountains.
AerialRangeStart = 0.3              # Normalized depth at which the aerial-perspective tint starts building up.
AerialTintBlend = 0.0               # 0 = aerial tint color comes entirely from the sky model (matches time of day automatically). 1 = fully replaced by the manual AerialTint color below.
AerialDayFadeStart = 0.85           # TESR_SunAmount.x value at which aerial perspective reaches full strength. Wider than the sun-scattering ramp (which tops out at 0.6) so aerial stays suppressed further into the sunrise/sunset transition, when low sun on distant terrain was reading as too bright. Raise toward 1.0 to suppress it even later into full daylight.
AerialTintR = 0.6                   # Manual aerial-perspective tint color (red), used when AerialTintBlend > 0.
AerialTintG = 0.7                   # Manual aerial-perspective tint color (green), used when AerialTintBlend > 0.
AerialTintB = 1.0                   # Manual aerial-perspective tint color (blue), used when AerialTintBlend > 0.
DistantFogRange = 0.9               # Range of the distance fog that blends mountains/terrain into the sky near the horizon.
DistantFogBlend = 0.3               # Blending power of the distant fog.
DistantFogHeight = 0.3              # Height limit for the distant fog. If set to 0, uses the sky as a mask instead.
EdgeAA = 0.4                        # Strength of the inverted distant-fog term that specifically feathers the terrain/sky silhouette edge, to hide aliasing there.
MinDensityFloor = 0.0               # Guarantees at least this fraction of the flat/distance-only density everywhere, regardless of height -- a single height falloff tuned to look right in low-lying terrain (river valleys, lowlands) can crush to unnaturally clear air on terrain well above that reference (hills, mountains, plateaus elsewhere on the map). Raising this adds a height-agnostic baseline haze there without diluting the height-based falloff's own shape near the ground, where it's already denser than the floor. 0 = disabled, matches prior behavior exactly.
LegacyFog = false                   # UNOFFICIAL, off by default: true = the fog from before the fog rewrite (Simple + Height fog), for presets made for it (Uranium Haze and others). It uses the LEGACY keys below plus Amount, FogSaturation, WeatherImpact, Extinction, Inscattering and the DistantFog keys. false = the current fog. Applies immediately, exteriors and interiors.
MinimumBaseFog = 0.2                # LEGACY FOG: how much fog is present as a base line when the weather has no fog.
SunPower = 0.2                      # LEGACY FOG: influence of the sun colour when it shines through the fog.
HeightFogDensity = 0.6              # LEGACY FOG: density multiplier for the height fog.
HeightFogFalloff = 50.0             # LEGACY FOG: vertical falloff of the height fog.
HeightFogDist = 0.4                 # LEGACY FOG: distance multiplier for the height fog. Pushes the fog back.
HeightFogSkyColor = 4.0             # LEGACY FOG: strong fogs use the weather fog colour instead of the sky; how strong the fog must be for that.
HeightFogHeight = 3.0               # LEGACY FOG: "sea level" from which the height fog starts to thin out.
HeightFogBlend = 1.0                # LEGACY FOG: overall strength of the height fog.
HeightFogRolloff = 1.3              # LEGACY FOG: pushes the height fog back without changing the far distance (the curve of progression).
HeightFogSaturation = 1.7           # LEGACY FOG: saturation of the height fog colour.
HeightFogInscattering = 1.6         # LEGACY FOG: light scattering through the height fog.
FogNight = 2.0                      # LEGACY FOG: scales the fog distances at night.
SimpleFogSkyColor = 20.0            # LEGACY FOG: strong fogs use the weather fog colour instead of the sky; how strong the fog must be for that.
SimpleFogHeight = 0.2               # LEGACY FOG: how fast the simple fog thins out with height.
SimpleFogBlend = 0.5                # LEGACY FOG: overall strength of the simple fog.

[_Shaders.VolumetricFog.Night]
GameFogFloorScale = 1.0             # UNOFFICIAL (2026-10-30), [0-2], with [Shaders.VolumetricFog.Main] GameFogFloor: its share by night, fading in through dusk as the other Night settings do. 1 = the game's fog by night too (the game's night fog is heavy: about 32 % at 20000 units in clear weather); 0 = the mod's own night fog only.
DensityScale = 1.0                  # Multiplier on the mod-authored density (BaseDensity and its noise/wind animation) specifically at night, fading in smoothly through dusk the same way NightAmbientStrength does. 1.0 = no change from daytime. Raise for moodier, thicker night fog; lower for clearer nights. Has no effect on the vanilla-weather-anchored portion of density (WeatherImpact) or in interiors.
AmountScale = 1.0                   # Multiplier on the final fog Amount (Main's) specifically at night, fading in the same way as DensityScale. 1.0 = no change. Use this for an overall night fog opacity push/pull independent of density shape.
HeightFalloffScale = 1.0            # Multiplier on HeightFalloff specifically at night, fading in the same way as DensityScale. 1.0 = no change. Raise for fog that hugs the ground tighter at night; lower to let it spread higher.
MaxHeightOffset = 0.0                # Additive offset (same thousands-of-units convenience scale as Main's MaxHeight) applied to the height-fog reference specifically at night, fading in the same way as DensityScale. 0.0 = no change. Raise to have fog appear to pool higher at night ("sea level" rising after dark); lower to sink it.
NoiseStrengthScale = 1.0            # Multiplier on NoiseStrength specifically at night, fading in the same way as DensityScale. 1.0 = no change. Raise for patchier, more uneven night fog; lower for a flatter, more uniform night layer.
WindSpeedScale = 1.0                # Multiplier on WindSpeed specifically at night, fading in the same way as DensityScale. 1.0 = no change. Lower for stiller, more settled-looking night fog; raise for faster night drift.
ExtinctionScale = 1.0               # Multiplier on Extinction specifically at night, fading in the same way as DensityScale. 1.0 = no change. Raise to make night fog obscure more of what's behind it; lower to keep it thinner/more see-through.
InscatteringScale = 1.0             # Multiplier on Inscattering specifically at night, fading in the same way as DensityScale. 1.0 = no change. Raise for brighter, more self-luminous-looking night fog; lower for darker, more light-absorbing fog.
TintR = 1.0                         # Red channel of a multiplicative color tint applied to the fog color specifically at night, fading in the same way as DensityScale. 1.0/1.0/1.0 (with TintG/TintB) = no change. Lower to push night fog color away from white, e.g. toward blue/grey.
TintG = 1.0                         # Green channel of the night fog color tint. See TintR.
TintB = 1.0                         # Blue channel of the night fog color tint. See TintR.
NightAmbientStrength = 1.0          # Multiplier on the moon-phase-driven night ambient floor for fog color, so fog doesn't collapse toward black after dark (most weathers author near-black night sky colors with no moon/starlight term). Varies with the same lunar cycle as Shaders.ShadowsExteriors.Main's NightMinDarkness, and fades in the same way as DensityScale. 0 = disable, fog can go fully dark at night like before.
DisableSkyMask = false              # Fog normally excludes the sky dome from the fog composite (see Main.RainyDisablesSkyFilter/CloudyDisablesSkyFilter for the weather-driven version of this same exclusion). Enabling this stops excluding it specifically at night, fading in through dusk the same way DensityScale does, so the sky itself can pick up fog color/haze after dark -- useful for a hazy, starless night look. false = sky dome stays excluded at night same as during the day.


[_Shaders.VolumetricFog.Interiors]
Amount = 0.25                       # Global multiplier for the final fog strength in interiors.
FogSaturation = 0.5                 # Tune the saturation of the fog color.
BaseDensity = 0.3                   # mod-authored fog density baseline, independent of vanilla weather fog.
WeatherImpact = 0.0                 # How much the vanilla weather's own fog near/far/power/color feeds into density and color, on top of BaseDensity.
HeightFalloff = 50.0                # How far up the fog reaches before it thins: HIGHER = thins MORE SLOWLY (see the Main page).
MaxHeight = 0.0                     # "Sea level" above which fog density falls off. Only meaningful when HeightInfluence > 0 -- tune per-cell via the preset manager for spaces where a real gradient makes sense (e.g. a tall Metro shaft), alongside HeightInfluence itself.
HeightInfluence = 0.0               # 1 = normal height-based falloff. 0 = uniform density regardless of height (the safe default for a generic preset with no per-cell tuning). Raise this only where MaxHeight has also been tuned for that specific space.
Extinction = 0.4                    # Light lost to absorption when seen through the fog.
Inscattering = 0.35                 # Light gained from scattering when seen through the fog.
WindAngle = 0.0                     # Compass direction (degrees) the fog's density noise drifts toward.
WindSpeed = 0.1                     # Speed of the fog's density noise animation.
NoiseScale = 1.0                    # World-space frequency of the procedural 3D density noise.
NoiseStrength = 0.5                 # How much the procedural noise modulates density (0 = flat, 1 = fully noise-driven).
RainyDisablesSkyFilter = true       # Sky-dome exclusion only, same as Main's own copy -- has no visible effect indoors unless the cell is exterior-lit; kept for consistency.
CloudyDisablesSkyFilter = true      # Sky-dome exclusion only, same as Main's own copy -- has no visible effect indoors unless the cell is exterior-lit; kept for consistency.
MinimumBaseFog = 0.3                # LEGACY FOG: how much fog is present as a base line.
HeightFogDensity = 0.6              # LEGACY FOG: density multiplier for the height fog.
HeightFogFalloff = 50.0             # LEGACY FOG: vertical falloff of the height fog.
HeightFogDist = 0.4                 # LEGACY FOG: distance multiplier for the height fog. Pushes the fog back.
HeightFogHeight = 0.0               # LEGACY FOG: "sea level" from which the height fog starts to thin out.
HeightFogBlend = 1.0                # LEGACY FOG: overall strength of the height fog.
HeightFogRolloff = 1.3              # LEGACY FOG: pushes the height fog back without changing the far distance.
HeightFogSaturation = 0.5           # LEGACY FOG: saturation of the height fog colour.
HeightFogInscattering = 0.35        # LEGACY FOG: light scattering through the height fog.
SimpleFogHeight = 0.5               # LEGACY FOG: how fast the simple fog thins out with height.
SimpleFogBlend = 0.2                # LEGACY FOG: overall strength of the simple fog.
LampHazeEnabled = false             # (2026-11-04), indoors, applies immediately: lamp haze on or off (the settings below). Off by default while it is being tuned.
LampHaze = 0.02                     # UNOFFICIAL (2026-11-03), [0-4], indoors, applies immediately, with LampHazeEnabled: the fog's air catches the light of the room's lamps, a soft glow in the haze round each lamp and its light falling through the haze (before, the indoor fog was lit by the ambient only). Strength of that light; it also follows the fog's density (BaseDensity, its noise), Inscattering and Amount, so thicker fog glows more. Up to LampHazeMaxLamps nearby lamps, no lamp shadows in the air (a lamp's glow can reach through a thin wall). Costs a few hundred instructions per half-size pixel with lamps on screen. 0 = as before (the fog exactly as it was). ClassicLook and LegacyFog ignore it.
LampHazeAnisotropy = 0.3            # UNOFFICIAL (2026-11-03), [0-0.9], indoors, applies immediately, with LampHaze: how much the haze sends a lamp's light on forward (Henyey-Greenstein g): 0 = the glow is even from every side, higher = brighter when you look toward a lamp through the haze, dimmer with the lamp behind you. No effect at LampHaze 0.
LampHazeCore = 0.1                  # UNOFFICIAL (2026-11-03), [0.05-1], indoors, applies immediately, with LampHaze: the size of each lamp's bright glow as a share of its reach (as [Shaders.PBR.LampFalloff] Falloff): small = a tight bright halo by the lamp and a faint tail, large = a broad soft glow over most of its reach. The light in the air falls off like real light (inverse square from the core) to nothing at the lamp's reach. No effect at LampHaze 0.
LampHazeMaxLamps = 8                # UNOFFICIAL (2026-11-03), [0-16], indoors, applies immediately, with LampHaze: how many lamps light the haze, the nearest first (from the frame's shadowed and tracked lamps). Each costs about 90 instructions per half-size pixel where its glow is on screen. 0 = none (as before).


[_Shaders.VolumetricFog.Status]
Enabled = true                      # Volumetric fog shader tinted by the sun. Rendered after shadows and other effects for more accurate effect.

