[_Shaders.VolumetricClouds.Main]
CloudBase = 1500.0                     # [200-8000] Height of the bottom of the cloud layer, in metres (70 game units each).
Thickness = 1800.0                     # [100-6000] How deep the cloud layer is, in metres. Deeper: taller heaped clouds, darker undersides.
CoveragePleasant = 0.4                 # [0-1] How much of the sky the clouds fill in fair weather. These four follow the game's current weather, so console weather commands (fw, sw) and weather mods change the clouds too: a weather forced with fw shows at once, other changes blend as the game blends its own sky. With FromWeatherTextures they are read against how cloudy the weather's own cloud textures are (this value = vanilla's clear sky, Cloudy = a half-full sky, Rainy = overcast).
CoverageCloudy = 0.7                   # [0-1] The same in cloudy weather.
CoverageRainy = 0.95                   # [0-1] The same in rain: also flatter, greyer clouds.
CoverageSnow = 0.9                     # [0-1] The same in snow.
Density = 1.0                          # [0.05-5] How thick the clouds are: higher is more solid and darker underneath, lower more see-through.
ShapeSize = 9000.0                     # [500-50000] Size of the big cloud shapes, in metres per tile of the shape noise. Larger: bigger, fewer clouds.
DetailSize = 500.0                     # [50-10000] Size of the wisps that wear away the edges, in metres.
Erosion = 0.5                          # [0-1] How much the wisps eat into the cloud edges. 0: smooth round edges.
EdgeSharpness = 2.0                    # [1-8] How quickly a cloud goes from clear air to solid at its edge. 1: soft, hazy outlines; higher: crisp ones.
ShapeSmoothing = 0.0                   # [0-3] Smooths the big cloud shapes (reads the shape noise at a coarser level): fewer small stray puffs, softer outlines.
Turbulence = 1.0                       # [0-2] Twists and stretches the noise the clouds are made of, so they swirl and streak instead of showing rows of round blots. 0: off.
DetailSmoothness = 0.5                 # [0-1] Share of smooth noise in the edge detail (the rest is round billows). Higher: wispier, less lumpy edges.
HalfResolution = false                 # Older switch, the same as Resolution 1 (used only while Resolution is 0). Needs a restart.
Resolution = 0                         # [0-5] UNOFFICIAL: the size the clouds are worked out at. 0: a quarter of the screen each way (cheapest). 1: half, a little more fine detail, about 1.5x the cost. 2: the full screen, the sharpest edges and wisps, but 4 times the pixels of 1 (by far the most costly; check the cost with F10). Needs a restart. 3, 4, 5: larger than the screen (1.5, 2, 3 times each way; 5 needs about 600 MB of video memory at 1440p). Needs a restart.
WeatherSize = 30000.0                  # [2000-200000] Size of the pattern of where clouds form, in metres. Smaller: more, smaller cloud fields.
SunStrength = 1.4                      # [0-10] How bright the sun (or moon) makes the clouds.
AmbientStrength = 0.7                  # [0-10] How much the sky colour lights the clouds from all around (their shaded sides and undersides).
ForwardScattering = 0.6                # [0-0.95] How strongly the clouds glow when you look toward the sun (silver linings).
Steps = 48                             # [8-256] Samples along each view ray. Fewer is faster but grainier; more gives finer, steadier detail (cost grows with it). UNOFFICIAL 2026-10-15: 64 is the most the D3D9 shader uses. 2026-10-26: above 64 needs the DXVK fork with NvrDxvkPasses on (the Vulkan march has no instruction limit); on D3D9 anything above 64 counts as 64.
FineDetail = 0.0                       # UNOFFICIAL [0-1]: a second, finer layer of wisps and curls on the cloud edges, so they keep detail close up instead of one size of lump. 0: off (no cost). One more texture read per sample when on; best with Resolution 1 or 2.
FineDetailSize = 140.0                 # UNOFFICIAL [10-5000]: size of that finer layer, in metres. Smaller: finer grain.
CumulusShape = 1.0                     # UNOFFICIAL [0-1] (2026-10-20): fair-weather clouds as heaps, like real desert cumulus: flat grey bases, rounded bright tops, clean edges (no smoky wisps or flat slabs). Fades out by itself as the sky closes over (cloudy, rain, snow keep their layered look). 0: the older look.
Towering = 0.0                         # UNOFFICIAL [0-1] (2026-10-25): storm clouds, like the huge cumulonimbus towering over the desert in a western: a few lone storms kilometres apart, each a broad billowing column from the cloud base up to TowerHeight times Thickness that spreads out into a flat-topped anvil, among the ordinary clouds (the biggest of those climb a little higher too). Higher: more storms. Fades out by itself as the sky closes over. Costs more cloud march work (check F10); 0: off, no cost.
TowerHeight = 5.0                      # UNOFFICIAL [1-8]: how tall the storms reach, in times Thickness (5 with Thickness 1800: tops near 10 km, as real ones). Used only with Towering above 0.
TowerAnvil = 1.0                       # UNOFFICIAL [0-1]: how far the storms' tops spread out into an anvil. 0: plain tall columns.
Sharpness = 0.5                        # UNOFFICIAL [0-3]: how crisp the clouds look. Higher: the clouds' history is kept sharp as they and the view move (instead of softening a little every frame), the finished clouds get edge-aware sharpening without halos, and far-off cloud detail stays finer. It also keeps drifting clouds moving smoothly (each pixel follows the wind between its refreshes). 0: the older, softer look. Costs a little at Resolution 2, almost nothing at 0.
FromWeatherTextures = 1.0              # UNOFFICIAL [0-1]: how much the coverage follows the current weather's own cloud textures (how much of the sky the game's cloud layers would fill) instead of only its type (pleasant, cloudy, rainy, snow). Weather mods often give overcast skies a 'pleasant' type; with 1 they still get heavy clouds. Rain and snow never get fewer clouds than their own setting. 0: the type alone, as before. Each weather is logged once (VegasShaders-Logs\VegasShaders_<date>.log) with what it measured.
FixedMarchExit = false                 # UNOFFICIAL (2026-10-17): the cloud march stops after Steps samples and when the cloud is opaque, as it was written to (the shader compiler had killed that exit, so every ray took 64 steps and ran past the horizon cap). Slightly different look near the horizon, a little faster. Off = as before.
WeatherTint = 0.5                      # UNOFFICIAL [0-1] (2026-10-25): the clouds take the colour the current weather gives its own cloud layers at this hour (orange at sunrise and sunset, grey when overcast, blue at night), on top of the sun and sky light they already get. Only the colour changes, not the brightness. Weather mods that set their own cloud colours show through. 0: off (the clouds' colour comes from the sun and sky alone, as before). No measurable cost.
MaxDistance = 80000.0                  # [5000-200000] How far away clouds are still drawn, in metres.
HazeDistance = 30000.0                 # [1000-200000] Distance, in metres, at which far clouds have mostly thinned out into the sky.
WindSpeed = 1.0                        # [0-20] How fast the clouds drift with the game's wind: 1 is about 15 m/s in calm weather to 60 m/s in a gale (faster than real, so you can see them move).
Evolution = 8.0                        # [0-50] How fast the clouds change shape as they drift, in metres per second.
History = 0.8                          # [0-0.95] How much of the earlier frames each new sample keeps: higher is smoother but slower to react.
Stable = false                         # UNOFFICIAL BUG FIX candidate (2026-10-31), live at Resolution 0-1 (2-5: restart): steadier clouds for capped or uneven frame rates, frame generation (NVIDIA Smooth Motion, Lossless Scaling), driver sharpening and TAA. Every cloud pixel is worked out every frame (half the Steps, stopping once a ray is opaque) instead of one in four, the blend with earlier frames follows the frame time instead of the frame count, and the noise filter uses the average and spread of nearby samples instead of their extremes. Costs more GPU time (roughly 1.5x the march). Off = as before.
JitterWrap = false                     # UNOFFICIAL BUG FIX candidate (2026-10-31), live: the clouds' per-frame sample offset is worked out from a frame count that grows all session; after about a million frames (an hour at 240 fps, four or five at 60) it only takes a few distinct values, so the clouds show banding and shimmer the history cannot smooth out. On: the count wraps every 4096 frames, so the offsets stay fine however long you play. Off = as before.
Brightness = 1.0                       # [0-5] Overall brightness of the clouds.
HideGameClouds = true                  # Hide the game's own flat cloud layers while these clouds are drawn (they stay in the water's reflection).
GameTime = true                        # UNOFFICIAL: the clouds move by the game's clock: waiting or sleeping moves them on as far as that time would, a pause or a menu stops them, and the same save shows the same sky. Off: they move by the real time on screen, as before.
Shadows = 0.6                          # UNOFFICIAL [0-1]: how much the clouds shade the ground in the sunlight (drifting cloud shadows across the land). 0: no cloud shadows. While above 0 these replace the flat clouds' Cloud Shadows (Shadows Exteriors, Cloud Shadows), which then do nothing.
ShadowRange = 30000.0                  # UNOFFICIAL [4000-100000]: how far round you the cloud shadows reach, in metres across. Larger reaches farther but each shadow is a little softer.
ShadowResolution = 256                 # UNOFFICIAL [256-2048]: detail of the cloud shadows: 256, 512, 1024 or 2048 texels across ShadowRange (256 over 30000 m is about 120 m per texel, soft edges). Higher: crisper cloud shadow edges, but the shadow map is redrawn every frame, so 1024 costs about 16 times 256 (check with F10). Needs a restart.
ShadowPrefilter = false                # UNOFFICIAL: smoother cloud shadows. On: the shadow map is made from the clouds' smooth shape only (no fine edge detail) and several samples per texel, so faces and ground get no dark speckles or blotches under the clouds. Off: as before.
ShadowSoftness = 1.5                   # UNOFFICIAL [0.5-4]: with ShadowPrefilter on, how wide each cloud shadow sample spreads, in shadow map texels. Higher: softer, smoother cloud shadow edges.
PhysicalShadows = false                # UNOFFICIAL (2026-10-31), live: cloud shadows as real ones. On: a thick cloud takes all of the sunlight under it (Shadows above 0 then only switches them on; 0.6 left 40% of the sun and sharp object shadows under an overcast sky), only the sunlight (the sky's light stays), with soft edges from the clouds' smooth shape (as ShadowPrefilter, ShadowSoftness wide), and they keep full strength with the sun down to about 14 degrees (off: only above 20; gone below about 5 either way). Applies where the sunlight alone is shaded (SunFar on, the default, or the RT sun); without SunFar the clouds' own apply darkens the whole pixel and keeps Shadows' strength. Off: as before.
PlantShadows = true                    # UNOFFICIAL (2026-11-04), live: the clouds' shadow on plants (the bushes and trees the [Shaders.Plants.Wind] Keywords name; needs [Main.Main.Quality] MaterialBuffer). Off: plants keep their full sunlight under a cloud, as with the clouds off (everything SunFar takes from the sun, the land's shadow too, is left off them); the ground round them is still shaded. On: as before.
ForwardShadows = false                 # UNOFFICIAL (2026-11-04), restart: the cloud shadows drawn by the surfaces themselves (land, objects, characters), per MSAA sample: no darkened edge pixels with the game's anti-aliasing, and grass and the speedtree leaves keep their sunlight under a cloud (with PlantShadows off the plants too). Off: SunFar puts them over the finished picture, as before.
PhysicalMoonlight = false              # UNOFFICIAL, live: the moon lights the clouds with all the light the weather gives at night, as the sun does by day (their moonlit sides and shading), instead of 15% of it. Daytime is unchanged; dusk and dawn carry the weather's own twilight light. Best with physically dim night light in the weathers, where the 15% cut leaves the clouds lit almost only by the sky (flat). Off: as before.
PhysicalSkyLight = false               # UNOFFICIAL, live, with [Shaders.Sky.Physical] on: the light the clouds get from the sky is the physical sky's at its own brightness against the sun or moon: their tops from the open sky above (averaged over the dome), their bases from the sunlit ground below (the physical sky's GroundAlbedo, or 0.3). The weather's sky colours then set only the hue (WeatherTint of [Shaders.Sky.Physical]); AmbientStrength becomes a plain multiplier, 1.0 = physical. Off: the sky light keeps the weather's brightness, as before. Without the physical sky: no effect.
WaterReflections = 1.0                 # UNOFFICIAL [0-1]: these clouds in the water's reflection, drawn into the game's own reflection where it shows sky (so the water waves and tints them like the rest), in place of the game's flat cloud layers there. 0: the game's clouds in the water, as before.
ShadowDebug = false                    # UNOFFICIAL: shows the cloud shadows alone (white: sunlit, black: shaded by a cloud; walls turned from the sun greyer). For checking only.
ReflectionDebug = 0                    # UNOFFICIAL [0-2]: checking only. 1: in the water reflection, paints red where it looks up into the sky and blue where down (where the clouds would go), behind what the game drew. 2: the same over everything.

[_Shaders.VolumetricClouds.Status]
Enabled = false                        # UNOFFICIAL, EXPERIMENTAL (2026-10-11): real 3D clouds high above the ground, lit by the sun and the sky, moving with the wind and following the weather, in place of the game's flat cloud pictures. About 1 ms at 2560x1440 on a GTX 1070. Exteriors only.

