[_Shaders.ShadowsExteriors.ScreenSpace]
BlurRadius = 1.0                     # Blur strength for denoising screenspace shadows. Keep low, otherwise a lot of pixelation will occur.
Enabled = true                       # Wether to render screen space contact/detail shadows
RenderDistance = 180000              # Max distance at which to compute screen space shadows
Intensity = 0.315                    # Rescale the intensity of screenspace shadows, to combat jitter and blur making them very faint even at maximum brightness.
NearFade = 400.0                     # UNOFFICIAL (2026-10-27), applies immediately: contact shadows fade in with distance from the camera, none nearer than half of this, full from this (game units, 70 = 1 m). Up close the sharp sun shadows already show the real shapes, and the contact shadows drew low-poly noses, brows and collars as hard triangles on characters (the 'facets', worst with Sharp). 0 = everywhere, as before.
Sharp = false                        # UNOFFICIAL: sharper, steadier contact shadows for less: the ray toward the sun followed in 16 even steps instead of 4 random ones smoothed by two big blurs (about a third of the cost). With forward shadows (the default). BlurRadius is not used with it on.
Bend = true                          # UNOFFICIAL (2026-11-06), turning on needs a restart: Skyrim Community Shaders' screen-space shadows (Bend Studio's), as CS uses them: in the lit shaders, darkening only the sun's light (not the ambient, as the old contact shadows did). Needs InLighting, ForwardShadows and the Vegas Shaders DXVK (fork) d3d9.dll; without them the old contact shadows are used. Each pixel takes last frame's result where it is the same surface, so things that move get theirs a frame late. Enabled (above) switches them off live.
InLighting = true                    # UNOFFICIAL (2026-11-06), turning on needs a restart: with Bend, the contact shadows are applied inside the lit shaders to the sun only. false = the old contact shadows (a pass over the finished picture).
SampleMultiplier = 1                 # UNOFFICIAL (2026-11-06) [1-4], with Bend, live: CS's Sample Count Multiplier. How far each contact shadow reaches across the screen (60 samples per ray at 1080p, times this); more costs more GPU.
SurfaceThickness = 0.02              # UNOFFICIAL (2026-11-06) [0.005-0.05], with Bend, live: CS's Surface Thickness: how thick each surface is assumed to be behind what the screen shows. Larger = more and longer shadows, also behind thin things where there should be none.
BilinearThreshold = 0.02             # UNOFFICIAL (2026-11-06) [0.02-1.0], with Bend, live: CS's Bilinear Threshold: depth steps bigger than this (relative) are read sharp instead of smoothed, so edges of objects cast and do not bleed.
ShadowContrast = 1.0                 # UNOFFICIAL (2026-11-06) [0.0-4.0], with Bend, live: CS's Shadow Contrast: above 1 the contact shadows get darker and harder, below 1 lighter.
DepthTolerance = 0.02                # UNOFFICIAL (2026-11-06) [0.002-0.2], with Bend, live: how close (fraction of the distance) a pixel must be to where last frame's contact shadow was made to take it. Smaller = fewer wrong shadows at the edges of moving things, larger = fewer holes on surfaces seen at a grazing angle.
StartDistance = 0.0                  # UNOFFICIAL (2026-11-06), with Bend, live: the Bend contact shadows start this far from the camera (game units, 70 = 1 m) and are full FadeLength further; nearer, the sun's shadow maps alone shade. 0 = where the shadow maps end ([ShadowMaps] Distance minus FadeLength). 64 = everywhere (as Community Shaders).
FadeLength = 1000.0                  # UNOFFICIAL (2026-11-06), with Bend, live: how far the Bend contact shadows take to fade in after StartDistance (game units).
BendDebug = 0                        # UNOFFICIAL (2026-11-06), diagnostic, with Bend, live: 1 = the sun's light shows the Bend contact shadows alone (the shadow maps left out), 2 = where last frame's result was taken (white) and where not (black: no contact there).
FastPaths = true                     # UNOFFICIAL (2026-10-17): the same contact shadows for less GPU time: the march's early exits (too far, surface turned away from the sun) really skip work (the shader compiler had turned them into work every pixel did). Off = the original pass. Applies immediately

[_Shaders.ShadowsExteriors.ShadowMaps]
CascadeResolution = 1				 # Resolution used for shadow cascades. 0: 1024, 1: 1536, 2: 2048, 3: 2560, 4: 3072, 5: 3584, 6: 4096 (UNOFFICIAL; 6 needs about 256 MB of video memory with PCF shadows, Max Quality uses it).
                                     # 3: 2560, 4: 3072, 5: 3584. The atlas holds 2x2 cascades, so
                                     # VRAM and shadow-pass bandwidth scale with the square of this:
                                     # 3 is ~2.6x the cost of 2, and 5 is ~5x. Clamped down if it
                                     # exceeds the device's maximum texture size.
Mipmaps = false						 # DISABLED. Enable mipmaps for the shadow maps.
Anisotropy = 0						 # DISABLED. Anisotropic filteric for mipmaps, 0: disabled, 1: 8x, 2: 16x
Distance = 6000                      # Distance to render shadows for. The unit is the same as the game uses for i.e. fog values. 
CascadeLambda = 0.9					 # [0.0-1.0] Controls how cascades are split, higher value means nearer cascades get higher resolution.
HandoverBlend = 70                   # UNOFFICIAL (2026-10-21), live, every Quality: how far inside each sun shadow cascade's edge the hand-over to the next (coarser) cascade is blended, in world units (70 is about 1 m). Fixes shadows on your character popping as the third-person camera zooms in and out (the hair's shadow on the brow appearing and vanishing at one distance), worst with a high CascadeLambda, where the old blend was a few centimetres wide: now both cascades read the same spot across the band, so only their mix changes. Never wider than the cascade, never narrower than the old tenth of it. 0 = the old blend (the outer tenth of each cascade).
PlayerInNear = 0                     # UNOFFICIAL (2026-10-23), live: in third person, keep your character's head in the sharpest sun shadow cascade while the camera is within this distance of it, in world units (420 is about 6 m; 70 = 1 m). Fixes the hair's, nose's and brow's shadows on your face showing only once the camera zooms in close (about 1.5-2 m): further out the head was in the next, coarser cascade, which blurs shadows that thin away. The sharp cascade grows to reach the head, so its shadows get a little softer everywhere while the camera is far back. 0 = off (as before).
PlayerInNearLog = false              # UNOFFICIAL (2026-10-23), diagnostic: with PlayerInNear, log the camera-to-head distance and the sharp cascade's size once a second.
CharacterShadowMap = true            # UNOFFICIAL (2026-10-23), ON by default since P82 v4, needs a restart to switch on or off (live after that): a small extra sun shadow map of your own character alone, fitted round the head and upper body (1-3 mm texels instead of the 4-10 mm of the sun cascades), read by the skin and clothing shaders where your character is on screen. Keeps the hair's, nose's and hat brim's shadows on the face sharp and steady at any third-person zoom. The sun cascades are drawn exactly as before (your shadow on the ground, and the world's shadows on you, stay theirs); this map only adds back the fine self-shadow they blur away. Third person only. Costs one small shadow map per frame (measured about 0.04 ms to draw; F10 profile: "Character shadow map").
CharacterShadowMapResolution = 1024  # UNOFFICIAL (2026-10-23), live: the map's size in texels (256-4096, rounded to 256). 1024 = about 1.4 mm texels round the head; 2048 = half that, four times the memory (16 MB) and fill.
CharacterShadowMapFit = 0            # UNOFFICIAL (2026-10-23), live: what the map is fitted round. 0 = the head and upper body (the Spine2 bone to the head bone, plus the margin): the sharpest. 1 = the whole character (its bound sphere): the arms' and weapon's shadows on the body too, about twice the texel size.
CharacterShadowMapMargin = 24        # UNOFFICIAL (2026-10-23), live: world units added round the fit (70 = 1 m), for hat brims, hair and shoulders; the sun is at an angle, so the box needs room on every side. Larger = coarser texels.
CharacterShadowMapBlend = 12         # UNOFFICIAL (2026-10-23), live: world units inside the map's edge over which it hands over to the sun cascades, so the border never shows as a line.
CharacterShadowMapBias = 0.15        # UNOFFICIAL (2026-10-23), live: constant depth bias of the lookup, world units (0.15 = 2 mm). Raise it if the skin shows fine stripes or speckles (acne) with the map on; lower it if shadows detach from what casts them.
CharacterShadowMapOthers = false     # UNOFFICIAL (2026-10-23), live: other characters standing inside the map's box are drawn into it too, so their shadow on you is as sharp as your own. A little CPU per frame (the loaded cells' references are scanned for them).
CharacterShadowMapTarget = 0         # UNOFFICIAL (2026-10-31), live, off (root plan A2): 1 = in first person (where the map had nothing to do) it is fitted round the nearest person whose head is in front of you within CharacterShadowMapNpcDistance, so the faces you talk to keep their sharp sun self-shadow (hair, nose, hat brim) too. 0 = your own character in third person only, as before.
CharacterShadowMapNpcDistance = 400.0 # UNOFFICIAL (2026-10-31), live: world units (70 = 1 m) from the camera to that person's head.
ViewModelShadows = true             # UNOFFICIAL (2026-11-05, from Balebandro's VegasShaders fork), live, needs CharacterShadowMap on: outdoors in first person your arms and weapon cast sun shadows on themselves (the gun's shadow across your hand, the hand's across the gun), drawn into the character map just before the first-person view with a soft 6 x 6 filter. Off: the arms and weapon get no sun shadow of their own, as before.
CharacterShadowMapLog = false        # UNOFFICIAL (2026-10-23), diagnostic: log the fit, texel size and caster count once a second.
CharacterShadowMapDebug = 0          # UNOFFICIAL (2026-10-24), diagnostic view, live: inside the map's box the sun shadow is replaced by 1 = the map's own verdict alone (white lit, black shadowed), 2 = the depth the map holds there (black = the map is empty or not bound, white = nothing drawn there, gray = a caster), 3 = the point's own depth in the box. 0 = off.
SmoothFilter = false					 # UNOFFICIAL (2026-10-15), PCF shadows (Mode 3): a smoother, slightly wider filter on the sun shadow maps (a 4 x 4 cubic B-spline instead of 3 x 3). Rounds off the stair steps that show where one shadow-map texel covers several pixels: shadows on your character in third person, a low sun across steep surfaces. Costs a little (16 compares per lookup instead of 9).
LimitFrequency = true				 # Limit the update frequency of the furthest cascade (once per four frames).
CasterFadeMin = 0.75                 # UNOFFICIAL (2026-10-28) [0-1], live: things the game is fading (in or out with distance) cast their sun shadow only from this much of their fade on. 0.75 = as before. Found with CasterView: distant trees' leaves sit at fade 0 while drawn on screen, so they never cast, and their shadow snaps on as you come nearer. 0 = they always cast (more shadow-map draws in tree-heavy places).
LodSkipLoaded = true				 # Distant-object LOD inside the loaded cells casts no shadow: the full objects there already do. Removes doubled shadows and ghost shadows of swapped or removed objects, and saves drawing them twice. false: the old behaviour.

[_Shaders.ShadowsExteriors.Ortho]
Resolution = 2						 # Resolution of the texture used to store the ortho map. 0: 128, 1: 256, 2: 512, 3: 1024, 4: 2048
Distance = 3000                      # Distance to render ortho for. The unit is the same as the game uses for i.e. fog values.
LimitFrequency = true				 # Limit the update frequency of the ortho map (one per four frames).
ProbeDump = 0                        # UNOFFICIAL, development builds only: a new non-zero value writes one dump of the ortho map with the object that drew each texel (for diagnosis; does nothing in release builds).

[_Shaders.ShadowsExteriors.TerrainShadows]
Enabled = false                      # UNOFFICIAL (2026-10-19) Mountain shadows: hills and mountains shade the land and everything on it far past the sun-shadow maps (about 85 m), so at sunrise and sunset ranges cast long shadows across the valleys. Only the sunlight is taken away: shaded land keeps its sky and ambient light. Reads the land's heights from your plugins in load order (about a second, on a spare core, when you enter a worldspace), or an xLODGen height map if you made one (UseHeightMapFile). Worked out on a spare CPU core when the sun moves; about 0.1 ms a frame on the GPU. Ported from Conor's (mrfury97) fork, after Community Shaders' Terrain Shadows (both GPL-3.0).
MaxResolution = 1                    # [0-2] (2026-10-19) The land's height map is shrunk to at most 0: 1024, 1: 2048, 2: 4096 texels on its longer side (applied on the next worldspace change or a moment after you change it). Larger: sharper shadow edges, more video memory (16 MB at 2048) and CPU per update.
Bias = 64.0                          # [0-4096] (2026-10-19) Shadow heights are lowered by this many units, so slopes do not shadow themselves. Higher: fewer, deeper shadows only; lower: more shadow on gentle slopes.
Softness = 1.0                       # [0.1-10] (2026-10-19) Degrees either side of the sun's height over which the shadow's edge fades.
Strength = 1.0                       # [0-1] (2026-10-19) How much of the sun the land's shadow takes.
Darkness = 0.0                       # [0-0.95] (2026-10-19) How much of the sky and ambient light the land's shadow also takes. 0: only the sun (physically right: a valley still sees the sky); higher: darker, more contrasted shadows (Conor's fork uses 0.5).
Contrast = 1.5                       # [0.5-8] (2026-10-19) Sharpens the shadow's edge: 1 as worked out, higher a harder line between lit and shaded land.
UseHeightMapFile = true              # (2026-10-19) Use an xLODGen height map when one is installed (FNVLODGen: Terrain LOD > Height maps, in Data\Textures\Terrain\<Worldspace>\), otherwise the land read from your plugins. Both give the same shape; the file skips the one-second read.
DebugView = 0                        # (2026-10-19) 1: the land's shadow tinted green (and the clouds' blue) over the picture. 2: also tints the area the height map covers.

[_Shaders.ShadowsExteriors.Status]
Enabled = true                       # Post process sun and pointlights shadows in exteriors.

