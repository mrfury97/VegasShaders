[_Shaders.TAA.Main]
HistoryWeight = 0.9                    # [0.5-0.97] How much of each frame is last frame's result carried forward. 0.9 averages roughly the last ten frames. Higher is smoother and settles crawling edges more completely, but anything the reprojection gets wrong -- moving NPCs, since only camera motion is tracked -- lingers longer before it clears. Lower responds faster and stabilises less.
ClipGamma = 1.0                        # [0.5-2.5] How far last frame's colour may stray from what is around the pixel now before it is pulled back, in standard deviations of the 3x3 neighbourhood. This is the main defence against ghosting. Lower rejects stale history harder -- fewer trails behind moving things, but more of the flicker comes back; higher keeps more history -- steadier, but moving objects start leaving trails.
WeaponTAA = 1.0                        # [0.0-1.0] How much TAA applies to the first-person weapon and hands, as a scale on HistoryWeight for those pixels only. The weapon is not jittered, so TAA gives it no anti-aliasing -- only steadiness while it sways -- and because its own sway and bob are motion TAA cannot track, its texture can soften slightly as it moves. 1 treats it like the world, 0.5 halves the history for a steadier-but-sharper middle ground, 0 leaves the weapon exactly as rendered (MSAA and SMAA still apply).
Jitter = true                          # Shift the world render by a different fraction of a pixel each frame (an 8-frame Halton pattern), so TAA collects several sub-pixel samples of every pixel and anti-aliases a still image, not just edges in motion. Without it each frame samples identical pixel centres, and averaging identical frames changes nothing. Only the world scene is jittered: shadow maps, the first-person weapon and every effect see the steady camera. Off gives stabilisation in motion only.
Sharpness = 0.5                        # [0.0-1.0] Sharpening of TAA's output, giving back the softness averaging frames costs. Clamped to each pixel's neighbours, so no halos, and lighter on hard edges than on texture detail. Only the picture is sharpened, never the history, so it does not build up. 0 off. With this on, the separate Sharpening effect is best left off (or at its default).
MipBias = -0.5                         # [-1.5-0.0] Texture mip bias while the jittered world draws: picks sharper texture mips, the detail TAA's averaging would otherwise soften, while TAA settles the extra shimmer. Needs Jitter. 0 off; below -1 textures start to crawl.
DebugView = 0                          # [0-5] Replaces the frame with a diagnostic view; the real TAA result keeps accumulating underneath, so switching back is seamless. 0 off. 1 motion: black = no movement, red/green = horizontal/vertical motion, full at 16 px per frame -- standing still must be all black, turning must give an even wash with the weapon staying black. 2 reprojection error: last frame vs this frame before any clipping -- THE test for trailing: turning past static scenery must stay mostly dark, lit only on edges and newly revealed areas; a doubled image lit everywhere means the reprojection is wrong. With Jitter on, edges flicker faintly here even standing still -- that is the jitter itself, and expected. 3 history use: grey = how much history is blended in (white full, black rejected), red = clipping fighting a ghost, expected on moving NPCs. 4 weapon mask: pixels treated as the first-person weapon in magenta -- must cover the weapon and hands exactly. 5 depth as TAA reads it, log scale, black near to white far.

[_Shaders.TAA.Cutouts]
Enabled = false                         # UNOFFICIAL (2026-11-03): NEEDS A RESTART to switch on or off (Save, then restart the game). Smooth edges for alpha-tested cut-outs (leaves, grass, fences, chain-link, hair cards) while TAA, FSR or DLSS anti-alias the world. Those textures were made for the game's transparency multisampling (alpha to coverage), which only works with the game's MSAA, and MSAA is off with TAA, FSR and DLSS: every texel was then drawn fully or not at all, so cut edges looked chopped and see-through fringes (some hair) came out solid. On, each pixel keeps the texel with a probability that follows its alpha, with noise that changes every frame, and the jittered frames average it back into a smooth edge. Does nothing while TAA's jitter is off (no TAA, FSR or DLSS), so with the game's MSAA the game's own transparency multisampling applies as before. Skin (bodies and faces) keeps the game's hard cut. The values below apply immediately
Mode = 2                               # [0-2] 2 = like the game's MSAA: a texel shows as much as its alpha says (what transparency multisampling did; soft fringes on hair and foliage, as their textures were made to look). 1 = edges only: the cut stays exactly where the game's alpha test puts it (as with MSAA off), only smoothed over EdgeWidth pixels. 0 = off (the game's hard cut, as before)
EdgeWidth = 1.0                        # [0.25-4.0] Mode 1: how many pixels the cut edge is smoothed over. Higher is softer and a little noisier in motion

[_Shaders.TAA.FSR]
Enabled = false                        # UNOFFICIAL (2026-10-26), needs the DXVK fork (does nothing on native D3D9 or stock DXVK; TAA's own resolve runs then): AMD FidelityFX Super Resolution 2 (FSR 2.2.1, MIT, GPUOpen) replaces TAA's resolve, at native resolution ("native AA"). Uses TAA's Jitter and MipBias and the same camera reprojection (motion of the camera only: moving characters are handled by FSR's own depth and luma checks). TAA must be on. Applies immediately. FSR and DLSS are either/or: switching one on switches the other off.
Version = 0                            # [0-1] UNOFFICIAL (2026-10-28), needs the DXVK fork: which AMD FSR runs. 0 = FSR 2.2.1 (as before). 1 = FSR 3.1 (AMD FidelityFX SDK 1.1.4, MIT): AMD's newer upscaler (better on thin detail and against ghosting), same inputs, jitter, sharpening, RenderScale and quality modes. Upscaling only (no frame generation). Needs the FSR31*.spv files in Shaders\VegasShaders\Compute; if they are missing or a pass fails, FSR 2 runs and the log says why (once). DLSS (its own tab) wins over both. Applies immediately.
Sharpness = 0.0                        # [0.0-1.0] FSR's own sharpening (RCAS) of its output. 0 off. TAA's Sharpness is not used while FSR runs.
WeaponReactive = 1.0                   # [0.0-1.0] How much FSR treats the first-person weapon as "reactive" (uses this frame rather than history around it). The weapon itself is put back exactly as rendered either way (it is not jittered).
ReactiveMask = 0.0                     # UNOFFICIAL (2026-10-30) [0.0-8.0], live, off by default: FSR (2, 3.1, RenderScale) also treats as "reactive" (this frame rather than history) what the game's alpha draws changed -- smoke, fire, sparks, glass, decals over the world -- measured as the colour after the world's alpha draws against the colour its opaque list left, times this. Those trailed and smeared as the camera moved (FSR kept their history like a wall's). 0 = off: only the weapon is reactive, as before. Costs two screen copies and one small pass.
ReactiveMax = 0.9                      # [0.0-1.0] The most reactive a pixel gets (AMD's own default 0.9: a little history stays).
ReactiveThreshold = 0.04               # [0.0-1.0] Changes below this count as none (noise, faint fog).
ReactiveMaxDistance = 12000.0         # [0-300000] World units (about 70 to a metre): farther than this nothing is reactive (the sky and the distant land are drawn after the main list too; they change only with the camera, which FSR handles).
ReactiveDebug = false                  # Diagnostic: the reactive mask shown in place of the world (white = reactive; before the ReactiveMaxDistance cut, which FSR's prep applies).
RenderScale = 1.0                      # [0.33-1.0] UNOFFICIAL (2026-10-27), needs the DXVK fork and Enabled above: real upscaling. Below 1 the world is drawn at this fraction of the screen's width and height (0.77 = 59% of the pixels, 0.67 = 45%, 0.5 = 25%, 0.33 = 11%, the lowest) and FSR 2 upscales it to the screen straight after, before the first-person weapon, the HUD, menus and every effect, which all stay at full resolution. Saves part of the game's own world drawing time (more where that is the expensive part: 1440p and up, many objects); costs FSR's passes (FSR at native resolution measured about 2.5 ms at 1080p on a GTX 1070; at RenderScale its render-size passes shrink, the output pass does not; not yet measured), so it pays only where the world is slow. Turn the game's MSAA off (FSR anti-aliases; with MSAA on it stays at native resolution). 1 = off: FSR runs at native resolution after tonemapping, exactly as before. Applies immediately.
DebugView = 0                          # [0-3] UNOFFICIAL (2026-10-27), RenderScale below 1 only: 1 shows the world as drawn at the internal resolution, in its corner of the screen (the rest black), proof of the lower resolution; 2 the same picture stretched to the screen without FSR (blocky, nearest pixels); 3 FSR's motion input (red/green = horizontal/vertical, full at 16 px per frame; black standing still). 0 off.
EffectsAfterUpscale = false            # DEVELOPER TEST (2026-11-01), applies immediately: below RenderScale 1 (FSR and DLSS) the mod's effects before the tonemap (AmbientLight, shadows, fog, clouds, reflections...) always run in the small frame before FSR / DLSS, which then smooth their noise along with the world; that is faster too. True = the old order (the world upscaled first, the effects after it at full size: about 9 ms more at 1440p and shimmering grass). Replaces LowResEffects, which is no longer read.
SmoothEffects = true                   # UNOFFICIAL (2026-11-01), applies immediately, only for frames upscaled BEFORE the effects (EffectsAfterUpscale, or when the effects cannot run in the small frame: RenderPreTonemapping off): TAA's own resolve runs after the effects so their noise is averaged over frames. Normally the effects run before FSR / DLSS and this does nothing.

[_Shaders.TAA.DLSS]
Enabled = false                        # UNOFFICIAL (2026-10-27), needs the DXVK fork, for NVIDIA RTX cards only: DLSS replaces TAA's resolve (TAA must be on), as FSR above does. It needs the DXVK fork's d3d9.dll with patch 1.7-dlss and NvrDlssHelper.exe with NVIDIA's nvngx_dlss.dll next to it, in the game folder or in Data\NVSE\Plugins\NvrDlss (DLSS is 64-bit only, the game is 32-bit: the helper is a separate 64-bit program the game starts). Whenever any of that is missing, or the card has no DLSS (any GTX), FSR 2 runs instead and the log says why (once). FSR 2 also runs for the second or so the helper needs to start. FSR and DLSS are either/or: switching one on switches the other off. Applies immediately.
RenderScale = 1.0                      # [0.33-1.0] UNOFFICIAL (2026-10-27): as FSR's RenderScale, for DLSS: below 1 the world is drawn at this fraction of the screen's width and height and DLSS scales it up (0.67 = DLSS Quality, 0.58 = Balanced, 0.5 = Performance, 0.33 = Ultra Performance). 1 = native resolution (DLAA). Turn the game's MSAA off.
WeaponMask = 1.0                       # [0.0-1.0] UNOFFICIAL (2026-11-01), with Enabled above (player report: with DLSS the first-person arms and gun ghost and smear while they sway, bob, fire and reload): how much DLSS trusts this frame's picture of the first-person weapon instead of its history. The weapon moves with the camera, so DLSS cannot see its own animation and smeared it; FSR does the same with WeaponReactive. 1 = the weapon always as drawn this frame (sharp, no ghosting; its edges can shimmer a little more), 0 = off (DLSS as before). Elsewhere DLSS gets FSR's reactive mask (smoke, fire and glass, when ReactiveMask in [Shaders.TAA.FSR] is on). Needs the DLSS helper of 2026-11-01 or newer (an older one is refused and FSR 2 runs, logged).
HelperTest = 0                         # [0-1] UNOFFICIAL (2026-10-27), TEST ONLY, with Enabled above: the DLSS helper runs its pass-through test instead of DLSS (works on any NVIDIA card, a GTX too, without nvngx_dlss.dll): the same exchange of pictures between the game and the helper, but the picture is only stretched (not anti-aliased) and a marker is drawn in the top-left corner (a magenta box that moves one step every frame, a green box that stays). Proves the helper path works; not for playing.
JitterFlip = 0                         # [0-3] UNOFFICIAL (2026-10-27), with Enabled above, for testers with NVIDIA's development nvngx_dlss.dll: flips the jitter sign DLSS is given (1 horizontal, 2 vertical, 3 both). Leave at 0 unless DLSS's own jitter check says it is the wrong way round.
HelperWait = 1                         # [0-1] UNOFFICIAL (2026-10-30), with Enabled above (tester report: DLAA with interior shadows on dropped to ~20 fps, the game's GPU waiting ~45 ms for the DLSS helper while the helper's own work took under 1 ms). 1: the helper waits on the CPU until the game's pictures are ready, then hands its work to the GPU with nothing left to wait for. 0: the helper's GPU work waits for the game's on the GPU itself (as before 2026-10-30). Changing it restarts the DLSS helper (FSR 2 for a second). The log's DLSS lines (DLSS EXCHANGE STALL, DLSS SLOW FRAME) show whether the wait comes back.
HelperGpuPriority = 1                  # [0-1] UNOFFICIAL (2026-10-30), with Enabled above: 1 asks Windows and the Vulkan driver to run the DLSS helper's small GPU work (about 1 ms a frame) at a high GPU priority, so the game's own GPU work cannot keep it waiting; the log says whether the driver allowed it. 0: normal priority (as before 2026-10-30). The CPU priority of NvrDlssHelper.exe does not reach the GPU. Changing it restarts the DLSS helper.
HelperExactInputs = 1                  # [0-1] UNOFFICIAL (2026-10-30), with Enabled above and RenderScale below 1 (tester report: with DLSS on, the render-scaled picture stayed small in the top-left corner): 1 = the helper copies the frame (drawn small, in the top-left of the mod's screen-sized pictures) into pictures of exactly its size, and DLSS reads those whole, the plainest way to use DLSS (about 0.1 ms). 0 = DLSS is told where the frame is inside the screen-sized pictures and reads it there (as before 2026-10-30): if DLSS reads the whole picture anyway, the frame shows small in the corner. Each change starts the helper again.
HelperFailTest = 0                     # [0-3] UNOFFICIAL (2026-10-30), TEST ONLY, with Enabled above: makes the DLSS helper fail on purpose at its 120th frame, to check that every failure leaves FSR 2 upscaling the whole screen (never the small picture in the corner): 1 the mod ends the helper process (as a crash would), 2 the helper reports a failure (as a failed DLSS evaluation does), 3 the helper stops answering (the game stalls about 3 seconds until the mod ends it). Each change starts the helper again. Leave at 0.
RayReconstruction = false              # UNOFFICIAL (2026-10-30), needs the DXVK fork, for NVIDIA RTX cards only, with Enabled above, at any RenderScale: DLSS Ray Reconstruction (NVIDIA's DLSS-D) denoises and anti-aliases the lit picture in one step (below RenderScale 1 it also upscales it to the screen, in place of DLSS's upscale: 2026-11-07), before the fog and the tonemap, instead of DLSS's anti-aliasing after the tonemap. Made for the ray traced effects (RT shadows, AO, GI, reflections): while it runs, their own denoisers step aside and hand it their raw rays (see RRKeepDenoisers). Needs NVIDIA's Ray Reconstruction runtime nvngx_dlssd.dll next to NvrDlssHelper.exe (beside nvngx_dlss.dll). Whenever anything is missing (no RTX card, no nvngx_dlssd.dll, TAA off, RenderScale with EffectsAfterUpscale) and in menus and the Pip-Boy, the frame goes to DLSS as before and the log says why (once): safe to leave on. With HelperTest 1 the exchange is tested on any NVIDIA card (the picture copied, the guide images as thumbnails along the bottom). Changing it restarts the DLSS helper (FSR 2 for the second or so it takes).
Preset = 0                             # [0-3] UNOFFICIAL (2026-10-30), with Enabled above: which DLSS model anti-aliases and upscales (DLSS Super Resolution; Ray Reconstruction has its own RRPreset). 0 = NVIDIA's default for the nvngx_dlss.dll in use (with 310.9.16: transformer, K at DLAA / Quality / Balanced, M at Performance, L at Ultra Performance; newer DLLs may pick newer models: the closest there is to "latest"). 1 = CNN, NVIDIA's older model (E; F at DLAA and Ultra Performance). 2 = transformer, pinned (K / M / L as above). 3 = transformer J (less ghosting, more flicker). A preset override in the NVIDIA App or the driver wins over this. Applies immediately (DLSS is made again with the new model).
RRPreset = 0                           # [0-2] UNOFFICIAL (2026-10-30), with RayReconstruction above: Ray Reconstruction's model. 0 = NVIDIA's default for the nvngx_dlssd.dll in use, 1 = preset D, 2 = preset E. A preset override in the NVIDIA App or the driver wins over this. Applies immediately.
RRAlbedo = 0                           # [0-2] UNOFFICIAL (2026-10-30), with RayReconstruction above: the surface-colour (albedo) pictures Ray Reconstruction gets. 0 = flat grey: RR denoises texture and light alike (the strongest denoise; textures come out a little softer). 1 = the picture's own colour at a fixed brightness (keeps colour detail as texture; may leave more noise where the light itself is coloured). 2 (2026-10-31) = the surfaces' real base colour from [Main.Main.Quality] AlbedoBuffer where the mod's shaders wrote it (the diffuse albedo times 1 - metal, the specular one from the metal), the picture's colour (1) elsewhere; needs AlbedoBuffer on (else as 1, logged once). Applies immediately.
RRRoughness = 0.6                      # [0.0-1.0] UNOFFICIAL (2026-10-30), with RayReconstruction above: the surface roughness Ray Reconstruction is told where the mod knows none (everywhere with [Main.Main.Quality] MaterialBuffer off, the default; with it on, still the land, grass, characters and the weapon). 0 = mirror, 1 = fully rough. Lower keeps reflections sharper, higher denoises them harder. Applies immediately.
RRNormals = 0                          # [0-1] UNOFFICIAL (2026-10-30), TEST, with RayReconstruction above: the space of the surface normals Ray Reconstruction gets. 0 = world space (around the camera), 1 = view space. NVIDIA's convention is a guess here (never run on an RTX card yet): if the lighting smears or lags when the camera turns, try 1 and say which looks right. Applies immediately.
RRDepthLinear = false                  # UNOFFICIAL (2026-10-30), TEST, with RayReconstruction above: false = Ray Reconstruction is told the depth is the hardware kind (0 near .. 1 far, as DLSS gets it); true = told it is not. A guess here (never run on an RTX card yet): if RR's picture looks wrong with distance (smearing or ghosting along depth edges), try true and say which looks right. Applies immediately.
RRKeepDenoisers = false                # UNOFFICIAL (2026-10-30), TEST, with RayReconstruction above: true keeps the mod's own denoisers of the ray traced effects running under Ray Reconstruction (RT sun with SunAngle, RT lamps with Denoise, RT AO and GI, AmbientLight's blurs and history, the reflections' history and blurs), to compare: RR then cleans up a picture that is already smoothed. false (default) hands RR their raw rays, as NVIDIA intends; they come back by themselves on any frame RR does not run. Applies from the next frame.

[_Shaders.TAA.Status]
Enabled = false                        # Temporal anti-aliasing: blends each frame with the last, reprojected for camera motion. With Jitter on it anti-aliases still images as well as settling edges and fine detail that crawl as the view moves. The first-person weapon is reprojected with zero motion so it does not smear when turning. (UNOFFICIAL: from the Physically-Based-Reloaded fork; TAA itself is upstream #78 by Conor.) Note: shapes that are dithered (terrain blending, LOD fades) are smoothed by it.


