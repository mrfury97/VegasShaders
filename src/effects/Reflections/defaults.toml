[_Shaders.Reflections.Main]
GroundSheen = 0.0                      # [0.0-2.0] Outdoors: how much dry ground that faces up (roads, pavements, floors) mirrors what is around it, blurred. Gives streets the sheen that picks up neon and lamps at night. Sand and grass get it too, so keep it low. 0: dry ground reflects nothing.
RainWetness = 1.0                      # [0.0-2.0] Outdoors: how much the rain makes the ground mirror the neon, lamps and sky. Follows the rain; only open ground gets wet (porches, awnings and marquees stay dry, as in Wet World); the puddles left after the rain are Wet World's. Above 1: stronger than real wet asphalt. 0: no rain reflections.
InteriorFloors = 0.0                   # [0.0-2.0] Indoors: how much floors mirror the room, blurred. EVERY floor facing up, wood and carpet too (the effect cannot tell materials apart); the game's own shiny surfaces already show the room through [Shaders.PBR.EnvMaps] CubeReflections. 0: none (default).
Mirror = 0.0                           # [0.0-1.0] UNOFFICIAL (2026-11-05, the Vulkan passes of the DXVK fork): how mirror-like reflecting surfaces are. 0: real stone, tile and polished floors (about 4 % of the reflection when you look down, so mostly bright lamps show; more toward grazing angles). 1: true mirrors that show people and objects at any angle (a demo / stylised look). Use with Roughness near 0.02.
MirrorSmoothOnly = false               # UNOFFICIAL (2026-11-06), live: Mirror only on surfaces whose own roughness is under 0.05 (a mirror object: the RT test room's panels, roughness 0.02 through RoughnessOverrides); every other floor and wall reflects as with Mirror 0. For showing a real mirror without turning the whole room into one.
Roughness = 0.4                        # [0.02-1.0] How blurred the dry reflections are. 0.02: a mirror; 1: barely a glow.
WetRoughness = 0.08                    # [0.02-1.0] How blurred the wet reflections are. Low: sharp mirrored neon in the puddles.
MaxDistance = 4000.0                   # [200-20000] How far each reflected ray searches, in game units (4096 to a cell). Longer finds farther things, but costs more and may miss thin ones.
Steps = 24                             # [8-64] Samples along each reflected ray (at half resolution). More: steadier, fewer gaps; costs more.
Thickness = 1.0                        # [0.1-10] How thick things count as when a ray passes behind them. Higher fills gaps behind poles and signs, too high reflects things that should be hidden.
Temporal = 0.85                        # [0.0-0.95] How much of last frame's reflection each frame keeps: steadies the noise of blurred reflections. Lower it if reflections trail when turning quickly. 0: none.
BlurRadius = 12.0                      # [0-8] Edge-aware smoothing, in half-resolution pixels each way (wider on rough ground, narrow on wet).
DrawDistance = 8000.0                  # [500-50000] Surfaces farther than this (game units) do not reflect; they fade out before it.
SkyFallback = true                     # Outdoors: a reflected ray that finds nothing on screen takes the sky's colour if it points up into the sky. Off: nothing is reflected there.
CubeMap = true                         # A small live cube of the surroundings, built from what you have seen around you (a little behind, blurred). A reflected ray that finds nothing on screen takes it: ceilings and lamps above you still show in the floor, buildings behind you in the street. Off: only the sky (outdoors) or nothing.
CubeCapture = 0.02                     # [0.02-1.0] How much of the cube each frame's view replaces. Lower: steadier, slower to follow changes (lights switching, turning); higher: quicker, can shimmer.
CubeFade = 0.005                       # [0.0-0.2] How much of what is out of view fades away each frame (0.005: about two seconds to half). Higher forgets places you looked away from sooner.
GridFallback = true                    # UNOFFICIAL, EXPERIMENTAL, INDOORS ONLY: a reflected ray that finds nothing on screen also takes the light from Ambient Light's light grid (needs Ambient Light on with GridBounce above 0; nothing extra is drawn). The grid knows the light all round you, so blurred reflections keep a soft colour in the right place at the screen edges instead of cutting off. Coarse: it fills rough (blurred) reflections first and only the gaps of sharp ones (wet puddles keep the screen and the surroundings cube). Indoors only (outdoors it added almost nothing); about +0.05 ms.
GridBrightness = 1.0                   # [0.0-4.0] How bright the light grid's reflections are (GridFallback). 1 matches the light the grid gives Ambient Light's bounce.
DebugView = 0                          # [0-10] 1: the reflection alone; 2: where the rays found something (green) and where not (red); 3: the surroundings cube over the whole screen (should look like a blurred copy of the view). 0: normal picture. 4: where the rain wets the ground (white) and floors it cannot reach (covered: dark red). 5: what the light grid gives along every reflected ray (GridFallback; black outside the grid). 6: where each reflection came from: green the screen, blue the surroundings cube, red the light grid, grey the sky. 7: the materials MaterialAware knows (red rough, blue smooth, green metal; dimmed: not known, the floor guess). 9 (HiZ, diagnostic): how each ray's walk ended (green hit, cyan hit after the cell limit, yellow hit thrown away, red nothing to the end / off screen, magenta cell limit and nothing, blue not started). 10 (HiZ, diagnostic): what it skipped (red facing along the ray, green the surface's own plane, blue behind by more than the thickness).
MaterialAware = 1                      # [0-2] UNOFFICIAL, EXPERIMENTAL (2026-10-20, restart to turn on; needs [Shaders.PBR.Rmaos] Enabled): the surfaces' own materials from their _rmaos maps decide what reflects. Smooth ones (tiles, glass, polished counters, car paint, metal) reflect whichever way they face, rough ones (concrete, dirt, carpet) stop sheening, metal reflects in its own colour. Surfaces without a map (the land, actors, the game's own shaders) keep the floor guess above. The rain still wets open floors whatever they are made of. 2: the materials are gathered but not used (a test). 0: off (the shaders are exactly as before).
MaterialReflect = 1.0                  # [0.0-2.0] With MaterialAware: how much a smooth known material reflects (indoors and out; GroundSheen and InteriorFloors stay for the surfaces without a map).
ReflectAdd = 0.0                       # [0.0-1.0] UNOFFICIAL, EXPERIMENTAL (2026-10-21, restart to turn on): 0: the reflection replaces its share of the surface's own colour (as before), which shows the floor reflections far more in shadow than under the lamps. 1: the reflection is added on top of the surface's lighting, as a highlight is (lamp-lit floors show the lamps, shaded ones stay dark). Adds a little light overall. In between: a mix.
SpecularOcclusion = 1.0                # [0.0-1.0] UNOFFICIAL, EXPERIMENTAL (2026-10-21, restart to turn on): blurred reflections dim where the floor itself gets little light, so shaded floors stop standing out (they showed the room's reflection far more than lamp-lit ones). Sharp reflections dim too (a taste choice: a real mirror would not). 0: off.
SpecularOcclusionLevel = 0.5           # [0.05-4.0] With SpecularOcclusion: how bright the floor must be, against what it reflects, to keep all of the reflection. Higher dims more (lit floors too).
RoughnessOverrides = "nv_ultralux_centertiles:0.1, ul_marbleblack:0.12" # With MaterialAware: polished surfaces the _rmaos maps rate too rough, as "keyword:roughness" pairs (comma separated), matched against the map's file name. Example: "nv_ultralux_centertiles:0.1, ul_marbleblack:0.12". Only the reflections use it.
MaterialMaxRoughness = 0.5             # [0.05-1.0] With MaterialAware: known materials at least this rough do not reflect (they fade out from 60% of it). Lower: only polished surfaces; higher: satin ones too.
CloudSky = false                       # UNOFFICIAL, EXPERIMENTAL (2026-10-30, the Vulkan passes of the DXVK fork only, outdoors with [Shaders.VolumetricClouds]): wet ground, puddles and glass that reflect open sky show the volumetric clouds there, also where you never looked (the clouds are marched once more over the whole sky into a small map, ~0.2 ms on an iGPU, one band of the sky a frame). Off: the plain sky colours where the surroundings cube has not seen the sky.
MaterialBufferRoughness = false        # UNOFFICIAL, EXPERIMENTAL (2026-10-30; since 2026-10-31 also the D3D9 effect when MaterialAware = 1; needs [Main.Main.Quality] MaterialBuffer in a build that has it): floors without a material map take the roughness and metal the game's own shader lit them with, instead of one DryRoughness and no metal for all: polished floors stay sharp, carpets and dirt blur, metal floors and plates reflect tinted (and get no rays with [Shaders.Reflections.RT]). Off: DryRoughness everywhere, as before.
GlassReflect = 0.0                     # [0.0-2.0] UNOFFICIAL, EXPERIMENTAL (2026-10-29, the Vulkan passes of the DXVK fork only): windows, bottles and shop glass reflect what is around them (on screen, the surroundings cube, and with [Shaders.Reflections.RT] the ray-traced scene), at the glass's own angle; the reflection follows the usual Fresnel (strong at grazing angles). Costs one extra draw per glass draw to mark where glass is (glass is a few draws a frame). Not during a sandstorm (glass then writes no depth). 0: off, nothing extra drawn.
HiZ = false                            # MEASURED SLOWER, LEAVE OFF (2026-10-26, GTX 1070): the walk now finds real hits and gives the same picture, but costs more than the fixed steps (desert 1080p: trace 1.30 vs 0.55 ms + 0.26 ms pyramid; Lucky 38 at 960x540: 0.44 vs 0.13 + 0.08). Kept for development only. UNOFFICIAL (2026-10-26), needs the DXVK fork and NvrDxvkPasses (does nothing on native D3D9 or stock DXVK), OUTDOORS ONLY for now (indoors the old fixed steps stay: the walk still misses some near-floor reflections there): each reflected ray walks the shared depth pyramid (Hi-Z, built once a frame in one compute pass), skipping whole empty blocks of the screen and testing every pixel it crosses, instead of Steps samples along the ray. Off: the fixed steps (as before). Applies immediately.
HiZSafeCells = false                   # UNOFFICIAL (2026-10-26) test only: the Hi-Z walk reads the depth pyramid's coarse cells safely (nearest/farthest as the smaller/larger of the two stored values, 'behind' skips only on the full-resolution depth); a fix under test for walks that found no hits. Leave off.
HiZCheck = 0                           # UNOFFICIAL (2026-10-26) test only: every N frames the Hi-Z pyramid is read back and compared with the depth buffer (one log line 'Hi-Z check'; that frame stalls). 0 = off.
HiZInteriorsTest = false               # UNOFFICIAL (2026-10-26) test only: HiZ indoors too (its interior picture is not yet the old trace's). With DebugView 9 / 10 shows why. Leave off.

[_Shaders.Reflections.RT]
Enabled = false                        # UNOFFICIAL, EXPERIMENTAL (2026-10-28, the DXVK fork on a GPU with Vulkan ray tracing only; does nothing elsewhere, e.g. on a GTX 10xx): reflected rays the screen cannot answer (off the screen, behind something, a gap the march stepped over) are traced through the scene in 3D. A hit that is visible on screen takes the picture there; one out of view takes the surroundings cube toward it, or a plain lit estimate. Rays that hit something no longer take the sky or the cube by mistake (no sky in the floor under a roof). Needs the Vulkan passes on. Off: the screen-space reflections as before.
RaysOnly = true                        # UNOFFICIAL (2026-11-07), live, with RT: reflections smooth enough for rays (MaxRoughness) come from the rays alone, the screen march's answer dropped (what DebugView 3 showed): no smeared backs of people in mirrors, the same light on and off screen. Things the rays do not see (grass, particles, glass) then leave the reflection. false = the screen first, rays where it has no answer (as before).
MaxRoughness = 0.5                     # [0.02-1.0] With RT: surfaces rougher than this keep the old fallbacks (the cube, the light grid, the sky); fades in from 75% of it. Blurred reflections gain little from rays and cost the same.
Distance = 6000.0                      # [200-30000] With RT: how far each ray looks, in game units (4096 to a cell). Farther than this counts as open (the cube, then the sky).
ScreenTolerance = 0.02                 # [0.002-0.2] With RT: a hit counts as the pixel the screen shows there when their depths differ by less than this share of the distance. Too low: hits on screen fall back to the estimate; too high: what hides the hit is reflected instead.
EstimateBrightness = 1.0               # [0.0-4.0] With RT: brightness of the plain estimate used for hits neither the screen nor the cube can show (a grey surface lit by the place's light and, outdoors by day, the sun).
SunShadows = true                      # With RT: the estimate's sun goes through one more ray (is the hit in the sun's shadow). Off: every estimated hit gets the sun (cheaper).
AlphaSolid = false                     # DIAGNOSTIC (2026-11-06), with RT: every alpha-tested hit (cut-out cards, fences, the office-kit walls and ceilings) is taken as solid, whatever its texture says. Tells a wrong RT alpha test from geometry missing in the traced scene. false = the alpha test (correct). Applies immediately.
HitLamps = true                        # UNOFFICIAL (2026-10-29), with RT: reflected things the screen cannot show (behind you, hidden) are lit by the 12 scene lamps nearest you as well as the room's light and the sun; indoors the lamp that lights each one most gets a shadow ray. Off: only the room's light and the sun.
VisibleNormals = true                  # UNOFFICIAL (2026-10-29), with RT: glossy reflections draw their rays from the microfacets the eye can see (VNDF sampling, Heitz 2018): less noise on rough and grazing surfaces for the same number of rays. Off: the screen march's plain GGX spread.
Weapon = 0.0                           # [0.0-2.0] UNOFFICIAL, EXPERIMENTAL (2026-10-30), with RT: the first-person weapon reflects the ray-traced world (lamps, sun, signs, the room behind you), over its own chrome reflection and by its Fresnel: metal parts (MaterialAware maps / the material buffer) strongly, a matte stock little. The player's own body is left out of its rays. 0: off (the weapon keeps only its own reflection).
WeaponMetal = 1.0                      # [0.0-1.0] UNOFFICIAL (2026-10-30), with Weapon: the gun has no material data in first person, so its grey (unsaturated) parts count as metal (reflecting in their own colour, strongly) and brown wood or coloured parts not; this scales that guess. 0: the whole gun reflects as non-metal (weak).
WeaponRoughness = 0.3                  # [0.02-1.0] UNOFFICIAL (2026-10-30), with Weapon: the weapon's roughness where no material map says (also scales how much it reflects: x (1 - roughness)).
RayReuse = false                       # UNOFFICIAL, EXPERIMENTAL (2026-10-31), with RT: glossy reflections (worn tiles, satin metal, wet stone) converge: each rough pixel reuses its neighbours' rays as extra samples of its own blur, weighted so the colour stays right, with edge stops. No extra rays (a few more hit shadings on rough pixels). Raise MaxRoughness (to 0.7-0.9) to give rougher surfaces rays at all. Off: one ray per pixel (or 2x2 block), smoothed by the blur.
Water = false                          # UNOFFICIAL, EXPERIMENTAL (2026-10-31), with RT: water reflects the ray traced scene (actors, plants, the skyline with FarLandLOD) instead of the game's planar reflection map: water pixels cast RT rays, the water shader reads them a frame later (reprojected) and bends them with its own waves as it bends the planar map. Where no ray answered (off screen last frame, past DrawDistance) the planar map stays.
SkyPanorama = false                    # UNOFFICIAL, EXPERIMENTAL (2026-10-31), with RT: a reflected ray that meets nothing shows the real sky: a small panorama of the sky as seen on screen (the sky dome, its clouds, the volumetric clouds, the sun), kept for the directions behind you, instead of the plain sky gradient. Where the sky was never seen, the gradient (with CloudSky's clouds when that is on). Good with Water.
WaterSkipPlanar = false                # UNOFFICIAL, EXPERIMENTAL (2026-10-31), with Water: the game's planar water reflection pass (a second draw of the world, about 1.7 ms) is skipped while RT holds the water; where no ray answered the water reflects the horizon colour instead.
WaterPlanarRefresh = 8                 # [0-120] UNOFFICIAL (2026-11-05), with WaterSkipPlanar: the skipped planar pass is still drawn every this many frames (and on the first), because it also draws the water's own depth map (how see-through it is, the shore); skipped from the start the lake showed streaks and its floor (og-lake). 0 = never (as before: only for tests). Live.
WaterRoughness = 0.02                  # [0.0-0.5] UNOFFICIAL (2026-10-31), with Water: the water's roughness for its rays (0.02: a mirror the waves break up).
ReuseRoughness = 0.2                   # [0.0-1.0] UNOFFICIAL (2026-10-31), with RayReuse: from this roughness on (smoother surfaces keep their own ray: a mirror's neighbours see other things).
HitAmbientGrid = true                  # UNOFFICIAL (2026-10-30), with RT and [Shaders.Reflections.Main] GridFallback: reflected things the screen cannot show get their ambient light (the light bouncing round, what lights shadowed places) from the light grid where they are, not one probe near the camera: reflections of shadowed corners and rooms behind you are neither too dark nor lit like where you stand. Off: the cube's ambient (as before).
HitTextures = true                     # UNOFFICIAL (2026-10-29), with RT and the ray tracing core's [Main.Main.RayTracing] HitTextures on: what the screen cannot show is reflected with its texture's colour at the hit (wood grain, tiles, signs), not the object's average colour. People keep their average. Off: the average colour (for A/B). Without the core's HitTextures it does nothing.
ShadeOffscreen = true                  # UNOFFICIAL (2026-11-05), with RT: something a reflection shows that is out of view (behind you, off to the side: people, plants, the room) is drawn from the ray's own hit (its texture, the sun and lamps on it) instead of the small cube of the surroundings seen from near the camera, which blurs it, lags behind and often misses people. Off: the cube first, as before. Live.
GlowBrightness = 3.0                   # [0.0-16.0] UNOFFICIAL (2026-10-29), with RT: reflected things the screen cannot show that glow (neon, lit signs, lamp glass: the ray tracing core's emissive flag) shine in the reflection with their own colour times this. 0: they are lit like any surface.
ContactSharpness = 0.3                 # [0.05-1.0] UNOFFICIAL (2026-10-29), with RT: how much of its usual blur a reflection keeps where the reflected thing touches the surface (a chair leg on a polished floor): sharp at contact, blurring with distance, as real glossy surfaces do. 1: the same blur everywhere (as before).
ContactSpread = 0.5                    # [0.01-4.0] UNOFFICIAL (2026-10-29), with RT: how far (as a share of your distance to the surface) the reflected thing must be from the surface for the full blur. Lower: the blur comes back sooner.
RoughShare = 0.3                       # [0.0-1.0] UNOFFICIAL (2026-10-29), with RT: surfaces rougher than this cast one ray per 2x2 pixels each frame (the casting pixel moves round the block frame by frame, the others use its hit, the reflection's history fills the gaps): a quarter of the rays on rough floors, where the reflection is blurred anyway. 0: a ray on every pixel.
RoughReach = 0.35                      # [0.0-0.99] UNOFFICIAL (2026-10-29), with RT: how far a ray on a fully rough surface looks, as a share of Distance (mirror-smooth ones look the whole Distance; in between, by roughness). Rough reflections blur far detail away, so short rays cost less for the same look. 0: every ray the whole Distance.
Denoiser = true                        # UNOFFICIAL (2026-11-07), with RT: a modern denoiser for the ray-traced reflections in place of the old smoothing (Temporal + the blur): it follows the reflected thing when you move (not the floor), keeps up to DenoiserHistory frames of history, blurs each spot only as much as its roughness and its distance to the reflected thing call for (sharp where an object touches the floor), and fixes the glossy rays' sampling (they only ever covered one line of each blur). On the RT test host: 4x closer to the exact reflection at rest, 2x in motion. Off: the old smoothing exactly as before.
DenoiserCore = 0                       # [0-1] UNOFFICIAL (2026-11-07), with Denoiser: 0 ours (ReBLUR-style); 1 AMD FidelityFX Reflections Denoiser (ported; for comparison: it removes bright parts of glossy reflections and smears in motion).
DenoiserHistory = 32.0                 # [1-128] UNOFFICIAL (2026-11-07), with Denoiser: frames of history at most on rough surfaces. More: smoother when still, slower to settle after a change.
DenoiserMirrorHistory = 4.0            # [1-128] UNOFFICIAL (2026-11-07), with Denoiser: frames of history on nearly mirror surfaces (rising to DenoiserHistory by roughness 0.25): little noise there, and a short history cannot trail.
DenoiserBlur = 10.0                    # [0-32] UNOFFICIAL (2026-11-07), with Denoiser (core 0): the blur's widest reach in half-resolution pixels (the blur is the reflection's own blur size, shrinking as the history grows).
DenoiserAntiLag = 2.5                  # [0.5-16] UNOFFICIAL (2026-11-07), with Denoiser (core 0): history this many deviations away from what the rays see now is cut short (moving lights, objects, doors). Lower: reacts sooner, a little noisier.
DenoiserClip = 0.7                     # [0.1-4] UNOFFICIAL (2026-11-07), with DenoiserCore 1: AMD's temporal stability (how far its history may stray from this frame).
DenoiserDebugView = 0                  # [0-6] UNOFFICIAL (2026-11-07) diagnostic, with Denoiser (core 0), seen with RT DebugView 0 and the effect's DebugView 1: 1 the raw rays, 2 accumulated without the blur, 3 history length (white = full), 4 blur radius (white = DenoiserBlur), 5 where the reflected thing is tracked (green), 6 hit distance (white near). 0: off.
SplitTest = false                      # UNOFFICIAL (2026-10-28) test only: with Enabled, runs the RT trace's two in-game passes (RayGen, Resolve) without any rays, even without the RT helper. The picture must be exactly the normal trace's (checks the split); shows the split's own cost. Leave off.
DebugView = 0                          # [0-7] UNOFFICIAL (2026-10-28) diagnostic, with RT: 7 (2026-11-05) the reflected direction as a colour (world axes, blue = up); 6 (2026-10-30) the fallbacks split (red the cloudless sky gradient, blue the surroundings cube, grey the light grid, green answered by the screen or the rays); 5 the scene alignment check (rays from the camera to each reflecting surface: green = the traced scene matches the screen, blue something nearer, yellow farther, red nothing hit); 1 where each reflection came from (green the screen march, cyan RT visible on screen, blue RT through the cube, magenta RT estimate, orange RT with the hit's own material, grey the old fallbacks); 2 the RT hit distance (white near, dark far, red nothing within Distance, black no ray); 3 the normal picture with RT alone (the screen march dropped); 4 a colour per hit instance (checks the scene). 0: normal picture.

[_Shaders.Reflections.Status]
Enabled = false                        # Screen-space reflections on the ground: wet streets mirror the neon and lamps in the rain; optional dry sheen and interior floors. Needs the normals buffer.

