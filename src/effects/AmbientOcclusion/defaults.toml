[_Shaders.AmbientOcclusion.Exteriors]
AngleBias = 1.6                         # Value to increase the contribution of closer samples for more detail in creases.
BlurDropThreshold = 8.0                 # Distance cutoff for areas that shouldn't be blurred together (edge aware denoise).
BlurRadiusMultiplier = 2.0              # Blur radius to denoise AO.
ClampStrength = 0.25                    # Lower limit to AO darkness (0 for pure black and 1 for pure white).
Enabled = true                          # Enable Ambient occlusion in exteriors.
LumThreshold = 0.7                      # Treshold to reduce AO strength on bright surfaces.
Range = 30.0                            # Distance for sampling. Larger values create a softer AO, smaller creates sharper details.
Samples = 5                             # Not used (currently hardcoded).
StrengthMultiplier = 1.0                # Global AO strength/darkness multiplier.

[_Shaders.AmbientOcclusion.Interiors]
AngleBias = 0.0                         # Value to increase the contribution of closer samples for more detail in creases.
BlurDropThreshold = 8.0                 # Distance cutoff for areas that shouldn't be blurred together (edge aware denoise).
BlurRadiusMultiplier = 2.0              # Blur radius to denoise AO.
ClampStrength = 0.2                     # Lower limit to AO darkness (0 for pure black and 1 for pure white).
Enabled = true                          # Enable Ambient occlusion in exteriors.
LumThreshold = 0.5                      # Treshold to reduce AO strength on bright surfaces.
Range = 30.0                            # Distance for sampling. Larger values create a softer AO, smaller creates sharper details.
Samples = 5                             # Not used (currently hardcoded).
StrengthMultiplier = 1.0                # Global AO strength/darkness multiplier.

[_Shaders.AmbientOcclusion.GTAO]
Enabled = false                      # UNOFFICIAL (2026-10-16): ground-truth ambient occlusion (GTAO, Jimenez et al. 2016) instead of the old SSAO: open flat ground is no longer greyed, corners and creases darken by how closed they really are, no halo round things in front. Uses the same Range, strength and fade settings. Applies immediately
MaxRadius = 64.0                     # [4-256] Largest search radius on screen, in pixels (close up the Range would cover half the screen)

[_Shaders.AmbientOcclusion.Skylighting]
Enabled = false                        # UNOFFICIAL (2026-10-17, new): outdoors, the sky's light is taken away where something above blocks the sky: under roofs, porches, bridges, overhangs and at the foot of cliffs. Uses a top-down map of the world round you and needs the ambient occlusion or (UNOFFICIAL 2026-10-20) AmbientLight on. Version 2 takes away only the sky's share of the light, so sunlit spots keep their sunlight.
Version = 2                            # UNOFFICIAL 2026-10-17: 2 = the sky's share only, its own clean and rarely redrawn map, quarter resolution (about 0.1-0.2 ms); 1 = the first version (darkens through the ambient occlusion, whole pixel, map redrawn every 4th frame).
Strength = 1.0                         # [0.0-1.0] How much of the blocked sky light is taken away.
Distance = 800.0                       # [64-4000] How far (game units) to look for something above. Larger: big overhangs and cliffs count from further away; smaller: only close cover. (Version 1 was tuned at 600.)
ShareApply = true                      # Version 2: take away only the sky's share of the light (false: the whole pixel, as a comparison).
OpenThreshold = 0.85                   # [0.5-1.0] Version 2: a spot that sees at least this much of the sky counts as open (no change), so open ground next to buildings keeps its light. 1.0: every bit of blocked sky counts.
DepthNormals = false                   # Version 2: work out the surface's slope from the depth (false: from the normals buffer, which is wrong on some road meshes and ground stains).
OwnProjection = false                  # Version 2: draw its top-down map with its own straight-down projection round you (false: the rain map's projection).
AmbientScale = 1.0                     # [0-10] Version 2: how strong the sky light is against the sun when the sky's share is worked out. Higher: sunlit surfaces under partial cover darken more.
CleanMap = true                        # Version 2: the top-down map takes leaves and fences with their holes and leaves out see-through effects (dust devils, glass), which would block the sky over open ground.
MapRefresh = 60                        # [1-100000] Version 2: frames between redraws of the top-down map while you stand still (cells that stream in). It is also redrawn when you move MoveRefresh units.
MoveRefresh = 200.0                    # [1-100000] Version 2: how far (game units) you move before the top-down map is redrawn.
SoftWidth = 40.0                       # [1-500] Version 2: how soft (game units) the edge of cover is in the test (against hard steps).
DebugView = 0                          # [0-4] Version 2, test views: 1 sky visibility, 2 the sky's share of the light, 3 the final darkening, 4 'covered' (something above the point in the map). 0 = off.
Reflections = false                    # UNOFFICIAL (2026-10-19) Skylighting step 3: the sky's reflection also goes where the sky cannot be seen, so wet floors, puddles and shiny ground under roofs, porches and overhangs stop mirroring a bright sky (the Specular effect's sky reflection and the wet-ground reflections' sky). Needs Skylighting Version 2 on. Costs next to nothing. After Community Shaders' Skylighting (GPL-3.0).
MinReflection = 0.1                    # [0-1] (2026-10-19) How much of the sky's reflection stays where the sky is fully hidden (Community Shaders' default 0.1).
LightCap = 0.1                         # [0-10] UNOFFICIAL (2026-10-20): the most light Skylighting may take from a spot, in multiples of the sky's light (x Strength x how much of the sky is hidden), so lamp-lit walls and glowing signs and bulbs under a roof or canopy keep their own light (the sky can only take the light it gave). 0.1 keeps lamps and glow and changes nothing in daylight; 0 = no limit (before 2026-10-20: a wide canopy at dusk turned everything under it, the bulbs too, black). Applies immediately.
OpenSides = 1.0                        # [0-1] UNOFFICIAL (2026-10-20): under a canopy, porch roof or bridge the sky test cannot see the open air at its sides, so it counted every spot under a wide cover as seeing no sky at all. 1 = for such a spot the low sky counts as open wherever nothing taller than the spot stands at the test's reach (an open-sided canopy keeps its side light; a cliff or the house beside a porch still blocks). 0 = as before (stronger darkening under covers). Applies immediately.

[_Shaders.AmbientOcclusion.RT]
Enabled = false                        # UNOFFICIAL (2026-10-28, the DXVK fork, ray tracing): ambient occlusion and sky visibility from rays traced against the real scene instead of the screen: what is off screen, behind the first surface or thinner than it looks still darkens, and no light leaks through walls. Takes the place of the screen estimate of AmbientLight (or of this AO when AmbientLight is off) and of Skylighting's top-down map; the strength and fade settings stay theirs. Needs the DXVK fork's d3d9.dll with ray tracing, [Main.Main.Performance] NvrDxvkPasses on and a GPU with ray queries (AMD RDNA2+, NVIDIA RTX, Intel Arc); anywhere else it does nothing and the current AO runs (logged once). Applies immediately
RayCount = 2                           # [1-16] Rays per pixel (half resolution) and frame for the occlusion. More: less grain before the blur and history smooth it, cost grows with the count (2: as good as 4 after the smoothing, about 40 % cheaper). Applies immediately
Distance = 120.0                       # [8-1000] How far (game units, about 70 = 1 m) a ray looks for something that occludes. Longer: broader, softer occlusion (under cars, in rooms); shorter: contact shadows only, cheaper. Applies immediately
Sky = true                             # The sky visibility (Skylighting, which must be on) from rays too, instead of its top-down map: overhangs, bridges and the inside of buildings block the sky by their real shape. Applies immediately
SkyRays = 16                           # [8 or 16] Rays per pixel for the sky visibility (fixed directions round the normal: no grain, no flicker). 8: one ring, cheaper. Applies immediately
SkyInsideFix = true                    # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: a sky ray that starts just under the traced ground (a road or path drawn a little below the land, the depth a little off far away) hit that ground from underneath and took it for cover, so Skylighting with RT AO darkened whole roads and paths with hard straight edges (the RT AO's own rays already passed such a hit, so RT AO alone looked right). On: the ray carries on past it. Off: as before.
GIAmbientUnits = true                 # UNOFFICIAL (2026-11-11), BUG FIX, applies immediately: the bounce hits' ambient (GIAmbient, GISky) is now scaled by the game's ambient scale (PBR AmbientScale), as the game's lit shaders do and as the sun already was (with GIGameLamps on). Unscaled, the ambient and sky share at a hit was off by that factor. Off: as before.
SkySoftEdges = true                    # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: cover near the end of a sky ray counts less and less (as the AO rays' cover does), and the ray-traced sky factor fades out over the last quarter before 8000 units instead of stopping there, so Skylighting with RT AO draws no hard line at SkyDistance from walls, cliffs and banks, or at 8000 units. A little lighter in places. Off: as before.
RtFarFade = true                       # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: the rays are traced out to 8000 units only, but AmbientLight kept the traced occlusion and the RT GI bounce light on out to its own DrawDistance, so with DrawDistance above 8000 (or a high GIStrength) they stopped dead at 8000 units: a hard line across the ground, worst where the bounce light is strong against DarkestOcclusion. On: both fade out between 6000 and 8000 units. Off: as before.
SkyDistance = 800.0                    # [64-8000] How far (game units) a sky ray looks for cover (Skylighting's Distance). Applies immediately
DebugView = 0                          # Test views: 1 the ray-traced visibility alone, before strength (through AmbientLight's occlusion view, or as this AO); 2 the ray-traced sky visibility (through Skylighting's view 1); 3 black where rays began inside something (depth and scene disagree), else grey by the mean hit distance; 4 and 5 (test only) the rays' input: view distance / 2000 and the normal's up component (white up, black down, grey sideways); 6 the bounce light alone (GI on); 7 the same with every bounce hit lit as if off screen (shows RadianceCache's whole share); 8 (2026-11-09, test only) the tangent frame the AO and GI rays' directions are built in: white = flat normals (n.z 0.999 or more), grey = tilted ones, the shade = the angle of their tangent (through AmbientLight's occlusion view; set DarkestOcclusion to 0 to see it plainly): two regions of another shade are two frames. 0 = off.

GI = false                             # UNOFFICIAL (2026-10-29, ray tracing, needs Enabled above and AmbientLight): one bounce of light from what is really around a spot, on screen or not: a sunlit wall tints the shaded ground beside it, a lamp-lit floor lights the underside of a table. One ray per pixel (half resolution) and frame, smoothed over frames by AmbientLight. Applies immediately
GIDistance = 1500.0                    # [100-8000] How far (game units) a bounce ray looks for a surface that sends light back. Applies immediately
GIStrength = 1.0                       # [0-20] How much bounce light is added (x the surface's own colour), as ComputeGIStrength. Applies immediately
GIOffscreen = 1.0                      # [0-1] The light of bounce rays' surfaces, worked out from the sun and the lamps, times this (1 = in the same units as the reference path tracer, checked 2026-11-03: docs/next/RT-PATH-TRACING.md section 17; was 0.1, set against the old screen-space GI, which made most of the bounce 10 times too dark). With GIScreenLight on it scales only the hits off screen. Applies immediately
GIScreenLight = false                  # UNOFFICIAL (2026-11-03) On: bounce rays that hit something on screen take the light the game drew there (the old way). It is not in the bounce's units: it also carries the game's ambient light (a second copy indoors: 15 times the real bounce in Lucky 38) and outdoors only about half the sun's bounce. Off (default): every hit's light is worked out from the sun and the lamps. Applies immediately
GIGameLamps = true                     # UNOFFICIAL (2026-11-03) The bounce rays' surfaces are lit by the game's own lamps: the lamps the game lights the frame with (its lamp table), their reach, colour and falloff (the reference path tracer's PTGameLamps 4 matches the game's direct lamp light this way: docs/next/RT-PATH-TRACING.md section 21). Off = the older lamp list and falloff (dimmer over most of a lamp's reach). Needs LightCommonLamps (on by default). Applies immediately.
GIClamp = 1.0                          # [0.05-4] The brightest one bounce ray may bring back (luminance, 1 = white in the game's frame): a ray that lands on a lamp's glow otherwise lights one pixel far more than its neighbours (flickering specks). Lower: calmer, but bright surfaces bounce less. Applies immediately
Denoise = true                         # The ray-traced occlusion through the shared RT denoiser (a temporal pass and three edge-aware smoothing passes, as the RT sun shadows use) before the occlusion is applied: calm from few rays. Off: the raw rays (AmbientLight's own blur and history still smooth them). Applies immediately
Interleave = 1                         # 1, 2 or 4: trace every pixel each frame, or every 2nd (a checkerboard), or every 4th (one of each 2 x 2, in turn); the others keep their last result and the smoothing over frames blends them. 2 or 4 cut the ray cost by about half or three quarters; when you turn fast the shading catches up over a few frames. Applies immediately
AOAlpha = 1                            # 0, 1 or 2: alpha-tested meshes (leaves, fences, signs) for the occlusion rays: 0 left out, 1 solid (cheap: a leaf card occludes whole), 2 tested against their texture's alpha (exact, about 3x the occlusion cost). Needs [Main.Main.RayTracing] AlphaTested; applies immediately
DenoiseKernel = 3                      # 3 or 5: the smoothing filter's size (3 is about 2.5x cheaper, a little less smooth). Applies immediately
GlowGI = 0.0                           # 0-4: glowing surfaces (neon signs, lit windows, lamp globes, screens) light their surroundings through the bounce light, with their own colour, this strong; also when they are off screen. 0 = off. Needs GI; best with [Main.Main.RayTracing] HitTextures. Applies immediately
GlowDirect = 0.0                       # 0-8: glowing objects (neon signs, lit windows, lamp globes, screens) light nearby floors and walls directly in their own colour, with soft shadows (the 32 strongest in view of the camera, one picked per pixel). 0 = off. Needs GI with GIReuse above 0. Applies immediately
GISpatial = 0                          # 0-4: with GIReuse, also merge this many neighbouring pixels' bounce samples (ReSTIR's spatial step): less noise, no extra rays; may leak a little light into contact shadows. Applies immediately
GIReuse = 8                            # 0-32: the bounce light reuses good samples from earlier frames on the same surface (ReSTIR GI), at most this many frames back: much less noise for the same rays; a light switched off fades over that many frames. 0 = no reuse (the old way). With GIInterleave 4 it is cheaper than full-rate GI and clean in motion (the old way smears there). Applies immediately
GIInterleave = 1                       # 1, 2 or 4: the bounce rays (GI) in every, every 2nd or every 4th block of pixels each frame, in turn (on top of Interleave); the others keep their last bounce light, which the smoothing blends. The bounce rays are about two thirds of the ray tracing's cost. Applies immediately
GIAmbient = 0.0                        # [0-1] How much of the ambient light a bounce ray's surface sends back too (0: only the sun and the lamps it gets: the game's ambient already stands for the indirect light; 1 brightened Lucky 38 by about 25 %). Applies immediately
GISky = 0.0                            # [0-1] UNOFFICIAL (2026-11-10) Outdoors, a bounce ray that finds nothing within GIDistance brings back the sky's light (the game's ambient colour, full for rays above the horizon, none below it), times this. Then open ground, roofs and the tops of rocks get bounce light too and GIStrength brightens them; ground beside walls, rocks and under overhangs gets less, as their rays meet those instead of the sky. 0 (default) = as before: a ray that finds nothing brings back nothing (the game's ambient already stands for the sky's light, so this adds a second copy of it, and GIStrength multiplies it too: keep GISky x GIStrength at about 0.5 or less; start with 0.1). Needs GI. Applies immediately
RadianceCache = false                  # UNOFFICIAL (2026-10-31, ray tracing, needs GI and GIReuse above): light that bounces more than once. A grid of light cells round you (32 x 32 x 16, fixed in the world) keeps what light reaches each spot after one, two, three... bounces (each cell traces rays to what it sees, lit by the sun, the lamps and the grid itself); bounce rays that hit something off screen add it, so a room lit from behind you or a corner two bounces from the sun is no longer black. Applies immediately
CacheStrength = 1.0                    # [0-2] How much of the grid's light a bounce ray's surface sends back. Applies immediately
CacheCellSize = 128.0                  # [32-512] Size of one grid cell in game units (128: about 1.8 m; the grid covers 32 x 32 x 16 cells round you). Smaller: finer, shorter reach. Applies immediately
CacheRays = 8                          # [1-32] Rays a cell traces when it is updated (1 in CacheSpread cells each frame). More: less flicker in the cells, more cost. Applies immediately
CacheFrames = 16                       # [1-32] How many updates a cell's light averages at most (more: steadier; fewer: follows a lamp switched on or off sooner). Applies immediately Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
CacheExteriors = false                 # [true/false] UNOFFICIAL (2026-10-31): the radiance cache outdoors too. Off = interiors only (outdoors most bounce rays land on screen, where the lit frame already holds the light, and the cache cost 7.8 ms a frame on an iGPU in Goodsprings). Applies immediately
CacheSpread = 8                        # [1, 2, 4, 8, 16, 32] Updates 1 in this many cells a frame (indoors). Higher: cheaper, slower to follow a lamp switched on or off. Applies immediately
CacheRaysExterior = 4                  # [1-32] CacheRays outdoors (with CacheExteriors). Applies immediately
CacheSpreadExterior = 8                # [1, 2, 4, 8, 16, 32] CacheSpread outdoors (with CacheExteriors). Applies immediately
GIMovingHistory = 4                    # 0-16, with [Main.Main.RayTracing] DenoiseBackbone on: the bounce light's smoothing over frames keeps at most this many frames on people and things that move themselves (a walking NPC: the bounce light on it changes as it walks, and 16 frames of it trail behind). 0 = no limit. Applies immediately Frames at 60 fps (perf-history 2026-11-07): at other frame rates the same seconds ([Main.Main.RayTracing] DenoiseTimeBased).
GIReuseSpread = true                   # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: with GIReuse, a bounce sample carried over from the last frame onto ground you are now closer to (running forward, turning) is shared by several pixels; each copy now keeps only its share of the sample's weight, so the copies do not all hold on to it for GIReuse frames. Off: dark and light streaks fanned out along the way you move (as before).
GIReuseShuffle = true                  # UNOFFICIAL (2026-11-08), BUG FIX, applies immediately: with GIReuse, last frame's bounce sample is taken from a pixel next to the matching one, shuffled each frame (every pixel still used once), so samples copied side by side part ways next frame: fine noise the smoothing removes instead of streaks. Off: as before.
GIDenoiseAntiLag = 3.0                 # UNOFFICIAL (2026-11-08) [0.0-16.0], applies immediately: the bounce light's smoothing over frames keeps a fast 4-frame history beside its long one; where the long one drifts outside the fast one's range by this many standard errors (a shadow moved, you turned onto something new), the light really changed and the history restarts short, so trails clear in a few frames (as the path tracer's PTDenoiseAntiLag). Lower: quicker, a little noisier. 0 = off (as before).
SampleLockFix = true                   # UNOFFICIAL (2026-11-09), BUG FIX, applies immediately: the AO and GI rays' two sample numbers were locked together, so every pixel's ray came from one spiral of directions that turned 0.14 of a turn each frame: the bounce light pulsed every 7.3 frames (about 8 times a second) and showed a screen-fixed diagonal step where the surface normals' tangent frame changes. On: independent numbers. Off: the old ones, to compare.
NormalGuard = true                     # UNOFFICIAL (2026-11-09), BUG FIX, applies immediately: the ray-traced occlusion and bounce light read each pixel's surface direction without a texture sampler, and a pixel whose entry is still not a real direction gets one rebuilt from the depth picture. On one tester's graphics driver the old read came back blank on every pixel: all rays started from one wrong direction, which showed as a screen-fixed 45-degree triangle in the bounce light and as dark trails when moving. false = the old read (for comparing).
GIStrengthNight = -1.0                 # [-1-20] UNOFFICIAL (2026-11-10), applies immediately: outdoors at night GIStrength becomes this (blended over dusk and dawn, as the game's own day/night change). -1 = no night value: GIStrength all day (as before). Indoors: GIStrength
GISkyNight = -1.0                      # [-1-1] UNOFFICIAL (2026-11-10), applies immediately: the same for GISky. -1 = GISky all day (as before)
GIStrengthInterior = -1.0              # [-1-20] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIStrength. -1 = the same value indoors and out (as before)
GIAmbientInterior = -1.0               # [-1-1] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIAmbient. -1 = the same value indoors and out (as before)
GIClampInterior = -1.0                 # [-1-4] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIClamp. -1 = the same value indoors and out (as before)
GIDistanceInterior = -1.0              # [-1-8000] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GIDistance. -1 = the same value indoors and out (as before)
GlowGIInterior = -1.0                  # [-1-4] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GlowGI. -1 = the same value indoors and out (as before)
GlowDirectInterior = -1.0              # [-1-8] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces GlowDirect. -1 = the same value indoors and out (as before)
LegacyTiltInterior = -1.0              # [-1-1] UNOFFICIAL (2026-11-10), applies immediately: indoors this replaces LegacyTilt. -1 = the same value indoors and out (as before)
LegacyTilt = 0.0                       # [0-1] UNOFFICIAL (2026-11-10), live, a LOOK option, off at 0: brings back the much darker ray-traced AO, sky light and bounce light that 1.0.6 gave on some NVIDIA drivers by mistake (every ray started from one fixed direction, left-down-toward the camera, instead of the surface's own normal), without the dark triangle that came with it. The value is how far each surface's normal is bent toward that direction: 0.5 is a clear darkening, 1 is the old picture exactly (the look then changes as you turn the camera, and dark trails behind moving things can come back). Not physically right at any value above 0.

[_Shaders.AmbientOcclusion.FastPaths]
Enabled = true                         # UNOFFICIAL (2026-10-17): the same ambient occlusion for less GPU time outdoors: sky and distant pixels really skip the occlusion samples and both blurs (the shader compiler had turned that early exit into work every pixel did). Off = the original passes. Applies immediately

[_Shaders.AmbientOcclusion.Status]
Enabled = true                          # Shadows based on object proximity/creases for more realistic light contribution.

