[_Shaders.Grass.Main]
ScaleX = 1.0
ScaleY = 1.0
ScaleZ = 1.0
GameShaderFix = true                   # FIX (2026-10-17): only matters if the mod's grass pixel shaders are missing (since 2026-10-27 the mod draws grass with or without the game's MSAA and transparency multisampling, with its sun shadow; before, without them grass was drawn with the game's own pixel shader, and since P80 that one got its light without the sun angle and the blade's light scale: every blade fully sunlit on every side, too bright and flat. true = the game's values again (as P79). false = the P80 behaviour, for comparison only.
DrawFirst = true                       # UNOFFICIAL (2026-10-17): the grass is drawn before the ground, so the ground's expensive shading is skipped under it (the faraway fading grass is still drawn after the ground, as before). Same picture (checked in game at noon, dusk and night), about 1 ms faster in a dense grass field. Live. false = the old order.
DrawFirstRestore = 5                   # UNOFFICIAL, diagnostic (2026-10-17): with DrawFirst, which device state is put back after the early grass (1 shader constants, 2 render states, 4 sampler states, 8 texture stage states, 16 textures). Leave at 5 (constants + sampler states).
ShadowFix = true                       # FIX (2026-10-27): the sun shadow on grass was striped and fell on the wrong side of each tuft (its normal faced the camera, not the sun). true = the tuft takes the ground's shadow evenly. false = the old look, for comparison only.
SkyLightScale = true                   # FIX (2026-10-27): grass in shadow was a little too bright: the mod's sky light skipped the darkening the game gives each tuft's ambient light. true = the sky light takes it too. false = the old look, for comparison only. Live.
PointLights = false                    # UNOFFICIAL (2026-10-27): grass lit by a lamp or fire (the game's 1POINT grass shaders) also gets the mod's sun shadow, ShadowFix and the grass wind, instead of the game's own shader (no mod shadow there: tufts near a lamp look different from the rest). No sandstorm gusts on those tufts. Not tested in game yet. Restart the game after changing. false = the game's shaders, as before.
CastShadows = true                     # UNOFFICIAL (2026-10-27): the grass tufts cast sun shadows on the ground and on everything drawn after them, as the placed bushes always did (before, grass took the shadows of others but threw none). They are drawn a second time into the near sun shadow map, so it costs some graphics card time where there is a lot of grass (the F10 profile shows it as "Grass shadows"). Needs DrawFirst on and the PCF sun shadow maps ([Shaders.ShadowsExteriors.ShadowMaps] Mode 3, the default). Near the camera only (the near shadow cascade). With Terrain Blending on too (since 2026-10-28: the grass is then drawn into the shadow map only before the land, and on screen at its usual place). Live.
CastShadowsReach = 1050.0               # UNOFFICIAL (2026-10-28) [0-4000], live: how far from you the grass casts sun shadows, in world units (70 is about 1 m; 1050 = 15 m). The nearest shadow map ends only 2-3 m out (with CascadeLambda 0.9), so the grass shadows used to fade there; now the tufts within this distance are also drawn into the next two sun shadow maps (a little softer there, as every shadow is). Costs more graphics card time the further it reaches in thick grass (F10 profile: "Grass shadows"). 0 = the nearest shadow map only, as before.
CastShadowsBlack = false               # UNOFFICIAL (2026-10-27), diagnostic, live: the grass shadows are drawn solid black (the tufts as if right against the sun), so you can see at once whether and where the grass casts. For checking only: leave off.
DrawFirstCull = true                   # UNOFFICIAL (2026-10-17): with DrawFirst, grass pieces that are all near or all in the distance fade are drawn once instead of twice. Same picture, less vertex work.

[_Shaders.Grass.GPUGrass]
Enabled = false                        # UNOFFICIAL (2026-10-27) GPU GRASS, a LOOK CHANGE, OFF by default (user 2026-10-27), NEEDS the DXVK fork 1.7-grass (does nothing on native D3D9, stock DXVK or an older DXVK fork: the game's grass cards as before, said once in the log), live: the near grass is drawn as thousands of thin strands that the graphics card places, culls and counts itself (one compute pass and two draws a frame), instead of the game's flat alpha-tested grass cards. Same places as the game's grass (the game's own tufts: positions, slopes, sizes, brightness, the grass types of each land texture), each clump in its card's own colours and outline, lit as the game lights its grass, in the grass wind (Grass Wind section) or the game's sway. The faraway fading grass stays the game's cards. Needs the grass drawn before the ground (Grass > Main > DrawFirst, off by default (user 2026-10-27); with Terrain Blending on it runs after the land instead (2026-11-05, from Balebandro's fork), while the grass casts its sun shadows). Off (or without the fork) = exactly the game's grass.
KeepCards = false                      # false = the strands replace the game's grass cards (what this option is for); true = the cards stay and the strands are added round them (a fuller clump).
BladeDistance = 7000.0                 # [0-20000] Grass pieces whose nearest tuft is farther than this (game units) stay the game's cards, a whole piece at a time. 7000 = everything before the default grass fade start.
Density = 1.0                          # [1-6] Clumps per tuft the game placed: 1 = exactly the game's tufts; 2-6 = extra clumps of the same plant beside each one, on the same slope (denser fields; the cost grows with it).
ExtraRadius = 60.0                     # [0-300] With Density above 1: how far from its tuft an extra clump may stand, in game units.
Blades = 64                            # [1-128] Strands per clump up to LodNear (thin twigs: with Coverage 1 about 1-2 units wide).
BladesFar = 8                          # [1-128] Strands per clump from LodFar on (in between it falls smoothly). Fewer strands far away are wider, so the field keeps its density (Coverage).
LodNear = 600.0                        # [0-20000] Up to this distance every clump has all its strands.
LodFar = 2500.0                        # [0-20000] From here on the far strand count.
DetailDistance = 1200.0                # [0-20000] Strands nearer than this are curves of 5 triangles, farther ones a single triangle each (cheaper; the curve is invisible that far).
Coverage = 1.0                         # [0.2-6] How much the strands of a clump cover together, as a multiple of the opaque part of the game's card (one card; a tuft is 2-3 crossed cards). Higher = bushier clumps, wider strands.
MinPixelWidth = 0.75                   # [0-4] No strand is drawn narrower than this many pixels (far strands widen instead of shimmering).
HeightScale = 0.9                      # [0.2-2] Strand height relative to the plant's height on its card (the card's opaque top).
LengthMin = 0.4                        # [0.1-1] The shortest strand of a clump as a share of the plant's height (the short ones at the edge make the dome of a bush).
TipReach = 1.0                         # [0.2-2] How far out the strands reach: tips between half of and this many times the card's outline at their height.
Spread = 0.15                          # [0-1] How far from the clump's centre a strand's root may stand, as a share of the card's half width.
Bend = 0.5                             # [0-1] How much a strand bows outward on its way to its tip.
Kink = 0.5                             # [0-2] A sideways wobble along each strand (a dry twig's kinks); 0 = smooth.
Droop = 0.5                            # [0-1] How far a strand leaning out to the clump's edge drops its tip.
Flutter = 0.15                         # [0-2] A sideways flutter in the wind on top of the sway.
Variation = 0.2                        # [0-1] Each strand a little lighter or darker (+-).
TipLift = 0.3                          # [0-1] A warm lift of the colour toward the tip.
Saturation = 1.0                       # [0-2] The strands' colour saturation (1 = the card's own colour).
MaxBlades = 524288                     # [4096-2097152] How many strands a frame can hold in each of the near and far lists (48 bytes each on the graphics card); strands past it are not drawn (the log says how many).
DebugView = 0                          # DIAGNOSTIC: 1 = near strands red, far strands blue; 2 = a colour per game grass draw. 0 = the real colours.
Log = 0                                # DIAGNOSTIC: 1 = the graphics card's counts (clumps, strands near / far) in the log every 300 frames (otherwise the first frames and once a minute).

[_Shaders.Grass.Collision]
Enabled = false                        # UNOFFICIAL (2026-10-19) Grass that moves when you walk through it: you and the people and creatures near you push the grass aside, and it springs back behind you. Costs next to nothing (a small texture made each frame, one extra read per grass vertex). Works on the game's grass and on GPU grass strands; every grass type now bends by the full Strength (it used to follow each grass's own sway stiffness, so most grass hardly moved). After Community Shaders' Grass Collision (GPL-3.0); this build's own version for DirectX 9.
Strength = 28.0                        # [0-200] (2026-10-19) How far a blade's tip is pushed aside right at someone's feet, in game units (2026-10-20: the full amount from 50 units above the ground up, for every grass type).
Radius = 1.0                           # [0.1-5] (2026-10-19) How wide the pushed patch is, times each actor's own size.
Recovery = 2.5                         # [0-60] (2026-10-19) Seconds for the grass to spring back once nobody stands in it (0: at once).
Range = 1536.0                         # [256-8192] (2026-10-19) How far from you actors still push grass, in game units. Smaller: a finer push map (sharper footprints).
Actors = 16                            # [0-64] (2026-10-19) How many of the nearest people and creatures push grass besides you.

[_Shaders.Grass.Lights]
Enabled = true                         # UNOFFICIAL (2026-11-05, from Balebandro's VegasShaders fork), live: placed lights and the Pip-Boy light light the grass (never the sun, which the grass already gets): the nearest lamps NVR tracks, with the game's falloff and a soft wrap (a blade lets light through to its back). Costs nothing where no lamp is near. Not on the grass the PointLights option gives the game's lamp shaders.
MaxLights = 8                          # [0-8] The most lamps on the grass at once, nearest first.
Strength = 1.0                         # [0.0-1.0] How bright the lamps are on the grass.

[_Shaders.Grass.NormalMaps]
Enabled = true                         # UNOFFICIAL (2026-11-05, from Balebandro's VegasShaders fork), live: a grass texture with a normal map beside it, named after it with _n (grass01.dds -> grass01_n.dds, rock_d.dds -> rock_n.dds; loose or in a BSA), gets per-pixel sunlight from that map. Grass without one looks exactly as before.
Strength = 1.0                         # [0.0-4.0] How much the normal map bends the light. 0 is the grass's own lighting.
EnableSpecular = true                  # The sun's highlight on the grass. Where the grass has a normal map, its alpha says how shiny each spot is; grass without one shines evenly.
SpecularStrength = 0.5                 # [0.0-4.0] How bright the highlight is.
Glossiness = 32.0                      # [1-512] How tight the highlight is: low a broad sheen, high a small sharp glint.

[_Shaders.Grass.Wind]
Enabled = false                        # UNOFFICIAL (2026-10-20) GRASS IN THE WIND, a LOOK CHANGE (off): the grass moves like a field in the wind instead of every tuft swaying on its own. Gusts roll across the grass along the weather's wind like waves through wheat (stronger and faster as the wind rises), each tuft flutters a little on its own, and the game's own sway follows the weather's wind direction -- the same wind cloth uses, so grass and coats agree (the game itself sways all grass north-south whatever the weather). Works on the game's grass cards. Off = exactly the game's sway. Live.
GustStrength = 2.0                     # [0-10] (2026-10-20) How far a passing gust leans the grass, as a multiple of the game's own sway (which already grows with the weather's wind speed and keeps each grass model's own stiffness). 1 = subtle, 3-4 = strong rolling waves, 0 = no gusts.
GustSize = 1200.0                      # [50-20000] (2026-10-20) Distance from one gust front to the next, in game units (1200 is about 17 m). Bigger = broad slow waves, smaller = choppy.
GustSpeed = 300.0                      # [0-3000] (2026-10-20) How fast the gusts roll across the field, in units per second at a middling wind (0.4x in dead calm up to 1.6x in a gale, as cloth). The flutter quickens with it (8 quivers per passing front).
Flutter = 0.3                          # [0-10] (2026-10-20) Each tuft's own small quiver, as a multiple of the game's sway, so neighbouring tufts never move in step. 0 = none.
UseGameWind = true                     # (2026-10-20) Take the wind's direction from the weather (as cloth does). false = Direction below.
Direction = 0.0                        # (2026-10-20) With UseGameWind off: where the wind blows toward, in degrees from north (0) toward east (90).
TimeOffset = 0.0                       # (2026-10-20) Test only: seconds the gust pattern is ahead (for pictures at set moments). Leave 0.
Log = 0                                # (2026-10-20) DIAGNOSTIC: 1 = a log line every 600 grass shader binds with the game's grass wind values, the weather's wind and these settings as the shaders get them.

[_Shaders.Grass.Status]
Enabled = true                        # Replaces the grass shaders.

