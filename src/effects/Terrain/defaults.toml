[_Shaders.Terrain.Main]
UsePBR = true                       # Use PBR lighting, disable to use vanilla.
Roughness = 1.0                     # Scale texture roughness, higher roughness decreases specular.
Metallicness = 0.0                  # Add metallicness.
AmbientScale = 0.5                  # Scale ambient lighting.
SkylightingScale = 0.5              # Sky-colour ambient boost. 0 disables it.
SkylightingDirectionality = 0.6      # Mode 1 only: 0 samples straight up, 1 along the normal.
LightingScale = 0.725               # Scale non-ambient lighting (sun or spotlights).
TerrainSaturation = 1.0             # Control terrain saturation.

[_Shaders.Terrain.Rain]
Roughness = 0.7                     # Scale texture roughness, higher roughness decreases specular.
Metallicness = 0.0                  # Add metallicness.
AmbientScale = 0.5                  # Scale ambient lighting.
SkylightingScale = 0.5              # Sky-colour ambient boost. 0 disables it.
SkylightingDirectionality = 0.6      # Mode 1 only: 0 samples straight up, 1 along the normal.
LightingScale = 1.0                 # Scale non-ambient lighting (sun or spotlights).
TerrainSaturation = 1.0             # Control terrain saturation.

[_Shaders.Terrain.Night]
Roughness = 1.0                     # Scale texture roughness, higher roughness decreases specular.
Metallicness = 0.0                  # Add metallicness.
AmbientScale = 0.5                  # Scale ambient lighting.
SkylightingScale = 0.5              # Sky-colour ambient boost. 0 disables it.
SkylightingDirectionality = 0.6      # Mode 1 only: 0 samples straight up, 1 along the normal.
LightingScale = 1.0                 # Scale non-ambient lighting (sun or spotlights).
TerrainSaturation = 1.0             # Control terrain saturation.

[_Shaders.Terrain.NightRain]
Roughness = 0.6                     # Scale texture roughness, higher roughness decreases specular.
Metallicness = 0.0                  # Add metallicness.
AmbientScale = 0.5                  # Scale ambient lighting.
SkylightingScale = 0.5              # Sky-colour ambient boost. 0 disables it.
SkylightingDirectionality = 0.6      # Mode 1 only: 0 samples straight up, 1 along the normal.
LightingScale = 1.0                 # Scale non-ambient lighting (sun or spotlights).
TerrainSaturation = 1.0             # Control terrain saturation.

[_Shaders.Terrain.Parallax]
Enabled = true                      # Turn on parallax occlusion mapping for terrain.
Shadows = true						# Turn on height based self shadowing.
ShadowsAtNight = false              # UNOFFICIAL: keep the self shadowing at night too. Off (default): skipped while the sun is down, where the moon is too dim for it to show (measured: no changed pixels at a night test spot, about 1 ms faster there at 1440p).
HeightBlend = true                  # Turn on height based texture blending.
HighQuality = true                  # Turn on high quality. Double the number of steps, higher performance impact.
MaxDistance = 2048                  # Controls the maximum distance for the parallax and shadow effects.
Height = 0.1						# Controls the height. Changing can break the visuals, especially with low max steps.
ShadowsIntensity = 2.0              # Intensity of self shadowing.
IsoHeightTaps = true                # UNOFFICIAL: the parallax height lookups take one plain filtered sample each (at the same detail level) instead of the anisotropic filtering the game's iMaxAnisotropy puts on the land maps; colour and normals keep it. Measured at noon: ground 4.0 -> 2.4 ms, a change below the frame-to-frame flicker. Off = the old lookups.
SkipEmptyLayers = true              # UNOFFICIAL: skip the colour and normal lookups of ground layers that have no weight at a pixel (they add exactly nothing). Same picture (largest difference 3e-7); measured at noon: ground -0.36 ms on top of IsoHeightTaps.

[_Shaders.Terrain.Blending]
Enabled = false                     # UNOFFICIAL, needs a game restart to turn ON (off works at once): blend objects into the ground where they meet it (from the Physically-Based-Reloaded fork, after Community Shaders' Terrain Blending). The land fades out over the part of a rock, wall or prop just below it, so it sinks softly into the terrain instead of ending in a hard line. Exteriors only. Smooth (below) fades it without needing TAA. Costs one depth copy a frame plus a little on the land. Not with SunSmoothing CrossFade (no sampler left on the land shaders).
Smooth = true                       # UNOFFICIAL: fade the land by blending it over the object (smooth without TAA). Off: the old dither (smooth only with TAA, a fine stipple without).
BlendDistance = 10.0                # [0.5-20.0] How deep below the land surface an object still shows through, fading out (game units, 70 = 1 m). Larger = a wider, softer seam.
GroundWidth = 24.0                  # [0-100] (ported from mrfury97's fork) The blend band's width across the ground, at most (game units): shallow objects such as road shoulders get a seam this wide instead of metres of see-through land, and meshes lying parallel just under the land get none.
HeightBlend = 1.0                   # [0-2] How much the land texture's height map shapes the edge: sand between pebbles reaches further over the object. 0 gives a smooth fade.
HeightEdge = 2                      # [0-2] UNOFFICIAL (community submissions): 2 (2026-10-20 update) = the edge follows the land texture's height map with strong contrast (crisp, patchy) and the land turns solid sooner (more ground stays round rocks and walls; the band is BlendDistance x SlopeBlend alone); 1 (2026-10-17) = the height-weighted edge without the contrast, with the ground-width band; 0 = the softer height nudge. Uses HeightBlend as its strength.
SlopeBlend = 1.0                    # [0-2] BlendDistance multiplier on steep land (cliffs, hill sides). 1 keeps it the same everywhere.
MinPixels = 3.0                     # [0-8] The fade is at least this many pixels wide on screen, so distant blends don't shimmer.
DebugView = 0                       # [0-4] 0 off. 1 the blend band magenta. 2 how much land is kept (white: all). 3 how deep the object is below the surface (black at the surface, white at four times BlendDistance; dark blue: nothing behind the land). 4 how deep the fade reaches (white: the full BlendDistance, grey: a shallow object's seam, black: none).
MaxDistance = 4096.0                # [256.0-16384.0] Blending stops beyond this distance from the camera (fading back to a hard edge over the last quarter).
ShadowDrop = 1.0                    # [0.0-4.0] UNOFFICIAL: with Forward Shadows, the part of an object the faded land reveals sat in the land's own sun shadow (a dark strip along the seam). The land is drawn into the sun shadow maps BlendDistance times this lower, so only what is buried deeper than the blend band stays shadowed by it. 0 = off (the old shadows). Works at once.
Debug = false                       # Old switch, kept for old settings files: true = DebugView 1.

[_Shaders.Terrain.Erosion]
Enabled = false             # Erosion gullies carved into the shading of distant (LOD) slopes (from Physically-Based-Reloaded by Balebandro). Only the lighting changes, not the outline. Off: unchanged.
Depth = 1.0                 # [0.0-4.0] How deep the gullies look.
Spacing = 1024.0            # [128.0-16384.0] The widest gullies' spacing, in game units; finer layers follow at half, quarter, ...
GullyDarkening = 0.35       # [0.0-1.0] How much darker the gully floors are than the crests.
NearDistance = 8000.0       # [0-200000] Closer than this, slopes get only NearStrength of the gullies and only the widest.
FarDistance = 40000.0       # [0-400000] From here on, full depth and detail.
NearStrength = 0.15         # [0.0-1.0] How much of the gullies near mountains keep.
FarDetail = 1.0             # [0.0-1.0] Two more, finer gully layers on far mountains.

[_Shaders.Terrain.LOD]
LODNoiseScale = 0.7                 # Amount of noise applied to LOD.
LODNoiseTile = 2.7                  # LOD noise texture tiling modifier.

[_Shaders.Terrain.Variation]
Enabled = false                     # UNOFFICIAL (2026-10-19) Less repeating ground: each ground texture is read twice at shifted, randomised spots and blended, so the desert stops looking like the same tile laid over and over (slightly softer contrast in exchange). Needs a restart. Some GPU time on the ground (its first Layers textures read twice); StartDistance can keep it off nearby. Ported from Conor's (mrfury97) fork, after Community Shaders' Terrain Variation (both GPL-3.0), after Deliot and Heitz 2019.
Layers = 2                          # [1-7] (2026-10-19) How many of a ground patch's textures (the first ones) get the variation. Needs a restart. Each one doubles that texture's reads; most open ground uses one to three.
Scale = 1.0                         # (2026-10-19) Random cells per texture repeat. Lower: bigger patches (keeps more of the texture's own large shapes); higher: changes more often but blends more, softening contrast.
HeightInfluence = 0.3               # [0-4] (2026-10-19) How much the textures' height decides the blend between the two reads. 0: a plain crossfade (both half-visible across the seam); higher: the taller one wins its own area, so seams follow stones and cracks.
StartDistance = 0.0                 # (2026-10-19) Game units from you before the variation starts (0: everywhere). Measured in one noon desert view (2560x1440, GTX 1070): everywhere and off cost the same within 0.1 ms. If the ground ever costs you more, 1000-2000 keeps it off under your feet.
StartFade = 512.0                   # (2026-10-19) Game units over which the variation fades in after StartDistance.
NormalMaps = true                   # (2026-10-19) The ground's normal maps (its bumps) vary too. Off: only the colour varies, for about half the cost; the bumps keep the plain repeat.

[_Shaders.Terrain.Macro]
Enabled = false                     # UNOFFICIAL (2026-11-04) Large-scale ground variation: a slow change in brightness and tint over hundreds of metres (paler sand here, darker gravel there, a warmer or greyer stretch), as Horizon and The Witcher 3 do, so a big slope does not read as one even colour from afar. Goes with Terrain Variation (which breaks the repeat of one texture up close). The near land, the far land and the band between them vary alike. Needs a restart to turn on or off; off, the land shaders are exactly what they were.
Strength = 1.0                      # [0-2] (2026-11-04) How much of the variation shows (0: none, the same as off). 2: diagnostic, the pattern alone as grey on the land.
Size = 2000.0                       # [256-40000] (2026-11-04) Game units across one patch of the pattern (a cell is 4096; 2000 = half a cell, so a view crosses several). Smaller: busier; larger: broad regions.
Brightness = 0.4                    # [0.0-1.5] (2026-11-04) How much lighter or darker a patch gets, in stops at the extremes (0.4: the lightest patches about a third brighter, the darkest a quarter darker; most patches change much less).
Tint = 0.25                         # [0.0-1.0] (2026-11-04) How much warmer (redder) or cooler (greyer-blue) a patch gets, in stops at the extremes.

[_Shaders.Terrain.LODBlending]
Enabled = false                     # UNOFFICIAL (2026-10-19) Far land matching: the distant land (its LOD texture) by a brightness and a gamma, so it meets the near land without a visible change in colour, and optionally the near land without its painted-in vertex colours. Live, next to no GPU time. After Community Shaders' LOD Blending (GPL-3.0).
Brightness = 1.0                    # [0.01-5] (2026-10-19) The far land's brightness (1: as it is). Raise it if distant land looks darker than the ground near you.
Gamma = 1.0                         # [0.1-3] (2026-10-19) The far land's gamma (1: as it is). Above 1 darkens its dark parts more than its light ones (more contrast), below 1 the other way.
DisableVertexColors = false         # (2026-10-19) The near land without its vertex colours (the darker and tinted patches painted into the land). Only for far land generated without them (xLODGen: Vertex Color Intensity 0), so both match.

[_Shaders.Terrain.Displacement]
Enabled = false                     # (2026-10-27) The tessellation bumps on or off, at once (for comparing). OFF by default while it is being finished: the bumps still flicker round objects and shake as you move. Needs [Main.Main.Performance] NvrDxvkDisplacement on when the game starts: that one sets the tessellation up, this one switches it. Live.
Strength = 10.0                     # UNOFFICIAL (2026-10-27), with [Main.Main.Performance] NvrDxvkDisplacement on (needs the DXVK fork): [0-64] how far apart the lowest and the highest point of the bumps can be, in game units (70 = 1 m). 0 = the land's own triangles exactly. Live. Raise it for bigger bumps; Contrast decides how much of that range ordinary ground uses.
Center = 0.5                        # [0-1] (2026-10-27: default 0.5, was 0) 0.5 = the bumps go up and down round the land's own height, so the ground stays where it was on average and rocks, feet and grass sit right on it. Lower raises the whole ground near you by (0.5 - Center) x Strength (0 = the old look: the ground lifts as you come near). With CastShadows off the sun's shadow maps hold the flat land, so the land's shadow lookup never goes below it (no dark dips). Live.
Contrast = 4.0                      # [0-32] (2026-10-27; default 4 since 2026-10-28, was 10) How strongly the ground textures' height differences are stretched. Most desert and scrub textures differ only by a few percent in height, so at 1 their bumps are a fraction of a game unit (invisible). 4 keeps smooth ground (sand, packed dirt, roads) smooth while pebbly and rocky ground gets clear mounds; 10 stretches every texture's grain into bumps (spiky on ordinary dirt). Very bumpy textures (pebbles, rubble) round off at the Strength limit instead of growing further. Live.
BumpSize = 48.0                     # [0-255] (2026-10-28) The smallest bump the ground gets, in game units (70 = 1 m): the bumps follow the textures' broad shapes (mounds, ruts, stones) and leave out their fine grain, which made a dense field of spikes. Smaller = sharper, busier bumps; larger = softer, rounder ones. 0 = as fine as the new points allow (the old look, spiky). Live.
EdgeLength = 12.0                   # [2-64] how far apart the new points are next to the camera, game units (the land's own triangles are 128 apart). Smaller = finer bumps, more work for the graphics card. Live. (Default 12, was 8: about half the triangles; the land's height maps hold little finer detail than that.)
EdgeGrowth = 0.01                   # [0-0.1] how much that spacing grows per game unit of distance (0.01: 22 units apart at 1000 units away). The split count then changes as you move, so the new points slide over the ground: keep it small (above about 0.02 the bumps visibly crawl and shake as you walk; 0 = nothing slides nearer than FadeStart, for more triangles farther out). Live.
MaxFactor = 16                      # [1-64] the most new points along one edge of a land triangle (a 16 x 16 split at most). Live.
FadeStart = 1024.0                  # game units from the camera where the bumps start to fade out ... Live.
FadeEnd = 2048.0                    # ... and where they are gone and the land is drawn as before (keep it within the parallax MaxDistance so far land does not change). Live.
BorderGrid = 2048.0                 # each land quadrant (2048 units) is its own draw with its own textures, so the bumps fade to nothing on quadrant borders (else a crack could open there). 0 = off (test only). Live.
ObjectBlend = false                 # EXPERIMENTAL (2026-10-27) The bumps fade out where the land meets rocks, buildings, feet and anything else standing on it, so those meet the ground as they do without displacement instead of sinking into it. Off by default: it sees everything drawn before the land, and the near grass is drawn first, so the ground also goes flat round every grass tuft and shifts as you move (first test). Live. Costs a depth copy as the land starts (about 0.1 ms). Land with 7 texture layers keeps its bumps.
ObjectBlendWidth = 32.0             # [4-512] (2026-10-27) How far from an object, in game units (70 = 1 m), the bumps take to come back in full. Small = a narrow blend right at the object; big = a wide, soft one. Live.
ObjectBlendKeep = 0.0               # [0-1] (2026-10-27) How much of the bumps is left right at the object: 0 = none (the ground meets it flat, as without displacement), 0.5 = half, 1 = all (the same as ObjectBlend off). Live.
ObjectBlendShadows = false          # (2026-10-28) With ObjectBlend on: false = the sun's shadow maps keep the full bumps, the same every frame, and the flattened ground near objects takes its shadows as if the bumps were there (fixes the shimmering of shadows other objects cast onto the bumpy ground). true = the maps flatten the ground near objects too, from last frame's picture (as before: it shimmers with TAA jitter). Live.
CastShadows = true                  # (2026-10-27) The bumps cast their own sun shadows: the land near the camera (within FadeEnd) is drawn with the same bumps into the sun's shadow maps, so stones and ruts throw small shadows at a low sun and the land's own shadow follows the bumpy surface (below the flat land too, with Center above 0). Needs the new Shaders\Shadows\ShadowMapLand files and the Compute\Tess *-s / *-sd shaders (the log says if they are missing). A land piece the camera has not drawn yet keeps a flat shadow until it has; near rocks the fade (ObjectBlend) comes from the previous frame. Off = flat shadows, as before. Live. Costs the land's tessellation once more for each sun cascade it reaches (F10: Sun cascade: displaced land).
ShadowSlack = 0.0                   # [0-64] UNOFFICIAL (2026-10-31), live, with CastShadows: how far (world units) the bumpy land is pushed away from the sun in its own sun shadow maps. The bumps are finer than a shadow map texel, so the land shaded itself in fine "fingerprint" stripes over sunlit ground, and with TAA / FSR every frame's jitter moved them: the ground flickered (most at a low RenderScale). About a third of Strength removes the stripes; bumps taller than it still cast, smaller ones lose their own shadow at a high sun, and a thin lit band can show at the foot of things standing on a slope in the land's own shadow. The same distance in every cascade. 0 = as before.
FarUntessellated = true             # (2026-10-28) Land pieces wholly beyond FadeEnd (plus 256 units) are drawn without tessellation. Nothing moves out there anyway, so they look exactly the same, but each of their draws is one plain draw again instead of three tessellated ones: a big saving where the game draws its land in many strips (hundreds of land draws a frame in the NVR TESS log line). Off = every land piece goes through the tessellation as before (for comparing). Live. The NVR TESS log line counts the land draws by where they come from and the far ones.
FarHysteresis = 0.0          # UNOFFICIAL (2026-10-29) [0-4096], live, with FarUntessellated: each land piece keeps its tessellated / flat choice until it is this many game units past the switch line the other way, so a road at about FadeEnd + 256 does not pop between the two as you move a little (try 256). 0 = the choice made fresh each frame, as before.
BendNormals = true                  # (2026-10-28) The bumps are lit as slopes: the side of a stone or rut that faces the sun gets brighter and the side turned away darker, as a real shape would. Off = the bumps are lit like the flat land (only their shadows and AO show them), as before. Needs the new Compute\Tess TerrainDisplace shaders. Live. Costs two more height lookups per ground texture at each new point (small).
LodBias = 0.0                       # [-2-4] fine-tuning of the bumps' detail on top of BumpSize: 0 = bumps as small as BumpSize (or the spacing of the new points, if that is coarser); each +1 doubles that size (smoother), each -1 halves it (sharper, but they may flicker as you move). Live.
ContactShadowsOutside = true        # (2026-10-28) While the bumps are on, the screen-space contact shadows ([Shaders.ShadowsExteriors.ScreenSpace]) start only where the bumps end, round FadeEnd, instead of at NearFade. Every bump blocks their ray toward the sun, so from NearFade (3-6 m) out the bumpy ground got crusty little contact shadows on top of its real ones: a darker ring that followed you. The bumps keep their real sun shadows (CastShadows); nearer than FadeEnd the sun's shadow maps give everything its shadows. Off = contact shadows from NearFade, as before. Live.
IgnoreMipBias = true                # (2026-10-28) The bumps keep one size whatever TAA does: TAA, FSR and DLSS sharpen every texture while the world is drawn (MipBias, and more at a lower RenderScale), and the bumps' height lookups took that sharpening too, so they came out sharper and bigger with jitter on (and smaller with it off). On = the heights are read at the detail the point spacing asks for (LodBias still adds to it). Off = as before. Live.
FixedFactor = 0                     # TEST: > 0 splits every land triangle edge this many times at any distance (1 with Strength 0 = the game's land exactly). 0 = by distance (EdgeLength). Live.
DebugView = 0                       # 0 off. 1 wireframe of the displaced land (proof that it is split: the lines get dense near the camera). 2 the bump height the land is moved by, as grey (mid grey = the land's own height, black low, white high). 3 the split count (blue = not split, red = MaxFactor) with the fade in green. 4-6 prove the land's pixel shader gets its inputs through the tessellation (smooth gradients, no black or blocks): 4 the texture coordinates (red / green, repeating), 5 the texture layer weights, 6 the normal (tilted by the bumps with BendNormals on). 7 ObjectBlend (white = all the bumps, black = none, near objects). Live.
Winding = 0                         # TEST: 0 = the game's triangle facing (expected). 1 = the other one: only if the displaced land disappears (seen from below) with 0. Live.

[_Shaders.Terrain.Status]
Enabled = true                      # Replaces shaders used by terrain, adding PBR lighting and parallax.

