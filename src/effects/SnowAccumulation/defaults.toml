[_Shaders.SnowAccumulation.Main]
BlurNormDropThreshhold = 120        # Distance for ortho average sampling around ortho covered area
BlurRadiusMultiplier = 2.0          # Screen space blur radius for ortho coverage smoothing
Decrease = 12.0                     # Time in game Hours for the snow to disappear
Increase = 0.3                      # Time in game Hours for the snow to accumulate
SunPower = 1.0                      # Multiplier for the lighting strength
SnowColorR = 0.9                    # Red chanel for the color of snow coverage
SnowColorG = 0.9                    # Green chanel for the color of snow coverage
SnowColorB = 0.8                    # Blue chanel for the color of snow coverage
NormalSmoothing = 32.0              # [0-256] UNOFFICIAL (2026-10-28) Where snow may lie, and how it is lit, follow the ground's shape over this many game units instead of each small triangle (70 = 1 m). On tessellated (bumpy) land each triangle's own slope made the snow come and go triangle by triangle: hard facets. 0 = per triangle, as before. Applies immediately.
CapturedNormals = false             # UNOFFICIAL (2026-10-28, macintroll's idea; needs a restart: the lit shaders are compiled with it): where snow may lie and how it is lit follow each surface's own smooth shape, written by the surface while it draws, instead of the normal rebuilt from the depth buffer (one flat normal per triangle: snow on rocks came and went triangle by triangle). Surfaces the mod's shaders do not draw (the game's own shaders, see-through things, water, grass) keep the old normal, smoothed by NormalSmoothing as before. Costs one extra screen-sized target while the world draws (see docs\next\CAPTURED-NORMALS.md). Off = exactly as before. Live once on at startup (switching it off then goes back to the old normal).
CapturedNormalsDebugView = 0        # [0-2] UNOFFICIAL (2026-10-28) diagnostic (with CapturedNormals, while the snow effect runs): 1 the normal the snow takes as colour, bright where the surface wrote it, dim where the old depth-rebuilt normal is used; 2 how much the two differ (white = 90 degrees), black where nothing was written. 0 = the real picture. Live.
Look = 1                            # [0-1] UNOFFICIAL (2026-10-28; 1 by default since 2026-10-28, the user: "it looks nice") 0 = the snow as it was before. 1 = macintroll's version 5 (shared 2026-10-28): coverage builds only once the snowfall is under way, blue-noise breakup at three scales, a softer slope rule, snow thinning out at the shoreline, snow darkened by shadows without darkening the ground twice, flakes landing on your first-person weapon while it snows, footprints with a soft rim. Needs Textures\Effects\Snownoise256.dds. Look 1 always runs as a D3D9 pass (no DXVK fork version yet). Live.
FollowJitter = true                 # UNOFFICIAL (2026-10-28) With FSR / DLSS and LowResEffects (TAA jitter on), the snow is placed along each jittered pixel's own view ray, so it moves with the ground instead of flickering against it (the same fix the volumetric clouds got on 10-28). Off = as before (for comparison). Live.
Persistent = false                  # UNOFFICIAL (2026-10-27): snow is kept spot by spot in a map round you (shared with WetWorld's Persistent; its size in [Shaders.WetWorld.Main] PersistentMapSize), instead of one amount for the whole world. It builds up only where the snow reaches, gathers in hollows and against walls, melts faster in the sun than in the shade, stays where it lies when you look away, and your feet tread a trail into it. Increase and Decrease above set how fast (for open, sunlit ground). Off = as before. Costs about 0.05 ms a frame on average for the map. Applies immediately (the map starts from the current snow).
PersistentShade = 0.35              # [0.02-1] (Persistent) How fast snow melts in the shade (and at night) compared with full sun: 0.35 = about three times slower; 1 = no difference.
PersistentDrifts = 0.5              # [0-1] (Persistent) How much more snow gathers in hollows and against walls, and how much less on ridges and edges. 0: the same everywhere.
PersistentFootprints = 0.7          # [0-1] (Persistent) How hard your steps tread the snow: footprints of compacted snow, left and right in turn, one per step (greyer and flatter; the ground shows through in their middle at high values; fresh snow fills them again). 0: none. (2026-10-28: footprints, was one continuous trail.)
PersistentFootprintShape = 0         # UNOFFICIAL (2026-10-28) [0-1] (Persistent) 0 = each footprint one soft oval (default), 1 = a boot print (sole and heel, as on 10-28). Live.
PersistentFootprintSize = 10        # [2-200] (Persistent) Half the length of one footprint, in game units (10 = a print about 28 cm long and 11 cm wide). The step between prints follows your speed (about 40 cm sneaking to 1.4 m running).

[_Shaders.SnowAccumulation.Status]
Enabled = false                      # Snow accumulation on the floor during snowstorms.

