[_Shaders.Precipitations.Main]
Bloom = 0.5                          # Rain effect that is blocked by objects above and refracts light.
Coloring = 1.1                       # Base coloring amount added to the refracted color.
Opacity = 1.0                        # Opacity of the drops.
Refraction = 1.0                     # Distance of the refraction of the screen image by the droplets.
Speed = 3.0                          # Multiplier for the rain speed.
VerticalScale = 1.6                  # Multiplier for the length of the drops/streaks.
SkipHiddenLayers = true              # UNOFFICIAL: skips the rain layers that lie behind walls and ground (they add nothing): same picture, less work. Off = as before.
ForceRain = false                    # UNOFFICIAL TEST AID (2026-10-25), live: the rain effects act as if it rained outdoors in any weather (FalloutNV.esm has no rainy weather; the DLCs and weather mods do), like Snow's ForceSnow. Leave off for play.

[_Shaders.Precipitations.Status]
Enabled = true                       # Rain effect that is blocked by objects above and refracts light.

[_Shaders.Precipitations.System]
Mode = 1                               # UNOFFICIAL (2026-11-05), live: 1 = the rain system (world-anchored 3D streaks that tilt with the wind, never stick to the screen, are cut by roofs and by the scene, glint toward the sun and lamps; rain haze; optional lens drops). 0 = the original screen-space layers ([Shaders.Precipitations.Main]). Tip: also set [Main.Main.Precipitations] RemovePrecipitations = true (restart) so the game's own rain particles do not fall on top.
Quality = 2                            # UNOFFICIAL (2026-11-05), [0-3], live: 0 = near rain only (to NearDistance, cheapest), 1 = plus one far band to FarDistance, 2 = plus two far bands (the far bands are drawn at half resolution), 3 = as 2 reaching 1.5 x FarDistance with the far bands at full resolution (dearest).
Intensity = 1.0                        # UNOFFICIAL (2026-11-05), [0.0-4.0], live: multiplies the weather's rain amount (drop count, haze). Above 1 = heavier than the weather says.
Density = 0.8                          # UNOFFICIAL (2026-11-05), [0.0-1.0], live: chance that each drop slot in the rain volume holds a drop at full rain (light rain uses fewer).
Exposure = 0.025                       # UNOFFICIAL (2026-11-05), [0.002-0.2] seconds, live: the "shutter" the streaks are drawn with: streak length = the drop's fall speed x this (0.025 s: 7-15 units, 10-21 cm).
StreakLength = 1.0                     # UNOFFICIAL (2026-11-05), [0.1-10], live: multiplier on the streak length.
Width = 2.0                            # UNOFFICIAL (2026-11-05), [0.1-10], live: multiplier on the drops' real width (1-3.4 mm). Drops thinner than a pixel are drawn a pixel wide and dimmer.
Opacity = 0.8                          # UNOFFICIAL (2026-11-05), [0.0-4.0], live: how strongly a streak replaces the picture behind it.
EnvironmentLift = 1.2                  # UNOFFICIAL (2026-11-05), [-1.0-4.0], live: how much brighter than its surroundings a drop looks (drops show the bright sky above them). 0 = as bright as the blurred picture around it.
SunGlint = 1.0                         # UNOFFICIAL (2026-11-05), [0.0-10.0], live: sunlight (moonlight at night) scattered forward by the drops: rain looking toward the sun glows.
LampGlint = 1.0                        # UNOFFICIAL (2026-11-05), [0.0-10.0], live: light of the nearest 8 lamps scattered by the drops (rain shows around street lamps at night). 0 = off (saves the lamp loop).
SkyShare = 0.35                        # UNOFFICIAL (2026-11-05), [0.0-1.0], live: share of the sky's fog colour in what a drop shows (the rest is the blurred picture round it).
FallSpeed = 1.0                        # UNOFFICIAL (2026-11-05), [0.05-5.0], live: multiplier on the physical fall speeds (4.0, 6.5, 8.5 m/s for 1, 2, 3.4 mm drops).
Wind = 400.0                           # UNOFFICIAL (2026-11-05), [0-3000] units/s, live: horizontal drift of the drops at the weather's full wind (the game's wind is 0-1, along its direction, as grass and cloth use it). 400 = about 5.7 m/s: up to about 40 degrees of tilt.
Gusts = 0.5                            # UNOFFICIAL (2026-11-05), [0.0-1.0], live: slow gusts in the wind's strength.
Haze = 0.35                            # UNOFFICIAL (2026-11-05), [0.0-1.0], live: how much heavy rain greys out the distance (rain haze), at most.
HazeExtinction = 0.00012               # UNOFFICIAL (2026-11-05), [0.0-0.01] per unit, live: how fast the haze builds with distance in heavy rain (0.00012: half at about 5800 units, 80 m).
Curtains = 0.6                         # UNOFFICIAL (2026-11-05), [0.0-1.0], live: the haze gathers in large curtains of heavier rain drifting with the wind. 0 = even haze.
NearDistance = 400.0                   # UNOFFICIAL (2026-11-05), [100-2000] units, live: depth of the near band (the finest drops, 48-unit columns, full resolution). Most of the cost.
FarBoost = 3.0                         # UNOFFICIAL (2026-11-05), [0.0-10.0], live: how strongly the far rain (beyond NearDistance, mostly thinner than a pixel) shows. 1 = physically weighted (faint); higher reads as denser distant rain.
FarDistance = 5000.0                   # UNOFFICIAL (2026-11-05), [NearDistance-20000] units, live: where the streaks end (beyond: only haze).
LensDrops = 0.0                        # UNOFFICIAL (2026-11-05), [0.0-1.0], live: water drops on the camera lens while you stand in the rain (more when looking up), drying in about 20 s under cover. 0 = off (default: the eye has no lens).
LensDropsFirstPerson = false           # UNOFFICIAL (2026-11-05), live: lens drops in first person too (off: third person only).
LensDropSize = 0.06                    # UNOFFICIAL (2026-11-05), [0.01-0.3], live: lens drop cell size as a share of the screen height.
DebugView = 0                          # UNOFFICIAL (2026-11-05), [0-4], live, test only: 1 = red: near streak coverage, green: far coverage, blue: haze + lens; 2 = the streaks' coverage alone (grey); 3 = everything but the streak walk; 4 = the rain pass off (the picture unchanged), for A/B timing.

